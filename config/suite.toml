# WildDuck HTMX Mail Suite & Smart Installer service
#
# Provides the built-in multi-language Web Setup Wizard (/setup), System Admin Console (/admin),
# and End-User HTMX Webmail (/webmail). Operates over the internal WildDuck REST API.
enabled = true
port = 8088
host = "127.0.0.1"

# Default interface language ("en", "vi", or any locale in lib/suite/locales/)
defaultLocale = "en"

# Session time-to-live in seconds (8 hours default)
sessionTTL = 28800

# Cookie signing secret (auto-generated by Smart Installer in production)
cookieSecret = "wildduck-suite-default-cookie-secret-change-me"

# Optional master access token used by Admin Console when config.api.accessToken is required
adminAccessToken = ""

# One-time setup token required to access /setup before initial installation completes
setupToken = "wildduck-initial-setup-token"

# Path to persistent installer state file
stateFile = "/tmp/wildduck-suite-install-state.json"

# Internal WildDuck API base URL. When left empty, derived automatically from [api] config.
apiUrl = ""
apiTimeout = 30000
