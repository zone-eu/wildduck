[api]
port = 8080
host = "127.0.0.1"
secure = false

[metrics]
enabled = true
port = 9998
host = "127.0.0.1"
secure = false

[log]
level = "silly"

[dbs]
# mongodb connection string for the main database
mongo = "mongodb://127.0.0.1:27017/wildduck-test"

# redis connection string
redis = "redis://127.0.0.1:6379/13"

dbname = "wildduck-test"

[imap]
port = 9993
host = "127.0.0.1"

[lmtp]
enabled = true
port = 2424

[jmap]
enabled = true
port = 8091

[jmap.submission]
# EmailSubmission scenarios observe the transition to final through the event stream
pollInterval = 1

[jmap.changes]
# the test server runs a single process, exact change lists keep the scenario assertions strict
safetyWindow = 0
ownedSafetyWindow = 0
# scenarios change the journal retention in the database and expect it to apply at once
retentionCacheTime = 0
# a small cap, so paging without maxChanges is testable (ECHG-089)
maxChanges = 100

# enable pwned checks for tests
[pwned]
enabled = true
type = "softfail"

[attachments]
# the attachment tests use small payloads and expect them in the configured object store
minObjectSize = 0

[jmap.push]
# the scenario tests run a local push service (test/jmap/harness/push-receiver.js) on push.wildduck.test,
# resolved by a test DNS server, and change limits and delays to observable values
maxPerUser = 3
createRate = 5
verificationTimeout = 60
attempts = 3
retryDelay = 1
maxRetryDelay = 8
coalesce = 0.3
vapidRefresh = 1
allowHosts = ["push.wildduck.test"]
ca = ["./test/jmap/fixtures/push-receiver.cert"]

[jmap.push.testDns]
server = "127.0.0.1:8153"
domains = ["wildduck.test"]
