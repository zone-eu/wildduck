[api]
port = 8080
host = "127.0.0.1"
secure = false

[metrics]
enabled = true
port = 9998
host = "127.0.0.1"
secure = false

[log]
level = "silly"

[dbs]
# mongodb connection string for the main database
mongo = "mongodb://127.0.0.1:27017/wildduck-test"

# redis connection string
redis = "redis://127.0.0.1:6379/13"

dbname = "wildduck-test"

[imap]
port = 9993
host = "127.0.0.1"

[lmtp]
enabled = true
port = 2424

[jmap]
enabled = true
port = 8091

[jmap.changes]
# the test server runs a single process, exact change lists keep the scenario assertions strict
safetyWindow = 0
# a small cap, so paging without maxChanges is testable (ECHG-089)
maxChanges = 100

# enable pwned checks for tests
[pwned]
enabled = true
type = "softfail"

[attachments]
# the attachment tests use small payloads and expect them in the configured object store
minObjectSize = 0
