  - id: IDN-041
    title: "Destroy an extra identity"
    method: Identity/set
    spec: "RFC 8621 6.3"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "An extra identity X (mayDelete true) created through Identity/set."
