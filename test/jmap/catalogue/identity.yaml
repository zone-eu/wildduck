area: identity
title: "Identity"
description: "RFC 8621 section 6: Identity/get, /set and /changes. In WildDuck every address the user owns yields one address derived identity (the main address first, mayDelete false), extra identities may be created only for addresses the user may send from, and changes to the address list made through the REST API surface in Identity/changes."
scenarios:
  - id: IDN-001
    title: "Return one identity per owned address when ids is null"
    method: Identity/get
    spec: "RFC 8621 6.1"
    level: must
    phase: 2
    applies: yes
    seed: [api]
    given: "A user with the main address a@example.com and two more addresses b@example.com and c@example.org added through the REST API."
    when: "Identity/get with ids null."
    then: "list has exactly three objects whose email values are the three addresses, each with a distinct id. notFound is an empty array, state is a non empty string and accountId is echoed."
    sources:
      - "james:IdentityGetContract#getIdentityShouldReturnDefaultIdentity"
      - "james:IdentityGetContract#getIdentityShouldReturnAliases"
      - "cyrus:JMAPCore/identity_get"
      - "stalwart:mail/submission.rs"
      - "jmapio:identity/get-all-identities"
      - "fastmail:t/Identity/get/basic.t"

  - id: IDN-002
    title: "Return every Identity property with the right type and default"
    method: Identity/get
    spec: "RFC 8621 6"
    level: must
    phase: 2
    applies: yes
    seed: [none]
    given: "A fresh user whose identities were never modified."
    when: "Identity/get with ids null and properties null."
    then: "Each object has exactly id (string), name (string), email (string), replyTo null, bcc null, textSignature empty string, htmlSignature empty string and mayDelete (boolean). No other properties are present."
    sources:
      - "jmapio:identity/get-identity-properties"
      - "jmapio:identity/get-identity-email-matches"
      - "james:IdentityGetContract#propertiesShouldBeSupported"
      - "rfc:8621 6"

  - id: IDN-003
    title: "List the main address first with mayDelete false"
    method: Identity/get
    spec: "RFC 8621 6"
    level: wd
    phase: 2
    applies: yes
    seed: [api]
    given: "A user with a main address and two additional addresses."
    when: "Identity/get with ids null."
    then: "list[0] is the identity of the main address and has mayDelete false. The identities of the other addresses have mayDelete true."
    sources:
      - "james:IdentityGetContract#getIdentityShouldReturnDefaultIdentity"
      - "wildduck:lib/api/addresses.js"
      - "rfc:8621 6"
    notes: "Identity has no default marker in RFC 8621, so clients take the first one. See IDN-046 for what destroying a non main address identity means."

  - id: IDN-004
    title: "Default the name to the address name, then the user name"
    method: Identity/get
    spec: "RFC 8621 6"
    level: wd
    phase: 2
    applies: yes
    seed: [api]
    given: "A user with name Jane Doe, address a@example.com without an address name and address b@example.com created with name Sales Team."
    when: "Identity/get."
    then: "The identity for a@example.com has name Jane Doe and the one for b@example.com has name Sales Team. For a user without a name and an address without a name, name is the empty string, never null."
    sources:
      - "stalwart:mail/submission.rs"
      - "wildduck:lib/api/addresses.js"

  - id: IDN-005
    title: "Expose a domain wildcard address as a wildcard identity"
    method: Identity/get
    spec: "RFC 8621 6"
    level: wd
    phase: 2
    applies: yes
    seed: [api]
    given: "A user who owns the wildcard address *@wild.example (created with allowWildcard)."
    when: "Identity/get."
    then: "One identity has email exactly *@wild.example and mayDelete true."
    sources:
      - "james:IdentityGetContract#getIdentityShouldReturnDomainAliases"
      - "rfc:8621 6"
      - "wildduck:lib/api/addresses.js"

  - id: IDN-006
    title: "Omit wildcard addresses that have no JMAP form"
    method: Identity/get
    spec: "RFC 8621 6"
    level: wd
    phase: 2
    applies: adapted
    seed: [api]
    given: "A user who owns user@* and *suffix@example.com in addition to normal addresses."
    when: "Identity/get."
    then: "No identity has an email containing an asterisk other than the exact form *@domain. The two special addresses are not listed and the rest are."
    sources:
      - "wildduck:lib/api/addresses.js"
    notes: "RFC 8621 only defines the local part being the single character *. Plan section 4.6."

  - id: IDN-007
    title: "Fetch identities by id and report unknown ids"
    method: Identity/get
    spec: "RFC 8620 5.1"
    level: must
    phase: 2
    applies: yes
    seed: [api]
    given: "A user with two identities X and Y, and another user with identity Z."
    when: "Identity/get with ids [X, unknownId, Z]."
    then: "list contains only X, notFound contains unknownId and Z (order not significant). No method level error."
    sources:
      - "james:IdentityGetContract#getIdentityShouldSupportIdsField"
      - "james:IdentityGetContract#getRandomIdShouldNotFail"
      - "jmapio:identity/get-identity-by-id"
      - "jmapio:identity/get-identity-not-found"
      - "fastmail:t/Identity/get/basic.t"

  - id: IDN-008
    title: "Return an empty list for an empty ids array"
    method: Identity/get
    spec: "RFC 8620 5.1"
    level: must
    phase: 2
    applies: yes
    seed: [none]
    given: "A user with at least one identity."
    when: "Identity/get with ids []."
    then: "list is [] and notFound is [], state is present."
    sources:
      - "cyrus:JMAPCore/identity_get"

  - id: IDN-009
    title: "Filter properties and always include id"
    method: Identity/get
    spec: "RFC 8620 5.1"
    level: must
    phase: 2
    applies: yes
    seed: [none]
    given: "A user with one identity."
    when: "Identity/get with properties [email, name], then with properties []."
    then: "The first returns exactly id, email and name per object. The second returns only id."
    sources:
      - "james:IdentityGetContract#propertiesShouldBeFiltered"

  - id: IDN-010
    title: "Reject an unknown property name"
    method: Identity/get
    spec: "RFC 8620 5.1"
    level: must
    phase: 2
    applies: yes
    seed: [none]
    given: "Any user."
    when: "Identity/get with properties [email, bogus]."
    then: "The method answers with an error of type invalidArguments."
    sources:
      - "james:IdentityGetContract#badPropertiesShouldBeRejected"

  - id: IDN-011
    title: "Reject a foreign or unknown accountId on all Identity methods"
    method: Identity/get
    spec: "RFC 8620 3.6.2"
    level: must
    phase: 2
    applies: yes
    seed: [none]
    given: "Users A and B, the request is authenticated as A."
    when: "Identity/get, Identity/set (with a create) and Identity/changes with the accountId of B, and with a random accountId."
    then: "Each call answers with an error of type accountNotFound and nothing is created for B."
    sources:
      - "james:IdentityGetContract#badAccountIdShouldBeRejected"
      - "james:IdentitySetContract#setIdentityShouldFailWhenWrongAccountId"
      - "james:IdentityChangesContract#badAccountIdShouldBeRejected"
      - "fastmail:t/Identity/foreign-account.t"

  - id: IDN-012
    title: "Require the submission capability for Identity methods"
    method: Identity/get
    spec: "RFC 8621 1.3.2"
    level: must
    phase: 2
    applies: yes
    seed: [none]
    given: "Any user."
    when: "Identity/get, Identity/set and Identity/changes with using listing only core and mail."
    then: "Each answers with an error invocation of type unknownMethod. With urn:ietf:params:jmap:submission in using the same calls succeed."
    sources:
      - "james:IdentitySetContract#setIdentityShouldFailWhenMissingCapability"
      - "rfc:8621 1.3.2"
    notes: "The submission capability therefore has to be advertised from phase 2 (Identity), even though EmailSubmission methods arrive in phase 3. See SUB-001."

  - id: IDN-013
    title: "Keep ids and state stable across repeated reads"
    method: Identity/get
    spec: "RFC 8620 5.1"
    level: must
    phase: 2
    applies: yes
    seed: [none]
    given: "A user with two identities."
    when: "Identity/get twice, with a worker restart and an unrelated Email change (a delivered message) in between."
    then: "The same ids map to the same email values in the same order and state is identical in both responses. Ids use only A-Za-z0-9, hyphen and underscore and start with a letter."
    sources:
      - "rfc:8620 5.1"
      - "rfc:8620 1.2"

  - id: IDN-014
    title: "Show an address added through the REST API"
    method: Identity/get
    spec: "RFC 8621 6.1"
    level: wd
    phase: 2
    applies: yes
    seed: [api]
    given: "A user with one address and a known Identity state S1."
    when: "POST /users/:user/addresses adds new@example.com, then Identity/get."
    then: "A new identity with email new@example.com and mayDelete true is listed, the existing identity keeps its id, and state differs from S1."
    sources:
      - "stalwart:mail/submission.rs"
      - "james:IdentityGetContract#getIdentityShouldReturnAliases"
      - "wildduck:lib/api/addresses.js"

  - id: IDN-015
    title: "Drop the identities of an address removed through the REST API"
    method: Identity/get
    spec: "RFC 8621 6.1"
    level: wd
    phase: 2
    applies: yes
    seed: [api, jmap]
    given: "A user with address old@example.com, its derived identity D, and an extra identity C created for the same address through Identity/set."
    when: "DELETE /users/:user/addresses/:id removes old@example.com, then Identity/get with ids [D, C] and Identity/set updating C."
    then: "Both D and C are in notFound and no listed identity has that email. The update of C gives notUpdated of type notFound. The user can no longer create an identity for that address (forbiddenFrom)."
    sources:
      - "james:IdentitySetContract#deletedIdentityShouldNotBeFetchedAnyMore"
      - "stalwart:mail/submission.rs"
      - "rfc:8621 9.6"
    notes: "James keeps the custom identity but makes it non usable. Removing it keeps the invariant that every identity is an address the user may send from."

  - id: IDN-016
    title: "Follow a change of the main address"
    method: Identity/get
    spec: "RFC 8621 6"
    level: wd
    phase: 2
    applies: yes
    seed: [api]
    given: "A user with main address a@example.com and a second address b@example.com."
    when: "PUT /users/:user/addresses/:id with main true for b@example.com, then Identity/get."
    then: "Both identities keep their ids. The identity of b@example.com is now first with mayDelete false and the one of a@example.com has mayDelete true."
    sources:
      - "wildduck:lib/api/addresses.js"

  - id: IDN-017
    title: "Expose exact and domain wildcard fromWhitelist entries"
    method: Identity/get
    spec: "RFC 8621 9.6"
    level: wd
    phase: 2
    applies: adapted
    seed: [api]
    given: "A user whose fromWhitelist contains ext@partner.example, *@brand.example and sales*@other.example."
    when: "Identity/get."
    then: "Identities exist for ext@partner.example and *@brand.example (mayDelete true). The partial pattern sales*@other.example has no identity. An EmailSubmission with From ext@partner.example and that identity is accepted in phase 3."
    sources:
      - "wildduck:lib/api/submit.js"
      - "rfc:8621 9.6"
    notes: "Plan section 4.6 says these can be exposed. Without it a whitelisted sender address could be used over the REST API but not over JMAP. Open decision."

  - id: IDN-018
    title: "Create an additional identity for an owned address"
    method: Identity/set
    spec: "RFC 8621 6.3"
    level: must
    phase: 2
    applies: yes
    seed: [api]
    given: "A user who owns a@example.com."
    when: "Identity/set create {c1: {email: a@example.com, name: Work, textSignature: text sig, htmlSignature: an html fragment, replyTo: [{name: R, email: r@example.com}], bcc: [{name: null, email: archive@example.com}]}}, then Identity/get."
    then: "created.c1 contains a new id and mayDelete true. Identity/get lists both the address derived identity and the new one with the same email, the new one returning every value as sent. newState differs from oldState."
    sources:
      - "james:IdentitySetContract#setIdentityShouldSucceed"
      - "james:IdentitySetContract#setIdentityShouldSucceedWhenValidEmailProperty"
      - "james:IdentityGetContract#getIdentityShouldReturnCustomIdentity"
      - "stalwart:mail/submission.rs"
      - "rfc:8621 6"
    notes: "RFC 8621 6 allows several identities with the same email. This needs the identities store of plan section 4.6. The Fastmail suite expects create to be refused on servers that do not allow it, which does not apply here."

  - id: IDN-019
    title: "Return defaults for properties omitted on create"
    method: Identity/set
    spec: "RFC 8620 5.3"
    level: must
    phase: 2
    applies: yes
    seed: [none]
    given: "A user who owns a@example.com."
    when: "Identity/set create {c1: {email: a@example.com}}, then Identity/get for the new id."
    then: "created.c1 lists id and the server set or defaulted properties the client did not send (name, replyTo, bcc, textSignature, htmlSignature, mayDelete). get returns name as an empty string, replyTo null, bcc null, both signatures empty strings and mayDelete true."
    sources:
      - "james:IdentitySetContract#setIdentityWithSomePropertiesOmittedShouldSucceedAndReturnDefaultValues"
      - "rfc:8620 5.3"

  - id: IDN-020
    title: "Create several identities in one call and use them in the same request"
    method: Identity/set
    spec: "RFC 8620 5.3"
    level: must
    phase: 2
    applies: yes
    seed: [none]
    given: "A user who owns a@example.com and b@example.com."
    when: "One request with Identity/set create {c1: {email: a@example.com, name: One}, c2: {email: b@example.com, name: Two}} followed by Identity/get with ids [#c1, #c2]."
    then: "Both are in created with distinct ids, the top level createdIds is returned when the request supplied createdIds, and the Identity/get resolves both creation references and returns the two objects."
    sources:
      - "james:IdentitySetContract#setIdentityShouldCreatedSeveralValidCreationRequest"
      - "james:IdentitySetContract#setIdentityAndGetIdentityCombinedShouldSucceed"
      - "rfc:8620 3.3"

  - id: IDN-021
    title: "Reject an identity for another user's address with forbiddenFrom"
    method: Identity/set
    spec: "RFC 8621 6.3"
    level: must
    phase: 2
    applies: yes
    seed: [api]
    given: "User A, and user B who owns b@example.com."
    when: "A calls Identity/set create {c1: {email: b@example.com}}."
    then: "notCreated.c1 has type forbiddenFrom, created is absent or empty, newState equals oldState and Identity/get for A is unchanged."
    sources:
      - "james:IdentitySetContract#setIdentityShouldReturnForbiddenFromErrorWhenForbiddenEmailProperty"
      - "stalwart:mail/submission.rs"
      - "fastmail:t/Identity/set/basic.t"
      - "rfc:8621 6.3"
      - "rfc:8621 9.6"
    notes: "Stalwart answers invalidProperties here, the RFC error is forbiddenFrom."

  - id: IDN-022
    title: "Reject an identity for an unregistered or external address with forbiddenFrom"
    method: Identity/set
    spec: "RFC 8621 6.3"
    level: must
    phase: 2
    applies: yes
    seed: [none]
    given: "A user who owns only a@example.com."
    when: "Identity/set create with email nobody@example.com (same domain, not registered), with email someone@elsewhere.test, and with a forwarded only address registered in WildDuck."
    then: "Each gives notCreated of type forbiddenFrom. No address is created in WildDuck as a side effect (GET /users/:user/addresses is unchanged)."
    sources:
      - "james:IdentitySetContract#setIdentityShouldReturnForbiddenFromErrorWhenForbiddenEmailProperty"
      - "rfc:8621 9.6"
    notes: "Identity/set never adds addresses to the account. Plan section 4.6 words create as mapping to adding an address, which would let any JMAP user claim free addresses. Treated here as creating an identity for an existing sending right only. Open question."

  - id: IDN-023
    title: "Allow identities covered by an owned domain wildcard"
    method: Identity/set
    spec: "RFC 8621 6"
    level: wd
    phase: 2
    applies: yes
    seed: [api]
    given: "A user who owns *@wild.example. Another user owns *@other.example."
    when: "Identity/set create with email anything@wild.example, with email *@wild.example, with email x@other.example and with email *@other.example."
    then: "The first two are created. The last two give notCreated of type forbiddenFrom."
    sources:
      - "rfc:8621 6"
      - "wildduck:lib/api/submit.js"

  - id: IDN-024
    title: "Match the email of a new identity the way WildDuck normalises addresses"
    method: Identity/set
    spec: "RFC 8621 6.3"
    level: wd
    phase: 2
    applies: yes
    seed: [api]
    given: "A user who owns first.last@example.com."
    when: "Identity/set create with email First.Last@EXAMPLE.com, and with the internationalised domain of an owned address given in its unicode and its punycode form."
    then: "The identities are created (the address resolves to the user after normalisation). The returned email is in one documented canonical form and is the same value on every later read."
    sources:
      - "james:EmailSubmissionSetMethodContract#recipientShouldBeCaseInsensitive"
      - "wildduck:lib/tools.js"

  - id: IDN-025
    title: "Require a syntactically valid email on create"
    method: Identity/set
    spec: "RFC 8620 5.3"
    level: must
    phase: 2
    applies: yes
    seed: [none]
    given: "Any user."
    when: "Identity/set create without email, with email null, with email as a number, with email not-an-address, and with an email containing a line break or angle brackets."
    then: "Each gives notCreated of type invalidProperties with properties [email]. None is reported as forbiddenFrom."
    sources:
      - "james:IdentitySetContract#setIdentityShouldFailWhenEmailPropertyIsMissing"
      - "james:IdentitySetContract#setIdentityShouldFailWhenEmailPropertyIsNull"
      - "stalwart:mail/submission.rs"

  - id: IDN-026
    title: "Reject server set and unknown properties on create"
    method: Identity/set
    spec: "RFC 8620 5.3"
    level: must
    phase: 2
    applies: yes
    seed: [none]
    given: "A user who owns a@example.com."
    when: "Identity/set create with a valid email plus id set to a value, plus mayDelete false, and plus an unknown property."
    then: "Each gives notCreated of type invalidProperties naming the offending property, and no identity is created."
    sources:
      - "james:IdentitySetContract#setIdentityShouldNotCreatedWhenCreationRequestHasServerSetProperty"
      - "rfc:8620 5.3"

  - id: IDN-027
    title: "Validate replyTo and bcc as EmailAddress lists"
    method: Identity/set
    spec: "RFC 8621 6"
    level: must
    phase: 2
    applies: yes
    seed: [none]
    given: "A user who owns a@example.com and an existing identity X."
    when: "Create and update with replyTo as a string, replyTo as a list containing an object without email, bcc with an email that is not an address, bcc with an email containing CR LF, and replyTo with an unknown key in the address object."
    then: "Each gives notCreated or notUpdated of type invalidProperties naming replyTo or bcc. An empty array is accepted and reads back as an empty array or null, consistently."
    sources:
      - "james:IdentitySetContract#updateShouldNotUpdatedWhenInvalidPropertyValue"
      - "rfc:8621 4.1.2.3"
    notes: "The stored values are later put into message headers by clients, so header injection characters must not be accepted."

  - id: IDN-028
    title: "Store replyTo and bcc addresses with and without names"
    method: Identity/set
    spec: "RFC 8621 6"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "An identity X."
    when: "Update X with replyTo [{name: Reply Desk, email: reply@example.com}, {email: second@example.com}] and bcc [{name: null, email: archive@example.com}], then Identity/get."
    then: "Both lists are returned in the same order. An address sent without name or with name null is returned with name null. Non ASCII names are returned unchanged."
    sources:
      - "james:IdentitySetContract#updateShouldModifyIdentityEntryWhenBccNameIsNull"
      - "jmapio:identity/set-update-reply-to"
      - "rfc:8621 6.4"

  - id: IDN-029
    title: "Store signatures verbatim"
    method: Identity/set
    spec: "RFC 8621 6"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "An identity X."
    when: "Update X with a multi line textSignature (including the two dash delimiter line with trailing space) and an htmlSignature containing markup, entities and non ASCII text, then Identity/get."
    then: "Both values are returned byte for byte, without trimming, sanitising or line ending conversion."
    sources:
      - "jmapio:identity/set-update-text-signature"
      - "jmapio:identity/set-update-html-signature"
      - "james:IdentitySetContract#updateShouldModifyIdentityEntry"

  - id: IDN-030
    title: "Limit the size of names and signatures"
    method: Identity/set
    spec: "RFC 8620 5.3"
    level: wd
    phase: 2
    applies: yes
    seed: [none]
    given: "A user who owns a@example.com and the configured identity limits."
    when: "Create an identity with a name, textSignature or htmlSignature longer than the configured maximum, or with more replyTo or bcc entries than allowed."
    then: "notCreated has type tooLarge (or invalidProperties naming the property) and nothing is stored. Values at the limit are accepted."
    sources:
      - "rfc:8620 5.3"
    notes: "Limits are a WildDuck decision still to be made. The scenario exists so that unbounded signatures cannot be stored."

  - id: IDN-031
    title: "Limit the number of identities per account"
    method: Identity/set
    spec: "RFC 8620 5.3"
    level: wd
    phase: 2
    applies: yes
    seed: [jmap]
    given: "A user who already has the configured maximum number of identities."
    when: "Identity/set create one more for an owned address."
    then: "notCreated has type overQuota and the number of identities is unchanged."
    sources:
      - "rfc:8620 5.3"

  - id: IDN-032
    title: "Update the name of an identity"
    method: Identity/set
    spec: "RFC 8621 6.3"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "An identity X created through Identity/set with name Old."
    when: "Identity/set update {X: {name: New}}, then Identity/get."
    then: "updated has the key X, get returns name New and every other property unchanged, and the state changed."
    sources:
      - "james:IdentitySetContract#updateShouldSucceed"
      - "jmapio:identity/set-update-name"
      - "fastmail:t/Identity/set/basic.t"

  - id: IDN-033
    title: "Update an address derived identity and keep unpatched properties"
    method: Identity/set
    spec: "RFC 8621 6.3"
    level: must
    phase: 2
    applies: yes
    seed: [api]
    given: "The untouched identity M of the main address with name Jane Doe."
    when: "Identity/set update {M: {textSignature: sig}}, then Identity/get."
    then: "The update succeeds. M keeps its id, email, name Jane Doe and mayDelete false, and textSignature is sig."
    sources:
      - "james:IdentitySetContract#updateShouldAcceptServerSetId"
      - "james:IdentitySetContract#firstUpdateOfServerSetIdentityShouldKeepUnpatchedProperties"
      - "james:IdentityGetContract#mayDeleteShouldReturnFalseWhenUpdateServerSetIdentity"

  - id: IDN-034
    title: "Round trip the name of an address derived identity with the REST address name"
    method: Identity/set
    spec: "RFC 8621 6"
    level: wd
    phase: 2
    applies: yes
    seed: [api, jmap]
    given: "An owned address b@example.com with its derived identity D."
    when: "Identity/set update {D: {name: From JMAP}} and GET /users/:user/addresses/:id. Then PUT the address with name From REST and Identity/get."
    then: "The REST address shows name From JMAP after the first step and Identity/get shows name From REST after the second. Each change moves the Identity state."
    sources:
      - "wildduck:lib/api/addresses.js"
    notes: "Assumes the address document is the single store for the name of a derived identity (plan section 4.6 leaves the storage open). Extra identities created over JMAP have their own name."

  - id: IDN-035
    title: "Reset replyTo and bcc with null"
    method: Identity/set
    spec: "RFC 8621 6"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "An identity X with replyTo and bcc set."
    when: "Identity/set update {X: {replyTo: null, bcc: null}}, then Identity/get."
    then: "Both properties are null."
    sources:
      - "james:IdentitySetContract#updateWithNullReplyToAndBccShouldResetThem"

  - id: IDN-036
    title: "Reject null for name and signatures"
    method: Identity/set
    spec: "RFC 8621 6"
    level: must
    phase: 2
    applies: adapted
    seed: [jmap]
    given: "An identity X with name and both signatures set."
    when: "Identity/set update {X: {name: null}}, and separately textSignature null and htmlSignature null. Then update each with an empty string."
    then: "null gives notUpdated of type invalidProperties naming the property, because the type is String without null. The empty string is accepted and read back as an empty string."
    sources:
      - "james:IdentitySetContract#updateWithNullNameAndSignaturesShouldResetThemToEmpty"
      - "rfc:8621 6"
    notes: "James treats null as a reset to the empty string. The RFC types are not nullable, so the strict result is expected. Revisit if a real client sends null."

  - id: IDN-037
    title: "Keep email immutable"
    method: Identity/set
    spec: "RFC 8621 6"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "An identity X with email a@example.com, the user also owns b@example.com."
    when: "Identity/set update {X: {email: b@example.com}}, then update {X: {email: a@example.com, name: Same}}."
    then: "The first gives notUpdated.X of type invalidProperties with properties [email] and nothing changes. The second, where the value equals the current one, succeeds and only the name changes."
    sources:
      - "james:IdentitySetContract#updateShouldNotUpdatedWhenAssignServerSetProperty"
      - "rfc:8621 6"
      - "rfc:8620 5.3"

  - id: IDN-038
    title: "Reject changes to server set properties on update"
    method: Identity/set
    spec: "RFC 8620 5.3"
    level: must
    phase: 2
