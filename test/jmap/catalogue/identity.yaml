  - id: IDN-043
    title: "Report unknown ids on destroy and handle mixed batches"
    method: Identity/set
    spec: "RFC 8620 5.3"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "An extra identity X, the main identity M, and an identity Z of another user."
    when: "Identity/set destroy [X, M, unknownId, Z]."
    then: "destroyed is [X]. notDestroyed has M with type forbidden and unknownId and Z with type notFound. Z still exists for its owner."
    sources:
      - "james:IdentitySetContract#destroyShouldHandleMixedCases"
      - "james:IdentitySetContract#destroyShouldFailWhenInvalidId"
      - "james:IdentitySetContract#destroyShouldNotFailWhenUnknownId"
    notes: "James silently accepts an unknown id on destroy. RFC 8620 5.3 requires notFound."

  - id: IDN-044
    title: "Leave the state untouched when nothing was changed"
