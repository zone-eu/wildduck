  - id: IDN-046
    title: "Destroying the identity of an owned address never removes the address"
    method: Identity/set
    spec: "RFC 8621 6.3"
    level: wd
    phase: 2
    applies: adapted
    seed: [api, lmtp]
    given: "A user with main address a@example.com and a second address b@example.com whose derived identity D has mayDelete true."
    when: "Identity/set destroy [D], then GET /users/:user/addresses and deliver a message to b@example.com."
    then: "D is in destroyed and no longer returned by Identity/get. The address b@example.com is still registered and the message is delivered to the user. The identity does not reappear on later reads unless the address is removed and added again."
    sources:
      - "wildduck:lib/api/addresses.js"
      - "rfc:8621 6"
    notes: "Open question. The brief only fixes mayDelete false for the main address. A destroy over JMAP must not delete a receiving address, so it can only hide the identity. The alternative is mayDelete false for every address derived identity, which is simpler and what James does for server set identities."

  - id: IDN-047
