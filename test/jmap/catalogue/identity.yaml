  - id: IDN-057
    title: "Change the session state when session visible address data changes"
    method: Session
    spec: "RFC 8620 2"
    level: wd
    phase: 2
    applies: adapted
    seed: [api]
    given: "The session state T1 and the sessionState T1 returned in API responses. The account name in the session object is the main address."
    when: "The main address is changed through the REST API, then the session is fetched and an API request is made. Separately, a non main address is added."
    then: "After the main address change the session state and the sessionState of API responses are a new value T2 and the account name is the new main address. Adding a non main address changes the Identity state but leaves the session state alone unless the session object content changed."
    sources:
      - "rfc:8620 2"
      - "rfc:8620 3.4"
    notes: "RFC 8620 ties the session state to the content of the session object only. The address list is not part of that object, so a blanket change on every address edit would be a WildDuck choice that makes clients refetch the session needlessly. Open question, see final report."
