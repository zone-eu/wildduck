  - id: IDN-050
    title: "Report address changes made through the REST API"
    method: Identity/changes
    spec: "RFC 8620 5.2"
    level: wd
    phase: 2
    applies: yes
    seed: [api]
    given: "State S1, a user with addresses a@example.com (main), b@example.com and c@example.com."
    when: "Through the REST API add d@example.com, delete c@example.com and change the name of b@example.com. Then Identity/changes with sinceState S1."
    then: "created holds the identity of d@example.com, destroyed the former identity of c@example.com and updated the identity of b@example.com. Nothing else is listed."
    sources:
      - "stalwart:mail/submission.rs"
      - "wildduck:lib/api/addresses.js"
    notes: "Address changes are not journaled today (plan section 4.6 and prerequisites). Answering cannotCalculateChanges for every address change is the fallback the plan mentions, this scenario asks for the exact form."

  - id: IDN-051
