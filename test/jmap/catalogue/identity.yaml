    given: "State S1 with identities X and Y."
    when: "Create identity N, update the name of X and destroy Y through Identity/set, then Identity/changes with sinceState S1."
    then: "created is [N], updated is [X], destroyed is [Y], each id appears in one list only, newState equals the state of Identity/get, and a second call since newState is empty."
    sources:
      - "jmapio:identity/changes-after-update"
      - "rfc:8620 5.2"
    notes: "Identity uses the exact owned change log (plan section 10.3), not the mail journal."

  - id: IDN-049
    title: "Collapse intermediate changes"
