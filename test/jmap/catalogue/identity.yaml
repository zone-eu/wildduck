    seed: [jmap]
    given: "The main address identity M (mayDelete false) and an extra identity X."
    when: "Identity/set update {M: {mayDelete: true}}, {X: {id: other}}, and {X: {bogus: 1}}."
    then: "Each gives notUpdated of type invalidProperties naming the property. M still has mayDelete false."
    sources:
      - "james:IdentitySetContract#updateShouldNotUpdatedWhenAssignServerSetProperty"

  - id: IDN-039
    title: "Reject patch paths that point into the address arrays"
    method: Identity/set
    spec: "RFC 8620 5.3"
    level: must
