    when: 'Query note with the phrase "said \"hello\"" (inner quotes escaped with a backslash), with ''O\''Brien\''s'' and with "C:\\temp".'
    then: 'Each query returns the card. An unbalanced quote such as {note: "\"hello"} does not raise an error; it is treated as a plain token search.'
    sources:
