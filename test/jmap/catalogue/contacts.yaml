    given: 'Fixture cards in book B: (1) Sarah Johnson (given, surname), nickname "SJ", org "Tech Innovations Inc.", email sarah.johnson@example.com (label "Work mail"), phone "+1-555-0100" (label "Desk"), note "Met at the conference in Tallinn"; (2) Carlos García López (given, surname García, surname2 López), nickname "Carlitos", email carlos@example.org, address Madrid, Spain; (3) kind org card "ACME Corp" with full name only, onlineService GitHub user "acme-corp"; (4) kind group card "Team" with members = uids of 1 and 2.'
    when: 'Query with {text: ""}, {name: "   "} and {note: ""}.'
