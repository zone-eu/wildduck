    notes: 'The RFC is silent. Matching everything follows from "all tokens must be present" with zero tokens; answering invalidArguments is the alternative. Decide once and keep it the same for the mail text filters.'

  - id: 'CARD-135'
    title: 'Search strings are not interpreted as regular expressions or operators'
    method: 'ContactCard/query'
    spec: 'RFC 9610 3.3.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A card with note "price is 5.00 (approx) [draft] a+b* $ref" and a card with note "plain".'
    when: 'Query note with ".*", "(approx)", "a+b*", "$ref", "$where" and "{\"$ne\": 1}"; also send filter {note: {"$ne": "x"}}.'
    then: 'The string queries return either the first card (when the literal text is present) or nothing, never both cards and never a server error. The object valued filter answers invalidArguments.'
    sources:
      - 'rfc:9610 6'
      - 'wildduck:plan 10.1'
    notes: 'Guards the MongoDB query builder against regex and operator injection. Contact data is personal data throughout.'

  - id: 'CARD-136'
