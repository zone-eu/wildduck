area: 'contacts'
title: 'Contacts: AddressBook and ContactCard (RFC 9610)'
description: 'The contacts capability, AddressBook get, changes and set including the default book and the read only address register book, and ContactCard get, set (JSContact validation per RFC 9553, media blobs, patches), changes, query, queryChanges, copy, push and group cards. Phase 5.'
scenarios:

  - id: 'ABK-001'
    title: 'Session advertises the contacts capability as an empty object'
    method: 'Session'
    spec: 'RFC 9610 1.4.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'none'
    given: 'JMAP is enabled and the user is authenticated.'
    when: 'GET the session resource.'
    then: 'capabilities has the key urn:ietf:params:jmap:contacts and its value is exactly {}. primaryAccounts["urn:ietf:params:jmap:contacts"] is the user id.'
    sources:
      - 'rfc:9610 1.4.1'
      - 'stalwart:principal/get.rs'
    notes: 'In phases 1 to 4 the key must be absent from capabilities, accountCapabilities and primaryAccounts.'

  - id: 'ABK-002'
    title: 'Account capability object carries maxAddressBooksPerCard and mayCreateAddressBook'
    method: 'Session'
    spec: 'RFC 9610 1.4.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'none'
    given: 'An authenticated user.'
    when: 'GET the session resource and read accounts[userId].accountCapabilities["urn:ietf:params:jmap:contacts"].'
    then: 'The object has exactly the two properties. maxAddressBooksPerCard is null or an integer of at least 1. mayCreateAddressBook is the boolean true.'
    sources:
      - 'rfc:9610 1.4.1'
      - 'cyrus:JMAPContacts/account_get_capabilities'
      - 'legacy-proxy:test/unit/capabilities.spec.ts'
    notes: 'The plan stores addressBooks as an array, so several books per card are possible. The concrete value of maxAddressBooksPerCard (null or a number) is not fixed by the plan; scenarios below refer to it as the advertised value.'

  - id: 'ABK-003'
    title: 'Contacts methods are rejected when the capability is not in using'
    method: 'Request'
    spec: 'RFC 8620 3.6.2'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'none'
    given: 'An authenticated user.'
    when: 'POST a request whose using is ["urn:ietf:params:jmap:core"] with the calls AddressBook/get, AddressBook/changes, AddressBook/set, ContactCard/get, ContactCard/changes, ContactCard/query, ContactCard/queryChanges, ContactCard/set and ContactCard/copy.'
    then: 'HTTP 200. Every method response is ["error", {"type": "unknownMethod"}, callId]. Nothing is created, not even the default address book.'
    sources:
      - 'rfc:8620 3.6.2'
      - 'rfc:8620 3.3'

  - id: 'ABK-004'
    title: 'Method names that RFC 9610 does not define answer unknownMethod'
    method: 'Request'
    spec: 'RFC 8620 3.6.2'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'none'
    given: 'An authenticated user, using includes the contacts capability.'
    when: 'Call AddressBook/query, AddressBook/queryChanges, AddressBook/copy and ContactCard/parse.'
    then: 'Each call answers an error of type unknownMethod.'
    sources:
      - 'rfc:9610 2'
      - 'rfc:8620 3.6.2'
    notes: 'ContactCard/parse is a Cyrus and Stalwart extension (vCard blob to JSContact). vCard conversion is outside the plan, see section 10.1 of the plan.'

  - id: 'ABK-005'
    title: 'Unknown accountId and another user''s id both answer accountNotFound on every contacts method'
    method: 'Request'
    spec: 'RFC 8620 3.6.2'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'api'
    given: 'Two users exist. The session belongs to user A.'
    when: 'As A, call AddressBook/get, AddressBook/changes, AddressBook/set, ContactCard/get, ContactCard/changes, ContactCard/query, ContactCard/queryChanges and ContactCard/set, once with accountId "nosuchaccount" and once with the user id of B.'
    then: 'Every call answers an error of type accountNotFound, identical for the unknown id and for the id of B. No data of B is read or changed.'
    sources:
      - 'fastmail:t/AddressBook/foreign-account.t'
      - 'fastmail:t/ContactCard/foreign-account.t'
      - 'legacy-proxy:test/unit/contacts-set.spec.ts'
      - 'rfc:8620 3.6.2'

  - id: 'ABK-006'
    title: 'First AddressBook/get creates the default address book lazily'
    method: 'AddressBook/get'
    spec: 'RFC 9610 2.1'
    level: 'wd'
    phase: 5
    applies: 'yes'
    seed:
      - 'api'
    given: 'A freshly created user that has never used contacts and has an empty address register.'
    when: 'Call AddressBook/get with ids null.'
    then: 'list contains one writable address book with isDefault true, a non empty name, description null, sortOrder 0, isSubscribed true, shareWith null. notFound is []. state is a string. A second call returns the same id and the same state.'
    sources:
      - 'stalwart:contacts/addressbook.rs'
      - 'cyrus:JMAPContacts/addressbook_get_default'
      - 'legacy-proxy:test/unit/contacts-set.spec.ts'
      - 'wildduck:plan 10.1'
    notes: 'The read only register book is also listed, see ABK-014. Lazy creation must not happen twice under concurrent first requests (see ABK-009).'

  - id: 'ABK-007'
    title: 'AddressBook/get returns every property of the AddressBook object'
    method: 'AddressBook/get'
    spec: 'RFC 9610 2'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A user created address book named "Friends" with description "People I know" and sortOrder 3.'
    when: 'Call AddressBook/get with ids [thatId] and no properties argument.'
    then: 'The object has exactly the keys id, name, description, sortOrder, isDefault, isSubscribed, shareWith and myRights with the values "Friends", "People I know", 3, false, true, null and a myRights object with the four booleans mayRead, mayWrite, mayShare, mayDelete.'
    sources:
      - 'rfc:9610 2'
      - 'fastmail:t/AddressBook/get/basic.t'
      - 'cyrus:JMAPContacts/addressbook_get'
      - 'stalwart:contacts/addressbook.rs'

  - id: 'ABK-008'
    title: 'AddressBook/get with ids null or omitted returns all address books'
    method: 'AddressBook/get'
    spec: 'RFC 9610 2.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'The default book, the register book and two user created books exist.'
    when: 'Call AddressBook/get once with ids null and once without the ids argument.'
    then: 'Both responses list the same four address books, notFound is [], accountId echoes the request and state is identical in both.'
    sources:
      - 'rfc:9610 2.1'
      - 'cyrus:JMAPContacts/addressbook_get'

  - id: 'ABK-009'
    title: 'Concurrent first use creates exactly one default address book'
    method: 'AddressBook/get'
    spec: 'RFC 9610 2'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'api'
    given: 'A freshly created user that has never used contacts.'
    when: 'Send ten AddressBook/get requests in parallel on separate connections, then one more AddressBook/get.'
    then: 'All responses name the same default address book id. The final list has exactly one address book with isDefault true and no duplicate writable books.'
    sources:
      - 'rfc:9610 2'
      - 'cyrus:JMAPContacts/addressbook_set_default_provision_fails'
      - 'wildduck:plan 10.1'
    notes: 'RFC 9610 2: isDefault MUST NOT be true for more than one AddressBook. Needs a unique partial index or an upsert for the lazy creation.'

  - id: 'ABK-010'
    title: 'Exactly one address book has isDefault true at all times'
    method: 'AddressBook/get'
    spec: 'RFC 9610 2'
    level: 'should'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'The default book plus three user created books.'
    when: 'Call AddressBook/get with ids null after each of: creating a book, renaming a book, destroying a non default book.'
    then: 'In every response exactly one object has isDefault true and it is the same id throughout.'
    sources:
      - 'rfc:9610 2'
      - 'cyrus:JMAPContacts/addressbook_get_default'
      - 'stalwart:contacts/addressbook.rs'

  - id: 'ABK-011'
    title: 'AddressBook/get reports unknown ids in notFound'
    method: 'AddressBook/get'
    spec: 'RFC 8620 5.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'The default address book exists.'
    when: 'Call AddressBook/get with ids [defaultId, "nosuchbook"].'
    then: 'list has the default book only and notFound is ["nosuchbook"]. With ids [] the list and notFound are both empty and state is still returned.'
    sources:
      - 'cyrus:JMAPContacts/addressbook_get'
      - 'fastmail:t/AddressBook/set/destroy.t'
      - 'rfc:8620 5.1'

  - id: 'ABK-012'
    title: 'AddressBook/get honours the properties argument and always returns id'
    method: 'AddressBook/get'
    spec: 'RFC 8620 5.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'The default address book exists.'
    when: 'Call AddressBook/get with properties ["name", "isDefault"], then with properties ["nosuchproperty"].'
    then: 'The first response objects have exactly id, name and isDefault. The second call answers an error of type invalidArguments.'
    sources:
      - 'cyrus:JMAPContacts/addressbook_get'
      - 'fastmail:t/AddressBook/set/update.t'
      - 'stalwart:contacts/addressbook.rs'
      - 'rfc:8620 5.1'

  - id: 'ABK-013'
    title: 'Owner rights: all true, with mayDelete false on the default book'
    method: 'AddressBook/get'
    spec: 'RFC 9610 2'
    level: 'wd'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'The default book and one user created book.'
    when: 'Call AddressBook/get with properties ["myRights", "isDefault"].'
    then: 'The default book has myRights {mayRead: true, mayWrite: true, mayShare: true, mayDelete: false}. The user created book has all four rights true.'
    sources:
      - 'wildduck:plan 10.1'
      - 'rfc:9610 2'
      - 'stalwart:contacts/acl.rs'
    notes: 'mayShare true is what the plan states (all true for the owner) although there are no principals to share with; see ABK-038 for what a shareWith write does.'

  - id: 'ABK-014'
    title: 'The address register is exposed as a read only address book'
    method: 'AddressBook/get'
    spec: 'RFC 9610 2'
    level: 'wd'
    phase: 5
    applies: 'yes'
    seed:
      - 'api'
    given: 'A user whose address register has at least one entry (a message was sent through the REST API submit endpoint).'
    when: 'Call AddressBook/get with ids null.'
    then: 'Besides the default book the list has one address book for the register with a fixed id that does not change between calls, a fixed name, isDefault false, isSubscribed true, shareWith null and myRights {mayRead: true, mayWrite: false, mayShare: false, mayDelete: false}.'
    sources:
      - 'wildduck:plan 10.1'
      - 'rfc:9610 4.1'
    notes: 'The plan leaves two things open: the display name (the RFC example calls it "Autosaved") and whether the book is listed when the register is empty. This catalogue assumes it is always listed so the id set is stable.'

  - id: 'ABK-015'
    title: 'shareWith is null on every address book'
    method: 'AddressBook/get'
    spec: 'RFC 9610 2'
    level: 'must'
    phase: 5
    applies: 'adapted'
    seed:
      - 'jmap'
    given: 'The default book, the register book and a user created book.'
    when: 'Call AddressBook/get with properties ["shareWith"].'
    then: 'shareWith is null (present, not omitted) on every object.'
    sources:
      - 'rfc:9610 2'
      - 'wildduck:brief: no sharing'
    notes: 'RFC 9670 is out of scope, so the Cyrus and Stalwart sharing tests (addressbook_get_shared, addressbook_set_sharewith, contacts/acl.rs) have no counterpart beyond this and ABK-038.'

  - id: 'ABK-016'
    title: 'AddressBook/get with more ids than maxObjectsInGet answers requestTooLarge'
    method: 'AddressBook/get'
    spec: 'RFC 8620 5.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'none'
    given: 'The core capability advertises maxObjectsInGet N.'
    when: 'Call AddressBook/get with N + 1 distinct made up ids.'
    then: 'The call answers an error of type requestTooLarge.'
    sources:
      - 'rfc:8620 5.1'

  - id: 'ABK-017'
    title: 'Create an address book with only a name'
    method: 'AddressBook/set'
    spec: 'RFC 9610 2.3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'The default address book exists.'
    when: 'Call AddressBook/set with create {"k1": {"name": "Work"}}.'
    then: 'created.k1 has id plus the server set and defaulted properties the client did not send: description null, sortOrder 0, isDefault false, isSubscribed true, shareWith null, myRights all true. oldState and newState are strings and differ. AddressBook/get on the new id returns name "Work".'
    sources:
      - 'fastmail:t/AddressBook/set/create.t'
      - 'cyrus:JMAPContacts/addressbook_set'
      - 'stalwart:contacts/addressbook.rs'
      - 'legacy-proxy:test/unit/contacts-set.spec.ts'
      - 'rfc:8620 5.3'

  - id: 'ABK-018'
    title: 'Create an address book with every settable property'
    method: 'AddressBook/set'
    spec: 'RFC 9610 2'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'The default address book exists.'
    when: 'Call AddressBook/set with create {"k1": {"name": "Suppliers", "description": "Vendors and couriers", "sortOrder": 7, "isSubscribed": false}}.'
    then: 'The create succeeds and AddressBook/get returns the four values exactly as sent, with isDefault false.'
    sources:
      - 'stalwart:contacts/addressbook.rs'
      - 'cyrus:JMAPContacts/addressbook_set'
      - 'cyrus:JMAPContacts/addressbook_set_sortorder'
      - 'rfc:9610 2'

  - id: 'ABK-019'
    title: 'New address book id is a valid JMAP Id and differs from every existing one'
    method: 'AddressBook/set'
    spec: 'RFC 8620 1.2'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'The default address book exists.'
    when: 'Create two address books with the same name "Twins" in one AddressBook/set call.'
    then: 'Both are created with distinct ids that match the Id grammar (1 to 255 characters from A-Za-z0-9, hyphen and underscore) and start with a letter. Both are returned by AddressBook/get.'
    sources:
      - 'rfc:8620 1.2'
      - 'wildduck:brief: letter prefixed ids'
      - 'cyrus:JMAPContacts/addressbook_get'
    notes: 'RFC 9610 places no uniqueness rule on name, so duplicate names are accepted. Change this scenario if the team decides names must be unique.'

  - id: 'ABK-020'
    title: 'Empty or missing name is rejected on create'
    method: 'AddressBook/set'
    spec: 'RFC 9610 2'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'The default address book exists.'
    when: 'Call AddressBook/set with three creates: {"name": ""}, {} and {"name": null}.'
    then: 'All three are in notCreated with type invalidProperties and properties ["name"]. newState equals oldState.'
    sources:
      - 'rfc:9610 2'
      - 'cyrus:JMAPContacts/addressbook_set_error'
      - 'legacy-proxy:test/unit/contacts-set.spec.ts'

  - id: 'ABK-021'
    title: 'Name longer than 255 octets of UTF-8 is rejected, 255 octets is accepted'
    method: 'AddressBook/set'
    spec: 'RFC 9610 2'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'The default address book exists.'
    when: 'Create one book with a name of 255 ASCII characters, one with 256 ASCII characters, and one with 86 three octet characters (258 octets, 86 code points).'
    then: 'The 255 octet name is created and returned unchanged. The other two are in notCreated with type invalidProperties and properties ["name"].'
    sources:
      - 'rfc:9610 2'
      - 'cyrus:JMAPContacts/addressbook_set_badname'
    notes: 'The limit counts octets, not characters.'

  - id: 'ABK-022'
    title: 'Name of the wrong JSON type is rejected'
    method: 'AddressBook/set'
    spec: 'RFC 8620 5.3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'The default address book exists.'
    when: 'Create address books with name 42, name ["a"] and name {"a": true}.'
    then: 'Each is in notCreated with type invalidProperties and properties ["name"].'
    sources:
      - 'rfc:8620 5.3'
      - 'cyrus:JMAPContacts/addressbook_set_error'

  - id: 'ABK-023'
    title: 'sortOrder outside 0 to 2^31 - 1 or not an integer is rejected'
    method: 'AddressBook/set'
    spec: 'RFC 9610 2'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'The default address book exists.'
    when: 'Create address books with sortOrder -1, 2147483648, 1.5 and "3"; and one with sortOrder 2147483647.'
    then: 'The first four are in notCreated with type invalidProperties and properties ["sortOrder"]. The last one is created and reads back 2147483647.'
    sources:
      - 'rfc:9610 2'
      - 'cyrus:JMAPContacts/addressbook_set_sortorder'

  - id: 'ABK-024'
    title: 'description accepts a string or null and rejects other types'
    method: 'AddressBook/set'
    spec: 'RFC 9610 2'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'The default address book exists.'
    when: 'Create address books with description "Long text with unicode: Tõnu, 日本", description null and description 5.'
    then: 'The first reads back unchanged, the second reads back null, the third is in notCreated with type invalidProperties and properties ["description"].'
    sources:
      - 'rfc:9610 2'
      - 'stalwart:contacts/addressbook.rs'

  - id: 'ABK-025'
    title: 'Server set properties are rejected on create'
    method: 'AddressBook/set'
    spec: 'RFC 8620 5.3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'The default address book exists.'
    when: 'Send four creates, each with a name plus one of: id "abc", isDefault true, myRights {"mayRead": true, "mayWrite": true, "mayShare": true, "mayDelete": true}, shareWith {"someone": {"mayRead": true}}.'
    then: 'Each is in notCreated with type invalidProperties and properties naming the offending key (["id"], ["isDefault"], ["myRights"], ["shareWith"]). The default book is still the only one with isDefault true.'
    sources:
      - 'cyrus:JMAPContacts/addressbook_set_error'
      - 'cyrus:JMAPContacts/addressbook_set_update_readonly'
      - 'legacy-proxy:test/unit/contacts-set.spec.ts'
      - 'rfc:8620 5.3'
    notes: 'isDefault can only be moved with onSuccessSetIsDefault. shareWith null is accepted on create because it is the default value.'

  - id: 'ABK-026'
    title: 'Unknown property on create is rejected'
    method: 'AddressBook/set'
    spec: 'RFC 8620 5.3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'The default address book exists.'
    when: 'Call AddressBook/set with create {"k1": {"name": "X", "colour": "red"}}.'
    then: 'notCreated.k1 has type invalidProperties and properties ["colour"].'
    sources:
      - 'legacy-proxy:test/unit/contacts-set.spec.ts'
      - 'rfc:8620 5.3'

  - id: 'ABK-027'
    title: 'Creation id can be referenced later in the same request'
    method: 'AddressBook/set'
    spec: 'RFC 8620 5.3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'The default address book exists.'
    when: 'In one request call AddressBook/set with create {"book": {"name": "Refs"}}, then ContactCard/set with create {"c": {"addressBookIds": {"#book": true}, "name": {"full": "Ref Test"}}}, then AddressBook/get with ids ["#book"].'
    then: 'The card is created with addressBookIds {<real id>: true}, and AddressBook/get returns the new book. The createdIds map is returned at request level only when the request supplied createdIds.'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_backref'
      - 'cyrus:JMAPContacts/misc_creationids'
      - 'rfc:8620 5.3'

  - id: 'ABK-028'
    title: 'A failed create does not prevent other creates in the same call'
    method: 'AddressBook/set'
    spec: 'RFC 8620 5.3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'The default address book exists.'
    when: 'Call AddressBook/set with create {"good": {"name": "Good"}, "bad": {"name": ""}}.'
    then: 'created has good, notCreated has bad with type invalidProperties. newState differs from oldState and AddressBook/changes from oldState lists exactly the good id in created.'
    sources:
      - 'rfc:8620 5.3'
      - 'cyrus:JMAPContacts/addressbook_set_error'

  - id: 'ABK-029'
    title: 'Rename an address book'
    method: 'AddressBook/set'
    spec: 'RFC 9610 2.3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A user created address book named "Old".'
    when: 'Call AddressBook/set with update {id: {"name": "New"}}.'
    then: 'updated has the id with value null (no server changed properties). notUpdated is null or lacks the id. AddressBook/get returns name "New" under the same id, and newState differs from oldState.'
    sources:
      - 'fastmail:t/AddressBook/set/update.t'
      - 'cyrus:JMAPContacts/addressbook_set'
      - 'cyrus:JMAPContacts/addressbook_changes_rename'
      - 'stalwart:contacts/addressbook.rs'
      - 'legacy-proxy:test/unit/contacts-set.spec.ts'

  - id: 'ABK-030'
    title: 'Update description, sortOrder and isSubscribed together'
    method: 'AddressBook/set'
    spec: 'RFC 9610 2.3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A user created address book with defaults.'
    when: 'Call AddressBook/set with update {id: {"description": "Updated text", "sortOrder": 2, "isSubscribed": false}}.'
    then: 'The update succeeds and AddressBook/get returns the three new values while name is unchanged.'
    sources:
      - 'stalwart:contacts/addressbook.rs'
      - 'cyrus:JMAPContacts/addressbook_set_issubscribed'
      - 'cyrus:JMAPContacts/addressbook_set_sortorder'

  - id: 'ABK-031'
    title: 'An update that does not mention a property leaves it alone'
    method: 'AddressBook/set'
    spec: 'RFC 8620 5.3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A user created address book with sortOrder 5, description "Keep me" and isSubscribed false.'
    when: 'Call AddressBook/set with update {id: {"name": "Renamed"}}.'
    then: 'AddressBook/get returns sortOrder 5, description "Keep me", isSubscribed false and the new name.'
    sources:
      - 'cyrus:JMAPContacts/addressbook_set_keeps_sortorder'
      - 'cyrus:JMAPContacts/addressbook_set_issubscribed_fail_sortorder'

  - id: 'ABK-032'
    title: 'The default address book can be renamed and re-ordered'
    method: 'AddressBook/set'
    spec: 'RFC 9610 2.3'
    level: 'wd'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'The lazily created default address book.'
    when: 'Call AddressBook/set with update {defaultId: {"name": "Personal", "sortOrder": 1, "description": "Mine"}}.'
    then: 'The update succeeds, isDefault stays true and myRights.mayDelete stays false.'
    sources:
      - 'wildduck:plan 10.1'
      - 'cyrus:JMAPContacts/addressbook_set'

  - id: 'ABK-033'
    title: 'isSubscribed can be turned off and on again for an own address book'
    method: 'AddressBook/set'
    spec: 'RFC 9610 2.3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A user created address book (isSubscribed true).'
    when: 'Update isSubscribed to false, read it, update it to true, read it.'
    then: 'Both updates succeed and each read returns the value just set. The cards in the book stay visible to ContactCard/get and ContactCard/query in both states.'
    sources:
      - 'cyrus:JMAPContacts/addressbook_set_issubscribed'
      - 'stalwart:contacts/addressbook.rs'
      - 'rfc:9610 2.3'
