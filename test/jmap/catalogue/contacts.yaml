    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A card whose photo has blobId P.'
    when: 'Call Blob/lookup with typeNames ["AddressBook"] and ids [P]; then call it with typeNames ["ContactCard"] in a request whose using lacks the contacts capability.'
    then: 'Both calls answer an error of type unknownDataType.'
    sources:
      - 'rfc:9404 4.3'
      - 'rfc:9610 7.2'
      - 'cyrus:JMAPContacts/card_blob_lookup'
    notes: 'AddressBook is registered with "Can Reference Blobs: No". Cyrus answers AddressBook lookups anyway; the RFC registration is followed here.'

  - id: 'CARD-073'
    title: 'A contact photo can be read with Blob/get and the download endpoint'
    method: 'Download'
    spec: 'RFC 8620 6.2'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A card whose photo has blobId P and mediaType image/png.'
    when: 'GET the downloadUrl with blobId P, name "avatar.png" and type image/png; then call Blob/get with ids [P] and properties ["data:asBase64", "size"]; then GET the download URL with another user''s credentials.'
    then: 'The download returns 200 with the exact image bytes. Blob/get returns the same bytes base64 encoded and the right size. The other user gets 404.'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_media_blob'
      - 'cyrus:JMAPContacts/card_set_media_from_deleted_card'
      - 'rfc:8620 6.2'
      - 'rfc:9404 4.2'

  - id: 'CARD-074'
    title: 'A card larger than the server limit answers tooLarge'
    method: 'ContactCard/set'
    spec: 'RFC 8620 5.3'
    level: 'wd'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'The configured maximum card size is L bytes of JSON.'
    when: 'Create a card with a note longer than L. Then create a small card and update it with a note longer than L.'
    then: 'The create is in notCreated and the update in notUpdated, both with type tooLarge. The small card is unchanged.'
    sources:
      - 'cyrus:JMAPContacts/card_set_toolarge'
      - 'rfc:8620 5.3'
    notes: 'The limit value is not in the plan. It must be below the MongoDB document limit and below maxSizeRequest; photos live in blobs and do not count.'

  - id: 'CARD-075'
    title: 'Creating cards beyond the per account limit answers overQuota'
    method: 'ContactCard/set'
    spec: 'RFC 8620 5.3'
    level: 'wd'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
      - 'db'
    given: 'The account is at its configured maximum number of cards (limit lowered for the test).'
    when: 'Create one more card.'
    then: 'notCreated has type overQuota. Destroying a card makes the next create succeed.'
    sources:
      - 'cyrus:JMAPContacts/card_copy_overquota'
      - 'rfc:8620 5.3'
    notes: 'Open: the plan defines no contact quota. Some bound is needed because cards are free storage otherwise; whether it is a count, a byte total, or part of the mail quota is undecided. The same applies to the number of address books per account.'

  - id: 'CARD-076'
    title: 'A data: URI photo beyond the upload size limit is refused'
