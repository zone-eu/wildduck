    spec: 'RFC 8620 5.2'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'An existing book, state S. The book is renamed and then destroyed.'
    when: 'Call AddressBook/changes with sinceState S.'
    then: 'The id is in destroyed and not in updated.'
    sources:
      - 'rfc:8620 5.2'
      - 'cyrus:JMAPContacts/addressbook_changes'

  - id: 'ABK-069'
    title: 'Moving the default reports both address books as updated'
    method: 'AddressBook/changes'
    spec: 'RFC 9610 2.3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'Default D and book B, state S. The default is moved to B with onSuccessSetIsDefault.'
    when: 'Call AddressBook/changes with sinceState S.'
    then: 'updated contains exactly D and B.'
    sources:
      - 'rfc:9610 2.3'
      - 'cyrus:JMAPContacts/addressbook_set_isdefault'

  - id: 'ABK-070'
    title: 'AddressBook/changes pages with maxChanges'
    method: 'AddressBook/changes'
    spec: 'RFC 8620 5.2'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'State S, then five address books are created.'
    when: 'Call AddressBook/changes with sinceState S and maxChanges 2, and keep calling with the returned newState until hasMoreChanges is false.'
    then: 'No response lists more than 2 ids in total, the intermediate responses have hasMoreChanges true and a newState different from the final state, and the union over all pages is exactly the five ids, each once.'
    sources:
      - 'rfc:8620 5.2'
      - 'wildduck:plan 10.3'

  - id: 'ABK-071'
    title: 'maxChanges of 0 or a negative number is rejected'
    method: 'AddressBook/changes'
    spec: 'RFC 8620 5.2'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'Any state S.'
    when: 'Call AddressBook/changes with sinceState S and maxChanges 0, then -1, then "5".'
    then: 'Each call answers an error of type invalidArguments.'
    sources:
      - 'rfc:8620 5.2'

  - id: 'ABK-072'
    title: 'An unknown or malformed sinceState answers cannotCalculateChanges'
    method: 'AddressBook/changes'
    spec: 'RFC 8620 5.2'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'The current state is S.'
    when: 'Call AddressBook/changes with sinceState "nonsense", with a syntactically valid state from the future (higher sequence than S) and with an empty string.'
    then: 'Each call answers an error of type cannotCalculateChanges (invalidArguments is acceptable only for the empty string). No call returns a success response with empty lists.'
    sources:
      - 'rfc:8620 5.2'
      - 'wildduck:plan 10.3'

  - id: 'ABK-073'
    title: 'A sinceState older than the tombstone retention answers cannotCalculateChanges'
    method: 'AddressBook/changes'
    spec: 'RFC 8620 5.2'
    level: 'wd'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
      - 'time'
      - 'db'
    given: 'State S was recorded, a book was destroyed, and the tombstone has since been purged (retention elapsed, at least 30 days).'
    when: 'Call AddressBook/changes with sinceState S.'
    then: 'The call answers an error of type cannotCalculateChanges. A sinceState taken after the purged tombstone still works. Purging tombstones does not change the current state string.'
    sources:
      - 'wildduck:plan 10.3'
      - 'rfc:8620 5.2'
    notes: 'Seed by back dating tombstones in the database or by clock control.'

  - id: 'ABK-074'
    title: 'AddressBook state is independent of ContactCard changes'
    method: 'AddressBook/changes'
    spec: 'RFC 8620 5.2'
    level: 'wd'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'AddressBook state S.'
    when: 'Create, update and destroy a card in the default book, then call AddressBook/get and AddressBook/changes with sinceState S.'
    then: 'The AddressBook state is still S and the changes response is empty, because no AddressBook property depends on its cards.'
    sources:
      - 'wildduck:plan 10.3'
      - 'rfc:8620 5.2'
    notes: 'The two types may share one per account sequence. If they do, the state strings may advance together, but AddressBook/changes must still report no changed ids. Adjust the first assertion if a shared sequence is chosen.'

  - id: 'ABK-075'
    title: 'Mail activity does not change the AddressBook state'
    method: 'AddressBook/changes'
    spec: 'RFC 8620 5.2'
    level: 'wd'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
      - 'imap'
      - 'lmtp'
    given: 'AddressBook state S and ContactCard state T.'
    when: 'Deliver a message over LMTP, set a flag over IMAP and create a mailbox over JMAP, then read the AddressBook and ContactCard states.'
    then: 'Both states are unchanged, and AddressBook/changes and ContactCard/changes from S and T report nothing.'
    sources:
      - 'wildduck:plan 10.3'
    notes: 'The owned change log is separate from the mail journal.'

  - id: 'ABK-076'
    title: 'EventSource pushes a StateChange for AddressBook'
    method: 'EventSource'
    spec: 'RFC 9610 7.2'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'An EventSource connection is open with types=* (or types=AddressBook).'
    when: 'On another connection create an address book.'
    then: 'A state event arrives whose data is a StateChange with changed[accountId].AddressBook equal to the newState of the AddressBook/set response. It carries no ContactCard, Email or Mailbox entry.'
    sources:
      - 'rfc:9610 7.2'
      - 'rfc:8620 7.1'
      - 'rfc:8620 7.3'
      - 'wildduck:plan 10.1'

  - id: 'ABK-077'
    title: 'EventSource types filter excludes AddressBook changes when not requested'
    method: 'EventSource'
    spec: 'RFC 8620 7.3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'An EventSource connection is open with types=Email,Mailbox.'
    when: 'Create and rename an address book, then deliver a message.'
    then: 'No state event is sent for the address book changes. The event for the delivery arrives and has no AddressBook key.'
    sources:
      - 'rfc:8620 7.3'
      - 'wildduck:plan 10.1'

  - id: 'ABK-078'
    title: 'Destroying a book with onDestroyRemoveContents pushes both AddressBook and ContactCard states'
    method: 'EventSource'
    spec: 'RFC 8620 7.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'An EventSource connection with types=AddressBook,ContactCard. A book with two cards.'
    when: 'Destroy the book with onDestroyRemoveContents true.'
    then: 'The pushed StateChange (one event or two) carries a new AddressBook state and a new ContactCard state for the account, equal to the current states returned by the /get methods.'
    sources:
      - 'rfc:8620 7.1'
      - 'rfc:9610 2.3'

  - id: 'CARD-001'
    title: 'Create a minimal card with @type, version, name and addressBookIds'
    method: 'ContactCard/set'
    spec: 'RFC 9610 3.5'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Call ContactCard/set with create {"c1": {"@type": "Card", "version": "1.0", "addressBookIds": {B: true}, "name": {"full": "Test Contact"}}}.'
    then: 'created.c1 has an id (valid Id, letter prefixed) and the server set properties the client did not send: uid, created and updated. oldState and newState differ. ContactCard/get for the id returns the card.'
    sources:
      - 'fastmail:t/ContactCard/set/create.t'
      - 'cyrus:JMAPContacts/card_set_create_basic'
      - 'stalwart:contacts/contact.rs'
      - 'legacy-proxy:test/unit/contacts-set.spec.ts'
      - 'rfc:9610 3.5'

  - id: 'CARD-002'
    title: 'ContactCard/get returns the card as stored plus id and addressBookIds'
    method: 'ContactCard/get'
    spec: 'RFC 9610 3.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A card created with name components (given "Joe", surname "Bloggs", isOrdered true) and emails {"e1": {"address": "joe.bloggs@example.com", "contexts": {"private": true}}} in book B.'
    when: 'Call ContactCard/get with ids [cardId].'
    then: 'list has one object with id, addressBookIds {B: true}, "@type" "Card", version "1.0", uid, created, updated, and name and emails deep equal to what was sent, including the map key e1 and the order of the components array. No default valued property (kind, isOrdered false and so on) is added. notFound is [], state is a string.'
    sources:
      - 'fastmail:t/ContactCard/get/basic.t'
      - 'cyrus:JMAPContacts/card_set_create_basic'
      - 'stalwart:contacts/contact.rs'
      - 'rfc:9610 3.1'
      - 'rfc:9610 4.1'
    notes: 'Stored natively, so the round trip must be lossless: map keys are preserved (RFC 9553 1.4.1) and the server does not normalise or reorder.'

  - id: 'CARD-003'
    title: 'ContactCard/get reports unknown ids in notFound'
    method: 'ContactCard/get'
    spec: 'RFC 8620 5.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'One card exists.'
    when: 'Call ContactCard/get with ids [cardId, "nosuchcard", an AddressBook id].'
    then: 'list has the one card. notFound has the other two ids.'
    sources:
      - 'cyrus:JMAPContacts/card_get_ids'
      - 'fastmail:t/ContactCard/set/destroy.t'
      - 'rfc:8620 5.1'

  - id: 'CARD-004'
    title: 'ContactCard/get with ids null returns all cards, with ids [] none'
    method: 'ContactCard/get'
    spec: 'RFC 8620 5.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'Three cards exist in two address books, and the register book has two entries.'
    when: 'Call ContactCard/get with ids null, with ids omitted, and with ids [].'
    then: 'The first two return all five cards (three stored, two register cards). The third returns an empty list and an empty notFound, with a state.'
    sources:
      - 'cyrus:JMAPContacts/card_get_ids_null_empty'
      - 'cyrus:JMAPContacts/card_get_ids'
      - 'rfc:9610 4.1'
      - 'rfc:8620 5.1'
    notes: 'When the account has more cards than maxObjectsInGet, ids null answers requestTooLarge, see CARD-007.'

  - id: 'CARD-005'
    title: 'ContactCard/get properties filter returns only the named properties plus id'
    method: 'ContactCard/get'
    spec: 'RFC 8620 5.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A card with name, emails, phones and notes.'
    when: 'Call ContactCard/get with properties ["name", "emails"], then ["addressBookIds"], then ["uid", "nosuchproperty"].'
    then: 'The first objects have exactly id, name, emails. The second exactly id and addressBookIds. A property the card does not have is simply absent from the object.'
    sources:
      - 'stalwart:contacts/contact.rs'
      - 'cyrus:JMAPContacts/card_get_ids'
      - 'rfc:8620 5.1'
    notes: 'JSContact allows unknown and vendor properties, so an unknown name in properties cannot be told apart from an unset one and must not raise invalidArguments. A name that is not a string, or a path with a slash, is invalidArguments.'

  - id: 'CARD-006'
    title: 'ContactCard/get of a vendor property by name'
    method: 'ContactCard/get'
    spec: 'RFC 8620 5.1'
    level: 'should'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A card created with the vendor property "example.com:customer" set to {"tier": 2}.'
    when: 'Call ContactCard/get with properties ["example.com:customer"].'
    then: 'The object has exactly id and "example.com:customer" with the stored value.'
    sources:
      - 'rfc:9553 1.8.1'
      - 'cyrus:JMAPContacts/card_set_preserve_xprops'

  - id: 'CARD-007'
    title: 'ContactCard/get beyond maxObjectsInGet answers requestTooLarge'
    method: 'ContactCard/get'
    spec: 'RFC 8620 5.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'The core capability advertises maxObjectsInGet N and the account has N + 1 cards.'
    when: 'Call ContactCard/get with N + 1 ids, then with ids null.'
    then: 'Both calls answer an error of type requestTooLarge.'
    sources:
      - 'rfc:8620 5.1'
    notes: 'RFC 9610 4.1 shows a client fetching all cards with ids omitted, so maxObjectsInGet should be generous. Clients beyond the limit page with ContactCard/query.'

  - id: 'CARD-008'
    title: '@type and version may be omitted on create and are then set by the server'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.1.1'
    level: 'wd'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with only addressBookIds and name {"full": "Simple Contact"}.'
    then: 'The card is created. created reports "@type" "Card" and version "1.0" (with uid, created, updated). ContactCard/get returns both.'
    sources:
      - 'stalwart:contacts/contact.rs'
      - 'rfc:9553 1.3.4'
      - 'rfc:9553 2.1.2'
    notes: 'RFC 9553 makes both mandatory in a Card. Stalwart accepts creates without them, Cyrus and the Fastmail suite always send them. Decision to confirm: accept and fill in, as written here, or reject with invalidProperties.'

  - id: 'CARD-009'
    title: 'A wrong @type or an unsupported version is rejected'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.1.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create cards with "@type" "card", "@type" "Contact", version "2.0", version "1" and version 1.0 (a number).'
    then: 'Each is in notCreated with type invalidProperties and properties ["@type"] or ["version"] respectively.'
    sources:
      - 'rfc:9553 2.1.1'
      - 'rfc:9553 2.1.2'
      - 'rfc:9553 1.7.1'
      - 'cyrus:JMAPContacts/card_get_vcardversion'

  - id: 'CARD-010'
    title: 'A uid is generated when the client sends none'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.1.9'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create two cards without uid.'
    then: 'Each created entry reports a uid of the form urn:uuid:<UUID>, the two differ, and ContactCard/get returns the same values.'
    sources:
      - 'fastmail:t/ContactCard/get/basic.t'
      - 'legacy-proxy:test/unit/contacts-set.spec.ts'
      - 'cyrus:JMAPContacts/card_set_create_basic'
      - 'rfc:9553 2.1.9'
    notes: 'uid is mandatory in a stored Card. A urn:uuid with a version 4 UUID is what RFC 9553 recommends.'

  - id: 'CARD-011'
    title: 'A client supplied uid is stored verbatim'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.1.9'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create three cards with uid "urn:uuid:f81d4fae-7dec-11d0-a765-00a0c91e6bf6", uid "F81D4FAE-7DEC-11D0-A765-00A0C91E6BF7" and uid "free text id / with spaces".'
    then: 'All three are created and ContactCard/get returns each uid byte for byte (no case folding, no urn:uuid prefix added or stripped). created does not list uid because the server did not change it.'
    sources:
      - 'cyrus:JMAPContacts/card_set_uid_text'
      - 'cyrus:JMAPContacts/card_set_uid_filename'
      - 'cyrus:JMAPContacts/card_member_uid_matrix'
      - 'stalwart:contacts/contact.rs'
      - 'rfc:9553 2.1.9'

  - id: 'CARD-012'
    title: 'A duplicate uid within the account is rejected'
    method: 'ContactCard/set'
    spec: 'RFC 9610 3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A card with uid "urn:uuid:f81d4fae-7dec-11d0-a765-00a0c91e6bf6" exists in book B1.'
    when: 'Create a card with the same uid in B1, and another with the same uid in a different book B2.'
    then: 'Both are in notCreated with type invalidProperties and properties ["uid"]. The existing card is unchanged.'
    sources:
      - 'stalwart:contacts/contact.rs'
      - 'cyrus:JMAPContacts/card_set_reject_duplicate_uid'
      - 'rfc:9610 3'

  - id: 'CARD-013'
    title: 'Two creates with the same uid in one call: one succeeds, one fails'
    method: 'ContactCard/set'
    spec: 'RFC 9610 3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Call ContactCard/set with two creates that carry the same new uid.'
    then: 'Exactly one is created and the other is in notCreated with type invalidProperties and properties ["uid"]. A ContactCard/query with filter {uid} returns one id.'
    sources:
      - 'cyrus:JMAPContacts/card_set_reject_duplicate_uid'
      - 'rfc:9610 3'
    notes: 'Also run as two parallel requests: the unique {user, uid} index must make exactly one win.'

  - id: 'CARD-014'
    title: 'The same uid can exist in two different accounts'
    method: 'ContactCard/set'
    spec: 'RFC 9610 3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'api'
      - 'jmap'
    given: 'Users A and B. A has a card with uid "urn:uuid:11111111-2222-4333-8444-555555555555".'
    when: 'As B, create a card with the same uid.'
    then: 'The create succeeds. Uniqueness is per account.'
    sources:
      - 'rfc:9610 3'
      - 'wildduck:plan 10.1'

  - id: 'CARD-015'
    title: 'A uid becomes available again after its card is destroyed'
    method: 'ContactCard/set'
    spec: 'RFC 9610 3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A card with uid U was created and destroyed.'
    when: 'Create a new card with uid U.'
    then: 'The create succeeds and the new card has a different id from the destroyed one.'
    sources:
      - 'rfc:9610 3'
      - 'cyrus:JMAPContacts/card_changes_recreate_url'

  - id: 'CARD-016'
    title: 'uid is immutable after creation'
    method: 'ContactCard/set'
    spec: 'RFC 9610 3'
    level: 'wd'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A card with uid "urn:uuid:aaaaaaaa-bbbb-4ccc-8ddd-eeeeeeeeeeee".'
    when: 'Update it with the same uid value; with a different uid; with the value minus the urn:uuid: prefix; and with uid null.'
    then: 'The first update succeeds. The other three are in notUpdated with type invalidProperties and properties ["uid"].'
    sources:
      - 'cyrus:JMAPContacts/card_set_update_uid'
      - 'legacy-proxy:test/unit/contacts-set.spec.ts'
