  - id: 'CARD-017'
    title: 'The id property cannot be chosen by the client'
    method: 'ContactCard/set'
    spec: 'RFC 9610 3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card that includes "id": "mychoice". Then update an existing card with {"id": "other"}, and with its own current id.'
    then: 'The create is in notCreated and the first update in notUpdated, both with type invalidProperties and properties ["id"]. The update that sends the unchanged id succeeds.'
    sources:
      - 'cyrus:JMAPContacts/card_set_update_readonly'
      - 'rfc:9610 3'
      - 'rfc:8620 5.3'

  - id: 'CARD-018'
    title: 'addressBookIds is required and must name at least one address book'
    method: 'ContactCard/set'
    spec: 'RFC 9610 3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create cards with addressBookIds missing, addressBookIds null, addressBookIds {} and addressBookIds [B].'
    then: 'Each is in notCreated with type invalidProperties and properties ["addressBookIds"].'
    sources:
      - 'stalwart:contacts/contact.rs'
      - 'cyrus:JMAPContacts/card_set_addressbookids'
      - 'cyrus:JMAPContacts/card_get_no_addressbookid'
      - 'rfc:9610 3'
    notes: 'Cyrus (card_set_create_default_addressbook) and legacy-proxy put a card without addressBookIds into the default book instead. The assignment for this catalogue says addressBookIds is required, matching Stalwart. Confirm.'

  - id: 'CARD-019'
    title: 'addressBookIds values must be true'
    method: 'ContactCard/set'
    spec: 'RFC 9610 3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create cards with addressBookIds {B: false}, {B: null}, {B: 1} and {B: "true"}.'
    then: 'Each is in notCreated with type invalidProperties and properties ["addressBookIds"].'
    sources:
      - 'cyrus:JMAPContacts/card_set_addressbookids'
      - 'rfc:9610 3'

  - id: 'CARD-020'
    title: 'An unknown address book id is rejected'
    method: 'ContactCard/set'
    spec: 'RFC 9610 3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with addressBookIds {"nosuchbook": true}, one with {B: true, "nosuchbook": true}, and one with an unresolved creation reference {"#nope": true}.'
    then: 'Each is in notCreated with type invalidProperties and properties ["addressBookIds"]. No address book is created implicitly.'
    sources:
      - 'cyrus:JMAPContacts/card_set_addressbookids'
      - 'cyrus:JMAPContacts/card_set_create_backref'
      - 'legacy-proxy:test/unit/contacts-set.spec.ts'
      - 'rfc:8620 5.3'

  - id: 'CARD-021'
    title: 'A card can be created in several address books up to maxAddressBooksPerCard'
    method: 'ContactCard/set'
    spec: 'RFC 9610 1.4.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'Three writable address books. The advertised maxAddressBooksPerCard is M (null means no limit).'
    when: 'Create a card with min(M, 3) address book ids; if M is not null, also create one with M + 1 ids (creating more books as needed).'
    then: 'The first card is created and ContactCard/get returns exactly the ids sent, each with value true. The second is in notCreated with type invalidProperties and properties ["addressBookIds"].'
    sources:
      - 'rfc:9610 1.4.1'
      - 'fastmail:t/AddressBook/set/destroy.t'
      - 'stalwart:contacts/contact.rs'
      - 'cyrus:JMAPContacts/card_set_addressbookids'
    notes: 'RFC 9610 defines no dedicated error for exceeding the limit (unlike tooManyMailboxes in mail), so invalidProperties is used.'

  - id: 'CARD-022'
    title: 'A card cannot be created in the read only register book'
    method: 'ContactCard/set'
    spec: 'RFC 9610 2'
    level: 'wd'
    phase: 5
    applies: 'yes'
    seed:
      - 'api'
    given: 'The register book R and a writable book B.'
    when: 'Create a card with addressBookIds {R: true}, and one with {B: true, R: true}.'
    then: 'Both are in notCreated with type forbidden. The REST API address register is unchanged.'
    sources:
      - 'wildduck:plan 10.1'
      - 'rfc:9610 2'
      - 'cyrus:JMAPContacts/card_set_update_noaccess'
    notes: 'mayWrite false means the user may not create cards in, or move cards to, that address book.'

  - id: 'CARD-023'
    title: 'kind accepts the registered values and vendor values, rejects others'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.1.4'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create cards with kind "individual", "group", "org", "location", "device", "application" and "example.com:robot"; then with kind "Individual", "person" and 5.'
    then: 'The first seven are created and read back the value sent (a card created without kind reads back without kind). The last three are in notCreated with type invalidProperties and properties ["kind"].'
    sources:
      - 'rfc:9553 2.1.4'
      - 'rfc:9553 1.7.5'
      - 'rfc:9553 1.8.2'
      - 'cyrus:JMAPContacts/card_query'
      - 'cyrus:JMAPContacts/card_set_create_basic'

  - id: 'CARD-024'
    title: 'created and updated must be UTCDateTime values'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.1.3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create cards with created "2024-01-02T03:04:05Z" (valid), created "2024-01-02T03:04:05+02:00", created "2024-01-02", created "2024-01-02t03:04:05z" and created "2024-01-02T03:04:05.000Z".'
    then: 'The first is created and reads back that created value. The others are in notCreated with type invalidProperties and properties ["created"].'
    sources:
      - 'rfc:9553 1.4.5'
      - 'rfc:9553 2.1.3'
      - 'cyrus:JMAPContacts/card_query_created_updated'

  - id: 'CARD-025'
    title: 'The server sets created on create when absent and never changes it afterwards'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.1.3'
    level: 'wd'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
      - 'time'
    given: 'A writable address book B exists.'
    when: 'Create a card without created, note the value, wait at least one second, update its name, and read it again.'
    then: 'created is a UTCDateTime close to the creation time, reported in the created response, and identical after the update.'
    sources:
      - 'rfc:9553 2.1.3'
      - 'wildduck:plan 10.1'
      - 'cyrus:JMAPContacts/card_query_created_updated'

  - id: 'CARD-026'
    title: 'The server maintains the updated timestamp on every change'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.1.10'
    level: 'wd'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
      - 'time'
    given: 'A card created at time T1.'
    when: 'Wait at least one second, update a property, and inspect the ContactCard/set response and a following ContactCard/get.'
    then: 'updated[id] in the set response contains the new updated value (server changed property), it is later than the previous value, and ContactCard/get returns the same value. An update that changes nothing leaves updated as it was.'
    sources:
      - 'rfc:9553 2.1.10'
      - 'rfc:8620 5.3'
      - 'wildduck:plan 10.1'
      - 'stalwart:contacts/contact.rs'
    notes: 'Decision to confirm: a client supplied updated on create or update is overridden with the server time and the override is reported in the response. Cyrus honours client supplied created and updated values, which its tests use for seeding.'

  - id: 'CARD-027'
    title: 'language, prodId and preferredLanguages are validated and stored'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.1.5'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with language "de-AT", prodId "ACME Contacts 1.0" and preferredLanguages {"l1": {"language": "en", "pref": 1, "contexts": {"work": true}}}. Then create cards with prodId "", preferredLanguages {"l1": {}} and language 7.'
    then: 'The first reads back unchanged. The others are in notCreated with type invalidProperties and properties ["prodId"], ["preferredLanguages/l1/language"] and ["language"].'
    sources:
      - 'rfc:9553 2.1.5'
      - 'rfc:9553 2.1.7'
      - 'rfc:9553 2.3.4'
      - 'cyrus:JMAPContacts/card_set_create_preferred_languages'
      - 'cyrus:JMAPContacts/card_get_prodid'
      - 'cyrus:JMAPContacts/card_set_create_no_prodid'
    notes: 'The server does not add a prodId of its own to cards created without one.'

  - id: 'CARD-028'
    title: 'name with components, isOrdered, defaultSeparator, sortAs and full is stored as sent'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.2.1.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card whose name has components [title "Dr.", given "Diego", given2 "María", surname "Rivera", surname2 "Barrientos", generation "Jr.", credential "PhD"], isOrdered true, defaultSeparator " ", sortAs {"surname": "Rivera Barrientos", "given": "Diego"} and full "Dr. Diego Rivera Barrientos".'
    then: 'The card is created and ContactCard/get returns name deep equal to the input, components in the same order.'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_name'
      - 'cyrus:JMAPContacts/card_get_sortas'
      - 'stalwart:contacts/contact.rs'
      - 'rfc:9553 2.2.1.1'

  - id: 'CARD-029'
    title: 'A name needs full or components, and components need a non separator entry'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.2.1.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create cards with name {}, name {"isOrdered": true}, name {"components": []} and name {"components": [{"kind": "separator", "value": "-"}], "isOrdered": true}.'
    then: 'Each is in notCreated with type invalidProperties and a properties entry of "name" or "name/components".'
    sources:
      - 'rfc:9553 2.2.1.1'
      - 'cyrus:JMAPContacts/card_set_create_name_component_missing'

  - id: 'CARD-030'
    title: 'An unknown NameComponent kind is rejected with the path'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.2.1.2'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with name components [{"kind": "given", "value": "A"}, {"kind": "middle", "value": "B"}], and one with a component lacking value, and one lacking kind.'
    then: 'Each is in notCreated with type invalidProperties. properties names the path into the array, "name/components/1/kind" for the first, "name/components/0/value" and "name/components/0/kind" for the others.'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_name_unknown_kind'
      - 'cyrus:JMAPContacts/card_set_create_name_component_missing'
      - 'rfc:9553 2.2.1.2'
    notes: 'Vendor specific kinds of the form example.com:foo are valid (RFC 9553 1.8.2) and must be accepted.'

  - id: 'CARD-031'
    title: 'Wrong JSON types inside name are rejected'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.2.1.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create cards with name "John Doe", name {"full": 5}, name {"components": {"given": "John"}}, name {"full": "x", "isOrdered": "yes"} and name {"@type": "NameComponent", "full": "x"}.'
    then: 'Each is in notCreated with type invalidProperties and properties ["name"], ["name/full"], ["name/components"], ["name/isOrdered"] and ["name/@type"].'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_name_bad_type'
      - 'rfc:9553 1.3.4'
      - 'rfc:9553 1.7.2'

  - id: 'CARD-032'
    title: 'Ordering rules of name: separator, defaultSeparator and sortAs constraints'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.2.1.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create cards whose name (a) has a separator component with isOrdered false, (b) has defaultSeparator with isOrdered omitted, (c) has defaultSeparator and full but no components, (d) has sortAs {"surname": "X"} with no surname component, (e) has sortAs but no components.'
    then: 'Each is in notCreated with type invalidProperties and a properties entry under "name" (name/components/N/kind, name/defaultSeparator or name/sortAs).'
    sources:
      - 'rfc:9553 2.2.1.1'
      - 'rfc:9553 2.2.1.2'

  - id: 'CARD-033'
    title: 'Phonetic name data requires phoneticSystem or phoneticScript'
    method: 'ContactCard/set'
    spec: 'RFC 9553 1.5.4'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with name components [{"kind": "given", "value": "John", "phonetic": "/d͡ʒɑn/"}] and phoneticSystem "ipa"; one with the same component but neither phoneticSystem nor phoneticScript; and one with phoneticSystem "klingon".'
    then: 'The first is created and round trips. The second is in notCreated with invalidProperties naming "name/components/0/phonetic". The third names "name/phoneticSystem".'
    sources:
      - 'cyrus:JMAPContacts/card_get_phonetics'
      - 'cyrus:JMAPContacts/card_get_ordered_phonetics'
      - 'rfc:9553 1.5.4'
      - 'rfc:9553 2.2.1.2'

  - id: 'CARD-034'
    title: 'Unknown properties with a valid name are preserved, reserved and case variant names are rejected'
    method: 'ContactCard/set'
    spec: 'RFC 9553 1.7.4'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create (a) a card with top level "futureProp": {"x": 1} and name {"full": "A", "futureThing": true}; (b) a card with top level "extra": "x"; (c) a card with name {"full": "A", "extra": "x"}; (d) a card with "Name": {"full": "A"}; (e) a card with "emails": {"e": {"Address": "a@example.com"}}.'
    then: '(a) is created and both unknown properties read back unchanged. (b) to (e) are in notCreated with type invalidProperties and properties ["extra"], ["name/extra"], ["Name"] and a path under "emails/e".'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_extra_rejected'
      - 'cyrus:JMAPContacts/card_set_create_name_unknown_prop'
      - 'cyrus:JMAPContacts/card_get_unresolvable_jsprop'
      - 'rfc:9553 1.7.1'
      - 'rfc:9553 1.7.3'
      - 'rfc:9553 1.7.4'
    notes: 'This needs the JSON Schema to allow additional properties whose names match the IANA syntax (ASCII alphanumerics and @) while rejecting names that differ only in case from a known one.'

  - id: 'CARD-035'
    title: 'Vendor extension properties are preserved at every level'
    method: 'ContactCard/set'
    spec: 'RFC 9553 1.8.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with "example.com:customFlag": true at the top level, "example.com:rank": {"any": ["json", 1, null]} inside name, and "example.com:verified": "yes" inside emails/e1. Then update an unrelated property.'
    then: 'The create succeeds and ContactCard/get returns all three vendor properties deep equal to the input, also after the update.'
    sources:
      - 'cyrus:JMAPContacts/card_set_preserve_xprops'
      - 'cyrus:JMAPContacts/card_copy_preserve_xprops'
      - 'legacy-proxy:test/unit/contacts-set.spec.ts'
      - 'rfc:9553 1.8.1'

  - id: 'CARD-036'
    title: 'Malformed vendor property names are rejected'
    method: 'ContactCard/set'
    spec: 'RFC 9553 1.8.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create cards with the top level properties "example.com:a/b", "example.com:a~b", ":noprefix" and "not a name".'
    then: 'Each is in notCreated with type invalidProperties, properties naming the key (with the slash and tilde escaped as ~1 and ~0 in the reported path).'
    sources:
      - 'rfc:9553 1.8.1'
      - 'rfc:9553 1.7.2'
      - 'cyrus:JMAPContacts/card_set_create_extra_rejected'

  - id: 'CARD-037'
    title: 'nicknames are stored and validated'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.2.2'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with nicknames {"k1": {"name": "Johnny", "contexts": {"private": true}, "pref": 1}, "k2": {"name": "Joe"}}. Then create cards with nicknames {"k1": {}}, nicknames {"k1": {"name": "x", "pref": 0}}, nicknames {"k1": {"name": "x", "pref": 101}} and nicknames ["Johnny"].'
    then: 'The first round trips. The others are in notCreated with invalidProperties naming "nicknames/k1/name", "nicknames/k1/pref", "nicknames/k1/pref" and "nicknames".'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_nicknames'
      - 'stalwart:contacts/contact.rs'
      - 'rfc:9553 2.2.2'
      - 'rfc:9553 1.5.3'

  - id: 'CARD-038'
    title: 'Map keys must be valid Ids'
    method: 'ContactCard/set'
    spec: 'RFC 9553 1.4.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create cards with emails {"e 1": {"address": "a@example.com"}}, phones {"": {"number": "1"}}, nicknames {"a/b": {"name": "x"}} and notes with a 256 character key.'
    then: 'Each is in notCreated with type invalidProperties naming the map ("emails", "phones", "nicknames", "notes") or the escaped entry path.'
    sources:
      - 'rfc:9553 1.4.1'

  - id: 'CARD-039'
    title: 'organizations with units, sortAs and contexts are stored and validated'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.2.3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with organizations {"o1": {"name": "ABC, Inc.", "units": [{"name": "North American Division"}, {"name": "Marketing", "sortAs": "MKT"}], "sortAs": "ABC", "contexts": {"work": true}}, "o2": {"units": [{"name": "Choir"}]}}. Then create cards with organizations {"o1": {}}, {"o1": {"name": "X", "units": []}} and {"o1": {"units": [{}]}}.'
    then: 'The first round trips with unit order kept. The others are in notCreated with invalidProperties naming "organizations/o1", "organizations/o1/units" and "organizations/o1/units/0/name".'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_organizations'
      - 'stalwart:contacts/contact.rs'
      - 'rfc:9553 2.2.3'

  - id: 'CARD-040'
    title: 'titles with kind and organizationId are stored and validated'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.2.5'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with organizations {"o1": {"name": "ACME"}} and titles {"t1": {"name": "Research Scientist", "kind": "title", "organizationId": "o1"}, "t2": {"name": "Project Lead", "kind": "role"}}. Then create cards with titles {"t1": {"kind": "role"}} and titles {"t1": {"name": "x", "kind": "boss"}}.'
    then: 'The first round trips. The others are in notCreated with invalidProperties naming "titles/t1/name" and "titles/t1/kind".'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_titles'
      - 'cyrus:JMAPContacts/card_set_create_titles_org'
      - 'stalwart:contacts/contact.rs'
      - 'rfc:9553 2.2.5'
    notes: 'An organizationId that names no entry in organizations is preserved, RFC 9553 does not require the reference to resolve.'

  - id: 'CARD-041'
    title: 'speakToAs with grammaticalGender and pronouns is stored and validated'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.2.4'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with speakToAs {"grammaticalGender": "neuter", "pronouns": {"k1": {"pronouns": "they/them", "pref": 2}, "k2": {"pronouns": "xe/xir", "pref": 1}}}. Then create cards with speakToAs {}, speakToAs {"grammaticalGender": "female"} and speakToAs {"pronouns": {"k1": {}}}.'
    then: 'The first round trips. The others are in notCreated with invalidProperties naming "speakToAs", "speakToAs/grammaticalGender" and "speakToAs/pronouns/k1/pronouns".'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_speaktoas'
      - 'rfc:9553 2.2.4'

  - id: 'CARD-042'
    title: 'emails are stored and validated'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.3.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with emails {"e1": {"address": "jqpublic@xyz.example.com", "contexts": {"work": true}, "pref": 1, "label": "Office"}, "e2": {"address": "jane_doe@example.com"}}. Then create cards with emails {"e1": {}}, emails {"e1": {"address": 5}}, emails {"e1": {"address": "a@example.com", "contexts": {"work": false}}} and emails {"e1": {"address": "a@example.com", "contexts": {"Work": true}}}.'
    then: 'The first round trips. The second to fourth are in notCreated with invalidProperties naming "emails/e1/address", "emails/e1/address" and "emails/e1/contexts/work". The fifth names "emails/e1/contexts/Work" (case variant of a registered enum value).'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_emails'
      - 'stalwart:contacts/contact.rs'
      - 'fastmail:t/ContactCard/set/update.t'
      - 'rfc:9553 2.3.1'
      - 'rfc:9553 1.5.1'
      - 'rfc:9553 1.7.1'
    notes: 'Whether an address that is not a syntactically valid addr-spec (for example "not an address") is rejected is left to the schema; RFC 9553 says it MUST be an addr-spec, so rejecting with emails/e1/address is correct, and SMTPUTF8 addresses must be accepted.'

  - id: 'CARD-043'
    title: 'phones with features are stored and validated'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.3.3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with phones {"p1": {"number": "tel:+1-555-555-5555;ext=5555", "features": {"voice": true, "mobile": true}, "contexts": {"work": true}, "pref": 1}, "p2": {"number": "+33 01 23 45 67", "label": "Paris"}}. Then create cards with phones {"p1": {}}, phones {"p1": {"number": "1", "features": {"cell": true}}} and phones {"p1": {"number": "1", "features": {"voice": false}}}.'
    then: 'The first round trips with the number strings untouched. The others are in notCreated with invalidProperties naming "phones/p1/number", "phones/p1/features/cell" and "phones/p1/features/voice".'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_phones'
      - 'fastmail:t/ContactCard/set/update.t'
      - 'stalwart:contacts/contact.rs'
      - 'rfc:9553 2.3.3'

  - id: 'CARD-044'
    title: 'onlineServices need a uri or a user'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.3.2'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with onlineServices {"x1": {"uri": "xmpp:alice@example.com"}, "x2": {"service": "Mastodon", "user": "@alice@example2.com", "uri": "https://example2.com/@alice"}, "x3": {"service": "GitHub", "user": "alice", "label": "code"}}. Then create cards with onlineServices {"x1": {"service": "Mastodon"}} and onlineServices {"x1": {"uri": "not a uri"}}.'
    then: 'The first round trips. The others are in notCreated with invalidProperties naming "onlineServices/x1" and "onlineServices/x1/uri".'
    sources:
      - 'cyrus:JMAPContacts/card_set_onlineservices'
      - 'stalwart:contacts/contact.rs'
      - 'rfc:9553 2.3.2'

  - id: 'CARD-045'
    title: 'addresses with components, countryCode, coordinates and timeZone are stored'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.5.1.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with addresses {"k23": {"contexts": {"work": true, "billing": true}, "components": [{"kind": "number", "value": "54321"}, {"kind": "separator", "value": " "}, {"kind": "name", "value": "Oak St"}, {"kind": "locality", "value": "Reston"}, {"kind": "region", "value": "VA"}, {"kind": "separator", "value": " "}, {"kind": "postcode", "value": "20190"}, {"kind": "country", "value": "USA"}], "countryCode": "US", "defaultSeparator": ", ", "isOrdered": true, "coordinates": "geo:38.96,-77.34", "timeZone": "America/New_York", "pref": 1}, "k24": {"full": "2 rue de la Paix, Paris"}}.'
    then: 'The card is created and ContactCard/get returns addresses deep equal to the input with the component order kept.'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_addresses'
      - 'stalwart:contacts/contact.rs'
      - 'rfc:9553 2.5.1.1'
      - 'rfc:9553 2.5.1.2'

  - id: 'CARD-046'
    title: 'Invalid addresses are rejected with the path'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.5.1.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create cards with addresses (a) {"a": {}}, (b) {"a": {"contexts": {"work": true}}}, (c) {"a": {"components": [{"kind": "streetAddress", "value": "1 Main St"}]}}, (d) {"a": {"components": [{"kind": "separator", "value": ","}], "isOrdered": true}}, (e) {"a": {"components": [{"kind": "locality", "value": "X"}], "defaultSeparator": ", "}}, (f) {"a": {"full": "x", "countryCode": "USA"}}, (g) {"a": {"full": "x", "timeZone": "Mars/Olympus"}}, (h) {"a": {"full": "x", "contexts": {"shipping": true}}}.'
    then: 'Each is in notCreated with type invalidProperties. The paths are "addresses/a" for (a) and (b), "addresses/a/components/0/kind" for (c), "addresses/a/components" for (d), "addresses/a/defaultSeparator" for (e), "addresses/a/countryCode", "addresses/a/timeZone" and "addresses/a/contexts/shipping" for the rest.'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_addresses_unknown_kind'
      - 'cyrus:JMAPContacts/card_get_adr_bogus_jscomp'
      - 'rfc:9553 2.5.1.1'
      - 'rfc:9553 2.5.1.2'
    notes: 'The valid extra contexts for addresses are billing and delivery. Validating timeZone needs the IANA zone list that the calendar work also needs.'

  - id: 'CARD-047'
    title: 'anniversaries accept a PartialDate or a Timestamp'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.8.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with anniversaries {"k8": {"kind": "birth", "date": {"year": 1953, "month": 4, "day": 15}}, "k9": {"kind": "death", "date": {"@type": "Timestamp", "utc": "2019-10-15T23:10:00Z"}, "place": {"full": "4445 Tree Street, New England, ND 58647, USA"}}, "k10": {"kind": "wedding", "date": {"month": 6, "day": 2}}, "k11": {"kind": "birth", "date": {"year": 1980}}}.'
    then: 'The card is created and all four entries round trip, including the year less date in k10 and the "@type" "Timestamp" in k9.'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_anniversaries'
      - 'cyrus:JMAPContacts/card_set_create_bday_noyear'
      - 'rfc:9553 2.8.1'

  - id: 'CARD-048'
    title: 'Invalid anniversaries are rejected with the path'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.8.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create cards with anniversaries (a) {"a": {"date": {"year": 2000}}}, (b) {"a": {"kind": "graduation", "date": {"year": 2000}}}, (c) {"a": {"kind": "birth"}}, (d) {"a": {"kind": "birth", "date": {"month": 13, "year": 2000}}}, (e) {"a": {"kind": "birth", "date": {"day": 5}}}, (f) {"a": {"kind": "birth", "date": {"month": 5}}}, (g) {"a": {"kind": "birth", "date": {"utc": "2019-10-15T23:10:00Z"}}}, (h) {"a": {"kind": "birth", "date": "1953-04-15"}}.'
    then: 'Each is in notCreated with type invalidProperties and a path of "anniversaries/a/kind" for (a) and (b), "anniversaries/a/date" for (c), (g) and (h), and "anniversaries/a/date/month" or "anniversaries/a/date/day" for (d) to (f).'
    sources:
      - 'rfc:9553 2.8.1'
      - 'rfc:9553 1.3.4'
      - 'cyrus:JMAPContacts/card_set_create_anniversaries'
    notes: '(g): the default type of date is PartialDate, so a Timestamp without "@type" is invalid. (e): day needs month. (f): month needs year or day.'

  - id: 'CARD-049'
    title: 'notes with created and author are stored and validated'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.8.3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with notes {"n1": {"note": "Open office hours are 1600 to 1715 EST, Mon-Fri", "created": "2022-11-23T15:01:32Z", "author": {"name": "John"}}, "n2": {"note": "multi\nline text with tab\t and unicode ✓"}}. Then create cards with notes {"n1": {}}, notes {"n1": {"note": "x", "author": {}}} and notes "plain text".'
    then: 'The first round trips with whitespace and line breaks intact. The others are in notCreated with invalidProperties naming "notes/n1/note", "notes/n1/author" and "notes".'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_notes'
      - 'fastmail:t/ContactCard/set/update.t'
      - 'rfc:9553 2.8.3'

  - id: 'CARD-050'
    title: 'keywords are a set with true values'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.8.2'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with keywords {"internet": true, "IETF": true, "B2B": true, "with space": true}. Then create cards with keywords {"x": false}, keywords ["x"] and keywords {"x": 1}.'
    then: 'The first round trips with the keyword case preserved. The others are in notCreated with invalidProperties naming "keywords/x", "keywords" and "keywords/x".'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_keywords'
      - 'cyrus:JMAPContacts/misc_categories'
      - 'stalwart:contacts/contact.rs'
      - 'rfc:9553 2.8.2'
    notes: 'Card keywords are free text and have nothing to do with mail keywords or WildDuck labels: no lowercasing.'

  - id: 'CARD-051'
    title: 'personalInfo is stored and validated'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.8.4'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with personalInfo {"pi1": {"kind": "expertise", "value": "chemistry", "level": "high", "listAs": 1}, "pi2": {"kind": "hobby", "value": "reading", "level": "high", "label": "weekends"}, "pi3": {"kind": "interest", "value": "r&b music", "level": "medium"}}. Then create cards with personalInfo {"p": {"kind": "hobby"}}, {"p": {"kind": "skill", "value": "x"}}, {"p": {"kind": "hobby", "value": "x", "level": "extreme"}} and {"p": {"kind": "hobby", "value": "x", "listAs": 0}}.'
    then: 'The first round trips. The others are in notCreated with invalidProperties naming "personalInfo/p/value", "personalInfo/p/kind", "personalInfo/p/level" and "personalInfo/p/listAs".'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_personal'
      - 'cyrus:JMAPContacts/card_query'
      - 'rfc:9553 2.8.4'

  - id: 'CARD-052'
    title: 'calendars and schedulingAddresses are stored and validated'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.4'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with calendars {"c1": {"kind": "calendar", "uri": "webcal://calendar.example.com/calA.ics"}, "c2": {"kind": "freeBusy", "uri": "https://calendar.example.com/busy/project-a", "mediaType": "text/calendar"}} and schedulingAddresses {"s1": {"uri": "mailto:janedoe@example.com", "pref": 1}}. Then create cards with calendars {"c1": {"uri": "webcal://x.example/a.ics"}}, calendars {"c1": {"kind": "calendar"}} and schedulingAddresses {"s1": {}}.'
    then: 'The first round trips. The others are in notCreated with invalidProperties naming "calendars/c1/kind", "calendars/c1/uri" and "schedulingAddresses/s1/uri".'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_calendars'
      - 'cyrus:JMAPContacts/card_set_create_sched_addrs'
      - 'rfc:9553 2.4.1'
      - 'rfc:9553 2.4.2'
    notes: 'These are plain URIs stored on the card. They create no link to the JMAP calendars of phase 6.'

  - id: 'CARD-053'
    title: 'cryptoKeys, directories and links are stored and validated'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.6'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with cryptoKeys {"k1": {"uri": "https://www.example.com/keys/jdoe.cer"}, "k2": {"uri": "data:application/pgp-keys;base64,LS0tLS1CRUdJTg=="}}, directories {"d1": {"kind": "entry", "uri": "https://dir.example.com/addrbook/jdoe/Jean%20Dupont.vcf"}, "d2": {"kind": "directory", "uri": "ldap://ldap.example/o=Example%20Tech,ou=Engineering", "pref": 1, "listAs": 1}} and links {"l1": {"kind": "contact", "uri": "mailto:contact@example.com", "pref": 1}, "l2": {"uri": "https://example.com/about"}}. Then create cards with directories {"d1": {"uri": "https://x.example/"}}, directories {"d1": {"kind": "entry", "uri": "https://x.example/", "listAs": 0}}, links {"l1": {"kind": "homepage", "uri": "https://x.example/"}} and cryptoKeys {"k1": {}}.'
    then: 'The first round trips; the data: URI in cryptoKeys is returned as a uri, unchanged (only Media gets blob conversion). The others are in notCreated with invalidProperties naming "directories/d1/kind", "directories/d1/listAs", "links/l1/kind" and "cryptoKeys/k1/uri".'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_cryptokeys'
      - 'cyrus:JMAPContacts/card_set_create_directories'
      - 'cyrus:JMAPContacts/card_set_create_links'
      - 'rfc:9553 2.6.1'
      - 'rfc:9553 2.6.2'
      - 'rfc:9553 2.6.3'

  - id: 'CARD-054'
    title: 'relatedTo maps uids to Relation objects'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.1.8'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with relatedTo {"urn:uuid:f81d4fae-7dec-11d0-a765-00a0c91e6bf6": {"relation": {"friend": true}}, "8cacdfb7d1ffdb59@example.com": {"relation": {}}, "no-such-card": {"relation": {"spouse": true, "emergency": true}}}. Then create cards with relatedTo {"u": {"relation": {"bestie": true}}}, relatedTo {"u": {"relation": {"friend": false}}} and relatedTo {"u": "friend"}.'
    then: 'The first round trips although none of the uids exists in the account (references are not resolved). The others are in notCreated with invalidProperties naming "relatedTo/u/relation/bestie", "relatedTo/u/relation/friend" and "relatedTo/u".'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_relatedto'
      - 'rfc:9553 2.1.8'
    notes: 'Keys are uids, not Ids, so characters such as colon and at sign are legal in the key.'

  - id: 'CARD-055'
    title: 'localizations are stored as patch objects and validated against the card'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.7.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with language "en", name components [title "Mr.", given "Ivan", surname "Vasiliev"], titles {"t1": {"name": "Shrimp Man"}} and localizations {"uk-Cyrl": {"name": {"components": [{"kind": "title", "value": "г-н"}, {"kind": "given", "value": "Иван"}, {"kind": "surname", "value": "Васильев"}]}}, "de": {"titles/t1/name": "Garnelenmann"}}.'
    then: 'The card is created and ContactCard/get returns localizations deep equal to the input. The base properties are not altered by the localizations.'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_localizations'
      - 'cyrus:JMAPContacts/card_get_localizations'
      - 'rfc:9553 2.7.1'

  - id: 'CARD-056'
    title: 'Invalid localizations are rejected with the full path'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.7.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B. The card to create has titles {"t1": {"name": "Boss"}}.'
    when: 'Create cards whose localizations are (a) {"de": {"titles/t1/name": 5}}, (b) {"de": {"titles/t1": {"kind": "role"}}}, (c) {"de": {"localizations/fr": {}}}, (d) {"de": {"name/full": "x", "name": {"full": "y"}}}, (e) {"de": "Deutsch"}, (f) {"de": {"titles/t9/name/foo": "x"}}.'
    then: 'Each is in notCreated with type invalidProperties and a path that starts with "localizations/de": for (a) "localizations/de/titles~1t1~1name" (or the unescaped "localizations/de/titles/t1/name"), for (c) the patch that targets localizations, for (e) "localizations/de".'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_localizations_bad'
      - 'cyrus:JMAPContacts/card_set_create_extra_rejected'
      - 'rfc:9553 2.7.1'
      - 'rfc:9553 1.4.3'
    notes: 'Cyrus reports both escaped and unescaped styles in different tests. Pick one and assert it: RFC 8620 does not define the format of SetError properties for nested paths. This catalogue recommends the unescaped JSON pointer without leading slash, as used everywhere else in this file.'

  - id: 'CARD-057'
    title: 'invalidProperties lists every invalid path of a create'
    method: 'ContactCard/set'
    spec: 'RFC 8620 5.3'
    level: 'should'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create one card with three independent errors: kind "nonsense", emails {"e1": {}} and phones {"p1": {"number": 5}}.'
    then: 'notCreated has type invalidProperties and properties contains all of "kind", "emails/e1/address" and "phones/p1/number". An optional description is a string. Nothing is stored.'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_localizations_bad'
      - 'cyrus:JMAPContacts/card_set_create_extra_rejected'
      - 'rfc:8620 5.3'

  - id: 'CARD-058'
    title: 'A card whose top level is not an object, or a property with null, is handled'
    method: 'ContactCard/set'
    spec: 'RFC 8620 5.3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Call ContactCard/set with create {"a": "string", "b": [], "c": {"addressBookIds": {B: true}, "name": {"full": "N"}, "emails": null, "notes": null}}.'
    then: 'a and b are in notCreated with type invalidProperties (or the whole call answers invalidArguments). c is created and ContactCard/get returns it without emails and notes keys.'
    sources:
      - 'rfc:8620 5.3'
      - 'cyrus:JMAPContacts/card_set_create_ignore_empty_string'
      - 'cyrus:JMAPContacts/card_get_v4_empty_name_addr'
    notes: 'A null for an optional top level property on create is treated as absent, which is what a PatchObject null does on update.'

  - id: 'CARD-059'
    title: 'Free form text keeps Unicode and strips nothing visible'
    method: 'ContactCard/set'
    spec: 'RFC 9610 5'
    level: 'should'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with name full "Zoë 日本語 🦆 עברית", a note containing CR LF, LF and TAB, and a nickname containing U+0007 (BEL).'
    then: 'The name and the note read back byte for byte. For the control character the server either stores the name with the character removed or replaced by U+FFFD and reports the changed nicknames value in the created response, or rejects the create with invalidProperties; it never stores it silently changed without reporting.'
    sources:
      - 'rfc:9610 5'
      - 'rfc:9553 1.6.1'
      - 'cyrus:JMAPContacts/card_get_invalid_utf8'
      - 'cyrus:JMAPContacts/card_set_preserve_escaping'

  - id: 'CARD-060'
    title: 'Media with an external https URI is stored as a uri'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.6.4'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with media {"res45": {"kind": "sound", "uri": "https://www.example.com/sound.ogg", "mediaType": "audio/ogg"}, "res47": {"kind": "logo", "uri": "https://www.example.com/pub/logos/abccorp.jpg"}, "res1": {"kind": "photo", "uri": "https://www.example.com/pub/photos/jqpublic.gif", "pref": 1}}.'
    then: 'The card is created and media round trips with uri and without blobId. The server does not fetch the URLs.'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_media'
      - 'rfc:9553 2.6.4'
      - 'rfc:9610 3'

  - id: 'CARD-061'
    title: 'Media kind is mandatory and limited to photo, sound and logo'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.6.4'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create cards with media {"m": {"uri": "https://x.example/a.png"}}, media {"m": {"kind": "avatar", "uri": "https://x.example/a.png"}}, media {"m": {"kind": "photo"}} and media {"m": {"kind": "photo", "uri": "not a uri"}}.'
    then: 'Each is in notCreated with type invalidProperties naming "media/m/kind", "media/m/kind", "media/m/uri" (neither uri nor blobId) and "media/m/uri".'
    sources:
      - 'rfc:9553 2.6.4'
      - 'rfc:9553 1.4.4'
      - 'cyrus:JMAPContacts/card_set_create_media'

  - id: 'CARD-062'
    title: 'A data: URI photo is converted to a blob'
    method: 'ContactCard/set'
    spec: 'RFC 9610 3'
    level: 'should'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with media {"p1": {"kind": "photo", "uri": "data:image/png;base64,<valid 1x1 PNG>"}}.'
    then: 'created reports the changed media value (server altered). ContactCard/get returns media/p1 with kind "photo", a blobId, mediaType "image/png" and no uri. Downloading the blobId returns the decoded PNG bytes.'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_media'
      - 'cyrus:JMAPContacts/card_blobid'
      - 'rfc:9610 3'
      - 'wildduck:plan 10.1'
    notes: 'RFC 9610 3: mediaType MUST be set when a blobId is returned. When the client sent no mediaType it is taken from the data: URI.'

  - id: 'CARD-063'
    title: 'A malformed data: URI is rejected'
    method: 'ContactCard/set'
    spec: 'RFC 9610 3'
    level: 'wd'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create cards with media/p1 uri "data:image/png;base64,###notbase64###", "data:;base64," (empty) and a data: URI declaring image/png whose bytes are plain text.'
    then: 'Each is in notCreated with type invalidProperties and properties ["media/p1/uri"].'
    sources:
      - 'rfc:9610 3.5'
      - 'wildduck:plan 10.1'

  - id: 'CARD-064'
    title: 'A photo can be set from an uploaded blob'
    method: 'ContactCard/set'
    spec: 'RFC 9610 3.5'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A JPEG was uploaded through the upload endpoint, giving blobId X with type image/jpeg.'
    when: 'Create a card with media {"p1": {"kind": "photo", "blobId": X}}.'
    then: 'The card is created. ContactCard/get returns media/p1 with blobId, mediaType "image/jpeg" and no uri. GET of the download URL for that blobId returns the uploaded bytes with Content-Type image/jpeg.'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_media_blob'
      - 'cyrus:JMAPContacts/card_blobid'
      - 'rfc:9610 3.5'
      - 'rfc:9610 3'
      - 'rfc:8620 6.2'
    notes: 'Whether the returned blobId equals the upload blobId or a new stored media id is an implementation choice; the test must use the id from ContactCard/get.'

  - id: 'CARD-065'
    title: 'A blob that is not a recognised image type is refused as a photo'
    method: 'ContactCard/set'
    spec: 'RFC 9610 3.5'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'Uploaded blobs: a PDF with type application/pdf, a text file uploaded with Content-Type image/png, and a zero length upload.'
    when: 'Create three cards, each with media {"p1": {"kind": "photo", "blobId": <one of them>}}.'
    then: 'Each is in notCreated with type invalidProperties and properties ["media/p1/blobId"]. The second case proves the bytes are sniffed and the declared type alone is not trusted.'
    sources:
      - 'rfc:9610 3.5'
      - 'cyrus:JMAPContacts/card_set_create_media_blob'
    notes: 'Recognised image types to be listed in the implementation (at least JPEG, PNG, GIF, WebP). Open: whether kind "logo" follows the same rule and whether kind "sound" may reference an uploaded audio blob. This catalogue assumes logo is treated like photo and sound accepts audio types only.'

  - id: 'CARD-066'
    title: 'An unknown blobId in media is rejected'
    method: 'ContactCard/set'
    spec: 'RFC 8620 5.3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with media {"p1": {"kind": "photo", "blobId": "Gnosuchblob"}}, one with a blobId uploaded by another user, and one with the blobId of an Email in the same account.'
    then: 'The first two are in notCreated with type invalidProperties and properties ["media/p1/blobId"] (blobNotFound is also acceptable). The third is refused the same way because a message is not an image.'
    sources:
      - 'rfc:8620 5.3'
      - 'rfc:9610 3.5'
      - 'cyrus:JMAPContacts/card_blobid_reject_legacy_blob_id'
      - 'cyrus:JMAPContacts/card_set_media_blob_shared'

  - id: 'CARD-067'
    title: 'A Media object with both uri and blobId is rejected'
    method: 'ContactCard/set'
    spec: 'RFC 9610 3'
    level: 'wd'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'An uploaded image blob X.'
    when: 'Create a card with media {"p1": {"kind": "photo", "blobId": X, "uri": "https://example.com/p.jpg"}}.'
    then: 'notCreated has type invalidProperties with properties naming media/p1.'
    sources:
      - 'rfc:9610 3'
    notes: 'RFC 9610 says a client may send a blobId instead of the uri. Sending both is ambiguous, so it is refused.'

  - id: 'CARD-068'
    title: 'A referenced upload does not expire while the card exists'
    method: 'ContactCard/set'
    spec: 'RFC 8620 6.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
      - 'time'
    given: 'A card whose photo was set from an uploaded blob.'
    when: 'Let the upload expiry period pass (clock control or back dated upload), run the cleanup, then download the blob named by the card.'
    then: 'The download still returns the image. After the card is destroyed (or the media entry removed) and the expiry passes again, the download answers 404.'
    sources:
      - 'rfc:8620 6.1'
      - 'wildduck:plan 10.3'
      - 'wildduck:brief: uploads expire when unreferenced'

  - id: 'CARD-069'
    title: 'Replacing a photo through a patch on media'
    method: 'ContactCard/set'
    spec: 'RFC 9610 3.5'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A card with media {"p1": {"kind": "photo", "blobId": X}} and a second uploaded image Y.'
    when: 'Update the card with {"media/p1/blobId": Y}, read it, then update with {"media/p1": null}.'
    then: 'After the first update media/p1 has the new blob, with mediaType matching Y. After the second, the card has no p1 entry (and an empty media map or no media property).'
    sources:
      - 'cyrus:JMAPContacts/card_set_update_media_blob'
      - 'rfc:9610 3.5'

  - id: 'CARD-070'
    title: 'A photo blobId can be reused on another card'
    method: 'ContactCard/set'
    spec: 'RFC 9610 3'
    level: 'should'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'Card A has a photo with blobId P (as returned by ContactCard/get).'
    when: 'Create card B with media {"p1": {"kind": "photo", "blobId": P}}, then destroy card A, then download the blob named by card B.'
    then: 'Card B is created with a working photo, and the download still succeeds after card A is gone.'
    sources:
      - 'cyrus:JMAPContacts/card_set_media_from_deleted_card'
      - 'cyrus:JMAPContacts/card_copy'
      - 'rfc:9610 3'

  - id: 'CARD-071'
    title: 'Blob/lookup maps a photo blob to its ContactCard'
    method: 'Blob/lookup'
    spec: 'RFC 9404 4.3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A card whose photo has blobId P. using includes the blob and contacts capabilities.'
    when: 'Call Blob/lookup with typeNames ["ContactCard"] and ids [P, "Gunknownblob"].'
    then: 'list has one entry per requested id: for P, matchedIds {"ContactCard": [cardId]}; for the unknown id it is listed in notFound. The card id resolves with ContactCard/get.'
    sources:
      - 'cyrus:JMAPContacts/card_blob_lookup'
      - 'rfc:9404 4.3'
      - 'rfc:9610 7.3'
    notes: 'ContactCard is registered as "Can Reference Blobs: Yes". It must also be listed in the supportedTypeNames of the blob account capability once contacts ship.'

  - id: 'CARD-072'
    title: 'Blob/lookup refuses AddressBook as a type name and requires the contacts capability'
    method: 'Blob/lookup'
