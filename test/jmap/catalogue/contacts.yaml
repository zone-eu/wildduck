    seed:
      - 'jmap'
    given: 'A card with name full "A", emails e1 and e2 and notes n1.'
    when: 'Update with {"name": {"components": [{"kind": "given", "value": "New"}, {"kind": "surname", "value": "Person"}], "isOrdered": true}, "emails": {"only1": {"address": "only@example.com"}}, "notes": {"n9": {"note": "replaced"}}}.'
    then: 'name has no full any more, emails has exactly only1 and notes exactly n9.'
