    when: 'Call ContactCard/changes with sinceState S.'
    then: 'created is [N], updated is [X], destroyed is [Y], hasMoreChanges false, and newState equals the current ContactCard/get state.'
    sources:
      - 'fastmail:t/ContactCard/changes/basic.t'
      - 'cyrus:JMAPContacts/card_changes'
      - 'stalwart:contacts/contact.rs'
      - 'cyrus:JMAPContacts/cardgroup_changes'

