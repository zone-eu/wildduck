  - id: 'CARD-132'
    title: 'Quoted text is a phrase search'
    method: 'ContactCard/query'
    spec: 'RFC 9610 3.3.1'
    level: 'should'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'Cards with notes "cats and dogs" and "dogs and cats".'
    when: 'Query with {note: "\"cats and dogs\""}, {note: "''dogs and cats''"}, {note: "\"cats dogs\""} and {note: "\"and dogs\" cats"}.'
    then: 'The first returns only the first card, the second only the second card, the third returns nothing (the words are not adjacent), the fourth returns the first card (a phrase plus a token).'
    sources:
      - 'cyrus:JMAPContacts/card_query_text'
      - 'rfc:9610 3.3.1'

  - id: 'CARD-133'
