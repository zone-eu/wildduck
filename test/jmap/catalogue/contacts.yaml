  - id: 'CARD-098'
    title: 'Register entries appear as synthesised cards in the register book'
    method: 'ContactCard/get'
    spec: 'RFC 9610 3.1'
    level: 'wd'
    phase: 5
    applies: 'yes'
    seed:
      - 'api'
    given: 'The user sent a message to "Jane Roe <jane.roe@example.com>" through the REST API, so the address register has that entry. R is the register book.'
    when: 'Call ContactCard/query with filter {inAddressBook: R}, then ContactCard/get for the ids.'
    then: 'One card is returned with addressBookIds {R: true}, "@type" "Card", version "1.0", a stable uid, kind absent or "individual", name {"full": "Jane Roe"} and one emails entry with address jane.roe@example.com. The id and uid are the same on every call.'
    sources:
      - 'wildduck:plan 10.1'
      - 'rfc:9610 4.1'
    notes: 'Open in the plan: synthesise cards on read (as assumed here) or seed real cards. Also open: entries with an empty name (name omitted, since Name needs full or components), entries flagged disabled in the register (assumed hidden), and what created and updated are (assumed: the register entry updated date for both).'

  - id: 'CARD-099'
    title: 'A recipient of a JMAP submission appears in the register book'
    method: 'EmailSubmission/set'
    spec: 'RFC 9610 3.2'
    level: 'wd'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'ContactCard state S. The register has no entry for new.person@example.net.'
    when: 'Create a draft to "New Person <new.person@example.net>", submit it with EmailSubmission/set, wait for the submission to be accepted, then call ContactCard/changes with sinceState S and query the register book with filter {email: "new.person@example.net"}.'
    then: 'The query returns one card in the register book. ContactCard/changes lists that card id in created and the state moved.'
    sources:
      - 'wildduck:plan 10.1'
      - 'wildduck:lib/message-handler.js address register'
    notes: 'Open question for the plan: the register is written by the mail path (message-handler), not by the JMAP worker, which contradicts the statement in 10.1 that no other path writes contacts. Either register writes must also append to the owned change log and publish a ContactCard StateChange, or register cards must be declared outside ContactCard/changes. This scenario assumes the former.'

  - id: 'CARD-100'
    title: 'Sending to the same recipient again updates rather than duplicates the register card'
    method: 'EmailSubmission/set'
    spec: 'RFC 9610 3.2'
    level: 'wd'
    phase: 5
    applies: 'yes'
    seed:
      - 'api'
    given: 'The register has a card for jane.roe@example.com. ContactCard state S.'
    when: 'Send another message to "Jane R. <Jane.Roe@Example.com>" and call ContactCard/changes with sinceState S.'
    then: 'The register book still has exactly one card for that address with the same id. If the display name changed, the card is listed in updated; it is never listed in created.'
    sources:
      - 'wildduck:plan 10.1'
      - 'wildduck:lib/message-handler.js address register'

  - id: 'CARD-101'
    title: 'Register cards cannot be updated, moved or destroyed'
