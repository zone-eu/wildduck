    given: 'Cards with (given, surname, surname2): (Zoe, Adams, none), (adam, Young, Ruiz), (Mia, brown, Alba).'
    when: 'Query with filter {kind: "individual"} and sort by name/given, then name/surname, then name/surname2 descending.'
