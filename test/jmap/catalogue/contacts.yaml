      - 'rfc:8620 5.6'

  - id: 'CARD-157'
    title: 'An updated card that still matches is reported in both removed and added'
    method: 'ContactCard/queryChanges'
    spec: 'RFC 8620 5.6'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'Query sorted by name/surname returned [Adams, Brown, Young] with queryState Q. Then Adams is renamed to Zimmer.'
    when: 'Call ContactCard/queryChanges with the same sort and sinceQueryState Q.'
    then: 'removed contains the renamed card id and added contains it with index 2, so a client applying removed then added gets [Brown, Young, Zimmer].'
    sources:
      - 'rfc:8620 5.6'

  - id: 'CARD-158'
    title: 'queryChanges honours maxChanges and upToId'
    method: 'ContactCard/queryChanges'
    spec: 'RFC 8620 5.6'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A query sorted by created ascending with queryState Q, then ten cards are created.'
    when: 'Call ContactCard/queryChanges with sinceQueryState Q and maxChanges 3; then again without maxChanges but with upToId set to the first id of the original result.'
    then: 'The first answers an error of type tooManyChanges. The second succeeds; changes located after upToId in the sort order may be omitted, changes before it must be present.'
    sources:
      - 'rfc:8620 5.6'

  - id: 'CARD-159'
    title: 'queryChanges with an unknown sinceQueryState answers cannotCalculateChanges'
    method: 'ContactCard/queryChanges'
    spec: 'RFC 8620 5.6'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Call ContactCard/queryChanges with sinceQueryState "bogus" and with a state older than the tombstone retention.'
    then: 'Both answer an error of type cannotCalculateChanges.'
    sources:
      - 'rfc:8620 5.6'
      - 'wildduck:plan 10.3'

  - id: 'CARD-160'
    title: 'ContactCard/copy has no second account to copy from'
    method: 'ContactCard/copy'
    spec: 'RFC 9610 3.6'
    level: 'must'
    phase: 5
    applies: 'adapted'
    seed:
      - 'api'
    given: 'Users A and B each have a card. The session belongs to A.'
    when: 'As A call ContactCard/copy with accountId A and fromAccountId "nosuchaccount"; then with fromAccountId set to the user id of B and create {"k": {"id": <card of B>, "addressBookIds": {<book of A>: true}}}.'
    then: 'Both calls answer an error of type fromAccountNotFound. Nothing is created in A and the card of B is untouched.'
    sources:
      - 'fastmail:t/ContactCard/foreign-account.t'
      - 'fastmail:t/ContactCard/copy/basic.t'
      - 'cyrus:JMAPContacts/card_copy'
      - 'stalwart:contacts/acl.rs'
      - 'rfc:8620 5.4'
    notes: 'No sharing, so the Cyrus card_copy family and the Fastmail copy test reduce to the error paths. ContactCard/copy must still exist as a method (not unknownMethod).'

  - id: 'CARD-161'
    title: 'ContactCard/copy to an unknown or foreign target account answers accountNotFound'
    method: 'ContactCard/copy'
    spec: 'RFC 8620 5.4'
    level: 'must'
    phase: 5
    applies: 'adapted'
    seed:
      - 'api'
    given: 'Users A and B. The session belongs to A.'
    when: 'As A call ContactCard/copy with fromAccountId A and accountId set to the user id of B, then with accountId "nosuchaccount".'
    then: 'Both calls answer an error of type accountNotFound.'
    sources:
      - 'fastmail:t/ContactCard/foreign-account.t'
      - 'rfc:8620 5.4'
      - 'rfc:8620 3.6.2'

  - id: 'CARD-162'
    title: 'ContactCard/copy within the same account is rejected'
    method: 'ContactCard/copy'
    spec: 'RFC 8620 5.4'
    level: 'must'
    phase: 5
    applies: 'adapted'
    seed:
      - 'jmap'
    given: 'User A with one card.'
    when: 'Call ContactCard/copy with fromAccountId A, accountId A and a create for the card.'
    then: 'The call answers an error of type invalidArguments and no second card appears.'
    sources:
      - 'rfc:8620 5.4'
      - 'cyrus:JMAPContacts/card_copy_state'
    notes: 'RFC 8620 5.4: accountId must differ from fromAccountId. Duplicating a card inside an account is a ContactCard/set create with a new uid.'

  - id: 'CARD-163'
    title: 'EventSource pushes a StateChange for ContactCard'
    method: 'EventSource'
    spec: 'RFC 9610 7.3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'An EventSource connection with types=ContactCard.'
    when: 'On another connection create a card, patch it, and destroy it, each in its own request.'
    then: 'A state event arrives for each change (events may be coalesced) and the last one has changed[accountId].ContactCard equal to the current ContactCard state. No event carries AddressBook, Email or Mailbox keys.'
    sources:
      - 'rfc:9610 7.3'
      - 'rfc:8620 7.1'
      - 'rfc:8620 7.3'
      - 'wildduck:plan 10.1'

  - id: 'CARD-164'
    title: 'A failed or no-op ContactCard/set pushes nothing'
    method: 'EventSource'
    spec: 'RFC 8620 7.1'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'An EventSource connection with types=* and closeafter=no.'
    when: 'Send a ContactCard/set whose only create is invalid, a no-op update, and a ContactCard/query; wait for the next ping.'
    then: 'No state event is delivered before the ping.'
    sources:
      - 'rfc:8620 7.1'
      - 'wildduck:brief: state must not change when nothing changed'

  - id: 'CARD-165'
    title: 'Contact pushes are isolated per account and do not disturb IMAP clients'
    method: 'EventSource'
    spec: 'RFC 8620 7.1'
    level: 'wd'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
      - 'imap'
      - 'api'
    given: 'Users A and B each hold an EventSource connection with types=*. A also has an IMAP connection in IDLE on INBOX.'
    when: 'As A create a card.'
    then: 'Only the stream of A receives a state event. B receives nothing. The IMAP connection of A receives no untagged response and stays in IDLE.'
    sources:
      - 'wildduck:plan 10.1'
      - 'rfc:9610 6'
    notes: 'The plan publishes contact state changes on the notifier channel the IMAP side also listens to, with a payload type IMAP must ignore.'

  - id: 'CARD-166'
    title: 'Last-Event-ID replay covers contact state changes'
    method: 'EventSource'
    spec: 'RFC 8620 7.3'
    level: 'should'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'An EventSource connection with types=ContactCard received an event with id E and was then dropped.'
    when: 'While disconnected, create a card. Reconnect with Last-Event-ID E.'
    then: 'The stream delivers a state event carrying the current ContactCard state shortly after reconnecting, without waiting for another change.'
    sources:
      - 'rfc:8620 7.3'
      - 'wildduck:brief: EventSource Last-Event-ID replay'

  - id: 'CARD-167'
    title: 'Create a group card with members'
    method: 'ContactCard/set'
    spec: 'RFC 9610 3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'Cards X and Y with uids UX and UY.'
    when: 'Create a card with kind "group", name {"full": "The Doe Family"} and members {UX: true, UY: true}.'
    then: 'The card is created and ContactCard/get returns kind "group" and members exactly as sent. A group without members and a group with members {} are also accepted.'
    sources:
      - 'cyrus:JMAPContacts/cardgroup_set_create'
      - 'cyrus:JMAPContacts/cardgroup_get_v4'
      - 'cyrus:JMAPContacts/card_query'
      - 'rfc:9610 3'
      - 'rfc:9553 2.1.6'

  - id: 'CARD-168'
    title: 'members requires kind group and true values'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.1.6'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create cards with (a) members {"u1": true} and no kind, (b) kind "org" and members {"u1": true}, (c) kind "group" and members {"u1": false}, (d) kind "group" and members ["u1"]. Then update an existing group card with members to kind "individual".'
    then: '(a) and (b) are rejected with invalidProperties naming "members" (or "kind"), (c) names "members/u1", (d) names "members". The update is in notUpdated with invalidProperties.'
    sources:
      - 'rfc:9553 2.1.6'
      - 'cyrus:JMAPContacts/cardgroup_set_create'

  - id: 'CARD-169'
    title: 'Unresolvable member uids are preserved'
    method: 'ContactCard/set'
    spec: 'RFC 9610 3'
    level: 'should'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'Card X with uid UX.'
    when: 'Create a group with members {UX: true, "urn:uuid:00000000-0000-4000-8000-000000000000": true, "some-foreign-uid@other.example": true}. Read it back.'
    then: 'The create succeeds although two uids match no card, and all three keys are returned unchanged.'
    sources:
      - 'rfc:9610 3'
      - 'cyrus:JMAPContacts/card_member_uid_matrix'
      - 'cyrus:JMAPContacts/cardgroup_set_create'
    notes: 'RFC 9610 3: any uid that cannot be found SHOULD be ignored but preserved. The server never validates member uids against existing cards.'

  - id: 'CARD-170'
    title: 'Add and remove group members with patches'
    method: 'ContactCard/set'
    spec: 'RFC 9610 3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A group with members {UX: true}. Card Y has uid UY which contains a colon (urn:uuid form).'
    when: 'Update with {"members/<UY>": true}; then {"members/<UX>": null}; then {"members/<UX>": true} again.'
    then: 'After each step members is {UX, UY}, then {UY}, then {UX, UY}. Each update moves the ContactCard state and lists only the group card in updated.'
    sources:
      - 'cyrus:JMAPContacts/cardgroup_set_update'
      - 'cyrus:JMAPContacts/cardgroup_set_add_remove_add'
      - 'cyrus:JMAPContacts/cardgroup_changes'
      - 'rfc:9610 3'

  - id: 'CARD-171'
    title: 'Member uids are never rewritten'
    method: 'ContactCard/set'
    spec: 'RFC 9610 3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'Card P has uid "urn:uuid:1b4e28ba-2fa1-41d2-883f-0016d3cca427" and card Q has uid "plainuid-0001".'
    when: 'Create a group with members keyed by both uids exactly; read it; patch one member out and in again; read it.'
    then: 'The keys are returned byte for byte each time: the urn:uuid prefix is neither stripped nor added, and case is kept. hasMember with each exact uid finds the group.'
    sources:
      - 'cyrus:JMAPContacts/card_member_uid_matrix'
      - 'cyrus:JMAPContacts/cardgroup_get_deduplicate_members'
      - 'rfc:9610 3'

  - id: 'CARD-172'
    title: 'Destroying a member card leaves the group untouched'
    method: 'ContactCard/set'
    spec: 'RFC 9610 3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'Group G with members {UX: true, UY: true}. ContactCard state S.'
    when: 'Destroy card X. Call ContactCard/changes with sinceState S and read G. Then create a new card with uid UX.'
    then: 'Changes lists X in destroyed and does not list G. G still has both member keys. After the recreate, a client resolving members finds a card for UX again.'
    sources:
      - 'rfc:9610 3'
      - 'cyrus:JMAPContacts/cardgroup_set_destroy'
      - 'cyrus:JMAPContacts/cardgroup_changes'

  - id: 'CARD-173'
    title: 'Destroying a group does not destroy its members'
    method: 'ContactCard/set'
    spec: 'RFC 9610 3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'Group G with members X and Y.'
    when: 'Destroy G.'
    then: 'G is gone; X and Y are still returned by ContactCard/get.'
    sources:
      - 'cyrus:JMAPContacts/cardgroup_set_destroy'
      - 'rfc:9610 3'

  - id: 'CARD-174'
    title: 'Group members resolve through uid queries'
    method: 'ContactCard/query'
    spec: 'RFC 9610 3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'Group G with members {UX: true, UY: true, "urn:uuid:missing": true}, where X is in book B1 and Y in book B2.'
    when: 'Read G, then for each member key call ContactCard/query with filter {uid: key}; alternatively one query with an OR of the three uid conditions.'
    then: 'UX and UY each resolve to exactly one card id regardless of the address book. The missing uid resolves to nothing. The OR query returns X and Y.'
    sources:
      - 'cyrus:JMAPContacts/card_query_group_with_member'
      - 'cyrus:JMAPContacts/cardgroup_query'
      - 'rfc:9610 3'

  - id: 'CARD-175'
    title: 'A group may list itself or another group as a member'
    method: 'ContactCard/set'
    spec: 'RFC 9553 2.1.6'
    level: 'may'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'Group G1 with uid U1.'
    when: 'Create group G2 with members {U1: true}; update G1 with members {<uid of G2>: true, U1: true}.'
    then: 'Both writes succeed and read back as sent. The server does not expand, follow or reject the cycle.'
    sources:
      - 'rfc:9553 2.1.6'
      - 'rfc:9610 3'

  - id: 'CARD-176'
    title: 'vCard specific properties are stored as ordinary JSContact data, with no conversion'
    method: 'ContactCard/set'
    spec: 'RFC 9553 1.7.4'
    level: 'wd'
    phase: 5
    applies: 'adapted'
    seed:
      - 'jmap'
    given: 'A writable address book B exists.'
    when: 'Create a card with the property vCardProps [["x-custom", {}, "text", "value"]] and an emails entry carrying vCardParams {"group": "item1"}, as defined by the JSContact to vCard mapping (RFC 9555).'
    then: 'The card is created and both properties are returned unchanged as unknown properties. Nothing is interpreted, merged into other properties or dropped.'
    sources:
      - 'cyrus:JMAPContacts/card_set_create_vcardprops'
      - 'cyrus:JMAPContacts/card_set_update_vcardprops'
      - 'cyrus:JMAPContacts/card_get_no_type_vcardparams'
      - 'wildduck:plan 10.1'
    notes: 'vCard import, export and CardDAV are outside the plan (section 10.1). The Cyrus tests that compare the stored vCard (card_get_v3, card_get_v4, card_set_derive_fn, card_set_name_check_vcard_props, card_apple_label_handling, card_get_apple_countrycode, card_get_param_rfc6868, card_set_importance_*, card_parse, carddav_*, dblookup_*) and the Stalwart CardDAV and ContactCard/parse sections have no counterpart here.'
