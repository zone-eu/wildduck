    spec: 'RFC 8620 5.5'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'Fixture cards in book B: (1) Sarah Johnson (given, surname), nickname "SJ", org "Tech Innovations Inc.", email sarah.johnson@example.com (label "Work mail"), phone "+1-555-0100" (label "Desk"), note "Met at the conference in Tallinn"; (2) Carlos García López (given, surname García, surname2 López), nickname "Carlitos", email carlos@example.org, address Madrid, Spain; (3) kind org card "ACME Corp" with full name only, onlineService GitHub user "acme-corp"; (4) kind group card "Team" with members = uids of 1 and 2.'
    when: 'Query with (a) {operator: "OR", conditions: [{"name/given": "Sarah"}, {"name/given": "Carlos"}]}, (b) {operator: "AND", conditions: [{kind: "individual"}, {email: "example.org"}]}, (c) {operator: "NOT", conditions: [{kind: "individual"}, {kind: "group"}]}, (d) {operator: "AND", conditions: [{inAddressBook: B}, {operator: "NOT", conditions: [{operator: "OR", conditions: [{name: "Sarah"}, {kind: "org"}]}]}]}, (e) {operator: "AND", conditions: []}.'
    then: '(a) cards 1 and 2. (b) card 2. (c) card 3 (NOT means none of the conditions match). (d) cards 2 and 4. (e) all cards.'
