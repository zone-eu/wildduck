    given: 'Fixture cards in book B: (1) Sarah Johnson (given, surname), nickname "SJ", org "Tech Innovations Inc.", email sarah.johnson@example.com (label "Work mail"), phone "+1-555-0100" (label "Desk"), note "Met at the conference in Tallinn"; (2) Carlos García López (given, surname García, surname2 López), nickname "Carlitos", email carlos@example.org, address Madrid, Spain; (3) kind org card "ACME Corp" with full name only, onlineService GitHub user "acme-corp"; (4) kind group card "Team" with members = uids of 1 and 2.'
    when: 'Query with {text: "Sarah"}, {text: "tallinn"}, {text: "innovations"}, {text: "carlos@example.org"}, {text: "Madrid"}, {text: "acme-corp"}, {text: "0100"} or {text: "+1-555-0100"}, and {text: "zebra"}.'
    then: 'Card 1 matches Sarah (name), tallinn (note), innovations (organization) and the phone number. Card 2 matches the email address and Madrid (address). Card 3 matches acme-corp (online service user). zebra matches nothing.'
    sources:
      - 'cyrus:JMAPContacts/card_query'
      - 'stalwart:contacts/contact.rs'
      - 'rfc:9610 3.3.1'
    notes: 'RFC 9610 only says the text matches "text in the card". The plan indexes name components, emails, phones, organisations and notes; this scenario also expects nicknames, addresses and online services to be covered so that text is a superset of the specific filters. Assert only the full phone number unless digit matching is implemented.'

  - id: 'CARD-130'
