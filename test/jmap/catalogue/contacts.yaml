  - id: 'CARD-080'
    title: 'Patch with null removes a property or a map entry'
    method: 'ContactCard/set'
    spec: 'RFC 8620 5.3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A card with nicknames {"k1": {"name": "Charlie"}}, emails e1 and e2, a note n1 and keywords {"B2B": true, "old": true}.'
    when: 'Update with {"nicknames/k1": null, "nicknames/k2": {"name": "Carlitos"}, "emails/e2": null, "notes": null, "keywords/old": null, "keywords/B2C": true, "emails/e1/label": null}.'
    then: 'The card has nicknames only k2, emails only e1, no notes property, keywords exactly {"B2B": true, "B2C": true}. Removing the absent emails/e1/label is a no-op and not an error.'
    sources:
      - 'stalwart:contacts/contact.rs'
      - 'legacy-proxy:test/unit/contacts-set.spec.ts'
      - 'cyrus:JMAPContacts/card_set_update'
      - 'rfc:8620 5.3'
    notes: 'Stalwart also accepts keywords/X false as a removal. RFC 9553 requires set values to be true, so false is rejected here with invalidProperties; removal is by null.'

  - id: 'CARD-081'
    title: 'Replacing a whole top level property'
    method: 'ContactCard/set'
    spec: 'RFC 8620 5.3'
    level: 'must'
