      - 'cyrus:JMAPContacts/card_set_update'
      - 'stalwart:contacts/contact.rs'

  - id: 'CARD-082'
    title: 'An update is validated against the resulting card'
    method: 'ContactCard/set'
    spec: 'RFC 9553 1.4.3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A valid individual card with emails e1 and name {"full": "A"}.'
    when: 'Send updates with {"emails/e1/address": null}, {"name/full": null}, {"kind": "bogus"}, {"emails/e1/pref": 500} and {"members": {"urn:uuid:x": true}}.'
    then: 'Each is in notUpdated with type invalidProperties naming "emails/e1/address", "name" (or "name/full"), "kind", "emails/e1/pref" and "members". The card is unchanged and the ContactCard state does not move.'
    sources:
      - 'cyrus:JMAPContacts/card_set_update_extra_rejected'
      - 'rfc:9553 1.4.3'
      - 'rfc:9553 2.1.6'
      - 'rfc:8620 5.3'
    notes: 'The last case: members may only be set when kind is group.'

  - id: 'CARD-083'
    title: 'invalidPatch for pointers that cannot be applied'
    method: 'ContactCard/set'
    spec: 'RFC 8620 5.3'
    level: 'must'
    phase: 5
    applies: 'yes'
    seed:
      - 'jmap'
    given: 'A card with name components [given, surname] and no phones property.'
    when: 'Send updates with (a) {"phones/p1/number": "1"} (parent phones/p1 missing), (b) {"name/components/5/value": "x"} (index out of range), (c) {"name/components/-": {"kind": "given", "value": "x"}}, (d) {"name/components/0": null}, (e) {"name": {"full": "x"}, "name/full": "y"} (one pointer is a prefix of the other), (f) {"name//full": "x"}.'
    then: 'Each is in notUpdated with type invalidPatch and the card is unchanged.'
    sources:
      - 'rfc:8620 5.3'
      - 'rfc:9553 1.4.3'
      - 'legacy-proxy:test/unit/contacts-set.spec.ts'
      - 'fastmail:t/ContactCard/set/update.t'
    notes: '(d): removing an array element by index is not a valid patch, the whole array must be replaced.'

