  - id: 'CARD-103'
    title: 'A uid used by a register card cannot be taken by a stored card'
    method: 'ContactCard/set'
    spec: 'RFC 9610 3'
    level: 'wd'
    phase: 5
    applies: 'yes'
    seed:
      - 'api'
    given: 'A register card with uid U.'
