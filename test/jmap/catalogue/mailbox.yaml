  - id: MBX-198
    title: "One failing update does not block the others"
    method: Mailbox/set
    spec: "RFC 8620 5.3"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "Mailboxes 'A' and 'B' and the INBOX."
    when: "Mailbox/set updates 'A' with name 'A2', 'B' with name 'x/y' and the INBOX with name 'Nope' in one call."
    then: "updated has only 'A'; notUpdated has 'B' with invalidProperties and the INBOX with forbidden. newState differs from oldState."
    sources:
      - "rfc:8620 5.3"
      - "james:MailboxSetMethodContract#updateShouldNotChangeRightsWhenRenameFails"

  # ------------------------------------------------------ Mailbox/set: destroy
  - id: MBX-199
    title: "Destroy an empty mailbox"
    method: Mailbox/set
    spec: "RFC 8621 2.5"
    level: must
    phase: 2
    applies: yes
    seed: [jmap, imap]
    given: "An empty mailbox 'Destroy Me' with id X, subscribed."
    when: "Mailbox/set is called with destroy [X]."
    then: "destroyed is [X] and notDestroyed is null. Mailbox/get returns X in notFound, Mailbox/changes lists X in destroyed, and neither IMAP LIST nor LSUB shows 'Destroy Me'."
    sources:
      - "james:MailboxSetMethodContract#deleteShouldRemoveExistingMailbox"
      - "james:MailboxSetMethodContract#destroyShouldUnsubscribeMailboxes"
      - "cyrus:JMAPMailbox/mailbox_set_destroy_empty"
      - "cyrus:JMAPMailbox/mailbox_set_subscriptions_destroy"
      - "stalwart:compliance/mailbox.rs#set_destroy_empty"
      - "jmapio:mailbox/set-destroy-empty"
      - "fastmail:t/Mailbox/set/destroy/good-destroy-no-messages.t"

  - id: MBX-200
    title: "Destroy several mailboxes in one call"
    method: Mailbox/set
    spec: "RFC 8620 5.3"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "Empty mailboxes 'A', 'B' and 'C'."
    when: "Mailbox/set is called with destroy listing the three ids."
    then: "destroyed holds the three ids (any order) and Mailbox/get ids null no longer lists them."
    sources:
      - "james:MailboxSetMethodContract#deleteShouldRemoveExistingMailboxes"

  - id: MBX-201
    title: "Destroying an unknown, malformed or already destroyed id answers notFound"
    method: Mailbox/set
    spec: "RFC 8620 5.3"
    level: must
    phase: 2
    applies: yes
    seed: [jmap, api]
    given: "A mailbox destroyed a moment ago (id X), a hidden mailbox (id H) and a mailbox id of another user."
    when: "Mailbox/set is called with destroy [X, H, <foreign id>, 'invalid', '#nosuch']."
    then: "notDestroyed has all five keys, each with a SetError of type notFound; destroyed is null and the state is unchanged."
    sources:
      - "james:MailboxSetMethodContract#deleteShouldFailWhenMailboxDoesNotExist"
      - "james:MailboxSetMethodContract#deleteShouldHandleInvalidMailboxId"
      - "james:MailboxSetMethodContract#destroyShouldPreserveAnUnknownMaximumLengthCreationReference"
      - "cyrus:JMAPMailbox/mailbox_set_destroy_twice"
      - "stalwart:compliance/mailbox.rs#set_destroy_not_found"
      - "jmapio:mailbox/set-destroy-not-found"
      - "fastmail:t/Mailbox/set/nonexistent-id.t"

  - id: MBX-202
    title: "A mailbox with a child cannot be destroyed"
    method: Mailbox/set
    spec: "RFC 8621 2.5"
    level: must
    phase: 2
    applies: yes
    seed: [jmap, imap]
    given: "'Parent' (empty) with child 'Parent/Child'."
    when: "Mailbox/set is called with destroy [<id of Parent>]; and again with onDestroyRemoveEmails true."
    then: "Both calls answer notDestroyed with a SetError of type mailboxHasChild. Parent and child still exist over JMAP and IMAP."
    sources:
      - "cyrus:JMAPMailbox/mailbox_set"
      - "stalwart:mail/mailbox.rs"
      - "stalwart:compliance/mailbox.rs#set_cannot_destroy_with_children"
      - "stalwart:compliance/mailbox.rs#set_on_destroy_remove_emails_with_children"
      - "jmapio:mailbox/set-cannot-destroy-with-children"
      - "jmapio:mailbox/set-on-destroy-remove-emails-with-children"
      - "fastmail:t/Mailbox/set/destroy/mailbox-has-child-error.t"
    notes: "MailboxHandler.del does not check for children today, so the check is a JMAP pre-check."

  - id: MBX-203
    title: "A mailbox whose only descendants have a missing ancestor still counts as having a child"
    method: Mailbox/set
    spec: "RFC 8621 2.5"
    level: wd
    phase: 2
    applies: adapted
    seed: [imap]
    given: "'A' and 'A/B/C' exist without 'A/B'."
    when: "Mailbox/set is called with destroy [<id of A>]."
    then: "notDestroyed has type mailboxHasChild, because Mailbox/get reports 'A' as the parentId of 'A/B/C'."
    sources:
      - "cyrus:JMAPMailbox/mailbox_set_intermediary_destroy"
      - "cyrus:JMAPMailbox/mailbox_set_intermediary_destroy_child"

  - id: MBX-204
    title: "Parent and child can be destroyed in one call, whatever the order of the ids"
    method: Mailbox/set
    spec: "RFC 8620 5.3"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "Empty mailboxes 'A', 'A/B' and 'A/B/C'."
    when: "Mailbox/set is called with destroy [<id of A>, <id of A/B>, <id of A/B/C>] (parents first)."
    then: "All three ids are in destroyed and none in notDestroyed."
    sources:
      - "cyrus:JMAPMailbox/mailbox_set_order"
      - "rfc:8620 5.3"

  - id: MBX-205
    title: "A mailbox holding emails cannot be destroyed by default"
    method: Mailbox/set
    spec: "RFC 8621 2.5"
    level: must
    phase: 2
    applies: yes
    seed: [jmap, imap]
    given: "A mailbox with one message appended over IMAP."
    when: "Mailbox/set is called with destroy [<id>] without onDestroyRemoveEmails, and again with onDestroyRemoveEmails false."
    then: "Both calls answer notDestroyed with a SetError of type mailboxHasEmail. The mailbox and the message still exist."
    sources:
      - "cyrus:JMAPMailbox/mailbox_set_destroy_empty"
      - "stalwart:mail/mailbox.rs"
      - "fastmail:t/Mailbox/set/destroy/mailbox-has-email-error.t"
      - "rfc:8621 2.5"
    notes: "James deletes the mailbox regardless; the RFC behaviour is required here."

  - id: MBX-206
    title: "onDestroyRemoveEmails true destroys the mailbox together with its emails"
    method: Mailbox/set
    spec: "RFC 8621 2.5"
    level: must
    phase: 2
    applies: yes
    seed: [jmap, imap]
    given: "A mailbox with two messages (Email ids E1 and E2, one thread); state S1."
    when: "Mailbox/set is called with destroy [<id>] and onDestroyRemoveEmails true."
    then: "The id is in destroyed. Email/get returns E1 and E2 in notFound, Email/changes sinceState S1 lists both in destroyed, Thread/get for their thread returns notFound, and IMAP LIST no longer shows the mailbox."
    sources:
      - "james:MailboxSetMethodContract#deleteShouldRemoveMessagesWhenOnDestroyRemoveEmails"
      - "cyrus:JMAPMailbox/mailbox_set_destroy_removemsgs"
      - "stalwart:mail/mailbox.rs"
      - "stalwart:compliance/mailbox.rs#set_on_destroy_remove_emails"
      - "jmapio:mailbox/set-on-destroy-remove-emails"
      - "fastmail:t/Mailbox/set/destroy/on-destroy-remove-messages-true-mail-only-here.t"
    notes: "An Email is in exactly one mailbox, so the 'also in another mailbox' branch of the RFC (fastmail on-destroy-remove-messages-true-mail-in-other-boxes.t) cannot occur. Decided 2026-11-11: the Emails are removed as by an IMAP DELETE of the mailbox (marked for immediate expiry, journaled as EXPUNGE), not moved to the 25 day archive."

  - id: MBX-207
    title: "Messages flagged \\Deleted do not block destroying a mailbox"
    method: Mailbox/set
    spec: "RFC 8621 2.5"
    level: wd
    phase: 2
    applies: adapted
    seed: [jmap, imap]
    given: "A mailbox whose only message is flagged \\Deleted over IMAP and not expunged; Mailbox/get shows totalEmails 0."
    when: "Mailbox/set is called with destroy [<id>] without onDestroyRemoveEmails."
    then: "The mailbox is destroyed (no mailboxHasEmail), since no Email is visible in it over JMAP. The flagged message is removed with the mailbox."
    sources:
      - "wildduck:brief emails"
      - "rfc:8621 4.1.1"
    notes: "Decided 2026-11-11: the mailbox is destroyed. The alternative, mailboxHasEmail for a mailbox that looks empty over JMAP, is a state clients cannot resolve. An IMAP client could still have undeleted the message; the same happens with an IMAP DELETE."

  - id: MBX-208
    title: "The INBOX and special use mailboxes cannot be destroyed"
    method: Mailbox/set
    spec: "RFC 8621 2.5"
    level: wd
    phase: 2
    applies: adapted
    seed: [none]
    given: "The default mailboxes, all empty."
    when: "Mailbox/set is called with destroy listing the ids of INBOX, Sent, Trash, Drafts and Junk, with onDestroyRemoveEmails true."
    then: "All five ids are in notDestroyed with a SetError of type forbidden, consistent with myRights.mayDelete false. All five still exist."
    sources:
      - "cyrus:JMAPMailbox/mailbox_set_role_protected_destroy"
      - "cyrus:JMAPMailbox/mailbox_set_role_move_destroy"
      - "wildduck:lib/mailbox-handler.js"
    notes: "Stalwart allows destroying Trash with its contents; WildDuck does not."

  - id: MBX-209
    title: "Create and destroy by creation id in one call"
    method: Mailbox/set
    spec: "RFC 8620 5.3"
    level: must
    phase: 2
    applies: yes
    seed: [none]
    given: "The default mailboxes."
    when: "Mailbox/set is called with create {'t': {name: 'Temp'}} and destroy ['#t']."
    then: "created has 't' and destroyed holds the id that was given to 't'. Afterwards no mailbox 'Temp' exists."
    sources:
      - "james:MailboxSetMethodContract#deleteShouldAcceptCreationIdsWithinTheSameRequest"
      - "rfc:8620 5.3"

  - id: MBX-210
    title: "Destroying a mailbox and creating one with the same name in one call works"
    method: Mailbox/set
    spec: "RFC 8620 5.3"
    level: wd
    phase: 2
    applies: adapted
    seed: [jmap]
    given: "An empty top level mailbox 'A' with id X."
    when: "Mailbox/set is called with create {'n': {name: 'A'}} and destroy [X]."
    then: "X is in destroyed and 'n' is created with an id different from X. Exactly one mailbox named 'A' exists afterwards. Mailbox/changes from the earlier state lists X in destroyed and the new id in created."
    sources:
      - "cyrus:JMAPMailbox/mailbox_set_order2"
      - "rfc:8620 5.3"
    notes: "A create whose name is taken by a mailbox that the same call destroys destroys that mailbox first, when the destroy can succeed on its own (no children, no Emails unless onDestroyRemoveEmails)."

  - id: MBX-211
    title: "A dependent chain of move, destroy and create in one call is ordered by the server"
    method: Mailbox/set
    spec: "RFC 8620 5.3"
    level: may
    phase: 2
    applies: yes
    seed: [jmap]
    given: "'A' (id X) with child 'A/B' (id Y), both empty."
    when: "Mailbox/set is called with create {'n': {name: 'A'}}, update {Y: {parentId: '#n'}} and destroy [X]."
    then: "Preferred outcome: all three succeed, leaving a new 'A' with child 'B' (id Y) and X destroyed. If the server cannot resolve the order it must fail the operations individually (for example X with mailboxHasChild and 'n' with invalidProperties) and leave the original tree intact; it must never destroy 'A' while losing 'B'."
    sources:
      - "cyrus:JMAPMailbox/mailbox_set_order2"

  - id: MBX-212
    title: "A destroyed name can be reused and gets a new id"
    method: Mailbox/set
    spec: "RFC 8621 2"
    level: must
    phase: 2
    applies: yes
    seed: [jmap, imap]
    given: "A mailbox 'Cycle' with id X, unsubscribed, sortOrder 9, destroyed over JMAP."
    when: "Mailbox/set creates 'Cycle' again."
    then: "The new mailbox has an id different from X, isSubscribed true and sortOrder 0. Mailbox/get for X still answers notFound."
    sources:
      - "james:MailboxSetMethodContract#destroyShouldUnsubscribeMailboxes"
      - "cyrus:JMAPMailbox/mailbox_changes_create_delete"
      - "cyrus:JMAPMailbox/mailbox_set_subscriptions_destroy"

  - id: MBX-213
    title: "One failing destroy does not block the others"
    method: Mailbox/set
    spec: "RFC 8620 5.3"
    level: must
    phase: 2
    applies: yes
    seed: [jmap, imap]
    given: "An empty mailbox 'E', a mailbox 'F' with one message and the INBOX."
    when: "Mailbox/set is called with destroy [<E>, <F>, <INBOX>]."
    then: "destroyed is [<E>]; notDestroyed has 'F' with mailboxHasEmail and the INBOX with forbidden."
    sources:
      - "rfc:8620 5.3"
      - "cyrus:JMAPMailbox/mailbox_set_destroy_movetomailbox_errors"

  # -------------------------------------------------- Mailbox/set: state, misc
  - id: MBX-214
    title: "Mailbox/set returns oldState and newState that bracket the change"
    method: Mailbox/set
    spec: "RFC 8620 5.3"
    level: must
    phase: 2
    applies: yes
    seed: [none]
    given: "State S from Mailbox/get."
    when: "One request holds Mailbox/set creating a mailbox and then Mailbox/get with an empty ids array."
    then: "oldState equals S, newState differs from S and equals the state the following Mailbox/get returns. Mailbox/changes sinceState S returns exactly the created id."
    sources:
      - "james:MailboxSetMethodContract#newStateShouldBeUpToDate"
      - "james:MailboxSetMethodContract#oldStateShouldIncludeSetChanges"
      - "stalwart:compliance/mailbox.rs#set_state_changes"
      - "jmapio:mailbox/set-state-changes"
      - "jmap-perl:t/set-state-consistent.t"

  - id: MBX-215
    title: "A Mailbox/set that changes nothing keeps the state and returns null maps"
    method: Mailbox/set
    spec: "RFC 8620 5.3"
    level: must
    phase: 2
    applies: yes
    seed: [none]
    given: "State S from Mailbox/get."
    when: "Mailbox/set is called with only accountId; then with create {}, update {} and destroy []; then with one create that fails validation."
    then: "In all three responses oldState and newState equal S. created, updated and destroyed are null, and notCreated, notUpdated and notDestroyed are null except for the failed create in the third call."
    sources:
      - "fastmail:t/Mailbox/set/create/empty-set-fields-are-null.t"
      - "fastmail:t/Mailbox/set/destroy/empty-set-fields-are-null.t"
      - "jmap-perl:t/set-state-consistent.t"
      - "rfc:8620 5.3"

  - id: MBX-216
    title: "ifInState matching the current state lets the call proceed"
    method: Mailbox/set
    spec: "RFC 8620 5.3"
    level: must
    phase: 2
    applies: yes
    seed: [none]
    given: "State S from Mailbox/get."
    when: "Mailbox/set is called with ifInState S and one create."
    then: "The mailbox is created and oldState equals S."
    sources:
      - "fastmail:t/Mailbox/set/if-in-state.t"
      - "cyrus:JMAPMailbox/mailbox_set"
      - "jmap-perl:t/set-state-consistent.t"

  - id: MBX-217
    title: "ifInState not matching aborts the call with stateMismatch"
    method: Mailbox/set
    spec: "RFC 8620 5.3"
    level: must
    phase: 2
    applies: yes
    seed: [imap]
    given: "State S1; then a mailbox is created over IMAP so the state is S2."
    when: "Mailbox/set is called with ifInState S1 and a create, an update and a destroy; and separately with ifInState 'garbage'."
    then: "Both calls return an error invocation of type stateMismatch. Nothing was created, updated or destroyed, and the state is still S2."
    sources:
      - "fastmail:t/Mailbox/set/if-in-state.t"
      - "cyrus:JMAPMailbox/mailbox_set"
      - "jmap-perl:t/set-state-consistent.t"
      - "rfc:8620 5.3"

  - id: MBX-218
    title: "ifInState also trips on Email activity because the state is shared"
    method: Mailbox/set
    spec: "RFC 8620 5.3"
    level: wd
    phase: 2
    applies: adapted
    seed: [lmtp]
    given: "State S1 from Mailbox/get; then a message is delivered to INBOX."
    when: "Mailbox/set is called with ifInState S1 and a rename of an unrelated mailbox."
    then: "The call returns stateMismatch. After the client refreshes with Mailbox/changes and retries with the new state, the rename succeeds."
    sources:
      - "wildduck:brief state and changes"
    notes: "Consequence of one state string for Email, Thread and Mailbox. Clients using ifInState on a busy account will retry often; worth revisiting if it hurts."

  - id: MBX-219
    title: "Mailbox/set with a foreign accountId answers accountNotFound"
    method: Mailbox/set
    spec: "RFC 8620 3.6.2"
    level: must
    phase: 2
    applies: yes
    seed: [none]
    given: "Two users A and B."
    when: "User A calls Mailbox/set with accountId of B and a create."
    then: "The response is an error invocation of type accountNotFound and B gets no new mailbox."
    sources:
      - "james:MailboxSetMethodContract#mailboxSetShouldFailWhenWrongAccountId"
      - "fastmail:t/Mailbox/foreign-account.t"

  - id: MBX-220
    title: "More operations than maxObjectsInSet answers requestTooLarge"
    method: Mailbox/set
    spec: "RFC 8620 5.3"
    level: must
    phase: 2
    applies: yes
    seed: [none]
    given: "The session advertises maxObjectsInSet N."
    when: "Mailbox/set is called with create, update and destroy entries adding up to N plus 1."
    then: "The response is an error invocation of type requestTooLarge and nothing is applied."
    sources:
      - "rfc:8620 5.3"

  - id: MBX-221
    title: "Changes made by Mailbox/set show up in Mailbox/changes with updatedProperties null"
    method: Mailbox/set
    spec: "RFC 8621 2.2"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "Mailboxes 'R' and 'D'; state S1."
    when: "One Mailbox/set creates 'N', renames 'R', sets isSubscribed false on the INBOX and destroys 'D'; then Mailbox/changes sinceState S1 is called."
    then: "created holds the id of 'N', updated holds the ids of 'R' and the INBOX, destroyed holds the id of 'D', and updatedProperties is null."
    sources:
      - "james:MailboxChangesMethodContract#mailboxChangesShouldReturnAllTypeOfChanges"
      - "stalwart:mail/mailbox.rs"
      - "fastmail:t/Mailbox/changes/with-changes.t"

  - id: MBX-222
    title: "An IMAP session sees JMAP mailbox changes without reconnecting"
    method: Mailbox/set
    spec: "RFC 8621 2.5"
    level: wd
    phase: 2
    applies: yes
    seed: [jmap, imap]
    given: "An IMAP session that is logged in before the JMAP calls and has the INBOX selected."
    when: "Over JMAP a mailbox 'New' is created, 'Other' is renamed to 'Other2', 'Gone' is destroyed and 'Quiet' is unsubscribed. The same IMAP session then runs NOOP, LIST and LSUB."
    then: "NOOP succeeds. LIST shows 'New', 'Other2' and 'Quiet' and neither 'Other' nor 'Gone'. LSUB shows 'New' and 'Other2' but not 'Quiet'. SELECT of 'Other2' succeeds and SELECT of 'Gone' fails."
    sources:
      - "cyrus:JMAPMailbox/mailbox_set_name_interop"
      - "wildduck:brief emails"

  - id: MBX-223
    title: "Mailbox/changes pages past the journal scan limit without losing mailbox changes"
    method: Mailbox/changes
    spec: "RFC 8620 5.2"
    level: must
    phase: 2
    applies: yes
    seed: [imap, jmap]
    given: "A JMAP service whose journal scan limit ([jmap.changes] scanLimit) is 5, and a state S1 of the user."
    when: "Six messages are appended to the INBOX over IMAP, then a mailbox 'Late' is created over JMAP. Mailbox/changes is called with sinceState S1, and again with each newState while hasMoreChanges is true."
    then: "The first page stops at the scan limit: hasMoreChanges is true and newState is not the current state. The pages together list the id of 'Late' in created, and the last page has hasMoreChanges false."
    sources:
      - "rfc:8620 5.2"
      - "wildduck:security audit R-1"
