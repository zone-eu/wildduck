    when: "Email/get with properties ['to', 'subject']."
    then: "to has ten entries with clean names (no CR, LF or tab) and exact addresses. subject contains no CR or LF; each fold becomes the white space that followed it."
    sources:
      - "rfc:5322 2.2.3"
      - "rfc:8621 4.1.2.2"

