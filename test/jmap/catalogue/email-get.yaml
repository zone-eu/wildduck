area: email-get
title: "Email/get"
description: "RFC 8621 sections 4.1 and 4.2: the Email object as read through Email/get. Covers the /get basics, metadata properties, every header form and its decoding edge cases, the body model (bodyStructure, textBody, htmlBody, attachments, bodyValues), hasAttachment, preview, part blobs and consistency with IMAP for the same message."
scenarios:
  # ---------------------------------------------------------------- basics
  - id: EGET-001
    title: "Return an Email by id with the standard /get response shape"
    method: Email/get
    spec: "RFC 8620 5.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "One message appended to INBOX over IMAP; its Email id is known from Email/query."
    when: "Email/get with accountId and ids set to that one id, no other arguments."
    then: "The response is an Email/get invocation with the same call id, containing accountId, a non empty string state, list with exactly one object whose id equals the requested id, and notFound as an empty array."
    sources:
      - "james:EmailGetMethodContract#existingEmailsShouldBeFound"
      - "cyrus:JMAPEmail/email_get"
      - "jmapio:email-get#get-by-id"
      - "jmapio:email-get#get-state-returned"
      - "stalwart:mail/get.rs"
      - "rfc:8620 5.1"

  - id: EGET-002
    title: "Report a well formed but unknown id in notFound"
    method: Email/get
    spec: "RFC 8620 5.1"
    level: must
    phase: 1
    applies: yes
    seed: [none]
    given: "An account with no message whose id is M followed by 24 zero hex digits."
    when: "Email/get with ids containing only that id."
    then: "list is empty and notFound contains exactly that id. No method level error is returned."
    sources:
      - "james:EmailGetMethodContract#notExistingValidIdsShouldBeNotFound"
      - "jmapio:email-get#get-not-found"
      - "rfc:8620 5.1"

  - id: EGET-003
    title: "Report a syntactically invalid id in notFound instead of failing the call"
    method: Email/get
    spec: "RFC 8620 5.1"
    level: wd
    phase: 1
    applies: yes
    seed: [none]
    given: "Any account."
    when: "Email/get with ids ['invalid', 'M123', 'Mzzzzzzzzzzzzzzzzzzzzzzzz', a valid Mailbox id], all valid Id strings by RFC 8620 1.2 but none in Email id format."
    then: "list is empty and notFound contains all four ids. No invalidArguments error and no server error."
    sources:
      - "james:EmailGetMethodContract#invalidIdsShouldBeNotFound"
    notes: "The id format (M plus 24 hex) must be checked before building a MongoDB ObjectId so that a bad id can never throw."

  - id: EGET-004
    title: "Mix found and not found ids in one call"
    method: Email/get
    spec: "RFC 8620 5.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "Two existing messages and one unknown id."
    when: "Email/get with ids [existing1, unknown, existing2]."
    then: "list holds exactly the two existing Emails and notFound holds exactly the unknown id."
    sources:
      - "james:EmailGetMethodContract#foundAndNotFoundCanBeMixed"
      - "james:EmailGetMethodContract#severalEmailCanBeRetrievedAtOnce"
      - "jmapio:email-get#get-multiple-emails"

  - id: EGET-005
    title: "Return an id that is requested twice only once"
    method: Email/get
    spec: "RFC 8620 5.1"
    level: should
    phase: 1
    applies: yes
    seed: [imap]
    given: "One existing message and one unknown id."
    when: "Email/get with ids [existing, existing, unknown, unknown]."
    then: "list contains the existing Email exactly once and notFound contains the unknown id exactly once."
    sources:
      - "james:EmailGetMethodContract#requestingTheSameIdTwiceReturnsItOnce"
      - "james:EmailGetMethodContract#requestingTheSameNotFoundIdTwiceReturnsItOnce"

  - id: EGET-006
    title: "Accept an empty ids array"
    method: Email/get
    spec: "RFC 8620 5.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "An account with at least one message."
    when: "Email/get with ids []."
    then: "list is [] and notFound is []; state is still returned."
    sources:
      - "james:EmailGetMethodContract#noIdsShouldBeAccepted"
      - "fastmail:t/Email/get/no-ids.t"

  - id: EGET-007
    title: "Reject ids null or omitted because fetching all Emails is not supported"
    method: Email/get
    spec: "RFC 8620 5.1"
    level: wd
    phase: 1
    applies: adapted
    seed: [imap]
    given: "An account with a few messages."
    when: "Email/get with ids null, and again with the ids argument left out."
    then: "Both calls answer with an error invocation of type invalidArguments. No Email is returned."
    sources:
      - "james:EmailGetMethodContract#idsShouldBeMandatory"
      - "rfc:8620 5.1"
    notes: "RFC 8620 5.1 lets a data type decline 'return all' for null ids but names no error for it. James answers invalidArguments; requestTooLarge would also be defensible. Open question: confirm the error type."

  - id: EGET-008
    title: "Reject ids and properties of the wrong JSON type"
    method: Email/get
    spec: "RFC 8620 3.6.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "One existing message."
    when: "Separate Email/get calls with ids as a string, ids as an array holding a number, properties as a string, and properties as an array holding null."
    then: "Each call answers invalidArguments; other method calls in the same request still run."
    sources:
      - "rfc:8620 3.6.2"
      - "fastmail:t/Email/get/properties.t"

  - id: EGET-009
    title: "Answer accountNotFound for an unknown accountId"
    method: Email/get
    spec: "RFC 8620 3.6.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "An authenticated user with one message."
    when: "Email/get with accountId set to an id that is not the user's account (a random id, and the id of another existing user)."
    then: "The method answers with error type accountNotFound in both cases; the HTTP status is 200."
    sources:
      - "james:EmailGetMethodContract#emailGetShouldFailWhenWrongAccountId"
      - "fastmail:t/Email/foreign-account.t"

  - id: EGET-010
    title: "Never return another user's Email by its id"
    method: Email/get
    spec: "RFC 8621 4.2"
    level: must
    phase: 1
    applies: adapted
    seed: [imap]
    given: "Users A and B; B has a message whose Email id is known."
    when: "A calls Email/get on A's own accountId with B's Email id in ids."
    then: "The id is listed in notFound and nothing about the message leaks."
    sources:
      - "james:EmailGetMethodContract#getShouldReturnNotFoundWhenNoRights"
      - "james:EmailGetMethodContract#bobShouldNotBeAbleToAccessAndreMailboxWhenNotDelegated"
      - "cyrus:JMAPEmail/email_get_shared"
    notes: "The James and Cyrus sharing and delegation tests collapse to this one case because WildDuck has no sharing. The lookup must always be scoped by user, since the root id alone is not account bound."

  - id: EGET-011
    title: "Answer unknownMethod when the mail capability is not in using"
    method: Email/get
    spec: "RFC 8620 3.6.2"
    level: must
    phase: 1
    applies: yes
    seed: [none]
    given: "Any account."
    when: "A request whose using lists only urn:ietf:params:jmap:core (and a second one with using empty) calls Email/get."
    then: "The method response is an error of type unknownMethod."
    sources:
      - "james:EmailGetMethodContract#emailGetShouldReturnUnknownMethodWhenMissingOneCapability"
      - "james:EmailGetMethodContract#emailGetShouldReturnUnknownMethodWhenMissingAllCapabilities"

  - id: EGET-012
    title: "Use the RFC default property set when properties is omitted"
    method: Email/get
    spec: "RFC 8621 4.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A multipart/alternative message with one attachment."
    when: "Email/get with only ids."
    then: "The Email has exactly these keys: id, blobId, threadId, mailboxIds, keywords, size, receivedAt, messageId, inReplyTo, references, sender, from, to, cc, bcc, replyTo, subject, sentAt, hasAttachment, preview, bodyValues, textBody, htmlBody, attachments. headers and bodyStructure are absent, bodyValues is {}."
    sources:
      - "james:EmailGetMethodContract#useDefaultPropertiesWhenNone"
      - "fastmail:t/Email/get/properties.t"
      - "stalwart:mail/get.rs"
      - "rfc:8621 4.2"

  - id: EGET-013
    title: "Treat properties null the same as omitted"
    method: Email/get
    spec: "RFC 8621 4.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "One message."
    when: "Email/get with properties null."
    then: "The returned key set equals the default set of EGET-012."
    sources:
      - "rfc:8621 4.2"

  - id: EGET-014
    title: "Return only the requested properties plus id"
    method: Email/get
    spec: "RFC 8620 5.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "One message."
    when: "Email/get with properties ['subject', 'size']."
    then: "The Email has exactly the keys id, subject and size."
    sources:
      - "james:EmailGetMethodContract#propertiesShouldBeFiltered"
      - "james:EmailGetMethodContract#idPropertyShouldAlwaysBeReturned"
      - "jmapio:email-get#get-properties-filter"
      - "fastmail:t/Email/get/properties.t"

  - id: EGET-015
    title: "Return only id for an empty properties array"
    method: Email/get
    spec: "RFC 8620 5.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "One message."
    when: "Email/get with properties []."
    then: "The Email object is exactly {id}."
    sources:
      - "james:EmailGetMethodContract#emptyPropertiesDefaultsToId"
      - "fastmail:t/Email/get/properties.t"

  - id: EGET-016
    title: "Reject an unknown property name"
    method: Email/get
    spec: "RFC 8620 5.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "One message."
    when: "Email/get with properties ['subject', 'invalid'], and again with ['Subject'] (wrong case) and ['deliveredTo'] (a Cyrus extension)."
    then: "Each call answers invalidArguments and the description names the offending property; no partial list is returned."
    sources:
      - "james:EmailGetMethodContract#invalidPropertiesShouldFail"
      - "cyrus:JMAPEmail/email_get_deliveredto"
    notes: "Property names are case sensitive. Vendor properties of other servers (deliveredTo, isDeleted, imageSize, trustedSender, createdModseq, calendarEvents) are not offered."

  - id: EGET-017
    title: "Return every Email property when all are requested explicitly"
    method: Email/get
    spec: "RFC 8621 4.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A multipart message with headers From, To, Cc, Subject, Date, Message-ID."
    when: "Email/get with properties listing the 24 defaults plus headers and bodyStructure."
    then: "All 26 keys are present with the types of RFC 8621 4.1: headers is an array of {name, value}, bodyStructure is one EmailBodyPart, textBody, htmlBody and attachments are arrays, bodyValues is an object."
    sources:
      - "fastmail:t/Email/get/properties.t"
      - "stalwart:mail/get.rs"
      - "jmapio:email-get#get-metadata-properties"

  - id: EGET-018
    title: "Return the current Email state, identical to the one Email/changes reports"
    method: Email/get
    spec: "RFC 8620 5.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "One message; state S1 read from Email/get."
    when: "Email/get is called twice in a row, then a flag is set over IMAP and Email/get is called again."
    then: "The first two calls return the same state S1 (reading does not change state). The third returns S2 different from S1, and Email/changes sinceState S1 answers newState S2."
    sources:
      - "james:EmailGetMethodContract#emailStateShouldBeTheLatestOne"
      - "jmapio:email-get#get-state-returned"

  - id: EGET-019
    title: "Reject more ids than maxObjectsInGet with requestTooLarge"
    method: Email/get
    spec: "RFC 8620 5.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "The session advertises maxObjectsInGet N (test config sets a small N)."
    when: "Email/get with N ids, then with N plus 1 ids (existing or not)."
    then: "The call with N ids succeeds. The call with N plus 1 ids answers error type requestTooLarge and returns no Emails."
    sources:
      - "james:EmailGetMethodContract#shouldFailWhenReadFullLevelAndIdsSizeTooLarge"
      - "james:EmailGetMethodContract#getEmailShouldSucceedWhenNotReadFullLevelAndExceedIdsSize"
      - "rfc:8620 5.1"
    notes: "James applies a smaller limit only when body properties are requested. WildDuck uses one limit for every property set; duplicates count before de-duplication."

  - id: EGET-020
    title: "Resolve ids through a result reference to Email/query"
    method: Email/get
    spec: "RFC 8620 3.7"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "Three messages in INBOX."
    when: "One request with Email/query (call id q) followed by Email/get whose '#ids' is {resultOf q, name Email/query, path /ids} and properties ['subject']."
    then: "Email/get returns the three Emails named by the query result."
    sources:
      - "cyrus:JMAPEmail/email_get"
      - "rfc:8621 4.2.1"

  - id: EGET-021
    title: "Use the WildDuck Email id format"
    method: Email/get
    spec: "RFC 8620 1.2"
    level: wd
    phase: 1
    applies: yes
    seed: [imap, lmtp]
    given: "Messages stored through IMAP APPEND and through LMTP delivery."
    when: "Email/get for all of them with properties ['id', 'blobId', 'threadId', 'mailboxIds']."
    then: "Every Email id matches M followed by 24 lowercase hex characters. blobId, threadId and the mailboxIds keys are 1 to 255 characters from A-Za-z0-9, hyphen and underscore, and start with a letter."
    sources:
      - "wildduck:brief ids"
      - "rfc:8620 1.2"

  - id: EGET-022
    title: "Treat a message flagged Deleted over IMAP as not found"
    method: Email/get
    spec: "RFC 8621 4.1.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message whose Email id is known; then STORE +FLAGS (\\Deleted) over IMAP without EXPUNGE."
    when: "Email/get with that id."
    then: "The id is in notFound and list is empty."
    sources:
      - "rfc:8621 4.1.1"
      - "cyrus:JMAPEmail/email_get_multimailboxes_expunged"

  - id: EGET-023
    title: "Make the Email visible again with the same id when Deleted is cleared"
    method: Email/get
    spec: "RFC 8621 4.1.1"
    level: wd
    phase: 1
    applies: yes
    seed: [imap]
    given: "The message of EGET-022, flagged \\Deleted."
    when: "STORE -FLAGS (\\Deleted) over IMAP, then Email/get with the original id."
    then: "The Email is returned under the same id with unchanged blobId, threadId, size and receivedAt; keywords does not contain any deleted marker."
    sources:
      - "wildduck:brief emails"

  - id: EGET-024
    title: "Report an expunged message as not found"
    method: Email/get
    spec: "RFC 8620 5.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message whose Email id is known; it is flagged \\Deleted and expunged over IMAP (WildDuck archives it)."
    when: "Email/get with that id."
    then: "The id is in notFound. The archived copy is not reachable through JMAP."
    sources:
      - "cyrus:JMAPEmail/email_get_multimailboxes_expunged"
      - "wildduck:brief emails"

  - id: EGET-025
    title: "Keep the Email id after an IMAP MOVE"
    method: Email/get
    spec: "RFC 8621 4.1.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message in INBOX with known id, blobId and threadId."
    when: "The message is moved to another mailbox with IMAP MOVE (new UID), then Email/get with the old id."
    then: "The Email is found under the same id; blobId, threadId, size, receivedAt and keywords are unchanged; mailboxIds has exactly one key, the id of the target mailbox."
    sources:
      - "wildduck:brief ids"
      - "rfc:8621 4.1.1"
    notes: "Phase 0 prerequisite (stable ids on move). id, blobId and threadId are immutable per RFC 8621 4.1.1."

  - id: EGET-026
    title: "Keep the Email id after a move through the REST API"
    method: Email/get
    spec: "RFC 8621 4.1.1"
    level: wd
    phase: 1
    applies: yes
    seed: [imap, api]
    given: "A message in INBOX with known Email id."
    when: "The message is moved with the WildDuck REST API (PUT message with moveTo), then Email/get with the old id."
    then: "Same assertions as EGET-025."
    sources:
      - "wildduck:brief ids"

  - id: EGET-027
    title: "Give an IMAP COPY its own Email id"
    method: Email/get
    spec: "RFC 8621 4.1.1"
    level: wd
    phase: 1
    applies: adapted
    seed: [imap]
    given: "A message in INBOX with known Email id E1; IMAP COPY puts a copy into mailbox Archive."
    when: "Email/query for Archive gives E2; Email/get [E1, E2] with properties ['mailboxIds', 'blobId', 'size', 'messageId', 'threadId']."
    then: "E2 differs from E1. E1 has only the INBOX id in mailboxIds and E2 only the Archive id. size and messageId are equal; each blobId downloads the same bytes."
    sources:
      - "cyrus:JMAPEmail/email_get_multimailboxes"
      - "wildduck:brief ids"
    notes: "RFC servers with content derived ids (Cyrus) show one Email in two mailboxes here. WildDuck has maxMailboxesPerEmail 1, so a copy is a second Email."

  - id: EGET-028
    title: "Give identical bytes stored twice two different Emails"
    method: Email/get
    spec: "RFC 8621 4.1.1"
    level: wd
    phase: 1
    applies: yes
    seed: [imap]
    given: "The same raw message appended twice to INBOX over IMAP."
    when: "Email/get for both ids."
    then: "Two Emails with different id and blobId and equal size, messageId and subject are returned."
    sources:
      - "wildduck:brief ids"

  # ---------------------------------------------------------------- metadata
  - id: EGET-029
    title: "Return a blobId that downloads the exact raw message"
    method: Email/get
    spec: "RFC 8621 4.1.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A known raw message with CRLF line endings appended over IMAP."
    when: "Email/get with properties ['blobId', 'size'], then GET the download URL for that blobId."
    then: "The download returns HTTP 200 and bytes identical to the appended message; their length equals size."
    sources:
      - "james:EmailGetMethodContract#blobIdPropertiesShouldBeReturned"
      - "stalwart:mail/get.rs"
      - "rfc:8621 4.1.1"
    notes: "WildDuck rebuilds the message from the MIME tree (indexer.rebuild); the rebuilt bytes must equal the original for well formed input."

  - id: EGET-030
    title: "Return the threadId of the Thread that lists the Email"
    method: Email/get
    spec: "RFC 8621 4.1.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message and a reply to it (In-Reply-To and References set, same normalised subject)."
    when: "Email/get both with properties ['threadId'], then Thread/get with that threadId."
    then: "Both Emails carry the same threadId and Thread/get lists both Email ids. An unrelated third message has a different threadId."
    sources:
      - "james:EmailGetMethodContract#threadIdPropertiesShouldBeReturned"
      - "jmapio:email-get#get-thread-id-consistent"

  - id: EGET-031
    title: "Return mailboxIds with exactly one entry whose value is true"
    method: Email/get
    spec: "RFC 8621 4.1.1"
    level: must
    phase: 1
    applies: adapted
    seed: [imap]
    given: "One message in INBOX and one in a nested mailbox A/B."
    when: "Email/get both with properties ['mailboxIds']."
    then: "Each mailboxIds object has exactly one key, the id Mailbox/get reports for INBOX and for A/B respectively, with the JSON value true."
    sources:
      - "james:EmailGetMethodContract#mailboxIdsPropertiesShouldBeReturned"
      - "jmapio:email-get#get-mailbox-ids"
      - "wildduck:brief emails"
    notes: "Adapted: an Email is never in more than one mailbox in WildDuck."

  - id: EGET-032
    title: "Return an empty keywords object for a message without flags"
    method: Email/get
    spec: "RFC 8621 4.1.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message appended over IMAP with no flags."
    when: "Email/get with properties ['keywords']."
    then: "keywords is {} (an object, not null and not absent). The IMAP \\Recent flag never appears."
    sources:
      - "cyrus:JMAPEmail/email_get_keywords"
      - "rfc:8621 4.1.1"

  - id: EGET-033
    title: "Map IMAP system flags to the JMAP system keywords"
    method: Email/get
    spec: "RFC 8621 4.1.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with IMAP flags \\Seen \\Flagged \\Draft \\Answered and $Forwarded."
    when: "Email/get with properties ['keywords']."
    then: "keywords is exactly {$seen: true, $flagged: true, $draft: true, $answered: true, $forwarded: true}. No key starts with a backslash."
    sources:
      - "james:EmailGetMethodContract#emailGetShouldReturnSystemKeywords"
      - "jmapio:email-get#get-keywords"
      - "cyrus:JMAPEmail/email_get_keywords"
      - "rfc:8621 4.1.1"

  - id: EGET-034
    title: "Return custom IMAP keywords in lowercase"
    method: Email/get
    spec: "RFC 8621 4.1.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with IMAP keywords MyFlag, $MDNSent, $Junk, NonJunk and $Phishing stored with that capitalisation."
    when: "Email/get with properties ['keywords']."
    then: "keywords is {myflag: true, $mdnsent: true, $junk: true, nonjunk: true, $phishing: true}; every value is the boolean true."
    sources:
      - "james:EmailGetMethodContract#emailGetShouldReturnKeyword"
      - "james:EmailGetMethodContract#emailGetShouldReturnSystemAndUserKeywordsIfExposed"
      - "cyrus:JMAPEmail/email_get_keywords_case_insensitive"
      - "rfc:8621 4.1.1"
    notes: "James hides some flags (non exposed keywords); WildDuck exposes every stored flag except \\Deleted and \\Recent."

  - id: EGET-035
    title: "Never return two keywords that differ only by case"
    method: Email/get
    spec: "RFC 8621 4.1.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap, db]
    given: "A message whose stored flags array holds both Foo and foo (legacy data written directly), plus \\seen in non canonical case."
    when: "Email/get with properties ['keywords']."
    then: "keywords has a single key foo and a single key $seen."
    sources:
      - "cyrus:JMAPEmail/email_get_keywords_case_insensitive"
      - "wildduck:brief emails"

  - id: EGET-036
    title: "Expose WildDuck labels as wdlabel keywords"
    method: Email/get
    spec: "RFC 8621 4.1.1"
    level: wd
    phase: 1
    applies: yes
    seed: [imap, api]
    given: "A label created through the REST API (24 hex id L) and applied to a message."
    when: "Email/get with properties ['keywords'], and IMAP FETCH FLAGS for the same message."
    then: "keywords contains the key $wdlabel$ followed by L in lowercase with value true, and the same token appears in the IMAP flags."
    sources:
      - "wildduck:brief emails"
      - "tmail:labels contract"

  - id: EGET-037
    title: "Reflect a flag change made over IMAP on the next Email/get"
    method: Email/get
    spec: "RFC 8621 4.1.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "An unread message; keywords is {}."
    when: "STORE +FLAGS (\\Seen custom1) over IMAP, Email/get; then STORE -FLAGS (\\Seen), Email/get."
    then: "The first get returns {$seen: true, custom1: true}, the second {custom1: true}. The Email id does not change."
    sources:
      - "cyrus:JMAPEmail/email_get_keywords"
      - "wildduck:brief state"

  - id: EGET-038
    title: "Keep keywords independent between an Email and its IMAP copy"
    method: Email/get
    spec: "RFC 8621 4.1.1"
    level: wd
    phase: 1
    applies: adapted
    seed: [imap]
    given: "A message in INBOX and its IMAP COPY in Archive (two Emails); \\Seen is set only on the INBOX one, custom1 only on the copy."
    when: "Email/get both with properties ['keywords']."
    then: "The INBOX Email has {$seen: true}, the copy has {custom1: true}. Nothing is aggregated."
    sources:
      - "james:EmailGetMethodContract#shouldAggregateKeywordsAccrossMailbox"
      - "cyrus:JMAPEmail/email_get_keywords"
    notes: "James and Cyrus merge keywords across the mailboxes of one Email. In WildDuck each copy is its own Email."

  - id: EGET-039
    title: "Return size equal to RFC822.SIZE over IMAP"
    method: Email/get
    spec: "RFC 8621 4.1.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "Messages of several shapes: plain text, base64 attachment, 8 bit body, candidate fixtures imap-core/test/fixtures/nodemailer.eml and mimetorture.eml."
    when: "Email/get with properties ['size', 'blobId'] and IMAP FETCH (RFC822.SIZE) for each."
    then: "size is an unsigned integer equal to RFC822.SIZE and to the byte length of the blob download."
    sources:
      - "cyrus:JMAPEmail/email_get_size"
      - "wildduck:brief emails"
      - "rfc:8621 4.1.1"

  - id: EGET-040
    title: "Return receivedAt equal to the IMAP INTERNALDATE as a UTCDate"
    method: Email/get
    spec: "RFC 8621 4.1.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message appended with an explicit internal date of 14-Jul-2020 10:11:12 +0200 and a Date header one day earlier."
    when: "Email/get with properties ['receivedAt', 'sentAt'] and IMAP FETCH (INTERNALDATE)."
    then: "receivedAt is exactly '2020-07-14T08:11:12Z' (UTC, Z suffix, no fractional zero padding issues) and denotes the same instant as INTERNALDATE. It differs from sentAt."
    sources:
      - "james:EmailGetMethodContract#receivedAtPropertyShouldBeReturned"
      - "jmapio:email-get#get-received-at-is-utc-date"
      - "wildduck:brief emails"

  - id: EGET-041
    title: "Set receivedAt to the delivery time for LMTP delivered mail"
    method: Email/get
    spec: "RFC 8621 4.1.1"
    level: must
    phase: 1
    applies: yes
    seed: [lmtp]
    given: "A message with a Date header in 2001 is delivered through LMTP at time T."
    when: "Email/get with properties ['receivedAt']."
    then: "receivedAt is within a few seconds of T and matches the pattern YYYY-MM-DDTHH:MM:SSZ."
    sources:
      - "rfc:8621 4.1.1"

  - id: EGET-042
    title: "Keep receivedAt, size and blobId unchanged by flag changes and moves"
    method: Email/get
    spec: "RFC 8621 4.1.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with recorded receivedAt, size, blobId and threadId."
    when: "Flags are changed and the message is moved twice over IMAP; Email/get after each step."
    then: "receivedAt, size, blobId and threadId are identical in every response."
    sources:
      - "rfc:8621 4.1.1"
      - "wildduck:brief ids"

  # ---------------------------------------------------------------- headers: list and raw access
  - id: EGET-043
    title: "Return headers as the ordered list of all top level header fields in Raw form"
    method: Email/get
    spec: "RFC 8621 4.1.3"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message whose header block is, in order: Received, Received, From, To, SUBJECT (upper case name), X-Custom, Date, Message-ID."
    when: "Email/get with properties ['headers']."
    then: "headers has eight {name, value} items in message order. name keeps the capitalisation of the message (SUBJECT). value is the Raw form: it starts with the space after the colon and has no trailing CRLF. Both Received fields are present."
    sources:
      - "james:EmailGetMethodContract#emailGetShouldReturnUnparsedHeaders"
      - "stalwart:mail/get.rs (headers.eml)"
      - "rfc:8621 4.1.3"

  - id: EGET-044
    title: "Return the Raw form by default for header:Name"
    method: Email/get
    spec: "RFC 8621 4.1.2.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with the line 'Subject:  Hello  World ' (two spaces after the colon, one trailing space) and 'X-Tight:nospace'."
    when: "Email/get with properties ['header:Subject', 'header:Subject:asRaw', 'header:X-Tight']."
    then: "header:Subject and header:Subject:asRaw are both '  Hello  World ' with every octet between the colon and the CRLF preserved. header:X-Tight is 'nospace' without a leading space."
    sources:
      - "james:EmailGetMethodContract#emailGetShouldReturnSpecificUnparsedHeaders"
      - "james:EmailGetMethodContract#emailGetShouldReturnSpecificHeadersAsRaw"
      - "fastmail:t/Email/get/header-header-field-name.t"
      - "jmapio:email-get-headers#header-raw-form"
      - "jmapio:email-get-headers#header-custom-header"

  - id: EGET-045
    title: "Keep folding in the Raw form of a folded header"
    method: Email/get
    spec: "RFC 8621 4.1.2.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with 'X-Long: part one' CRLF SP 'part two' CRLF HTAB 'part three'."
    when: "Email/get with properties ['header:X-Long', 'headers']."
    then: "header:X-Long is ' part one\\r\\n part two\\r\\n\\tpart three' (inner CRLF and leading white space kept, final CRLF removed). The same value appears in the headers list."
    sources:
      - "james:EmailGetMethodContract#asRawShouldSupportSeveralHeaders"
      - "rfc:8621 4.1.2.1"

  - id: EGET-046
    title: "Match header field names case insensitively and echo the requested capitalisation"
    method: Email/get
    spec: "RFC 8621 4.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with the header 'X-Custom-Header: v'."
    when: "Email/get with properties ['header:x-custom-header', 'header:X-CUSTOM-HEADER', 'header:X-Custom-Header:asText']."
    then: "The Email has exactly those three property keys, spelled as requested, with values ' v', ' v' and 'v'."
    sources:
      - "james:EmailGetMethodContract#emailGetShouldReturnSpecificUnparsedHeadersWithInsensitiveCaseMatching"
      - "jmapio:email-get-headers#header-case-insensitive"
      - "rfc:8621 4.2"

  - id: EGET-047
    title: "Return null for an absent header and an empty array with the all suffix"
    method: Email/get
    spec: "RFC 8621 4.1.3"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message without an X-Missing header."
    when: "Email/get with properties ['header:X-Missing', 'header:X-Missing:asText', 'header:X-Missing:all', 'header:X-Missing:asAddresses:all']."
    then: "The first two are null, the last two are []."
    sources:
      - "james:EmailGetMethodContract#emailGetShouldReturnNullWhenUnknownSpecificUnparsedHeaders"
      - "fastmail:t/Email/get/header-header-field-name.t"
      - "rfc:8621 4.1.3"

  - id: EGET-048
    title: "Return the last instance when a header appears several times"
    method: Email/get
    spec: "RFC 8621 4.1.3"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with 'X-Tra: foo' followed later by 'X-Tra: bar'."
    when: "Email/get with properties ['header:X-Tra', 'header:X-Tra:asText']."
    then: "The values are ' bar' and 'bar'."
    sources:
      - "cyrus:JMAPEmail/email_get_header_last_value"
      - "fastmail:t/Email/get/header-header-field-name.t"
      - "rfc:8621 4.1.3"

  - id: EGET-049
    title: "Return every instance in message order with the all suffix"
    method: Email/get
    spec: "RFC 8621 4.1.3"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with 'X-Tra: foo', 'X-Tra: bar' in that order and a single 'X-One: 1'."
    when: "Email/get with properties ['header:X-Tra:all', 'header:X-Tra:asRaw:all', 'header:X-Tra:asText:all', 'header:X-One:all']."
    then: "The values are [' foo', ' bar'], [' foo', ' bar'], ['foo', 'bar'] and [' 1']. The last element of an all array equals the value without the suffix."
    sources:
      - "cyrus:JMAPEmail/email_get_header_all"
      - "james:EmailGetMethodContract#emailGetShouldSupportAllQualifierForSpecificHeader"
      - "fastmail:t/Email/get/header-header-field-name.t"

  - id: EGET-050
    title: "Reject the suffixes in the wrong order"
    method: Email/get
    spec: "RFC 8621 4.1.3"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with an X-Tra header."
    when: "Email/get with properties ['header:X-Tra:all:asText']."
    then: "The call answers invalidArguments."
    sources:
      - "fastmail:t/Email/get/header-header-field-name.t"
      - "rfc:8621 4.1.3"

  - id: EGET-051
    title: "Reject malformed header property names"
    method: Email/get
    spec: "RFC 8621 4.1.3"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "Any message."
    when: "Separate Email/get calls with properties ['header:'], ['header:From:Subject'], ['header:X-A:asFoo'], ['header:X-A:astext'] (wrong case of the form), ['header:X A'] (space in the name), ['header:X-A:asText:all:all'] and ['Header:Subject']."
    then: "Every call answers invalidArguments and names the property."
    sources:
      - "james:EmailGetMethodContract#emailGetShouldRejectSpecificUnparsedHeadersWithColon"
      - "james:EmailGetMethodContract#emailGetShouldRejectEmptySpecificUnparsedHeaders"
      - "rfc:8621 4.1.3"
    notes: "A field name is one or more printable ASCII characters (33 to 126) except colon. Form names are case sensitive (asText, asAddresses, asGroupedAddresses, asMessageIds, asDate, asURLs, asRaw)."

  - id: EGET-052
    title: "Serve several forms of the same and of different headers in one call"
    method: Email/get
    spec: "RFC 8621 4.1.3"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with From, To, Subject, Date, Message-ID, List-Unsubscribe and X-Custom headers."
    when: "Email/get with properties ['header:Subject', 'header:Subject:asText', 'header:From:asAddresses', 'header:From:asGroupedAddresses', 'header:Date:asDate', 'header:Message-ID:asMessageIds', 'header:List-Unsubscribe:asURLs', 'header:X-Custom:asText:all']."
    then: "All eight properties are present, each typed by its form: string, string, EmailAddress array, EmailAddressGroup array, date string, string array, string array, array of strings."
    sources:
      - "james:EmailGetMethodContract#emailGetShouldSupportDifferentSpecificHeadersTypeOnSameMessage"
      - "rfc:8621 4.2.1"

  # ---------------------------------------------------------------- headers: Text form
  - id: EGET-053
    title: "Unfold, trim leading spaces and decode in the Text form"
    method: Email/get
    spec: "RFC 8621 4.1.2.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with 'Subject:   A folded' CRLF SP 'subject =?UTF-8?Q?caf=C3=A9?=' and 'X-Spam-Hits: SPAMA, SPAMB, SPAMC'."
    when: "Email/get with properties ['header:Subject:asText', 'header:X-Spam-Hits:asRaw', 'header:X-Spam-Hits:asText']."
    then: "header:Subject:asText is 'A folded subject café' (unfolded, no leading spaces, encoded word decoded, no CRLF). The X-Spam-Hits values are ' SPAMA, SPAMB, SPAMC' and 'SPAMA, SPAMB, SPAMC'."
    sources:
      - "james:EmailGetMethodContract#emailGetShouldReturnSpecificHeadersAsText"
      - "cyrus:JMAPEmail/email_get_headers_multipart"
      - "fastmail:t/Email/get/header-header-field-name.t"
      - "jmapio:email-get-headers#header-raw-access"

  - id: EGET-054
    title: "Allow the Text form on Subject, Comments, Keywords, List-Id and non RFC 5322 headers"
    method: Email/get
    spec: "RFC 8621 4.1.2.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with Subject, Comments, Keywords, List-Id, X-Mood, Content-Type and Content-Transfer-Encoding headers."
    when: "Email/get with header:{name}:asText for each of those seven names."
    then: "The call succeeds and each value is the unfolded, trimmed string."
    sources:
      - "rfc:8621 4.1.2.2"
      - "cyrus:JMAPEmail/email_get_encoded_message"

  - id: EGET-055
    title: "Reject the Text form on structured RFC 5322 and RFC 2369 headers"
    method: Email/get
    spec: "RFC 8621 4.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message that has all the named headers."
    when: "Separate Email/get calls requesting header:{name}:asText for From, To, Date, Message-ID, References, Received, Return-Path, Resent-To and List-Unsubscribe."
    then: "Every call is rejected with invalidArguments, also when combined with the all suffix and also when the message lacks the header."
    sources:
      - "rfc:8621 4.2"
      - "rfc:8621 4.1.2.2"
      - "fastmail:t/Email/get/header-header-field-name.t"

  - id: EGET-056
    title: "Convert the Text form to Unicode NFC while Raw stays untouched"
    method: Email/get
    spec: "RFC 8621 4.1.2.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with a raw UTF-8 header 'X-My-Header: ' followed by a decomposed string (e followed by U+0301) and a To address whose display name is decomposed the same way."
    when: "Email/get with properties ['header:X-My-Header', 'header:X-My-Header:asText', 'header:to', 'to']."
    then: "asText and to[0].name contain the precomposed character (U+00E9). The two Raw values still contain the decomposed sequence."
    sources:
      - "cyrus:JMAPEmail/email_get_header_nfc"
      - "rfc:8621 4.1.2.2"

  # ---------------------------------------------------------------- headers: Addresses form
  - id: EGET-057
    title: "Parse an address list into EmailAddress objects"
    method: Email/get
    spec: "RFC 8621 4.1.2.3"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with 'To: Alice Example <alice@example.com>, bob@example.com, \"Carol, C.\" <carol@example.com>'."
    when: "Email/get with properties ['header:To:asAddresses']."
    then: "The value is [{name 'Alice Example', email 'alice@example.com'}, {name null, email 'bob@example.com'}, {name 'Carol, C.', email 'carol@example.com'}]. Each object has exactly the keys name and email."
    sources:
      - "james:EmailGetMethodContract#emailGetShouldReturnSpecificHeadersAsAddresses"
      - "jmapio:email-get-headers#header-as-addresses"
      - "fastmail:t/Email/get/header-header-field-name.t"
    notes: "WildDuck's internal {name, address} objects must be mapped to {name, email}, with an empty name becoming null."

  - id: EGET-058
    title: "Process quoted display names: remove quotes, decode quoted pairs, unfold and trim"
    method: Email/get
    spec: "RFC 8621 4.1.2.3"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A From header whose display name is the quoted string with two leading spaces, an escaped double quote and an escaped backslash, folded over two lines: '\"  James \\\"Jim\\\" Smythe\\\\\"' CRLF SP '<james@example.com>'."
    when: "Email/get with properties ['header:From:asAddresses']."
    then: "The single entry has name 'James \"Jim\" Smythe\\' (no surrounding quotes, quoted pairs decoded, no leading or trailing white space) and email 'james@example.com'."
    sources:
      - "rfc:8621 4.1.2.3"
      - "fastmail:t/Email/get/header-header-field-name.t"

  - id: EGET-059
    title: "Use a trailing comment as the name when there is no display name"
    method: Email/get
    spec: "RFC 8621 4.1.2.3"
    level: should
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with 'From: jane@example.com (Jane Doe)' and 'To: Real Name <x@example.com> (ignored comment)'."
    when: "Email/get with properties ['from', 'to']."
    then: "from is [{name 'Jane Doe', email 'jane@example.com'}]. to is [{name 'Real Name', email 'x@example.com'}], the comment is discarded when a display name exists."
    sources:
      - "rfc:8621 4.1.2.3"

  - id: EGET-060
    title: "Flatten groups in the Addresses form"
    method: Email/get
    spec: "RFC 8621 4.1.2.3"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "The address list of the RFC example in a To header: a quoted padded name James Smythe with james@example.com, then a group Friends holding jane@example.com and an encoded word name for john@example.com, closed by a semicolon."
    when: "Email/get with properties ['header:To:asAddresses', 'to']."
    then: "Both values are the three mailboxes in order: {James Smythe, james@example.com}, {null, jane@example.com}, {John Smîth decoded from the encoded word, john@example.com}. No entry represents the group."
    sources:
      - "james:EmailGetMethodContract#emailGetShouldReturnSpecificHeadersAsAddressesAndIgnoresGroup"
      - "rfc:8621 4.1.2.3"
      - "fastmail:t/Email/get/header-header-field-name.t"

  - id: EGET-061
    title: "Allow the Addresses forms on the address headers, the Resent variants and unknown headers"
    method: Email/get
    spec: "RFC 8621 4.1.2.3"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with From, Sender, Reply-To, To, Cc, Bcc, Resent-From, Resent-Sender, Resent-Reply-To, Resent-To, Resent-Cc, Resent-Bcc and X-Original-To, each holding one address."
    when: "Email/get requesting header:{name}:asAddresses and header:{name}:asGroupedAddresses for all thirteen names."
    then: "The call succeeds; every asAddresses value is a one element EmailAddress array and every asGroupedAddresses value a one element group array with name null."
    sources:
      - "rfc:8621 4.1.2.3"
      - "rfc:8621 4.1.2.4"

  - id: EGET-062
    title: "Reject the Addresses and GroupedAddresses forms on headers that are not address lists"
    method: Email/get
    spec: "RFC 8621 4.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message that has all the named headers."
    when: "Separate Email/get calls requesting asAddresses and asGroupedAddresses for Subject, Date, Message-ID, In-Reply-To, References, Received, Comments, Keywords, List-Post and List-Id."
    then: "Every call is rejected with invalidArguments."
    sources:
      - "rfc:8621 4.2"
      - "rfc:8621 4.1.2.3"
    notes: "List-Id is named explicitly only for the Text form; it is defined outside RFC 5322 and RFC 2369, so strictly it falls under 'any other header' for the other forms. Open question: WildDuck rejects it here for sanity, confirm."

  - id: EGET-063
    title: "Return an array of arrays for asAddresses with the all suffix"
    method: Email/get
    spec: "RFC 8621 4.1.3"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with two Resent-To headers, the first with two addresses, the second with one."
    when: "Email/get with properties ['header:Resent-To:asAddresses:all', 'header:Resent-To:asAddresses']."
    then: "The all value is [[a1, a2], [a3]] in message order; the value without all is [a3]."
    sources:
      - "rfc:8621 4.1.3"

  - id: EGET-064
    title: "Parse unparsable address headers best effort without failing"
    method: Email/get
    spec: "RFC 8621 4.1.2.3"
    level: should
    phase: 1
    applies: yes
    seed: [imap]
    given: "Messages with 'To: blahblah', 'To: <>', 'To: ,, ,', 'To:' (empty value), 'To: Name Only <', 'To: user@' and 'To: a@example.com, broken <, b@example.com'."
    when: "Email/get with properties ['header:To:asAddresses', 'header:To:asGroupedAddresses', 'to'] for each."
    then: "No call errors and every value is an array, never null. Empty and separator only values give []. Entries that are returned always have a string email (possibly without an at sign) and name string or null. The well formed a@example.com and b@example.com of the last message are both present."
    sources:
      - "james:EmailGetMethodContract#emailGetShouldReturnEmptyWhenCannotParseAsAddresses"
      - "james:EmailGetMethodContract#emailGetShouldReturnEmptyWhenCannotParseAsGroupedAddresses"
      - "rfc:8621 4.1.2.3"
    notes: "James returns [] for 'blahblah'. The RFC allows an email value that is not an addr-spec. Open question: pin the exact WildDuck result for 'blahblah' ([] or one entry with email 'blahblah') once the parser is chosen."

  # ---------------------------------------------------------------- headers: GroupedAddresses form
  - id: EGET-065
    title: "Preserve groups in the GroupedAddresses form"
    method: Email/get
    spec: "RFC 8621 4.1.2.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "The To header of EGET-060."
    when: "Email/get with properties ['header:To:asGroupedAddresses']."
    then: "The value is two groups: {name null, addresses [James Smythe]} and {name 'Friends', addresses [jane@example.com with name null, John Smîth]}."
    sources:
      - "james:EmailGetMethodContract#emailGetShouldReturnGroupedAddresses"
      - "rfc:8621 4.1.2.4"
      - "fastmail:t/Email/get/header-header-field-name.t"

  - id: EGET-066
    title: "Collect ungrouped mailboxes under a single group with a null name"
    method: Email/get
    spec: "RFC 8621 4.1.2.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with 'From: A <a@example.com>, b@example.com' and no group syntax."
    when: "Email/get with properties ['header:From:asGroupedAddresses']."
    then: "The value is [{name null, addresses [{A, a@example.com}, {null, b@example.com}]}]."
    sources:
      - "james:EmailGetMethodContract#emailGetShouldReturnAsGroupedAddressesWithoutGroupInfo"
      - "jmapio:email-get-headers#header-as-grouped-addresses"

  - id: EGET-067
    title: "Keep the order of interleaved groups and loose mailboxes"
    method: Email/get
    spec: "RFC 8621 4.1.2.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with 'To: a@example.com, G1: b@example.com;, c@example.com, d@example.com, G2: e@example.com;'."
    when: "Email/get with properties ['header:To:asGroupedAddresses']."
    then: "Four groups in order: {null, [a]}, {G1, [b]}, {null, [c, d]}, {G2, [e]}. Consecutive loose mailboxes share one null named group."
    sources:
      - "rfc:8621 4.1.2.4"

  - id: EGET-068
    title: "Return an empty group for a group without members"
    method: Email/get
    spec: "RFC 8621 4.1.2.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with 'To: undisclosed-recipients:;'."
    when: "Email/get with properties ['header:To:asGroupedAddresses', 'header:To:asAddresses', 'to']."
    then: "The grouped value is [{name 'undisclosed-recipients', addresses []}]. The Addresses form and to are []."
    sources:
      - "rfc:8621 4.1.2.4"
      - "rfc:5322 3.4"

  - id: EGET-069
    title: "Decode encoded words and quoted strings in a group name"
    method: Email/get
    spec: "RFC 8621 4.1.2.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with an X-To header holding a group whose display name is the base64 encoded word for 'Grüppe' with member ann@example.com, and a second group whose name is the quoted string '\"  Team A \"'."
    when: "Email/get with properties ['header:X-To:asGroupedAddresses']."
    then: "The group names are 'Grüppe' and 'Team A'; the member is {name null, email 'ann@example.com'}."
    sources:
      - "cyrus:JMAPEmail/email_get_grouped_addresses_encoded_name"
      - "rfc:8621 4.1.2.4"

  # ---------------------------------------------------------------- headers: MessageIds form
  - id: EGET-070
    title: "Parse message ids without angle brackets"
    method: Email/get
    spec: "RFC 8621 4.1.2.5"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with 'Message-ID: <id1@example.com>', 'In-Reply-To: <parent@example.com>' and 'References: <root@example.com> <parent@example.com>'."
    when: "Email/get with properties ['header:Message-ID:asMessageIds', 'header:In-Reply-To:asMessageIds', 'header:References:asMessageIds', 'header:references']."
    then: "The values are ['id1@example.com'], ['parent@example.com'], ['root@example.com', 'parent@example.com'] and the Raw string with brackets and leading space."
    sources:
      - "james:EmailGetMethodContract#emailGetShouldReturnSpecificHeaderAsMessageIds"
      - "james:EmailGetMethodContract#emailGetSpecificHeaderAsMessageIdsShouldSupportMultipleIds"
      - "cyrus:JMAPEmail/email_get_references"
      - "jmapio:email-get-headers#header-as-message-ids"
      - "fastmail:t/Email/get/header-header-field-name.t"

  - id: EGET-071
    title: "Remove comments and folding white space between message ids"
    method: Email/get
    spec: "RFC 8621 4.1.2.5"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with 'X-Refs: <a@example.com> (comment) <b@example.com>' and a References header folded so that a line break falls between two ids and one inside the white space before an id."
    when: "Email/get with properties ['header:X-Refs:asMessageIds', 'references']."
    then: "X-Refs gives ['a@example.com', 'b@example.com']. references lists every id of the folded header once, with no white space or brackets in any item."
    sources:
      - "cyrus:JMAPEmail/email_get_message_ids_parse"
      - "cyrus:JMAPEmail/email_get_fixbrokenmessageids"
      - "rfc:8621 4.1.2.5"

  - id: EGET-072
    title: "Return null when a header cannot be parsed as message ids"
    method: Email/get
    spec: "RFC 8621 4.1.2.5"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with 'X-Bad: not a message id' and 'In-Reply-To: your mail of yesterday'."
    when: "Email/get with properties ['header:X-Bad:asMessageIds', 'inReplyTo', 'header:X-Bad:asMessageIds:all']."
    then: "The first two are null. The all value is [null]."
    sources:
      - "james:EmailGetMethodContract#emailGetAsMessageIdsHeaderShouldReturnNullWhenInvalidMessageIds"
      - "cyrus:JMAPEmail/email_get_message_ids_parse"
      - "fastmail:t/Email/get/header-header-field-name.t"

  - id: EGET-073
    title: "Be lenient with partly invalid message id lists and a bare id"
    method: Email/get
    spec: "RFC 8621 4.1.2.5"
    level: wd
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with 'References: invalid   bloblah' CRLF SP '<3456@example.net>' and 'X-Bare: c@example.com' (no angle brackets)."
    when: "Email/get with properties ['references', 'header:X-Bare:asMessageIds']."
    then: "references is ['3456@example.net'] (the bracketed id survives the junk). X-Bare gives ['c@example.com']."
    sources:
      - "james:EmailGetMethodContract#emailGetShouldReturnSpecificHeaderWhenPartialInvalidMessageIds"
      - "cyrus:JMAPEmail/email_get_message_ids_parse"
    notes: "The RFC only says null if parsing fails. James and Cyrus both salvage ids; WildDuck follows them so that threading data stays visible."

  - id: EGET-074
    title: "Reject the MessageIds form on headers that do not hold message ids"
    method: Email/get
    spec: "RFC 8621 4.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "Any message."
    when: "Separate Email/get calls requesting asMessageIds for From, To, Subject, Date, Received and List-Unsubscribe; and one call requesting it for Message-ID, In-Reply-To, References, Resent-Message-ID and X-Anything."
    then: "The six separate calls answer invalidArguments. The combined call succeeds."
    sources:
      - "rfc:8621 4.1.2.5"
      - "rfc:8621 4.2"

  # ---------------------------------------------------------------- headers: Date form
  - id: EGET-075
    title: "Parse a Date header into an RFC 3339 date"
    method: Email/get
    spec: "RFC 8621 4.1.2.6"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with 'Date: Thu, 22 Aug 2019 23:12:06 -0600'."
    when: "Email/get with properties ['header:Date:asDate', 'sentAt']."
    then: "Both values are the same RFC 3339 date-time string denoting the instant 2019-08-23T05:12:06Z. It carries either the original offset (2019-08-22T23:12:06-06:00) or Z; no milliseconds are required."
    sources:
      - "james:EmailGetMethodContract#emailGetShouldReturnSpecificHeaderAsDate"
      - "cyrus:JMAPEmail/email_get_header_last_value"
      - "jmapio:email-get-headers#header-as-date"
      - "fastmail:t/Email/get/header-header-field-name.t"
    notes: "The type is Date, not UTCDate, so the sender's offset may be kept. Cyrus keeps it, James normalises to UTC. WildDuck stores hdate as a UTC Date, so keeping the offset means reparsing the raw header. Open question: decide and then pin the exact string."

  - id: EGET-076
    title: "Return null for a Date header that cannot be parsed"
    method: Email/get
    spec: "RFC 8621 4.1.2.6"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "Messages with 'Date: invalid', 'Date: 32 Foo 2020 25:61:00 +0000', 'Date:' (empty) and one with no Date header."
    when: "Email/get with properties ['header:Date:asDate', 'sentAt', 'receivedAt'] for each."
    then: "header:Date:asDate and sentAt are null in all four cases. receivedAt is still a valid UTCDate."
    sources:
      - "james:EmailGetMethodContract#emailGetShouldReturnNullWhenInvalidSpecificHeaderAsDate"
      - "james:EmailGetMethodContract#sentAtPropertyShouldBeNullWhenMissing"
      - "fastmail:t/Email/get/header-header-field-name.t"
    notes: "WildDuck falls back to the internal date for its stored hdate when the Date header is missing or broken. JMAP must not expose that fallback as sentAt."

  - id: EGET-077
    title: "Accept obsolete and sloppy date syntax"
    method: Email/get
    spec: "RFC 8621 4.1.2.6"
    level: should
    phase: 1
    applies: yes
    seed: [imap]
    given: "Messages with the Date values '22 Aug 2019 23:12 GMT' (no weekday, no seconds), 'Thu, 22 Aug 19 23:12:06 EST' (two digit year, named zone), 'Thu, 22 Aug 2019 23:12:06 +0200 (CEST)' (comment) and a folded value with extra white space."
    when: "Email/get with properties ['sentAt'] for each."
    then: "The instants are 2019-08-22T23:12:00Z, 2019-08-23T04:12:06Z, 2019-08-22T21:12:06Z and the correct instant for the folded one; none is null."
    sources:
      - "rfc:5322 4.3"
      - "rfc:8621 4.1.2.6"

  - id: EGET-078
    title: "Restrict the Date form to Date, Resent-Date and unknown headers"
    method: Email/get
    spec: "RFC 8621 4.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with Date, Resent-Date and 'X-Tra: Thu, 22 Aug 2019 23:12:06 -0600'."
    when: "One call with header:Date:asDate, header:Resent-Date:asDate and header:X-Tra:asDate; separate calls with header:From:asDate, header:Subject:asDate, header:Received:asDate and header:Message-ID:asDate."
    then: "The first call succeeds with three dates. Each of the other four answers invalidArguments."
    sources:
      - "rfc:8621 4.2"
      - "cyrus:JMAPEmail/email_get_header_last_value"
      - "fastmail:t/Email/get/header-header-field-name.t"

  # ---------------------------------------------------------------- headers: URLs form
  - id: EGET-079
    title: "Parse list headers into URL arrays"
    method: Email/get
    spec: "RFC 8621 4.1.2.7"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with 'List-Unsubscribe: <mailto:unsub@example.com?subject=unsubscribe>, <https://example.com/unsub?id=1,2>' and 'List-Help: <https://example.com/help> (Web help)'."
    when: "Email/get with properties ['header:List-Unsubscribe:asURLs', 'header:List-Help:asURLs']."
    then: "The values are ['mailto:unsub@example.com?subject=unsubscribe', 'https://example.com/unsub?id=1,2'] and ['https://example.com/help']: no angle brackets, no comment, a comma inside brackets does not split the URL."
    sources:
      - "james:EmailGetMethodContract#emailGetShouldReturnSpecificHeaderAsURLs"
      - "james:EmailGetMethodContract#emailGetShouldReturnSpecificHeaderAsURLsAndIgnoresComments"
      - "jmapio:email-get-headers#header-as-urls"
      - "fastmail:t/Email/get/header-header-field-name.t"

  - id: EGET-080
    title: "Return null when a header cannot be parsed as URLs"
    method: Email/get
    spec: "RFC 8621 4.1.2.7"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with 'List-Help: Invalid' and 'List-Post: NO (posting not allowed on this list)'."
    when: "Email/get with properties ['header:List-Help:asURLs', 'header:List-Post:asURLs']."
    then: "Both values are null."
    sources:
      - "james:EmailGetMethodContract#emailGetShouldReturnNullWhenInvalidSpecificHeaderAsURLs"
      - "rfc:2369 3.4"

  - id: EGET-081
    title: "Restrict the URLs form to the RFC 2369 list headers and unknown headers"
    method: Email/get
    spec: "RFC 8621 4.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with all six List headers and 'X-Link: <https://example.com/x>'."
    when: "One call requesting asURLs for List-Help, List-Unsubscribe, List-Subscribe, List-Post, List-Owner, List-Archive and X-Link; separate calls requesting it for Subject, From, Date and References."
    then: "The first call succeeds with seven arrays. Each of the other four answers invalidArguments."
    sources:
      - "rfc:8621 4.1.2.7"
      - "rfc:8621 4.2"

  # ---------------------------------------------------------------- convenience properties
  - id: EGET-082
    title: "Return messageId, inReplyTo and references as message id arrays"
    method: Email/get
    spec: "RFC 8621 4.1.3"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A reply with Message-ID, In-Reply-To and a three id References header."
    when: "Email/get with properties ['messageId', 'inReplyTo', 'references', 'header:Message-ID:asMessageIds', 'header:In-Reply-To:asMessageIds', 'header:References:asMessageIds']."
    then: "messageId is a one element array, inReplyTo a one element array, references a three element array in header order, all without angle brackets, and each equals its header: counterpart."
    sources:
      - "james:EmailGetMethodContract#messageIdPropertyShouldBeSupported"
      - "james:EmailGetMethodContract#inReplyToPropertyShouldBeSupported"
      - "james:EmailGetMethodContract#referencesPropertyShouldBeSupported"
      - "jmapio:email-get-headers#header-message-id"
      - "jmapio:email-get-headers#header-in-reply-to"
      - "jmapio:email-get-headers#header-references"
      - "cyrus:JMAPEmail/email_get_references"

  - id: EGET-083
    title: "Return from, to, cc, bcc, sender and replyTo as EmailAddress arrays"
    method: Email/get
    spec: "RFC 8621 4.1.3"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with From (name and address), Sender (address only), Reply-To, To (two addresses), Cc and Bcc headers."
    when: "Email/get with those six properties plus the six matching header:{name}:asAddresses properties."
    then: "Each convenience property equals its header form. sender is [{name null, email}]. to has two entries in header order. bcc is returned because the header is stored in the message."
    sources:
      - "james:EmailGetMethodContract#fromPropertyShouldBeSupported"
      - "james:EmailGetMethodContract#toPropertyShouldBeSupported"
      - "james:EmailGetMethodContract#ccPropertyShouldBeSupported"
      - "james:EmailGetMethodContract#bccPropertyShouldBeSupported"
      - "james:EmailGetMethodContract#senderPropertyShouldBeSupported"
      - "james:EmailGetMethodContract#senderPropertyShouldBeSupportedWhenNoName"
      - "james:EmailGetMethodContract#senderPropertyShouldDisplayBothValues"
      - "james:EmailGetMethodContract#replyToPropertyShouldBeSupported"
      - "jmapio:email-get-headers#header-from"
      - "jmapio:email-get-headers#header-to"
      - "jmapio:email-get-headers#header-cc"
      - "jmapio:email-get-headers#header-bcc"

  - id: EGET-084
    title: "Return subject as the Text form and sentAt as the Date form"
    method: Email/get
    spec: "RFC 8621 4.1.3"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with 'Subject:  Weekly   report ' and a valid Date header."
    when: "Email/get with properties ['subject', 'header:Subject:asText', 'sentAt', 'header:Date:asDate']."
    then: "subject equals header:Subject:asText: leading spaces removed, inner spacing kept as in the header. sentAt equals header:Date:asDate."
    sources:
      - "james:EmailGetMethodContract#subjectPropertyShouldBeSupported"
      - "james:EmailGetMethodContract#sentAtPropertyShouldBeSupported"
      - "jmapio:email-get-headers#header-subject"
      - "jmapio:email-get-headers#header-sent-at"
    notes: "WildDuck's stored subject field is normalised for threading; the JMAP subject must be computed from the header, not from that field."

  - id: EGET-085
    title: "Return null for every convenience property whose header is missing"
    method: Email/get
    spec: "RFC 8621 4.1.3"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message whose only header is 'X-Only: 1' followed by a short body."
    when: "Email/get with properties ['messageId', 'inReplyTo', 'references', 'sender', 'from', 'to', 'cc', 'bcc', 'replyTo', 'subject', 'sentAt']."
    then: "All eleven properties are present with the value null (not [] and not an empty string)."
    sources:
      - "james:EmailGetMethodContract#messageIdShouldReturnNullWhenNone"
      - "james:EmailGetMethodContract#inReplyToShouldReturnNullWhenNone"
      - "james:EmailGetMethodContract#referencesShouldReturnNullWhenNone"
      - "james:EmailGetMethodContract#toPropertyShouldBeNullWhenMissing"
      - "james:EmailGetMethodContract#ccPropertyShouldBeNullWhenMissing"
      - "james:EmailGetMethodContract#bccPropertyShouldBeNullWhenMissing"
      - "james:EmailGetMethodContract#fromPropertyShouldBeNullWhenMissing"
      - "james:EmailGetMethodContract#replyToPropertyShouldBeNullWhenMissing"
      - "james:EmailGetMethodContract#subjectPropertyShouldBeNullWhenMissing"
      - "james:EmailGetMethodContract#senderPropertyShouldBeNullWhenMissing"
      - "cyrus:JMAPEmail/email_parse_blob822_lenient"
    notes: "WildDuck generates an internal msgid for messages without a Message-ID header. That generated value must not appear as messageId."

  - id: EGET-086
    title: "Return an empty string, not null, for a present but empty Subject"
    method: Email/get
    spec: "RFC 8621 4.1.3"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with the header line 'Subject:' and nothing after the colon, and another with 'Subject:    ' (spaces only)."
    when: "Email/get with properties ['subject', 'header:Subject']."
    then: "subject is '' for both. header:Subject is '' and '    ' respectively."
    sources:
      - "jmapio:email-get-headers#header-subject-empty"
      - "rfc:8621 4.1.2.2"

  - id: EGET-087
    title: "Use the last instance for convenience properties when a header is duplicated"
    method: Email/get
    spec: "RFC 8621 4.1.3"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with two each of From, To, Cc, Bcc, Sender, Reply-To, Subject and Date headers with different values."
    when: "Email/get with properties ['from', 'to', 'cc', 'bcc', 'sender', 'replyTo', 'subject', 'sentAt', 'header:To:asAddresses:all']."
    then: "Each convenience property reflects only the second (last) header. The all form returns both To headers as two arrays; values are not merged."
    sources:
      - "james:EmailGetMethodContract#toPropertyShouldReturnLastWhenMultipleFields"
      - "james:EmailGetMethodContract#fromPropertyShouldReturnLastWhenMultipleFields"
      - "james:EmailGetMethodContract#ccPropertyShouldReturnLastWhenMultipleFields"
      - "james:EmailGetMethodContract#bccPropertyShouldReturnLastWhenMultipleFields"
      - "james:EmailGetMethodContract#senderPropertyShouldReturnLastWhenMultipleFields"
      - "james:EmailGetMethodContract#replyToPropertyShouldReturnLastWhenMultipleFields"
      - "james:EmailGetMethodContract#subjectPropertyShouldReturnLastWhenMultipleFields"
      - "james:EmailGetMethodContract#sentAtPropertyShouldReturnLastWhenMultipleFields"
    notes: "IMAP ENVELOPE and WildDuck's parsedHeader may pick the first instance or merge address headers. JMAP requires the last one."

  # ---------------------------------------------------------------- header decoding edge cases
  - id: EGET-088
    title: "Decode Q and B encoded words in subject and address names"
    method: Email/get
    spec: "RFC 8621 4.1.2.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with a Subject made of a Q encoded UTF-8 word, From with a B encoded ISO-8859-1 display name, To, Cc, Bcc, Sender and Reply-To each with an encoded display name, and an X-Mood header holding a UTF-8 encoded smiley."
    when: "Email/get with properties ['subject', 'from', 'to', 'cc', 'bcc', 'sender', 'replyTo', 'header:X-Mood:asText', 'header:Subject']."
    then: "subject, header:X-Mood:asText and every name are the decoded Unicode strings. header:Subject (Raw) still shows the encoded word text."
    sources:
      - "james:EmailGetMethodContract#subjectPropertyShouldDecodeField"
      - "james:EmailGetMethodContract#fromPropertyShouldDecodeField"
      - "james:EmailGetMethodContract#toPropertyShouldDecodeField"
      - "james:EmailGetMethodContract#ccPropertyShouldDecodeField"
      - "james:EmailGetMethodContract#bccPropertyShouldDecodeField"
      - "james:EmailGetMethodContract#senderPropertyShouldDecodeField"
      - "james:EmailGetMethodContract#replyToPropertyShouldDecodeField"
      - "cyrus:JMAPEmail/email_get_mimeencode"
      - "jmapio:email-get-headers#header-intl-from-decoded"

  - id: EGET-089
    title: "Join adjacent encoded words and keep white space next to plain text"
    method: Email/get
    spec: "RFC 8621 4.1.2.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "The RFC 2047 section 8 style samples as X headers: two encoded words separated by a space, two separated by a fold, an encoded word followed by a plain word, and an encoded word that itself encodes a trailing space."
    when: "Email/get with header:{name}:asText for each."
    then: "White space between two encoded words is dropped ('ab'), white space between an encoded word and plain text is kept ('a b'), and an encoded space is kept."
    sources:
      - "cyrus:JMAPEmail/email_get_mimeencode"
      - "rfc:2047 6.2"

  - id: EGET-090
    title: "Decode a multi byte character split across two encoded words"
    method: Email/get
    spec: "RFC 8621 4.1.2.2"
    level: should
    phase: 1
    applies: yes
    seed: [imap]
    given: "A Subject of three folded UTF-8 Q encoded words where a four byte emoji is cut after its first byte at a word boundary."
    when: "Email/get with properties ['subject']."
    then: "subject is the full emoji sequence with no U+FFFD: adjacent words of the same charset are joined at byte level before charset decoding."
    sources:
      - "cyrus:JMAPEmail/email_get_brokenheader_split_codepoint"

  - id: EGET-091
    title: "Decode encoded words in legacy charsets"
    method: Email/get
    spec: "RFC 8621 4.1.2.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "Messages whose Subject is an encoded word in ISO-8859-1, ISO-8859-15, Windows-1252, KOI8-R, ISO-2022-JP, Shift_JIS, GB2312, Big5 and EUC-KR, with the charset label in mixed case."
    when: "Email/get with properties ['subject'] for each."
    then: "Each subject equals the expected Unicode text."
    sources:
      - "cyrus:JMAPEmail/email_get_mimeencode"
      - "jmapio:email-get-body#body-non-utf8-charset"
      - "rfc:8621 4.1.2.2"

  - id: EGET-092
    title: "Leave an encoded word with an unknown charset undecoded"
    method: Email/get
    spec: "RFC 8621 4.1.2.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with a Subject of the form '=?x-unknown-charset?Q?abc?= tail'."
    when: "Email/get with properties ['subject', 'header:Subject:asText']."
    then: "The call succeeds and both values contain the literal encoded word text followed by ' tail'. Nothing is thrown and nothing is silently dropped."
    sources:
      - "rfc:8621 4.1.2.2"
    notes: "Only encoded sections with a known character set are decoded."

  - id: EGET-093
    title: "Do not decode text that looks like an encoded word but breaks RFC 2047 placement rules"
    method: Email/get
    spec: "RFC 8621 4.1.2.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with 'X-A: foo=?UTF-8?Q?bar?=baz' (no white space around the token), 'X-B: =?UTF-8?Q?a b?=' (space inside the token) and a From display name given as a quoted string that contains an encoded word."
    when: "Email/get with properties ['header:X-A:asText', 'header:X-B:asText', 'from']."
    then: "X-A and X-B come back verbatim. For the quoted From name the value is a string and the call succeeds; WildDuck decodes it, as mail clients commonly produce this."
    sources:
      - "rfc:8621 4.1.2.2"
      - "rfc:2047 5"
    notes: "Strict RFC 2047 forbids encoded words inside quoted strings, yet real mail is full of them. Decoding inside quoted display names is a deliberate WildDuck leniency; flag if the team prefers strictness."

  - id: EGET-094
    title: "Drop NUL and control characters produced by decoding and replace undecodable bytes"
    method: Email/get
    spec: "RFC 8621 4.1.2.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with a Subject encoded word whose payload decodes to 'a', NUL, 'b', BEL, 'c', and an X header with a UTF-8 encoded word containing the invalid byte FF between 'x' and 'y'."
    when: "Email/get with properties ['subject', 'header:X-Bad:asText']."
    then: "subject is 'abc'. The X header value is 'x', U+FFFD, 'y'."
    sources:
      - "rfc:8621 4.1.2.2"

  - id: EGET-095
    title: "Return raw UTF-8 headers (RFC 6532) unchanged"
    method: Email/get
    spec: "RFC 8621 4.1.2.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with unencoded UTF-8 in the Subject and in the From display name (Cyrillic text), and a UTF-8 local part in To."
    when: "Email/get with properties ['subject', 'from', 'to', 'header:Subject', 'headers']."
    then: "subject and from[0].name are the Cyrillic strings, to[0].email keeps the UTF-8 local part, and the Raw values contain the same characters with no replacement characters."
    sources:
      - "cyrus:JMAPEmail/email_get_8bit_headers"
      - "rfc:8621 4.1.2.1"

  - id: EGET-096
    title: "Handle 8 bit headers that are not UTF-8"
    method: Email/get
    spec: "RFC 8621 4.1.2.1"
    level: should
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with raw KOI8-R bytes in Subject and From, and one with raw ISO-8859-1 bytes in Subject, appended as binary."
    when: "Email/get with properties ['subject', 'from', 'header:Subject', 'headers']."
    then: "The call succeeds and the response is valid JSON. In the Raw values each invalid octet run is U+FFFD (or the text is decoded when the server detected the charset). from[0].email is intact. ASCII parts of the values are unchanged."
    sources:
      - "cyrus:JMAPEmail/email_get_8bit_headers"
      - "jmapio:email-get-body#body-invalid-ascii-handling"
      - "rfc:8621 4.1.2.1"
    notes: "Cyrus detects the charset and returns readable Cyrillic. WildDuck may do the same later; the minimum is U+FFFD replacement and no failure."

  - id: EGET-097
    title: "Drop NUL octets from Raw header values"
    method: Email/get
    spec: "RFC 8621 4.1.2.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message appended as a binary literal with 'X-Nul: a', NUL, 'b' in the header."
    when: "Email/get with properties ['header:X-Nul', 'headers']."
    then: "The value is ' ab' in both places and the JSON contains no escaped NUL character."
    sources:
      - "rfc:8621 4.1.2.1"
    notes: "If IMAP APPEND refuses NUL, seed through LMTP or the database."

  - id: EGET-098
    title: "Unfold folded address and text headers in the parsed forms"
    method: Email/get
