    applies: yes
    seed: [imap]
    given: "A single part message and multipart/mixed [alternative [plain, html], pdf]."
    when: "Email/get with properties ['bodyStructure'] and IMAP FETCH BODY[1], BODY[1.1], BODY[1.2], BODY[2]."
    then: "The single part has partId '1'. The multipart leaves have partIds '1.1', '1.2' and '2', and the content IMAP returns for each section number is the encoded form of that JMAP part."
    sources:
      - "wildduck:jmap-report Email mapping (partId is the IMAP part path)"
      - "cyrus:JMAPEmail/email_get_encoded_message"

  - id: EGET-127
    title: "Report size as the number of octets after transfer decoding"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A quoted-printable text part whose decoded content is 15 octets (encoded longer), a base64 attachment of 1000 decoded octets wrapped at 76 columns, and a 7bit part."
    when: "Email/get with properties ['bodyStructure', 'size'] and a download of each part blob."
    then: "The part sizes are 15, 1000 and the literal body length; each equals the length of the downloaded blob. The Email size is the full raw message size and is larger than the sum."
    sources:
      - "cyrus:JMAPEmail/email_get_size"
      - "rfc:8621 4.1.4"
    notes: "IMAP BODYSTRUCTURE reports the encoded size, so this number intentionally differs from IMAP. WildDuck does not store decoded sizes for every part; they are computed at index time or on first access."

  - id: EGET-128
    title: "Take name from the Content-Disposition filename, falling back to the Content-Type name"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "Attachments with: only 'filename=\"f.xls\"' (folded before the value); only 'name=y.dat' on Content-Type; both name=y.dat and filename=z.dat; neither."
    when: "Email/get with properties ['attachments'] and bodyProperties ['name', 'type']."
    then: "The names are 'f.xls', 'y.dat', 'z.dat' (filename wins) and null."
    sources:
      - "cyrus:JMAPEmail/email_get_attachment_name"
      - "fastmail:t/Email/get/attachments.t"
      - "rfc:8621 4.1.4"

  - id: EGET-129
    title: "Decode RFC 2231 and RFC 2047 encoded file names"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "Attachments named through: RFC 2231 continuations (name*0, name*1, name*2); a continuation folded over two lines; filename*=utf-8''percent encoded emoji; mixed filename*0* (encoded) plus filename*1 (quoted); an RFC 2047 Q encoded word in a quoted name parameter; an ISO-8859-1 2231 value with a language tag."
    when: "Email/get with properties ['attachments'] and bodyProperties ['name']."
    then: "Each name is the fully joined and decoded Unicode file name (for example 'loooooong.name', 'continue', the emoji followed by '.txt', 'Café.doc'). No name contains an asterisk section marker, a percent escape or an encoded word."
    sources:
      - "cyrus:JMAPEmail/email_get_attachment_name"
      - "stalwart:mail/get.rs (text_attachments.eml)"
      - "rfc:2231 4"

  - id: EGET-130
    title: "Read sloppy file name parameters leniently"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: wd
    phase: 1
    applies: yes
    seed: [imap]
    given: "Attachments with: an unquoted RFC 2047 encoded word as the name value; 'name= foo ' with surrounding spaces; unquoted 'name=foo bar'; a raw UTF-8 emoji in an unquoted name; an escaped quote inside a quoted file name; an empty name value."
    when: "Email/get with properties ['attachments'] and bodyProperties ['name']."
    then: "The names are the decoded word, 'foo', 'foo bar', the emoji name, the name containing a literal double quote, and null for the empty value. No call fails."
    sources:
      - "cyrus:JMAPEmail/email_get_attachment_name"
    notes: "Leniency mirrors Cyrus. The exact results depend on WildDuck's libmime parameter parser; the hard requirement is no failure and the same name as the REST API attachment listing shows."

  - id: EGET-131
    title: "Return only the requested bodyProperties"
    method: Email/get
    spec: "RFC 8621 4.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A multipart/mixed message with text and one attachment."
    when: "Email/get with properties ['bodyStructure', 'textBody', 'attachments'] and bodyProperties ['partId', 'type'], then with ['partId', 'type', 'subParts']."
    then: "In the first call every part object in all three properties has exactly the keys partId and type, and bodyStructure is only the root multipart node. In the second call bodyStructure additionally has subParts whose items again have exactly partId, type and (for multiparts) subParts."
    sources:
      - "james:EmailGetMethodContract#bodyPropertiesFilteringShouldBeApplied"
      - "fastmail:t/Email/get/body-properties.t"
      - "jmapio:email-get-body#body-properties-filter"
      - "rfc:8621 4.2"
    notes: "Open question: whether subParts must be listed explicitly once bodyProperties is given (strict reading) or is always included in bodyStructure. The catalogue assumes the strict reading for an explicit list and implicit inclusion for the default, as Cyrus does."

  - id: EGET-132
    title: "Return empty part objects for an empty bodyProperties array"
    method: Email/get
    spec: "RFC 8621 4.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A multipart/mixed message with text and one attachment."
    when: "Email/get with properties ['textBody', 'attachments'] and bodyProperties []."
    then: "textBody is [{}] and attachments is [{}]: the right number of parts, each an empty object."
    sources:
      - "james:EmailGetMethodContract#emptyBodyPropertiesShouldReturnEmptyObjects"
      - "fastmail:t/Email/get/body-properties.t"

  - id: EGET-133
    title: "Reject unknown bodyProperties"
    method: Email/get
    spec: "RFC 8620 5.1"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "Any message."
    when: "Separate Email/get calls with bodyProperties ['partId', 'invalid'], ['partId', 'id'] (an Email property, not a part property), ['imageSize'], ['header:Content-Type:asDate'] and bodyProperties given as a string."
    then: "Every call answers invalidArguments, also when properties requests no body property at all."
    sources:
      - "james:EmailGetMethodContract#invalidBodyPropertiesShouldBeRejected"
      - "cyrus:JMAPEmail/email_get_invalid_body_properties"
    notes: "Valid names: partId, blobId, size, headers, name, type, charset, disposition, cid, language, location, subParts and header:* properties."

  - id: EGET-134
    title: "Return part headers and header properties on EmailBodyPart"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "multipart/mixed whose text part has headers Content-Type, Content-Transfer-Encoding, X-Part: one in that order, and whose attachment has Content-Disposition and two X-Dup headers."
    when: "Email/get with properties ['bodyStructure'] and bodyProperties ['partId', 'headers', 'header:X-Part', 'header:content-transfer-encoding:asText', 'header:X-Dup:all', 'header:X-None', 'subParts']."
    then: "Each part's headers lists only that part's own header fields in order, in Raw form with original name capitalisation. The root part's headers are the top level message headers. header:X-Part is ' one' on the text part and null elsewhere, X-Dup:all has two values on the attachment and [] elsewhere, X-None is null everywhere."
    sources:
      - "james:EmailGetMethodContract#bodyStructureShouldSupportSpecificHeaders"
      - "cyrus:JMAPEmail/email_get_barelf_multipart"
      - "cyrus:JMAPEmail/email_get_encoded_message"
      - "cyrus:JMAPEmail/email_get_bodystructure"
      - "rfc:8621 4.1.4"

  - id: EGET-135
    title: "Report charset per the MIME defaults"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "Parts with: 'text/plain; charset=ISO-8859-15'; 'text/html' without charset; no Content-Type at all; 'application/pdf'; 'application/json; charset=utf-8'; 'image/png'; a multipart container."
    when: "Email/get with properties ['bodyStructure'] and bodyProperties ['type', 'charset', 'subParts']."
    then: "charset is the given value for the first, 'us-ascii' for the second and third, null for application/pdf and image/png, 'utf-8' for the json part (parameter present), and null for the multipart."
    sources:
      - "cyrus:JMAPEmail/email_parse_charset"
      - "cyrus:JMAPEmail/email_parse_contenttype_default"
      - "rfc:8621 4.1.4"

  - id: EGET-136
    title: "Report disposition without parameters, or null"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "Parts with 'Content-Disposition: ATTACHMENT; filename=a.txt', 'Content-Disposition: inline (comment)', no disposition header, and an unknown value 'Content-Disposition: weird; x=y'."
    when: "Email/get with properties ['bodyStructure'] and bodyProperties ['disposition', 'name', 'subParts']."
    then: "disposition is 'attachment', 'inline', null and 'weird'. No parameter or comment text is included."
    sources:
      - "rfc:8621 4.1.4"
      - "cyrus:JMAPEmail/email_get_bodystructure"
    notes: "Lowercasing is a WildDuck choice so that the comparison with 'attachment' in the body algorithm is reliable."

  - id: EGET-137
    title: "Report cid without angle brackets"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "multipart/mixed [text without Content-ID, image with 'Content-Id: <1234567890@local>', image with '<1234567890>', image with a bare '1234567890', image with ' <a@b> (comment)']."
    when: "Email/get with properties ['bodyStructure'] and bodyProperties ['partId', 'cid', 'subParts']."
    then: "The cid values are null, '1234567890@local', '1234567890', '1234567890' and 'a@b'."
    sources:
      - "cyrus:JMAPEmail/email_get_cid"
      - "stalwart:mail/get.rs (multipart_cid.eml)"
      - "jmapio:email-get-body#body-inline-attachment-cid"

  - id: EGET-138
    title: "Report language and location from Content-Language and Content-Location"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "Parts with 'Content-Language: en-US, de (German), fr', 'Content-Language: et', no Content-Language; and 'Content-Location: https://example.com/img/logo.png' (also folded), none."
    when: "Email/get with properties ['bodyStructure'] and bodyProperties ['language', 'location', 'subParts']."
    then: "language is ['en-US', 'de', 'fr'], ['et'] and null. location is the URI string without white space, and null when absent."
    sources:
      - "rfc:8621 4.1.4"
      - "stalwart:mail/get.rs"

  - id: EGET-139
    title: "Treat an unknown Content-Transfer-Encoding as no encoding for the blob"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A single part text/plain message with 'Content-Transfer-Encoding: foobar' and the body 'This is a test email.' CRLF."
    when: "Email/get with properties ['bodyStructure', 'bodyValues'], fetchAllBodyValues true, and a download of the part blob."
    then: "The part size and the blob bytes equal the literal body octets. The body value has isEncodingProblem true; its value is the undecoded text with LF line endings."
    sources:
      - "cyrus:JMAPEmail/email_get_bogus_encoding"
      - "rfc:8621 4.1.4"
    notes: "Cyrus returns an empty value here. The RFC says the blob is treated as unencoded and the flag is set, so WildDuck returns the text."

  # ---------------------------------------------------------------- textBody, htmlBody, attachments algorithm
  - id: EGET-140
    title: "Fall back across alternatives when only one text flavour exists"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: should
    phase: 1
    applies: yes
    seed: [imap]
    given: "Message 1: multipart/alternative with only a text/html child. Message 2: multipart/alternative with only a text/plain child. Message 3: multipart/mixed [alternative [html only], pdf attachment]."
    when: "Email/get with properties ['textBody', 'htmlBody', 'attachments'], fetchTextBodyValues and fetchHTMLBodyValues true."
    then: "Message 1: textBody and htmlBody are both [html]. Message 2: both are [plain]. Message 3: both are [html] and attachments is [pdf]. bodyValues holds the one text part in each case."
    sources:
      - "james:EmailGetMethodContract#htmlBodyValuesShouldFallBackToPlainTextWhenNoHtmlPart"
      - "stalwart:mail/get.rs (text_body_missing.eml, text_body_missing_multipart.eml)"
      - "fastmail:t/Email/get/text-body.t"
      - "fastmail:t/Email/get/html-body.t"

  - id: EGET-141
    title: "Return empty body lists when the message has no displayable part"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A single part message of type application/zip, and a single part text/plain message with 'Content-Disposition: attachment; filename=notes.txt'."
    when: "Email/get with the default properties."
    then: "For both: textBody is [], htmlBody is [], attachments is [the part], hasAttachment is true, preview is a string (empty for the zip)."
    sources:
      - "cyrus:JMAPEmail/email_get_body_notext"
      - "rfc:8621 4.1.4"

  - id: EGET-142
    title: "Show sequential text parts of a multipart/mixed as one body"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: should
    phase: 1
    applies: yes
    seed: [imap]
    given: "multipart/mixed [text/plain body, text/plain mailing list footer], neither with a file name or disposition."
    when: "Email/get with properties ['textBody', 'htmlBody', 'attachments'], fetchTextBodyValues true."
    then: "textBody and htmlBody are both [body, footer] in order; attachments is []; bodyValues has both parts."
    sources:
      - "rfc:8621 4.1.4"
      - "stalwart:mail/get.rs (multipart_mixed.eml)"

  - id: EGET-143
    title: "Treat a named text part that is not first as an attachment"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: should
    phase: 1
    applies: yes
    seed: [imap]
    given: "multipart/mixed [text/plain body, text/plain with 'Content-Type: text/plain; name=log.txt' and no disposition, text/html with disposition attachment]."
    when: "Email/get with properties ['textBody', 'htmlBody', 'attachments']."
    then: "textBody and htmlBody are [body]. attachments is [log.txt, the html attachment]."
    sources:
      - "stalwart:mail/get.rs (text_attachments.eml)"
      - "rfc:8621 4.1.4"

  - id: EGET-144
    title: "Place inline media parts of a mixed message in both body lists and not in attachments"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: should
    phase: 1
    applies: yes
    seed: [imap]
    given: "multipart/mixed [text/plain, image/jpeg with disposition inline and a file name, audio/mpeg without disposition, video/mp4 with disposition attachment]."
    when: "Email/get with properties ['textBody', 'htmlBody', 'attachments', 'hasAttachment']."
    then: "textBody and htmlBody are [text, jpeg, audio]. attachments is [video] only. hasAttachment is true."
    sources:
      - "rfc:8621 4.1.4"
      - "cyrus:JMAPEmail/email_get_hasattachment"

  - id: EGET-145
    title: "List an inline image that is in only one of the body lists in attachments too"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: should
    phase: 1
    applies: yes
    seed: [imap]
    given: "multipart/alternative [multipart/mixed [text/plain B, image/jpeg C inline, text/plain D], text/html E]."
    when: "Email/get with properties ['textBody', 'htmlBody', 'attachments']."
    then: "textBody is [B, C, D], htmlBody is [E], attachments is [C] because C is a media part that is not in both lists."
    sources:
      - "rfc:8621 4.1.4"
      - "cyrus:JMAPEmail/email_get_bodystructure"

  - id: EGET-146
    title: "Keep non plain, non html text parts out of the body lists"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: should
    phase: 1
    applies: yes
    seed: [imap]
    given: "multipart/mixed [text/plain, text/calendar without disposition, text/x-markdown without disposition]; and a single part text/x-markdown message."
    when: "Email/get with properties ['textBody', 'htmlBody', 'attachments', 'bodyStructure', 'bodyValues'], fetchAllBodyValues true."
    then: "First message: textBody is [plain]; attachments is [calendar, markdown]; bodyValues contains all three text parts. Second message: textBody and htmlBody are [], attachments is [the part], its body value is the markdown text with isEncodingProblem false."
    sources:
      - "cyrus:JMAPEmail/email_get_bodyvalues_markdown"
      - "rfc:8621 4.1.4"

  - id: EGET-147
    title: "List attachments depth first without subParts"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "mixed [text, mixed [pdf1, mixed [pdf2]], pdf3, message/rfc822]."
    when: "Email/get with properties ['attachments'] and bodyProperties ['partId', 'type', 'name', 'subParts']."
    then: "attachments is [pdf1, pdf2, pdf3, message] in that order. No item is a multipart and none has a non null subParts."
    sources:
      - "rfc:8621 4.1.4"
      - "james:EmailGetMethodContract#attachmentsForComplexMultipart"

  # ---------------------------------------------------------------- bodyValues
  - id: EGET-148
    title: "Return an empty bodyValues object when no fetch flag is set"
    method: Email/get
    spec: "RFC 8621 4.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A multipart/alternative message."
    when: "Email/get with properties ['bodyValues', 'textBody', 'htmlBody'] and no fetch arguments; and again with all three fetch arguments explicitly false."
    then: "bodyValues is {} in both responses."
    sources:
      - "james:EmailGetMethodContract#bodyValuesShouldBeEmptyWithoutFetch"
      - "rfc:8621 4.2"

  - id: EGET-149
    title: "Fetch only textBody values with fetchTextBodyValues"
    method: Email/get
    spec: "RFC 8621 4.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "mixed [alternative [text/plain P, text/html H], text/csv attachment T]."
    when: "Email/get with properties ['textBody', 'htmlBody', 'bodyValues'] and fetchTextBodyValues true."
    then: "bodyValues has exactly one key, the partId of P, with {value: the plain text, isEncodingProblem false, isTruncated false}. H and T are absent."
    sources:
      - "james:EmailGetMethodContract#textBodyValuesForSimpleMultipart"
      - "james:EmailGetMethodContract#textBodyValuesForAlternativeMessage"
      - "james:EmailGetMethodContract#textBodyValuesForComplexMultipart"
      - "jmapio:email-get-body#body-values-text"
      - "fastmail:t/Email/get/fetch-text-body-values.t"

  - id: EGET-150
    title: "Fetch only htmlBody values with fetchHTMLBodyValues"
    method: Email/get
    spec: "RFC 8621 4.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "The message of EGET-149."
    when: "Email/get with properties ['textBody', 'htmlBody', 'bodyValues'] and fetchHTMLBodyValues true."
    then: "bodyValues has exactly the partId of H with the HTML source as value. P and T are absent."
    sources:
      - "james:EmailGetMethodContract#htmlBodyValuesForComplexMultipart"
      - "jmapio:email-get-body#body-values-html"
      - "fastmail:t/Email/get/fetch-html-body-values.t"

  - id: EGET-151
    title: "Combine fetchTextBodyValues and fetchHTMLBodyValues"
    method: Email/get
    spec: "RFC 8621 4.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "The message of EGET-149, and a single part text/plain message."
    when: "Email/get with both flags true."
    then: "For the multipart, bodyValues has exactly P and H. For the single part message it has one key (the part is in both lists and appears once)."
    sources:
      - "james:EmailGetMethodContract#textAndHtmlBodyValuesForComplexMultipart"
      - "james:EmailGetMethodContract#textAndHtmlBodyValuesForSimpleMultipart"

  - id: EGET-152
    title: "Fetch every text part with fetchAllBodyValues"
    method: Email/get
    spec: "RFC 8621 4.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "mixed [alternative [text/plain P, text/html H], text/csv attachment T, image/png I, message/rfc822 M with a text body]."
    when: "Email/get with properties ['bodyStructure', 'bodyValues'] and fetchAllBodyValues true."
    then: "bodyValues has exactly the partIds of P, H and T. The image, the embedded message and text inside the embedded message are not included. Every key equals a partId found in bodyStructure."
    sources:
      - "james:EmailGetMethodContract#allBodyValuesForSimpleMultipart"
      - "james:EmailGetMethodContract#allBodyValuesForComplexMultipart"
      - "cyrus:JMAPEmail/email_get_body_both"
      - "jmapio:email-get-body#body-values-all"
      - "fastmail:t/Email/get/fetch-all-body-values.t"

  - id: EGET-153
    title: "Honour fetch flags only when bodyValues is among the returned properties"
    method: Email/get
    spec: "RFC 8621 4.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A text/plain message."
    when: "Email/get with properties ['subject'] and fetchAllBodyValues true; then with properties ['bodyValues'] only (no textBody) and fetchTextBodyValues true."
    then: "The first response has no bodyValues key. The second has bodyValues with the text part even though textBody itself was not requested."
    sources:
      - "rfc:8621 4.2"
      - "cyrus:JMAPEmail/email_get_bodyvalues_crlf"

  - id: EGET-154
    title: "Reject fetch flags and maxBodyValueBytes of the wrong type"
    method: Email/get
    spec: "RFC 8620 3.6.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A text/plain message."
    when: "Separate Email/get calls with maxBodyValueBytes set to -5, 1.5, 'cat', '1', true, {} and [], and with fetchTextBodyValues set to 'yes' and to 1."
    then: "Every call answers invalidArguments."
    sources:
      - "fastmail:t/Email/get/max-body-value-bytes.t"
      - "rfc:8621 4.2"
    notes: "The Fastmail suite also expects null to be rejected. WildDuck treats an explicit null like an omitted argument (default 0); flag if strictness is preferred."

  - id: EGET-155
    title: "Decode quoted-printable and base64 text parts"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A UTF-8 text/plain part in quoted-printable with soft line breaks and escaped non ASCII characters, and a UTF-8 text/html part in base64."
    when: "Email/get with fetchAllBodyValues true."
    then: "Each value is the decoded Unicode text: no '=' escapes, no soft breaks, no base64. isEncodingProblem and isTruncated are false."
    sources:
      - "cyrus:JMAPEmail/email_get_size"
      - "cyrus:JMAPEmail/email_parse_encoding"
      - "stalwart:mail/get.rs"
      - "rfc:8621 4.1.4"

  - id: EGET-156
    title: "Convert legacy charsets to Unicode in body values"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "Text parts in ISO-8859-1, Windows-1252 (with a euro sign), KOI8-R, ISO-2022-JP (quoted-printable and 7bit), Shift_JIS, EUC-KR, GB18030 and UTF-16 with BOM, each with the correct charset label."
    when: "Email/get with properties ['bodyValues', 'preview'] and fetchAllBodyValues true."
    then: "Every value equals the expected Unicode text, isEncodingProblem is false, and preview shows the same decoded text. The part's charset property still names the original charset and the blob download returns the original bytes."
    sources:
      - "cyrus:JMAPEmail/email_get_bodyvalues_iso2022jp"
      - "cyrus:JMAPEmail/email_get_iso2022jp_body"
      - "jmapio:email-get-body#body-non-utf8-charset"
      - "rfc:8621 4.1.4"

  - id: EGET-157
    title: "Normalise CRLF to LF in body values"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A quoted-printable text/plain part with the lines one, two, three separated by CRLF and no trailing line break; and a base64 text part whose decoded content contains CRLF pairs and a lone CR."
    when: "Email/get with properties ['bodyValues', 'bodyStructure'] and fetchAllBodyValues true."
    then: "The first value is exactly 'one', LF, 'two', LF, 'three'. In the second every CRLF is a single LF and no CRLF remains. The part size still counts the CRLF octets."
    sources:
      - "cyrus:JMAPEmail/email_get_bodyvalues_crlf"
      - "rfc:8621 4.1.4"

  - id: EGET-158
    title: "Flag an unknown charset as an encoding problem"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "mixed [text/plain charset us-ascii 'hello', text/plain charset x-jmts-unknown 'world']."
    when: "Email/get with properties ['bodyValues'] and fetchAllBodyValues true."
    then: "The first value is 'hello' with isEncodingProblem false. The second has isEncodingProblem true and a string value (the ASCII text is still readable). The call does not fail."
    sources:
      - "cyrus:JMAPEmail/email_get_unknown_charset"
      - "rfc:8621 4.1.4"

  - id: EGET-159
    title: "Replace malformed byte sequences and flag the problem"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: should
    phase: 1
    applies: yes
    seed: [imap]
    given: "A text/plain part labelled charset utf-8 whose 8bit body contains the invalid byte sequence C3 28 between 'a' and 'b'; a part labelled us-ascii that holds ISO-8859-1 bytes; a part labelled UTF-32 holding bytes that are not valid UTF-32."
    when: "Email/get with properties ['textBody', 'bodyValues', 'preview'] and fetchTextBodyValues true."
    then: "Each value is valid Unicode with U+FFFD in place of the bad sequence (or correctly decoded text if the server detected the real charset), isEncodingProblem is true, and the response is valid JSON. preview is a string without raw invalid bytes."
    sources:
      - "cyrus:JMAPEmail/email_get_detect_iso_8859_1"
      - "cyrus:JMAPEmail/email_get_detect_utf32"
      - "jmapio:email-get-body#body-invalid-ascii-handling"
      - "rfc:8621 4.1.4"

  - id: EGET-160
    title: "Do not flag a correctly encoded replacement character"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A base64 UTF-8 text part whose content legitimately contains an emoji and the character U+FFFD."
    when: "Email/get with properties ['bodyValues'] and fetchAllBodyValues true."
    then: "The value contains the emoji and U+FFFD exactly as sent and isEncodingProblem is false."
    sources:
      - "cyrus:JMAPEmail/email_get_utf8body_base64_with_replacement_char"

  - id: EGET-161
    title: "Tolerate a charset name used as the transfer encoding and NUL bytes in a text body"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: should
    phase: 1
    applies: yes
    seed: [imap]
    given: "A text/plain part with 'Content-Transfer-Encoding: UTF-8' (a known client bug) and the body 'This is a test.'; and a quoted-printable text/html part containing an encoded NUL (=00) inside 'hello world'."
    when: "Email/get with properties ['bodyValues'] and fetchAllBodyValues true."
    then: "The first value is 'This is a test.' followed by LF. The second value contains no NUL character (the JSON has no escaped NUL) and reads 'hello world' inside the markup, with isEncodingProblem true."
    sources:
      - "cyrus:JMAPEmail/email_get_encoding_utf8"
      - "cyrus:JMAPEmail/email_get_bodyvalues_nulbyte"

  - id: EGET-162
    title: "Truncate body values to maxBodyValueBytes and set isTruncated"
    method: Email/get
    spec: "RFC 8621 4.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A text/plain ASCII part of 1000 octets and a second message with a 10 octet part."
    when: "Email/get with fetchAllBodyValues true and maxBodyValueBytes 100; then 1000; then 1001; then 0; then omitted."
    then: "With 100 the long value is exactly the first 100 characters and isTruncated is true, while the 10 octet value is complete with isTruncated false. With 1000, 1001, 0 and omitted the long value is complete and isTruncated is false."
    sources:
      - "james:EmailGetMethodContract#bodyValueShouldBeTruncatedIfNeeded"
      - "cyrus:JMAPEmail/email_get_max_body_value_bytes_zero"
      - "jmapio:email-get-body#body-max-body-value-bytes"
      - "fastmail:t/Email/get/max-body-value-bytes.t"

  - id: EGET-163
    title: "Never truncate inside a UTF-8 code point"
    method: Email/get
    spec: "RFC 8621 4.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A UTF-8 text part whose content is a three byte character, a two byte character and a one byte character (6 octets), and one starting with a four byte emoji."
    when: "Email/get with fetchAllBodyValues true and maxBodyValueBytes 1 through 6 for the first, 1 through 4 for the second."
    then: "For limits 1 and 2 the first value is '' with isTruncated true; 3 and 4 give the first character; 5 gives two characters; 6 gives all three with isTruncated false. The emoji value is '' for limits 1 to 3. Every returned value is valid UTF-8 no longer than the limit in octets."
    sources:
      - "cyrus:JMAPEmail/email_get_maxbodyvaluebytes_utf8"
      - "fastmail:t/Email/get/max-body-value-bytes.t"
      - "rfc:8621 4.2"

  - id: EGET-164
    title: "Count the limit on the decoded UTF-8 value, not on the stored bytes"
    method: Email/get
    spec: "RFC 8621 4.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A base64 ISO-8859-1 text part of 50 characters, all of them non ASCII (50 octets decoded in Latin 1, 100 octets as UTF-8, about 68 octets base64), with CRLF line endings in another part."
    when: "Email/get with fetchAllBodyValues true and maxBodyValueBytes 60."
    then: "The value holds 30 characters (60 UTF-8 octets) and isTruncated is true. A part whose LF normalised UTF-8 value fits in the limit is not truncated even if its CRLF form would exceed it."
    sources:
      - "rfc:8621 4.2"

  - id: EGET-165
    title: "Avoid truncating inside an HTML tag"
    method: Email/get
    spec: "RFC 8621 4.2"
    level: should
    phase: 1
    applies: yes
    seed: [imap]
    given: "A text/html part '<p>Hello <a href=\"https://example.com/a/long/link\">link</a> world</p>'."
    when: "Email/get with fetchHTMLBodyValues true and maxBodyValueBytes set so the limit falls inside the anchor start tag."
    then: "The value ends before the '<a' (or after the complete tag), never with a partial tag; it is no longer than the limit and isTruncated is true."
    sources:
      - "rfc:8621 4.2"

  - id: EGET-166
    title: "Serve large text parts that live in the attachment store"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: wd
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message whose text/plain part is 400 KB (above WildDuck's 300 KB inline limit, so stored in the attachment bucket) and one whose text part is 100 KB (inline in the MIME tree)."
    when: "Email/get with fetchTextBodyValues true, once without a limit and once with maxBodyValueBytes 1024."
    then: "Without a limit both values are complete and byte for byte what was sent (after LF normalisation). With the limit both are 1024 octets with isTruncated true. preview is present for both."
    sources:
      - "wildduck:jmap-report Email mapping (bodyValues)"

  # ---------------------------------------------------------------- hasAttachment
  - id: EGET-167
    title: "Set hasAttachment false for messages without downloadable parts"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: should
    phase: 1
    applies: yes
    seed: [imap]
    given: "A text/plain message, a multipart/alternative message, and a multipart/related message whose only extra part is an inline image referenced by cid."
    when: "Email/get with properties ['hasAttachment', 'attachments']."
    then: "hasAttachment is the boolean false for all three, although attachments of the third lists the inline image."
    sources:
      - "james:EmailGetMethodContract#hasAttachmentForSimpleEmail"
      - "james:EmailGetMethodContract#hasAttachmentForMultipartWithoutAttachment"
      - "james:EmailGetMethodContract#inlinedAttachmentMailShouldNotBeCountedAsHasAttachmentWhenEmailFullView"
      - "jmapio:email-get#get-has-attachment-false"
      - "fastmail:t/Email/get/has-attachment.t"

  - id: EGET-168
    title: "Set hasAttachment true when a part is offered for download"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: should
    phase: 1
    applies: yes
    seed: [imap]
    given: "Messages with: a pdf with disposition attachment; an image/jpeg with a name and no disposition placed between two text parts; an attached message/rfc822; an application/octet-stream without any disposition."
    when: "Email/get with properties ['hasAttachment']; Email/query with filter hasAttachment true; the REST API message listing."
    then: "hasAttachment is true for the pdf, the embedded message and the octet-stream. The query returns exactly the Emails whose hasAttachment is true and the REST API attachments flag agrees for every message."
    sources:
      - "james:EmailGetMethodContract#hasAttachmentForMultipartWithAttachment"
      - "cyrus:JMAPEmail/email_get_hasattachment"
      - "cyrus:JMAPEmail/email_get_attachment_name"
      - "jmapio:email-get#get-has-attachment-true"
      - "fastmail:t/Email/get/has-attachment.t"
    notes: "hasAttachment maps to WildDuck's stored ha flag. Cyrus reports true for the unnamed inline looking jpeg between text parts; the RFC algorithm puts it in both body lists, so false is also defensible. The firm requirement is agreement between Email/get, the Email/query filter and the REST API. Signature parts of multipart/signed follow the same stored flag."

  # ---------------------------------------------------------------- preview
  - id: EGET-169
    title: "Return a plain text preview of the body"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A text/plain message with the body 'A plain text email.'."
    when: "Email/get with properties ['preview']."
    then: "preview is the string 'A plain text email.' with no trailing line break."
    sources:
      - "james:EmailGetMethodContract#previewForSimpleEmail"
      - "cyrus:JMAPEmail/email_get_preview"
      - "jmapio:email-get#get-preview-is-text"
      - "fastmail:t/previews.t"

  - id: EGET-170
    title: "Limit preview to 128 characters"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: wd
    phase: 1
    applies: adapted
    seed: [imap]
    given: "A text/plain message with a 5000 character body, and one whose body is 200 four byte emoji."
    when: "Email/get with properties ['preview']."
    then: "preview is a prefix of the white space collapsed body, at most 128 characters long (the RFC ceiling is 256), and is never cut inside a surrogate pair. It equals the intro value the REST API shows."
    sources:
      - "james:EmailGetMethodContract#previewShouldBeTruncatedForLongTextBodies"
      - "wildduck:brief emails"
      - "rfc:8621 4.1.4"

  - id: EGET-171
    title: "Collapse white space in preview"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: should
    phase: 1
    applies: yes
    seed: [imap]
    given: "A text/plain body with leading blank lines, tabs, runs of spaces and CRLF line breaks between short lines."
    when: "Email/get with properties ['preview']."
    then: "preview has no CR, LF or tab, no leading or trailing white space and no run of two or more spaces."
    sources:
      - "cyrus:JMAPEmail/email_get_iso2022jp_body"
      - "rfc:8621 4.1.4"

  - id: EGET-172
    title: "Derive preview from HTML when there is no plain text part"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A text/html only message with the body 'hello<br><p>world</p>!' plus a style block, a script block, an HTML comment and the entities for ampersand and non breaking space."
    when: "Email/get with properties ['preview']."
    then: "preview contains the words hello, world and the exclamation mark separated by single spaces, a literal ampersand for the entity, and no angle bracket tags, style rules, script source or comment text."
    sources:
      - "cyrus:JMAPEmail/email_get_preview_html"
      - "james:EmailGetMethodContract#previewForSimpleEmailWithHtmlBody"

  - id: EGET-173
    title: "Return an empty string preview when there is no text to show"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message with an empty body, a single part application/pdf message, and a multipart/encrypted message."
    when: "Email/get with properties ['preview']."
    then: "preview is the empty string for each: a String, never null, never base64 or ciphertext."
    sources:
      - "james:EmailGetMethodContract#previewForSimpleEmailWithoutBody"
      - "rfc:8621 4.1.4"

  - id: EGET-174
    title: "Decode transfer encoding and charset before building preview"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "A base64 ISO-2022-JP text/plain message and a quoted-printable Windows-1252 message with accented characters."
    when: "Email/get with properties ['preview']."
    then: "preview is the readable Unicode text. It contains no base64, no '=XX' escapes and no escape sequences of the source charset."
    sources:
      - "cyrus:JMAPEmail/email_get_iso2022jp_body"
      - "cyrus:JMAPEmail/email_get_detect_utf32"

  # ---------------------------------------------------------------- part blobs
  - id: EGET-175
    title: "Download a part blob as decoded content"
    method: Download
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "mixed [quoted-printable ISO-8859-1 text, base64 png of known bytes, 7bit csv]."
    when: "Email/get with properties ['bodyStructure', 'attachments'], then GET the download URL for each part blobId."
    then: "Each download is HTTP 200 with a body equal to the transfer decoded part: the original png bytes, the text in its original ISO-8859-1 bytes (not converted to UTF-8, CRLF kept), the csv as is. Each length equals the part size."
    sources:
      - "james:EmailGetMethodContract#shouldBeAbleToDownloadAttachmentBaseOnFastViewWithAttachmentsMetadataResult"
      - "james:EmailGetMethodContract#shouldBeAbleToDownloadAttachmentBaseOnFastViewWithAttachmentsMetadataResultWithReadLevelFll"
      - "jmapio:email-get-body#body-attachment-blob-id"
      - "stalwart:mail/parse.rs"
      - "rfc:8621 4.1.4"

  - id: EGET-176
    title: "Use WildDuck blob id prefixes and keep part blob ids stable"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: wd
    phase: 1
    applies: yes
    seed: [imap]
    given: "A multipart message with nested parts (part paths 1.1, 1.2, 2)."
    when: "Email/get with properties ['blobId', 'bodyStructure'] twice, with an IMAP MOVE of the message in between."
    then: "The Email blobId and every part blobId are identical in both responses. All use only A-Za-z0-9, hyphen and underscore (the dot of a part path is encoded), the raw message blob id and the part blob ids are distinguishable by prefix, and all part blob ids of the Email are distinct."
    sources:
      - "wildduck:jmap-report blob id scheme"
      - "rfc:8620 1.2"

  - id: EGET-177
    title: "Give the blob of an embedded message as the decoded message"
    method: Download
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "mixed [text, message/rfc822 part sent base64 encoded]."
    when: "Email/get with properties ['attachments'], then download the attachment blobId."
    then: "The download is the embedded RFC 5322 message itself (starts with its header block), not base64 text; its length equals the part size."
    sources:
      - "cyrus:JMAPEmail/email_parse_base64"
      - "cyrus:JMAPEmail/email_get_encoded_message"
      - "stalwart:mail/parse.rs (attachment_b64.eml)"

  # ---------------------------------------------------------------- consistency with IMAP
  - id: EGET-178
    title: "Agree with IMAP BODYSTRUCTURE on the part tree"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: wd
    phase: 1
    applies: yes
    seed: [imap]
    given: "Each candidate fixture under imap-core/test/fixtures (simple.eml, nodemailer.eml, fix1.eml, fix3.eml, fix4.eml, append.eml, mimetorture.eml) and test/fixtures/multipart-2.eml appended to a mailbox."
    when: "Email/get with properties ['bodyStructure'] and bodyProperties ['partId', 'type', 'name', 'cid', 'disposition', 'subParts'], and IMAP FETCH BODYSTRUCTURE for the same message."
    then: "Walking both trees in order gives the same nesting, the same media type and subtype (case insensitive), the same Content-ID and the same disposition for every part outside embedded messages. JMAP leaf partIds equal the IMAP section numbers."
    sources:
      - "wildduck:brief emails"
      - "wildduck:imap-core/test/fixtures"

  - id: EGET-179
    title: "Agree with IMAP FETCH on part content"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: wd
    phase: 1
    applies: yes
    seed: [imap]
    given: "A multipart message with base64, quoted-printable and 8bit parts."
    when: "For every leaf part: download the JMAP part blob and IMAP FETCH BINARY[section] (or BODY[section] decoded by the test)."
    then: "The bytes are identical for every part. The raw message blob equals IMAP BODY[] byte for byte."
    sources:
      - "cyrus:JMAPEmail/email_get_encoded_message"
      - "wildduck:brief emails"

  - id: EGET-180
    title: "Agree with IMAP ENVELOPE, FLAGS, INTERNALDATE and RFC822.SIZE"
    method: Email/get
    spec: "RFC 8621 4.1.1"
    level: wd
    phase: 1
    applies: yes
    seed: [imap, lmtp]
    given: "Ten varied messages (fixtures plus LMTP deliveries), some with flags and labels."
    when: "Email/get with the default properties and IMAP FETCH (ENVELOPE FLAGS INTERNALDATE RFC822.SIZE) for each."
    then: "For every message: size equals RFC822.SIZE, receivedAt equals INTERNALDATE, the keyword set equals the lowercased IMAP flags with system flags mapped and without \\Recent, subject equals the decoded ENVELOPE subject, messageId and inReplyTo match, and from, to and cc list the same addresses."
    sources:
      - "wildduck:brief emails"
      - "cyrus:JMAPEmail/email_get_utf8_domain"
    notes: "Where a header is duplicated JMAP takes the last instance (EGET-087); the comparison uses messages without duplicated single instance headers."

  # ---------------------------------------------------------------- large messages and batches
  - id: EGET-181
    title: "Read a large message without loading its attachments for fast properties"
    method: Email/get
    spec: "RFC 8621 4.2"
    level: should
    phase: 1
    applies: yes
    seed: [imap]
    given: "A message close to the configured maximum size with one 20 MB base64 attachment and a short text part."
    when: "Email/get with only the fast properties (id, blobId, threadId, mailboxIds, keywords, size, receivedAt, messageId, inReplyTo, sender, from, to, cc, bcc, replyTo, subject, sentAt, hasAttachment, preview); then with bodyStructure and fetchAllBodyValues true."
    then: "Both calls succeed. The first is answered from the message document alone (response time comparable to a small message). The second reports the attachment's decoded size, about three quarters of its encoded size, and returns only the short text in bodyValues."
    sources:
      - "rfc:8621 4.2"
      - "james:EmailGetMethodContract#shouldUseFastViewWithAttachmentMetadataWhenSupportedBodyProperties"
      - "james:EmailGetMethodContract#shouldUseFullViewReaderWhenFetchAllBodyProperties"

  - id: EGET-182
    title: "Handle a message with very many parts"
    method: Email/get
    spec: "RFC 8621 4.1.4"
    level: should
    phase: 1
    applies: yes
    seed: [imap]
    given: "A multipart/mixed message with one text part and 200 small attachments."
    when: "Email/get with properties ['bodyStructure', 'attachments', 'hasAttachment']."
    then: "bodyStructure has 201 subParts, attachments has 200 items in order with distinct partIds and blobIds, hasAttachment is true."
    sources:
      - "rfc:8621 4.1.4"

  - id: EGET-183
    title: "Fetch full bodies for many Emails in one call"
    method: Email/get
    spec: "RFC 8621 4.2"
    level: must
    phase: 1
    applies: yes
    seed: [imap]
    given: "As many messages as maxObjectsInGet allows, of mixed shapes, in several mailboxes."
    when: "One Email/get with all ids, the default properties plus bodyStructure, fetchAllBodyValues true and maxBodyValueBytes 256."
    then: "Every id is in list exactly once, none in notFound, each Email carries its own body values (no cross contamination between Emails), and no value exceeds 256 octets."
    sources:
      - "james:EmailGetMethodContract#severalEmailCanBeRetrievedAtOnce"
      - "stalwart:mail/get.rs"
      - "wildduck:jmap-report maxObjectsInGet"

  - id: EGET-184
    title: "Return identical Email content for IMAP appended and LMTP delivered copies of the same message"
    method: Email/get
    spec: "RFC 8621 4.1"
    level: wd
    phase: 1
    applies: yes
    seed: [imap, lmtp]
    given: "The same raw multipart message stored once through IMAP APPEND and once through LMTP delivery."
    when: "Email/get both with all body and header convenience properties and fetchAllBodyValues true."
    then: "Apart from id, blobId, threadId, receivedAt, size and delivery added headers (Delivered-To, Return-Path, Received), the two Emails are equal: same structure, part sizes, names, body values, preview and hasAttachment."
    sources:
      - "wildduck:brief state"
