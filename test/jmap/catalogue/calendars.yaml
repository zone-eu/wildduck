  - id: CEQ-060
    title: "Expand a yearly rule with byMonth"
    method: "CalendarEvent/query"
    spec: "RFC 8984 4.3.3.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event starting 2026-03-10T09:00:00 with recurrenceRule {frequency \"yearly\", byMonth [\"3\", \"9\"], count 3}."
    when: "Call CalendarEvent/query with expandRecurrences true, filter {\"after\": \"2026-01-01T00:00:00\", \"before\": \"2026-12-31T00:00:00\"}, sort [{\"property\": \"start\"}], then CalendarEvent/get for the returned ids with properties [\"start\", \"recurrenceId\"]."
    then: "Within 2026 the starts are 2026-03-10 and 2026-09-10; a second window over 2027 shows the third and last instance on 2027-03-10."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_bymonth"
      - "rfc:8984 4.3.3.1"

  - id: CEQ-061
    title: "Handle a yearly event on 29 February under each skip value"
    method: "CalendarEvent/query"
    spec: "RFC 8984 4.3.3.1"
    level: must
    phase: 6
