area: calendars
title: "Calendars without scheduling"
description: "Calendar storage as defined by draft-ietf-jmap-calendars-33: the capability object, ParticipantIdentity, Calendar, CalendarEvent get, set, changes, copy and query with recurrence expansion, and alerts with the CalendarAlert push. The draft builds on JSCalendar bis (draft-ietf-calext-jscalendarbis-22), so event property scenarios follow RFC 8984 plus the changes the draft itself shows (single recurrenceRule, calendarAddress, organizerCalendarAddress, version 2.0, endTimeZone) and may move until both are published. Sharing, principals and free busy are not offered; scheduling is in calendar-scheduling.yaml."
scenarios:
  - id: CAL-001
    title: "Advertise the calendars capability in the session capabilities as an empty object"
    method: "Session"
    spec: "draft-ietf-jmap-calendars-33 1.5.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [none]
    given: "A user with JMAP enabled and no calendar data yet."
    when: "GET the JMAP session resource with valid credentials."
    then: "capabilities has the key urn:ietf:params:jmap:calendars and its value is exactly {}. primaryAccounts maps urn:ietf:params:jmap:calendars to the user's account id."
    sources:
      - "cyrus:JMAPCalendars/session_capability_isrfc"
      - "cyrus:JMAPCalendars/account_get_capabilities"
      - "stalwart:principal/get.rs"
      - "rfc:draft-ietf-jmap-calendars-33 1.5.1"

  - id: CAL-002
    title: "Expose all six account level calendar limits with valid types"
    method: "Session"
    spec: "draft-ietf-jmap-calendars-33 1.5.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [none]
    given: "A user with JMAP enabled and no calendar data yet."
    when: "GET the session resource and read accounts[accountId].accountCapabilities[\"urn:ietf:params:jmap:calendars\"]."
    then: "The object contains maxCalendarsPerEvent (integer >= 1 or null), minDateTime and maxDateTime (UTCDateTime strings ending in Z, minDateTime earlier than maxDateTime), maxExpandedQueryDuration (a Duration string such as P1Y or P366D), maxParticipantsPerEvent (integer >= 1 or null) and mayCreateCalendar (boolean). No property is missing."
    sources:
      - "cyrus:JMAPCalendars/account_get_capabilities"
      - "rfc:draft-ietf-jmap-calendars-33 1.5.1"

  - id: CAL-003
    title: "Report mayCreateCalendar true for the account owner"
    method: "Session"
    spec: "draft-ietf-jmap-calendars-33 1.5.1"
    level: wd
    phase: 6
    applies: "yes"
    seed: [none]
    given: "A user with JMAP enabled and no calendar data yet."
    when: "GET the session resource."
    then: "mayCreateCalendar is true, and a following Calendar/set create with a name succeeds."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 1.5.1"
      - "wildduck:plan 10.2 Calendar"
    notes: "There is one account per user and the user owns it, so the value is constant. If a per user calendar count limit is added later, mayCreateCalendar must turn false once the limit is reached."

  - id: CAL-004
    title: "Reject calendar methods when the calendars capability is not listed in using"
    method: "Request"
    spec: "RFC 8620 3.6.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [none]
    given: "A user whose default calendar exists."
    when: "POST a request whose using array holds only urn:ietf:params:jmap:core and that calls Calendar/get."
    then: "The method response is an error with type unknownMethod; HTTP status is 200."
    sources:
      - "rfc:8620 3.6.2"
      - "rfc:8620 3.3"

  - id: CAL-005
    title: "Do not offer Principal/getAvailability or the availability capability"
    method: "Session"
    spec: "draft-ietf-jmap-calendars-33 1.5.2"
    level: must
    phase: 6
    applies: "adapted"
    seed: [none]
    given: "A user with JMAP enabled and no calendar data yet."
    when: "GET the session resource, then POST a request with using [core, calendars] that calls Principal/getAvailability, then a second request that lists urn:ietf:params:jmap:principals:availability in using."
    then: "Neither capabilities nor accountCapabilities contains urn:ietf:params:jmap:principals:availability. The method call answers with error type unknownMethod. The second request is rejected at request level with HTTP 400 and type urn:ietf:params:jmap:error:unknownCapability."
    sources:
      - "cyrus:JMAPCalendars/calendarprincipal_getavailability_merged"
      - "fastmail:t/Principal/getAvailability/basic.t"
      - "rfc:draft-ietf-jmap-calendars-33 1.5.2"
      - "rfc:draft-ietf-jmap-calendars-33 2.2"
      - "wildduck:plan 10.2 Principal/getAvailability"
    notes: "Free busy needs RFC 9670 principals, which are out of scope. The Cyrus and Fastmail availability tests have no positive counterpart here."

  - id: CAL-006
    title: "Do not offer calendar sharing"
    method: "Session"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: must
    phase: 6
    applies: "adapted"
    seed: [jmap]
    given: "A user whose default calendar exists."
    when: "GET the session resource, then call Calendar/get for all calendars, then Calendar/set updating the default calendar with shareWith {\"P1\": {\"mayReadItems\": true}}."
    then: "urn:ietf:params:jmap:principals is absent from capabilities and accountCapabilities. Every calendar has shareWith null. The update is rejected in notUpdated with type invalidProperties and properties [\"shareWith\"], and shareWith stays null."
    sources:
      - "cyrus:JMAPCalendars/calendar_set_sharewith"
      - "cyrus:JMAPCalendars/calendar_get_shared"
      - "stalwart:calendar/acl.rs"
      - "rfc:draft-ietf-jmap-calendars-33 4"
      - "rfc:draft-ietf-jmap-calendars-33 4.3"
      - "wildduck:brief Accounts and auth"
    notes: "All Cyrus and Stalwart sharing tests (67 Cyrus tests tagged S, Stalwart acl.rs) collapse into this one. Open question: invalidProperties (no such principal) is assumed here; forbidden would also be defensible. Setting shareWith to null explicitly must succeed as a no-op."

  - id: CAL-007
    title: "Do not advertise calendars:parse before phase 7"
    method: "Session"
    spec: "draft-ietf-jmap-calendars-33 1.5.3"
    level: wd
    phase: 6
    applies: "yes"
    seed: [none]
    given: "A user with JMAP enabled and no calendar data yet."
    when: "GET the session resource, then call CalendarEvent/parse with using [core, calendars]."
    then: "urn:ietf:params:jmap:calendars:parse is absent from capabilities and accountCapabilities, and the method call answers unknownMethod."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 1.5.3"
      - "rfc:draft-ietf-jmap-calendars-33 5.13"
      - "wildduck:plan 10.3 order of work"
    notes: "Phase 7 flips this, see CPAR-001 in calendar-scheduling.yaml."

  - id: CAL-008
    title: "Answer accountNotFound for calendar methods addressed to another account id"
    method: "Request"
    spec: "RFC 8620 3.6.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar exists."
    when: "Call Calendar/get, Calendar/changes, Calendar/set, CalendarEvent/get, CalendarEvent/changes, CalendarEvent/query, CalendarEvent/queryChanges, CalendarEvent/set, ParticipantIdentity/get and CalendarEventNotification/get, each with the accountId of a different existing user."
    then: "Every method response is an error with type accountNotFound. No data of the other user is returned or changed."
    sources:
      - "fastmail:t/Calendar/foreign-account.t"
      - "fastmail:t/CalendarEvent/foreign-account.t"
      - "cyrus:JMAPCalendars/no_shared_calendar"
      - "rfc:8620 3.6.2"

  - id: CAL-009
    title: "Do not implement Calendar/query"
    method: "Request"
    spec: "draft-ietf-jmap-calendars-33 10.4"
    level: must
    phase: 6
    applies: "yes"
    seed: [none]
    given: "A user whose default calendar exists."
    when: "Call Calendar/query with an empty filter."
    then: "The response is an error with type unknownMethod. The draft defines only get, changes and set for Calendar."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 4"

  - id: PID-001
    title: "Return one ParticipantIdentity per address the user owns"
    method: "ParticipantIdentity/get"
    spec: "draft-ietf-jmap-calendars-33 3.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [api]
    given: "A user with main address alice@example.com and one alias al@example.com, created through the REST API."
    when: "Call ParticipantIdentity/get with ids null."
    then: "list has exactly two objects. Each has id, name, calendarAddress and isDefault. The calendarAddress values are mailto:alice@example.com and mailto:al@example.com. notFound is empty and state is a string."
    sources:
      - "cyrus:JMAPCalendars/participantidentity_get"
      - "stalwart:calendar/identity.rs"
      - "rfc:draft-ietf-jmap-calendars-33 3"
      - "rfc:draft-ietf-jmap-calendars-33 3.1"
      - "wildduck:plan 10.2 ParticipantIdentity"

  - id: PID-002
    title: "Mark exactly one identity as default, the main address"
    method: "ParticipantIdentity/get"
    spec: "draft-ietf-jmap-calendars-33 3"
    level: must
    phase: 6
    applies: "yes"
    seed: [api]
    given: "A user with main address alice@example.com and two aliases."
    when: "Call ParticipantIdentity/get with ids null."
    then: "Exactly one object has isDefault true and its calendarAddress is mailto:alice@example.com. All others have isDefault false."
    sources:
      - "cyrus:JMAPCalendars/participantidentity_get"
      - "stalwart:calendar/identity.rs"
      - "rfc:draft-ietf-jmap-calendars-33 3"

  - id: PID-003
    title: "Use the user's display name as the identity name"
    method: "ParticipantIdentity/get"
    spec: "draft-ietf-jmap-calendars-33 3"
    level: wd
    phase: 6
    applies: "yes"
    seed: [api]
    given: "A user whose name is \"Alice Example\", with one alias that has its own name \"Al\" set through the REST API."
    when: "Call ParticipantIdentity/get with ids null."
    then: "The main address identity has name \"Alice Example\". The alias identity has name \"Al\". An address without a name of its own falls back to the user name; a user without any name yields \"\"."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 3"
      - "wildduck:plan 10.2 ParticipantIdentity"
    notes: "Mirrors how the mail Identity objects derive their name. The draft default for name is the empty string."

  - id: PID-004
    title: "Fetch identities by id and report unknown ids in notFound"
    method: "ParticipantIdentity/get"
    spec: "RFC 8620 5.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [api]
    given: "A user with two addresses; the identity ids are known from a previous get."
    when: "Call ParticipantIdentity/get with ids [knownId, \"Zunknown\"]."
    then: "list holds only the known identity and notFound is [\"Zunknown\"]."
    sources:
      - "cyrus:JMAPCalendars/participantidentity_get"
      - "rfc:8620 5.1"

  - id: PID-005
    title: "Honour the properties argument and always return id"
    method: "ParticipantIdentity/get"
    spec: "RFC 8620 5.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [api]
    given: "A user with two addresses."
    when: "Call ParticipantIdentity/get with properties [\"calendarAddress\"], then with properties [\"bogus\"]."
    then: "The first response objects contain only id and calendarAddress. The second call answers with error type invalidArguments."
    sources:
      - "rfc:8620 5.1"

  - id: PID-006
    title: "Keep identity ids stable and letter prefixed"
    method: "ParticipantIdentity/get"
    spec: "draft-ietf-jmap-calendars-33 3"
    level: wd
    phase: 6
    applies: "yes"
    seed: [api]
    given: "A user with two addresses."
    when: "Call ParticipantIdentity/get twice, restarting the JMAP worker in between."
    then: "Each address has the same id in both responses. Ids match the pattern of a letter followed by characters from A-Za-z0-9-_ only."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 3"
      - "wildduck:brief Ids"

  - id: PID-007
    title: "Emit calendar addresses as lowercase mailto URIs of the normalised address"
    method: "ParticipantIdentity/get"
    spec: "draft-ietf-jmap-calendars-33 3"
    level: wd
    phase: 6
    applies: "yes"
    seed: [api]
    given: "A user whose address was created through the REST API as Alice.Smith@EXAMPLE.com."
    when: "Call ParticipantIdentity/get with ids null."
    then: "calendarAddress is mailto:alice.smith@example.com, the same normalised form WildDuck stores for the address, with a lowercase scheme."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 3"
      - "wildduck:lib/tools.js normalizeAddress"

  - id: PID-008
    title: "Do not expose wildcard addresses as participant identities"
    method: "ParticipantIdentity/get"
    spec: "draft-ietf-jmap-calendars-33 3"
    level: wd
    phase: 6
    applies: "yes"
    seed: [api]
    given: "A user who owns alice@example.com and the wildcard address *@example.org."
    when: "Call ParticipantIdentity/get with ids null."
    then: "Only mailto:alice@example.com is listed. No identity has a calendarAddress containing an asterisk."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 3"
      - "wildduck:brief Identity"
    notes: "Open question. A wildcard cannot be a calendar address. Whether an event organised from some concrete address under the wildcard domain counts as the user (isOrigin, owner checks) is undecided; see CEV scenarios on isOrigin."

  - id: PID-009
    title: "Return the same state and empty lists when nothing changed"
    method: "ParticipantIdentity/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user with two addresses; state S1 taken from ParticipantIdentity/get."
    when: "Call ParticipantIdentity/changes with sinceState S1."
    then: "oldState and newState both equal S1, hasMoreChanges is false, and created, updated and destroyed are empty arrays."
    sources:
      - "cyrus:JMAPCalendars/participantidentity_changes"
      - "rfc:8620 5.2"

  - id: PID-010
    title: "Report an address added through the REST API as a created identity"
    method: "ParticipantIdentity/changes"
    spec: "draft-ietf-jmap-calendars-33 3.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [api]
    given: "State S1 taken from ParticipantIdentity/get."
    when: "Add the alias al@example.com to the user through the REST API, then call ParticipantIdentity/changes with sinceState S1 and ParticipantIdentity/get for the created ids."
    then: "newState differs from S1, created has exactly one id, updated and destroyed are empty, and the fetched identity has calendarAddress mailto:al@example.com and isDefault false."
    sources:
      - "cyrus:JMAPCalendars/participantidentity_changes"
      - "rfc:draft-ietf-jmap-calendars-33 3.2"
      - "wildduck:plan 10.3 owned change log"
    notes: "Addresses are written by the REST API, not by the JMAP worker, so the address handlers must write to the owned change log. The plan lists ParticipantIdentity among the types only the JMAP worker writes; that is not accurate for this type and needs a decision."

  - id: PID-011
    title: "Report a removed address as a destroyed identity"
    method: "ParticipantIdentity/changes"
    spec: "draft-ietf-jmap-calendars-33 3.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [api]
    given: "A user with an alias; state S1 and the alias identity id are known."
    when: "Delete the alias through the REST API, then call ParticipantIdentity/changes with sinceState S1 and ParticipantIdentity/get with the old id."
    then: "destroyed is [aliasIdentityId], created and updated are empty, and the get puts the id in notFound."
    sources:
      - "cyrus:JMAPCalendars/participantidentity_changes"
      - "rfc:draft-ietf-jmap-calendars-33 3.2"

  - id: PID-012
    title: "Report both identities as updated when the main address changes"
    method: "ParticipantIdentity/changes"
    spec: "draft-ietf-jmap-calendars-33 3.2"
    level: wd
    phase: 6
    applies: "yes"
    seed: [api]
    given: "A user with main address A and alias B; state S1."
    when: "Make B the main address through the REST API, then call ParticipantIdentity/changes with sinceState S1 and get both identities."
    then: "updated contains both ids. B now has isDefault true and A has isDefault false; at no point do two identities have isDefault true."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 3"
      - "rfc:draft-ietf-jmap-calendars-33 3.2"

  - id: PID-013
    title: "Report identities as updated when the user's name changes"
    method: "ParticipantIdentity/changes"
    spec: "draft-ietf-jmap-calendars-33 3.2"
    level: wd
    phase: 6
    applies: "yes"
    seed: [api]
    given: "A user named \"Alice\" with two addresses that have no names of their own; state S1."
    when: "Rename the user to \"Alice B\" through the REST API, then call ParticipantIdentity/changes with sinceState S1."
    then: "updated contains both identity ids and a get shows name \"Alice B\" on both."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 3.2"

  - id: PID-014
    title: "Answer cannotCalculateChanges for an unknown sinceState"
    method: "ParticipantIdentity/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user with at least one address."
    when: "Call ParticipantIdentity/changes with sinceState \"bogus-state\"."
    then: "The response is an error with type cannotCalculateChanges."
    sources:
      - "rfc:8620 5.2"

  - id: PID-015
    title: "Reject identity creation with forbidden"
    method: "ParticipantIdentity/set"
    spec: "draft-ietf-jmap-calendars-33 3.3"
    level: must
    phase: 6
    applies: "adapted"
    seed: [jmap]
    given: "A user with one address."
    when: "Call ParticipantIdentity/set with create {\"k1\": {\"name\": \"X\", \"calendarAddress\": \"mailto:alice@example.com\"}}, and again with a calendarAddress the user does not own."
    then: "Both calls return notCreated.k1 with type forbidden. created is null, newState equals oldState, and ParticipantIdentity/get is unchanged."
    sources:
      - "stalwart:calendar/identity.rs"
      - "cyrus:JMAPCalendars/participantidentity_set"
      - "cyrus:JMAPCalendars/calendar_user_address_set_other_user"
      - "rfc:draft-ietf-jmap-calendars-33 3.3"
    notes: "Stalwart and Cyrus allow creating identities and only reject addresses the user may not claim. WildDuck derives identities from addresses, which the draft allows, so every create is forbidden."

  - id: PID-016
    title: "Reject identity updates with forbidden"
    method: "ParticipantIdentity/set"
    spec: "draft-ietf-jmap-calendars-33 3.3"
    level: must
    phase: 6
    applies: "adapted"
    seed: [jmap]
    given: "A user with one address; its identity id is known."
    when: "Call ParticipantIdentity/set with update {id: {\"name\": \"New name\"}} and, in a second call, update {id: {\"calendarAddress\": \"mailto:other@example.net\"}}."
    then: "Each call returns notUpdated[id] with type forbidden and the identity is unchanged."
    sources:
      - "cyrus:JMAPCalendars/participantidentity_set"
      - "rfc:draft-ietf-jmap-calendars-33 3.3"

  - id: PID-017
    title: "Reject identity destruction with forbidden, and unknown ids with notFound"
    method: "ParticipantIdentity/set"
    spec: "draft-ietf-jmap-calendars-33 3.3"
    level: must
    phase: 6
    applies: "adapted"
    seed: [jmap]
    given: "A user with two addresses."
    when: "Call ParticipantIdentity/set with destroy [aliasIdentityId, \"Zunknown\"]."
    then: "notDestroyed[aliasIdentityId] has type forbidden and notDestroyed.Zunknown has type notFound. Both identities still exist."
    sources:
      - "stalwart:calendar/identity.rs"
      - "cyrus:JMAPCalendars/participantidentity_set"
      - "rfc:draft-ietf-jmap-calendars-33 3.3"

  - id: PID-018
    title: "Ignore onSuccessSetIsDefault without an error"
    method: "ParticipantIdentity/set"
    spec: "draft-ietf-jmap-calendars-33 3.3"
    level: must
    phase: 6
    applies: "adapted"
    seed: [jmap]
    given: "A user with main address A and alias B."
    when: "Call ParticipantIdentity/set with no create, update or destroy and onSuccessSetIsDefault set to B's identity id, then with an unknown id."
    then: "Both responses are ordinary ParticipantIdentity/set responses with no error, updated is null or empty, oldState equals newState, and A remains the only default."
    sources:
      - "stalwart:calendar/identity.rs"
      - "rfc:draft-ietf-jmap-calendars-33 3.3"
    notes: "The draft requires the server to ignore a default change it does not permit. The default follows the main address, which is changed through the REST API."

  - id: PID-019
    title: "Honour ifInState before evaluating the forbidden changes"
    method: "ParticipantIdentity/set"
    spec: "RFC 8620 5.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user with one address."
    when: "Call ParticipantIdentity/set with ifInState \"wrong\" and a create."
    then: "The response is an error with type stateMismatch, not a notCreated entry."
    sources:
      - "rfc:8620 5.3"

  - id: CAL-010
    title: "Create the default calendar lazily on first calendar access"
    method: "Calendar/get"
    spec: "draft-ietf-jmap-calendars-33 4.1"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user with JMAP enabled and no calendar data yet."
    when: "Call Calendar/get with ids null."
    then: "list holds exactly one calendar with isDefault true, a non-empty name, isSubscribed true, isVisible true and shareWith null. notFound is empty."
    sources:
      - "cyrus:JMAPCalendars/calendar_get_default"
      - "stalwart:calendar/calendars.rs"
      - "fastmail:t/Calendar/get/no-ids.t"
      - "wildduck:plan 10.2 Calendar"

  - id: CAL-011
    title: "Do not create calendar storage for users who never use calendars"
    method: "Calendar/get"
    spec: "draft-ietf-jmap-calendars-33 4.1"
    level: wd
    phase: 6
    applies: "yes"
    seed: [db]
    given: "A user who has only used mail methods over JMAP."
    when: "Inspect the calendars collection for the user, then call Calendar/get, then inspect again."
    then: "There is no calendar document before the first calendar method call and exactly one afterwards."
    sources:
      - "wildduck:plan 10.2 Calendar"

  - id: CAL-012
    title: "Create only one default calendar under concurrent first access"
    method: "Calendar/get"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user with JMAP enabled and no calendar data yet."
    when: "Send ten Calendar/get requests in parallel as the very first calendar calls of the user."
    then: "Every response lists the same single calendar id, and a later Calendar/get still returns exactly one calendar with isDefault true."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 4"
      - "wildduck:plan 10.2 Calendar"
    notes: "The draft forbids more than one default calendar per account, so lazy creation needs a unique constraint or an upsert."

  - id: CAL-013
    title: "Create the default calendar lazily from any calendar method, not only Calendar/get"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user with JMAP enabled and no calendar data yet."
    when: "As the very first calendar call of the user send CalendarEvent/query with an empty filter, then call Calendar/get."
    then: "The query answers with ids [] and no error. The following Calendar/get returns the single default calendar."
    sources:
      - "wildduck:plan 10.2 Calendar"

  - id: CAL-014
    title: "Return every Calendar property with the documented type"
    method: "Calendar/get"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar exists."
    when: "Call Calendar/get with ids null and properties null."
    then: "Each calendar has id, name, description, color, sortOrder, isSubscribed, isVisible, isDefault, includeInAvailability, defaultAlertsWithTime, defaultAlertsWithoutTime, timeZone, shareWith and myRights. The freshly created default calendar has description null, sortOrder 0, isVisible true, includeInAvailability \"all\", timeZone null and shareWith null."
    sources:
      - "cyrus:JMAPCalendars/calendar_get"
      - "fastmail:t/Calendar/get/an-entity.t"
      - "stalwart:calendar/calendars.rs"
      - "rfc:draft-ietf-jmap-calendars-33 4"

  - id: CAL-015
    title: "Report all eight rights as true in myRights"
    method: "Calendar/get"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: must
    phase: 6
    applies: "adapted"
    seed: [jmap]
    given: "A user with the default calendar and two more calendars, A and B."
    when: "Call Calendar/get with properties [\"myRights\"]."
    then: "For every calendar myRights has exactly the keys mayReadFreeBusy, mayReadItems, mayWriteAll, mayWriteOwn, mayUpdatePrivate, mayRSVP, mayShare and mayDelete, all true."
    sources:
      - "cyrus:JMAPCalendars/calendar_get"
      - "rfc:draft-ietf-jmap-calendars-33 4"
      - "wildduck:brief Contacts and calendars"
    notes: "Open question on two rights. mayShare true is misleading while sharing is not offered (CAL-006 rejects shareWith). mayDelete true on the default calendar differs from contacts, where the plan sets mayDelete false on the default address book. The brief says all true, so that is asserted here."

  - id: CAL-016
    title: "Fetch calendars by id and report unknown ids in notFound"
    method: "Calendar/get"
    spec: "RFC 8620 5.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user with the default calendar and two more calendars, A and B."
    when: "Call Calendar/get with ids [idA, \"Zmissing\"]."
    then: "list holds only calendar A, notFound is [\"Zmissing\"], and state is a non-empty string."
    sources:
      - "cyrus:JMAPCalendars/calendar_get"
      - "fastmail:t/Calendar/get/an-entity.t"
      - "rfc:8620 5.1"

  - id: CAL-017
    title: "Return only requested properties plus id"
    method: "Calendar/get"
    spec: "RFC 8620 5.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user with the default calendar and two more calendars, A and B."
    when: "Call Calendar/get with properties [\"name\", \"color\"]."
    then: "Each object has exactly id, name and color."
    sources:
      - "cyrus:JMAPCalendars/calendar_get"
      - "rfc:8620 5.1"

  - id: CAL-018
    title: "Reject an unknown property name with invalidArguments"
    method: "Calendar/get"
    spec: "RFC 8620 5.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar exists."
    when: "Call Calendar/get with properties [\"name\", \"noSuchProperty\"]."
    then: "The response is an error with type invalidArguments."
    sources:
      - "rfc:8620 5.1"

  - id: CAL-019
    title: "Enforce maxObjectsInGet"
    method: "Calendar/get"
    spec: "RFC 8620 5.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar exists."
    when: "Call Calendar/get with an ids array one longer than the maxObjectsInGet value from the core capability."
    then: "The response is an error with type requestTooLarge."
    sources:
      - "rfc:8620 5.1"

  - id: CAL-020
    title: "Use letter prefixed calendar ids that stay stable across rename"
    method: "Calendar/get"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user with the default calendar and two more calendars, A and B."
    when: "Rename calendar A with Calendar/set, then call Calendar/get."
    then: "Calendar A keeps its id. All ids consist of a letter followed by characters from A-Za-z0-9-_."
    sources:
      - "wildduck:brief Ids"

  - id: CAL-021
    title: "Create a calendar from a name alone and return the server set properties"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar exists."
    when: "Call Calendar/set with create {\"k1\": {\"name\": \"Work\"}}."
    then: "created.k1 contains id, isDefault false and myRights, plus every defaulted property the client did not send (at least sortOrder 0, isVisible true, isSubscribed true, includeInAvailability \"all\"). A following Calendar/get returns name \"Work\", description null, color null, timeZone null and shareWith null."
    sources:
      - "fastmail:t/Calendar/set/create.t"
      - "cyrus:JMAPCalendars/calendar_set"
      - "stalwart:calendar/calendars.rs"
      - "rfc:draft-ietf-jmap-calendars-33 4.3"
      - "rfc:8620 5.3"

  - id: CAL-022
    title: "Create a calendar with every settable property"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar exists."
    when: "Call Calendar/set creating {\"name\": \"Team\", \"description\": \"Shared plans\", \"color\": \"#1a2b3c\", \"sortOrder\": 7, \"isSubscribed\": true, \"isVisible\": false, \"includeInAvailability\": \"attending\", \"timeZone\": \"Europe/Tallinn\", \"defaultAlertsWithTime\": {\"a1\": {\"@type\": \"Alert\", \"trigger\": {\"@type\": \"OffsetTrigger\", \"offset\": \"-PT15M\"}}}, \"defaultAlertsWithoutTime\": null}."
    then: "The calendar is created and Calendar/get returns every value exactly as sent."
    sources:
      - "cyrus:JMAPCalendars/calendar_set"
      - "cyrus:JMAPCalendars/calendar_set_extendedprops"
      - "stalwart:calendar/calendars.rs"
      - "fastmail:t/Calendar/set/create.t"
      - "rfc:draft-ietf-jmap-calendars-33 4"

  - id: CAL-023
    title: "Require a name on create"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar exists."
    when: "Call Calendar/set with create {\"k1\": {\"color\": \"red\"}}."
    then: "notCreated.k1 has type invalidProperties and properties [\"name\"]."
    sources:
      - "fastmail:t/Calendar/set/create.t"
      - "cyrus:JMAPCalendars/calendar_set_error"
      - "rfc:draft-ietf-jmap-calendars-33 4"

  - id: CAL-024
    title: "Reject an empty calendar name"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar exists."
    when: "Call Calendar/set creating {\"name\": \"\"}, and update an existing calendar with {\"name\": \"\"}."
    then: "The create fails with invalidProperties and properties [\"name\"]. The update lands in notUpdated with the same error and the old name is kept."
    sources:
      - "cyrus:JMAPCalendars/calendar_set_error"
      - "rfc:draft-ietf-jmap-calendars-33 4"

  - id: CAL-025
    title: "Limit the calendar name to 255 octets of UTF-8"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar exists."
    when: "Create one calendar whose name is 85 three-byte characters (255 octets) and one whose name is 256 ASCII characters."
    then: "The first is created and reads back unchanged. The second fails with invalidProperties and properties [\"name\"]."
    sources:
      - "cyrus:JMAPCalendars/calendar_set_badname"
      - "rfc:draft-ietf-jmap-calendars-33 4"
    notes: "The limit counts octets, not characters. The Cyrus test uses 256 bytes as the allowed maximum; the draft says the name must not be greater than 255 octets."

  - id: CAL-026
    title: "Allow two calendars with the same name"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar exists."
    when: "Create two calendars both named \"Work\" in separate requests."
    then: "Both are created with different ids."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 4"
    notes: "The draft has no uniqueness rule for names; calendars are identified by id only."

  - id: CAL-027
    title: "Accept CSS colour names case insensitively and hexadecimal RGB values"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar exists."
    when: "Create calendars with color \"SteelBlue\", \"steelblue\", \"#01aafF\" and \"#0af\"."
    then: "All four are created. Calendar/get returns each value as it was sent."
    sources:
      - "cyrus:JMAPCalendars/calendar_set_color"
      - "fastmail:t/Calendar/set/create.t"
      - "fastmail:t/Calendar/set/update.t"
      - "rfc:draft-ietf-jmap-calendars-33 4"
    notes: "CSS Color Level 3 section 4.2.1 defines both three and six digit hexadecimal notation. The Cyrus test rejects the three digit form; the draft text allows it."

  - id: CAL-028
    title: "Reject invalid colour values"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A calendar with color \"#01aaff\"."
    when: "Update the calendar with color \"foo\", then \"#foofoo\", then \"#01aAfFF\" (seven digits), then \"#01aaff80\" (eight digits), then [\"steelblue\"]."
    then: "Every update is rejected in notUpdated with type invalidProperties and properties [\"color\"], and the color is still \"#01aaff\"."
    sources:
      - "cyrus:JMAPCalendars/calendar_set_color"
      - "rfc:draft-ietf-jmap-calendars-33 4"

  - id: CAL-029
    title: "Accept null as the calendar colour"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A calendar with color \"red\"."
    when: "Update the calendar with {\"color\": null}."
    then: "The update succeeds and Calendar/get returns color null."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 4"

  - id: CAL-030
    title: "Validate the sortOrder range"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar exists."
    when: "Create calendars with sortOrder 0, 2147483647, -1, 2147483648, 1.5 and \"3\"."
    then: "The first two are created. The other four fail with invalidProperties and properties [\"sortOrder\"]."
    sources:
      - "cyrus:JMAPCalendars/calendar_set"
      - "cyrus:JMAPCalendars/calendar_set_shared_sort_order"
      - "rfc:draft-ietf-jmap-calendars-33 4"

  - id: CAL-031
    title: "Store isSubscribed and isVisible as independent booleans"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar exists."
    when: "Create a calendar with isSubscribed false and isVisible true, then update it to isSubscribed true and isVisible false."
    then: "Calendar/get returns the values as set after each step. A non-boolean value for either property is rejected with invalidProperties."
    sources:
      - "cyrus:JMAPCalendars/calendar_set_issubscribed"
      - "cyrus:JMAPCalendars/calendar_get_autosub"
      - "cyrus:JMAPCalendars/calendar_set_autosub"
      - "rfc:draft-ietf-jmap-calendars-33 4"
      - "rfc:draft-ietf-jmap-calendars-33 4.3"
    notes: "The user may unsubscribe from their own calendar; alerts then stop firing (see CALR). The Cyrus test calendar_set_issubscribed_fail forbids unsubscribing from an owned calendar, which the draft does not require."

  - id: CAL-032
    title: "Validate includeInAvailability"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar exists."
    when: "Create calendars with includeInAvailability \"all\", \"attending\", \"none\" and \"sometimes\"."
    then: "The first three are created and read back as set. The fourth fails with invalidProperties and properties [\"includeInAvailability\"]."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 4"
    notes: "The value is stored but has no effect, since availability is not offered."

  - id: CAL-033
    title: "Accept only IANA time zone ids for the calendar timeZone"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar exists."
    when: "Create calendars with timeZone \"Australia/Melbourne\", \"Etc/UTC\", null, \"Mars/Olympus_Mons\", \"+02:00\" and \"EET-2EEST\"."
    then: "The first three are created and read back as set. The last three fail with invalidProperties and properties [\"timeZone\"]."
    sources:
      - "stalwart:calendar/calendars.rs"
      - "rfc:draft-ietf-jmap-calendars-33 4"

  - id: CAL-034
    title: "Default both default alert sets to null when omitted on create"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "The default calendar has defaultAlertsWithTime set to one alert."
    when: "Create a calendar with only a name."
    then: "The new calendar has defaultAlertsWithTime null and defaultAlertsWithoutTime null; the alerts of the default calendar are not copied."
    sources:
      - "cyrus:JMAPCalendars/calendar_set_inherit_defaultalerts"
      - "cyrus:JMAPCalendars/calendar_copy_defaultalerts_mkcalendar"
      - "rfc:draft-ietf-jmap-calendars-33 4"
    notes: "The draft leaves the default to the server. Cyrus copies the alerts of the default calendar; WildDuck picks null so the result does not depend on other calendars."

  - id: CAL-035
    title: "Store default alerts for timed and all day events separately"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Calendar A without default alerts."
    when: "Update A with defaultAlertsWithTime {\"t1\": display alert, OffsetTrigger offset \"-PT10M\" relativeTo \"start\"} and defaultAlertsWithoutTime {\"d1\": display alert, OffsetTrigger offset \"PT9H\"}."
    then: "Calendar/get returns both maps with the alert ids t1 and d1 and the triggers as sent. Setting one of them to null afterwards leaves the other untouched."
    sources:
      - "cyrus:JMAPCalendars/calendar_set_defaultalerts"
      - "rfc:draft-ietf-jmap-calendars-33 4"
      - "rfc:8984 4.5.2"

  - id: CAL-036
    title: "Reject an AbsoluteTrigger in default alerts"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Calendar A."
    when: "Update A with defaultAlertsWithTime {\"x\": {\"@type\": \"Alert\", \"trigger\": {\"@type\": \"AbsoluteTrigger\", \"when\": \"2030-01-01T00:00:00Z\"}}}; repeat for defaultAlertsWithoutTime."
    then: "Both updates are rejected with invalidProperties naming the offending property, and the stored default alerts are unchanged."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 4"

  - id: CAL-037
    title: "Require default alert ids to be unique across the whole account"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Calendar A has defaultAlertsWithTime {\"dup\": ...}."
    when: "Update calendar B with defaultAlertsWithoutTime {\"dup\": ...}; then update A itself with defaultAlertsWithoutTime {\"dup\": ...}."
    then: "Both updates are rejected with invalidProperties naming defaultAlertsWithoutTime. Using a different alert id succeeds."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 4"
    notes: "Uniqueness matters because an acknowledged default alert is stored on the event under the same id (draft 6.1)."

  - id: CAL-038
    title: "Patch a single default alert by path"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4 and RFC 8620 5.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Calendar A has defaultAlertsWithTime {\"t1\": offset \"-PT10M\", \"t2\": offset \"-PT1H\"}."
    when: "Update A with {\"defaultAlertsWithTime/t1/trigger/offset\": \"-PT5M\", \"defaultAlertsWithTime/t2\": null}."
    then: "Calendar/get shows only t1, now with offset \"-PT5M\"."
    sources:
      - "cyrus:JMAPCalendars/calendar_set_defaultalerts"
      - "rfc:8620 5.3"

  - id: CAL-039
    title: "Reject client supplied server set properties on create"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4 and RFC 8620 5.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar exists."
    when: "Create calendars with {\"name\": \"X\", \"isDefault\": true}, {\"name\": \"X\", \"id\": \"Cmine\"} and {\"name\": \"X\", \"myRights\": {\"mayDelete\": false}}."
    then: "Each create fails with invalidProperties naming isDefault, id and myRights respectively."
    sources:
      - "cyrus:JMAPCalendars/calendar_set_error"
      - "cyrus:JMAPCalendars/calendar_set_unknown_calendarright"
      - "rfc:draft-ietf-jmap-calendars-33 4"
      - "rfc:8620 5.3"
    notes: "RFC 8620 5.3 allows a server set property in a create only if it equals the value the server would set. isDefault false and a myRights object equal to the all true default are therefore accepted."

  - id: CAL-040
    title: "Reject unknown Calendar properties"
    method: "Calendar/set"
    spec: "RFC 8620 5.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar exists."
    when: "Create a calendar with {\"name\": \"X\", \"flavour\": \"mint\"}."
    then: "notCreated has type invalidProperties and properties [\"flavour\"]."
    sources:
      - "cyrus:JMAPCalendars/calendar_set_error"
      - "rfc:8620 5.3"

  - id: CAL-041
    title: "Resolve a calendar creation id in a later CalendarEvent/set of the same request"
    method: "Calendar/set"
    spec: "RFC 8620 5.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar exists."
    when: "Send one request with Calendar/set create {\"cal1\": {\"name\": \"New\"}} followed by CalendarEvent/set create with calendarIds {\"#cal1\": true}."
    then: "Both creates succeed and CalendarEvent/get shows the event in the new calendar's real id."
    sources:
      - "cyrus:JMAPCalendars/misc_creationids"
      - "rfc:8620 5.3"
      - "rfc:8620 3.3"

  - id: CAL-042
    title: "Change the default calendar with onSuccessSetIsDefault and report both calendars as updated"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Default calendar D and a second calendar A."
    when: "Call Calendar/set with no create, update or destroy and onSuccessSetIsDefault idA."
    then: "updated is {idA: {\"isDefault\": true}, idD: {\"isDefault\": false}} (server set values included). Calendar/get shows A as the only default and newState differs from oldState."
    sources:
      - "cyrus:JMAPCalendars/calendar_set_isdefault"
      - "stalwart:calendar/calendars.rs"
      - "rfc:draft-ietf-jmap-calendars-33 4.3"
      - "rfc:draft-ietf-jmap-calendars-33 8.4"

  - id: CAL-043
    title: "Make a calendar created in the same call the default through a creation reference"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Default calendar D."
    when: "Call Calendar/set with create {\"k1\": {\"name\": \"Main\"}} and onSuccessSetIsDefault \"#k1\"."
    then: "created.k1.isDefault is true, updated[idD] reports isDefault false, and Calendar/get confirms a single default."
    sources:
      - "cyrus:JMAPCalendars/calendar_set_isdefault_with_creationid"
      - "cyrus:JMAPCalendars/calendar_set_isdefault_no_existing"
      - "rfc:draft-ietf-jmap-calendars-33 4.3"

  - id: CAL-044
    title: "Ignore onSuccessSetIsDefault for an unknown id without an error"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Default calendar D and calendar A."
    when: "Call Calendar/set with update {idA: {\"name\": \"Renamed\"}} and onSuccessSetIsDefault \"Znope\"."
    then: "The rename succeeds, there is no error and no notUpdated entry for Znope, and D is still the default."
    sources:
      - "cyrus:JMAPCalendars/calendar_set_isdefault"
      - "rfc:draft-ietf-jmap-calendars-33 4.3"

  - id: CAL-045
    title: "Skip onSuccessSetIsDefault when any change in the call failed"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Default calendar D and calendar A."
    when: "Call Calendar/set with create {\"bad\": {\"name\": \"\"}} and onSuccessSetIsDefault idA."
    then: "notCreated.bad is reported, updated is null or empty, and D is still the default."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 4.3"

  - id: CAL-046
    title: "Report each id at most once when an update and the default change touch the same calendar"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Default calendar D and calendar A."
    when: "Call Calendar/set with update {idA: {\"color\": \"red\"}} and onSuccessSetIsDefault idA."
    then: "idA appears once in updated (with isDefault true among the server set values) and not in notUpdated. idD appears in updated with isDefault false."
    sources:
      - "cyrus:JMAPCalendars/calendar_set_isdefault_reports_id_once"
      - "rfc:draft-ietf-jmap-calendars-33 4.3"

  - id: CAL-047
    title: "Treat onSuccessSetIsDefault naming the current default as a no-op"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4.3"
    level: should
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Default calendar D."
    when: "Call Calendar/set with only onSuccessSetIsDefault idD."
    then: "No error. updated is null or empty and newState equals oldState."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 4.3"

  - id: CAL-048
    title: "Reject a direct update of isDefault"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Default calendar D and calendar A."
    when: "Call Calendar/set with update {idA: {\"isDefault\": true}}."
    then: "notUpdated[idA] has type invalidProperties and properties [\"isDefault\"]; D stays the default."
    sources:
      - "cyrus:JMAPCalendars/calendar_set_isdefault"
      - "rfc:draft-ietf-jmap-calendars-33 4"

  - id: CAL-049
    title: "Keep the chosen default across unrelated changes and restarts"
    method: "Calendar/get"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Calendar A was made the default with onSuccessSetIsDefault."
    when: "Create another calendar, rename A, restart the JMAP worker, then call Calendar/get."
    then: "A is still the only calendar with isDefault true."
    sources:
      - "cyrus:JMAPCalendars/calendar_get_isdefault_persists"
      - "rfc:draft-ietf-jmap-calendars-33 4"

  - id: CAL-050
    title: "Rename a calendar"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user with the default calendar and two more calendars, A and B."
    when: "Call Calendar/set with update {idA: {\"name\": \"Renamed\"}}."
    then: "updated[idA] is null (or an object without client sent properties), Calendar/get returns the new name, and newState differs from oldState."
    sources:
      - "fastmail:t/Calendar/set/update.t"
      - "cyrus:JMAPCalendars/calendar_set"
      - "cyrus:JMAPCalendars/calendar_set_state"
      - "stalwart:calendar/calendars.rs"
      - "rfc:draft-ietf-jmap-calendars-33 4.3"

  - id: CAL-051
    title: "Update description, color, sortOrder, isVisible, timeZone and includeInAvailability in one patch"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user with the default calendar and two more calendars, A and B."
    when: "Call Calendar/set updating A with all six properties set to new valid values."
    then: "Calendar/get returns all six new values; properties not in the patch (name, default alerts) are unchanged."
    sources:
      - "cyrus:JMAPCalendars/calendar_set"
      - "fastmail:t/Calendar/set/update.t"
      - "stalwart:calendar/calendars.rs"
      - "rfc:draft-ietf-jmap-calendars-33 4.3"

  - id: CAL-052
    title: "Report notFound for an update of an unknown calendar"
    method: "Calendar/set"
    spec: "RFC 8620 5.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar exists."
    when: "Call Calendar/set with update {\"Zmissing\": {\"name\": \"X\"}}."
    then: "notUpdated.Zmissing has type notFound."
    sources:
      - "fastmail:t/Calendar/set/update.t"
      - "cyrus:JMAPCalendars/calendar_set_error"
      - "rfc:8620 5.3"

  - id: CAL-053
    title: "Apply a calendar update atomically"
    method: "Calendar/set"
    spec: "RFC 8620 5.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Calendar A named \"A\" with color null."
    when: "Call Calendar/set with update {idA: {\"name\": \"Valid\", \"color\": \"nocolour\"}}."
    then: "notUpdated[idA] has type invalidProperties with properties [\"color\"], and the name is still \"A\"."
    sources:
      - "rfc:8620 5.3"

  - id: CAL-054
    title: "Reject a patch whose path does not resolve"
    method: "Calendar/set"
    spec: "RFC 8620 5.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Calendar A with defaultAlertsWithTime null."
    when: "Call Calendar/set with update {idA: {\"defaultAlertsWithTime/x/trigger/offset\": \"-PT5M\"}}."
    then: "notUpdated[idA] has type invalidPatch."
    sources:
      - "rfc:8620 5.3"

  - id: CAL-055
    title: "Honour ifInState on Calendar/set"
    method: "Calendar/set"
    spec: "RFC 8620 5.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user with the default calendar and two more calendars, A and B."
    when: "Call Calendar/set with ifInState set to a stale state and an update; then repeat with the current state."
    then: "The first call is an error with type stateMismatch and nothing changes. The second succeeds and oldState equals the supplied state."
    sources:
      - "cyrus:JMAPCalendars/calendar_set_state"
      - "rfc:8620 5.3"

  - id: CAL-056
    title: "Enforce maxObjectsInSet on Calendar/set"
    method: "Calendar/set"
    spec: "RFC 8620 5.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar exists."
    when: "Call Calendar/set with one more create than the maxObjectsInSet value of the core capability."
    then: "The response is an error with type requestTooLarge and no calendar is created."
    sources:
      - "rfc:8620 5.3"

  - id: CAL-057
    title: "Allow renaming and recolouring the default calendar"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Only the default calendar exists."
    when: "Update the default calendar with a new name, color and sortOrder."
    then: "The update succeeds; the calendar keeps its id and isDefault true."
    sources:
      - "stalwart:calendar/calendars.rs"
      - "rfc:draft-ietf-jmap-calendars-33 4"

  - id: CAL-058
    title: "Destroy an empty calendar"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Calendar A without events."
    when: "Call Calendar/set with destroy [idA], then Calendar/get with ids [idA]."
    then: "destroyed is [idA], the get reports idA in notFound, and newState differs from oldState."
    sources:
      - "fastmail:t/Calendar/set/destroy.t"
      - "cyrus:JMAPCalendars/calendar_set"
      - "stalwart:calendar/calendars.rs"
      - "rfc:draft-ietf-jmap-calendars-33 4.3"

  - id: CAL-059
    title: "Refuse to destroy a calendar that has events unless onDestroyRemoveEvents is true"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Calendar A contains one event."
    when: "Call Calendar/set with destroy [idA], with onDestroyRemoveEvents omitted and then explicitly false."
    then: "Both calls return notDestroyed[idA] with type calendarHasEvent. The calendar and the event still exist."
    sources:
      - "fastmail:t/Calendar/set/destroy.t"
      - "cyrus:JMAPCalendars/calendar_set_destroy_events"
      - "stalwart:calendar/calendars.rs"
      - "rfc:draft-ietf-jmap-calendars-33 4.3"

  - id: CAL-060
    title: "Destroy a calendar together with its events when onDestroyRemoveEvents is true"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Calendar A contains two events that are in no other calendar; CalendarEvent state S1."
    when: "Call Calendar/set with destroy [idA] and onDestroyRemoveEvents true, then CalendarEvent/get for both ids and CalendarEvent/changes since S1."
    then: "destroyed is [idA]. Both event ids are in notFound and both are listed in destroyed by CalendarEvent/changes."
    sources:
      - "fastmail:t/Calendar/set/destroy.t"
      - "cyrus:JMAPCalendars/calendar_set_destroy_events"
      - "stalwart:calendar/calendars.rs"
      - "rfc:draft-ietf-jmap-calendars-33 4.3"

  - id: CAL-061
    title: "Keep an event that is also in another calendar when its calendar is destroyed"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event with calendarIds {idA: true, idB: true}; CalendarEvent state S1."
    when: "Call Calendar/set with destroy [idA] and onDestroyRemoveEvents true."
    then: "The event still exists with calendarIds {idB: true} and is listed in updated by CalendarEvent/changes since S1."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 4.3"
    notes: "Only reachable when maxCalendarsPerEvent is above 1. If WildDuck settles on maxCalendarsPerEvent 1 this scenario becomes applies no."

  - id: CAL-062
    title: "Count an event shared with another calendar as content for calendarHasEvent"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event with calendarIds {idA: true, idB: true}."
    when: "Call Calendar/set with destroy [idA] without onDestroyRemoveEvents."
    then: "notDestroyed[idA] has type calendarHasEvent."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 4.3"

  - id: CAL-063
    title: "Count draft events as content for calendarHasEvent"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Calendar A contains only an event with isDraft true."
    when: "Call Calendar/set with destroy [idA]."
    then: "notDestroyed[idA] has type calendarHasEvent."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 4.3"
      - "rfc:draft-ietf-jmap-calendars-33 5"

  - id: CAL-064
    title: "Report notFound when destroying an unknown calendar"
    method: "Calendar/set"
    spec: "RFC 8620 5.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar exists."
    when: "Call Calendar/set with destroy [\"Zmissing\"]."
    then: "notDestroyed.Zmissing has type notFound."
    sources:
      - "fastmail:t/Calendar/set/destroy.t"
      - "cyrus:JMAPCalendars/calendar_set_error"
      - "rfc:8620 5.3"

  - id: CAL-065
    title: "Recreate a default calendar after the default one is destroyed"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4.3"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Only the default calendar D exists and it is empty."
    when: "Call Calendar/set with destroy [idD], then Calendar/get with ids null."
    then: "The destroy succeeds. The following get lazily creates and returns a new default calendar with a different id; Calendar/changes reports idD destroyed and the new id created."
    sources:
      - "cyrus:JMAPCalendars/calendar_set_destroyspecials"
      - "rfc:draft-ietf-jmap-calendars-33 4"
      - "wildduck:plan 10.2 Calendar"
    notes: "Open question. The alternative is mayDelete false on the default calendar, as the plan does for the default address book; then this destroy answers forbidden. When other calendars remain, the server should promote one of them (lowest sortOrder, then oldest) instead of creating a new one, so that exactly one default exists."

  - id: CAL-066
    title: "Promote another calendar when the default calendar is destroyed and others remain"
    method: "Calendar/set"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Default calendar D (empty) and calendars A (sortOrder 1) and B (sortOrder 2)."
    when: "Call Calendar/set with destroy [idD]."
    then: "destroyed is [idD] and updated reports idA with isDefault true. Calendar/get shows exactly one default."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 4"
    notes: "Depends on the decision recorded in the previous scenario."

  - id: CAL-067
    title: "Process create, update and destroy of one Calendar/set call independently"
    method: "Calendar/set"
    spec: "RFC 8620 5.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user with the default calendar and two more calendars, A and B."
    when: "Call Calendar/set with a valid create, an update of A with an invalid color, and a destroy of B (empty)."
    then: "created has the new calendar, notUpdated[idA] is invalidProperties, destroyed is [idB]. newState reflects the two successful changes."
    sources:
      - "cyrus:JMAPCalendars/calendar_set_error"
      - "rfc:8620 5.3"

  - id: CAL-068
    title: "Return the same state and empty lists when no calendar changed"
    method: "Calendar/changes"
    spec: "draft-ietf-jmap-calendars-33 4.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "State S1 from Calendar/get."
    when: "Call Calendar/changes with sinceState S1."
    then: "oldState and newState equal S1, hasMoreChanges is false, created, updated and destroyed are empty."
    sources:
      - "fastmail:t/Calendar/changes/basic.t"
      - "cyrus:JMAPCalendars/calendar_changes"
      - "stalwart:calendar/calendars.rs"
      - "rfc:draft-ietf-jmap-calendars-33 4.2"

  - id: CAL-069
    title: "Report created, updated and destroyed calendars"
    method: "Calendar/changes"
    spec: "draft-ietf-jmap-calendars-33 4.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Calendars A and B; state S1."
    when: "Create calendar C, rename A and destroy B, then call Calendar/changes with sinceState S1."
    then: "created is [idC], updated is [idA], destroyed is [idB], and newState equals the state returned by a fresh Calendar/get."
    sources:
      - "fastmail:t/Calendar/changes/basic.t"
      - "cyrus:JMAPCalendars/calendar_changes"
      - "cyrus:JMAPCalendars/calendar_changes_rename"
      - "stalwart:calendar/calendars.rs"
      - "rfc:draft-ietf-jmap-calendars-33 4.2"

  - id: CAL-070
    title: "Do not report a calendar that was created and destroyed between the two states"
    method: "Calendar/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "State S1."
    when: "Create calendar T and destroy it again, then call Calendar/changes with sinceState S1."
    then: "idT appears in none of created, updated or destroyed, and newState differs from S1."
    sources:
      - "rfc:8620 5.2"

  - id: CAL-071
    title: "Page calendar changes with maxChanges"
    method: "Calendar/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "State S1, then five calendars are created."
    when: "Call Calendar/changes with sinceState S1 and maxChanges 2, and keep calling with the returned newState until hasMoreChanges is false."
    then: "Each response lists at most two ids, intermediate responses have hasMoreChanges true, and the union of created over all pages is the five new ids with no duplicates."
    sources:
      - "cyrus:JMAPCalendars/calendar_changes_maxchanges"
      - "rfc:8620 5.2"

  - id: CAL-072
    title: "Answer cannotCalculateChanges for an unknown sinceState"
    method: "Calendar/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar exists."
    when: "Call Calendar/changes with sinceState \"nonsense\"."
    then: "The response is an error with type cannotCalculateChanges."
    sources:
      - "cyrus:JMAPCalendars/calendar_changes"
      - "rfc:8620 5.2"

  - id: CAL-073
    title: "Keep calendar tombstones for at least 30 days"
    method: "Calendar/changes"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "State S1, then calendar A is destroyed."
    when: "Advance the clock by 29 days and call Calendar/changes with sinceState S1; advance past the configured retention and call again."
    then: "The first call lists idA in destroyed. The second call either still answers correctly or returns cannotCalculateChanges; it never returns an empty change set."
    sources:
      - "wildduck:plan 10.3 owned change log"

  - id: CAL-074
    title: "Report both calendars as updated after a default change"
    method: "Calendar/changes"
    spec: "draft-ietf-jmap-calendars-33 4.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Default calendar D and calendar A; state S1."
    when: "Change the default to A with onSuccessSetIsDefault, then call Calendar/changes with sinceState S1."
    then: "updated contains idA and idD."
    sources:
      - "cyrus:JMAPCalendars/calendar_set_isdefault"
      - "rfc:draft-ietf-jmap-calendars-33 4.3"

  - id: CAL-075
    title: "Leave the Calendar state untouched when only events change"
    method: "Calendar/changes"
    spec: "draft-ietf-jmap-calendars-33 4.2"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Calendar state S1."
    when: "Create, update and destroy an event in the default calendar, then call Calendar/changes with sinceState S1."
    then: "newState equals S1 and all lists are empty. Calendar objects carry no event counts, so event writes are not calendar changes."
    sources:
      - "cyrus:JMAPCalendars/calendar_changes"
      - "wildduck:plan 10.3 owned change log"

  - id: CAL-076
    title: "Leave the CalendarEvent state untouched when only calendar properties change"
    method: "CalendarEvent/changes"
    spec: "draft-ietf-jmap-calendars-33 4.2"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "CalendarEvent state E1; calendar A holds events."
    when: "Rename A and change its color, then call CalendarEvent/changes with sinceState E1."
    then: "newState equals E1 and all lists are empty."
    sources:
      - "wildduck:plan 10.3 owned change log"
    notes: "The state string is the highest sequence of the type, so each type needs its own sequence or its own high water mark. Changing default alerts of a calendar is covered separately in CALR."

  - id: CAL-077
    title: "Push a StateChange for Calendar when a calendar is written"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An EventSource connection with types=Calendar is open."
    when: "Create a calendar through Calendar/set on another connection."
    then: "A state event arrives whose changed[accountId].Calendar equals the newState of the set response. No CalendarEvent key is included."
    sources:
      - "rfc:8620 7.1"
      - "rfc:8620 7.3"
      - "rfc:draft-ietf-jmap-calendars-33 10.4"
      - "wildduck:plan 10.3 push"

  - id: CEV-001
    title: "Create a minimal event and return the server set properties"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Call CalendarEvent/set with create {\"k1\": {\"calendarIds\": {C1: true}, \"title\": \"Lunch\", \"start\": \"2026-03-10T12:00:00\", \"timeZone\": \"Europe/Tallinn\", \"duration\": \"PT1H\"}}."
    then: "created.k1 contains id, \"@type\" \"Event\", version \"2.0\", a generated uid, created and updated (equal UTCDateTime values close to now), isOrigin true, and the defaulted isDraft false and useDefaultAlerts false. newState differs from oldState."
    sources:
      - "fastmail:t/CalendarEvent/set/create.t"
      - "cyrus:JMAPCalendars/calendarevent_set_simple"
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"
      - "rfc:draft-ietf-jmap-calendars-33 8.2"

  - id: CEV-002
    title: "Return the stored JSCalendar properties plus the mandatory JMAP properties by default"
    method: "CalendarEvent/get"
    spec: "draft-ietf-jmap-calendars-33 5.7"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event E1 in the default calendar: title \"Lunch\", start \"2026-03-10T12:00:00\", timeZone \"Europe/Tallinn\", duration \"PT1H\"."
    when: "Call CalendarEvent/get with ids [E1] and properties null."
    then: "The object has \"@type\", uid, version, created, updated, title, start, timeZone, duration and also id, calendarIds {C1: true}, isOrigin, isDraft and useDefaultAlerts. It does not contain utcStart, utcEnd, iCalendar or baseEventId, and it has no method property."
    sources:
      - "fastmail:t/CalendarEvent/get/basic.t"
      - "cyrus:JMAPCalendars/calendarevent_get_simple"
      - "cyrus:JMAPCalendars/calendarevent_get_properties"
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.7"

  - id: CEV-003
    title: "Return only requested properties plus id, and report unknown ids in notFound"
    method: "CalendarEvent/get"
    spec: "RFC 8620 5.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event E1 in the default calendar: title \"Lunch\", start \"2026-03-10T12:00:00\", timeZone \"Europe/Tallinn\", duration \"PT1H\"."
    when: "Call CalendarEvent/get with ids [E1, \"Zmissing\"] and properties [\"title\", \"start\"]."
    then: "list has one object with exactly id, title and start. notFound is [\"Zmissing\"]. state is a non-empty string."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_get_properties"
      - "stalwart:calendar/event.rs"
      - "rfc:8620 5.1"

  - id: CEV-004
    title: "Return all events for ids null up to maxObjectsInGet, otherwise requestTooLarge"
    method: "CalendarEvent/get"
    spec: "RFC 8620 5.1"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Three events in two calendars."
    when: "Call CalendarEvent/get with ids null. Repeat for an account holding more events than maxObjectsInGet."
    then: "The first call lists all three events. The second answers with error type requestTooLarge; clients are expected to use CalendarEvent/query."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_get_simple"
      - "rfc:8620 5.1"
    notes: "The draft says ids may be null for Calendar and ParticipantIdentity only. Cyrus accepts null for events as well."

  - id: CEV-005
    title: "Reject a JSCalendar type other than Event"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.1.1 and draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with \"@type\": \"Task\", and one with \"@type\": \"Group\"."
    then: "Both creates fail with invalidProperties and properties [\"@type\"]. Tasks are outside the calendars data model."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_type"
      - "rfc:draft-ietf-jmap-calendars-33 1"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-006
    title: "Set version when omitted and reject versions the server does not implement"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create one event without version, one with version \"2.0\" and one with version \"9.0\"."
    then: "The first two are created and read back with version \"2.0\". The third fails with invalidProperties and properties [\"version\"]."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 5.9"
    notes: "Version 2.0 is the JSCalendar bis format. Open question: whether an RFC 8984 object (version 1.0, recurrenceRules array, replyTo, sendTo) is upgraded on input or rejected. Rejecting is assumed."

  - id: CEV-007
    title: "Require start on create"
    method: "CalendarEvent/set"
    spec: "RFC 8984 5.1.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with calendarIds and title but no start."
    then: "notCreated has type invalidProperties and properties [\"start\"]."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_get_no_dtstart"
      - "rfc:8984 5.1.1"

  - id: CEV-008
    title: "Allow an event without a title"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.2.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with only calendarIds and start \"2026-03-10T12:00:00\"."
    then: "The event is created. CalendarEvent/get returns no title or an empty title, duration is absent or \"PT0S\", and timeZone is absent or null (floating)."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_notitle"
      - "rfc:8984 4.2.1"
      - "rfc:8984 5.1.2"

  - id: CEV-009
    title: "Require at least one calendar id on create"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create events with calendarIds omitted, calendarIds {} and calendarIds null."
    then: "Each create fails with invalidProperties and properties [\"calendarIds\"]."
    sources:
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5"

  - id: CEV-010
    title: "Reject unknown calendar ids and false values in calendarIds"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create events with calendarIds {\"Znope\": true} and with calendarIds {C1: false}."
    then: "Both fail with invalidProperties and properties [\"calendarIds\"]. No event is stored."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_move"
      - "cyrus:JMAPCalendars/calendarevent_query_deleted_calendar"
      - "rfc:draft-ietf-jmap-calendars-33 5"

  - id: CEV-011
    title: "Enforce maxCalendarsPerEvent"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 1.5.1 and draft-ietf-jmap-calendars-33 5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "The account capability reports maxCalendarsPerEvent N (not null) and the user has N+1 calendars."
    when: "Create an event with N calendar ids, then one with N+1 calendar ids."
    then: "The first is created and CalendarEvent/get returns all N ids. The second fails with invalidProperties and properties [\"calendarIds\"]."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 1.5.1"
      - "rfc:draft-ietf-jmap-calendars-33 5"
    notes: "Open question: the value of N. The planned storage keeps an array of calendar ids, so N above 1 or null is possible. If N is null this scenario is replaced by one creating an event in every calendar of the account."

  - id: CEV-012
    title: "Generate a globally unique uid when omitted and keep a client supplied uid"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create two events without uid and one with uid \"5d5776f6-ff8e-4bfd-ab3e-fe2fe5d4fa91\"."
    then: "The first two get different non-empty uids returned in created. The third reads back with exactly the supplied uid and created does not echo it."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_uid"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"
      - "rfc:draft-ietf-jmap-calendars-33 1.4.1"

  - id: CEV-013
    title: "Keep the event id independent of the uid"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 1.4.1"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with uid \"weird uid/with spaces@example.com\", destroy it, and create another event with the same uid."
    then: "Both creates succeed. Each id is a letter followed by characters from A-Za-z0-9-_, the uid is stored verbatim, and the second event has a different id from the first."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_uid"
      - "cyrus:JMAPCalendars/calendarevent_changes_recreate_uid"
      - "rfc:draft-ietf-jmap-calendars-33 1.4.1"
      - "wildduck:brief Ids"
    notes: "Cyrus derives the id from the uid, which is why its recreate test expects cannotCalculateChanges. WildDuck ids are not content derived."

  - id: CEV-014
    title: "Reject a second event with the same uid and no recurrenceId"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 1.4.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event with uid \"u-1\" exists in calendar C1."
    when: "Create another event with uid \"u-1\" in C1, and another with uid \"u-1\" in a different calendar C2."
    then: "Both creates fail with invalidProperties and properties [\"uid\"]. The original event is unchanged."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_reject_duplicate_uid"
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 1.4.1"
    notes: "Backed by the unique index on {user, uid, recurrenceId}. Uniqueness is per account, not per calendar."

  - id: CEV-015
    title: "Reject two creates with the same uid inside one request"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 1.4.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Call CalendarEvent/set with two creates that both carry uid \"u-2\" and no recurrenceId."
    then: "At most one of them is created; the other is in notCreated with invalidProperties and properties [\"uid\"]."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 1.4.1"

  - id: CEV-016
    title: "Reject changing the uid of an existing event"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 1.4.1"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event E1 with uid \"u-1\"."
    when: "Update E1 with {\"uid\": \"u-other\"}."
    then: "notUpdated[E1] has type invalidProperties and properties [\"uid\"]."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 1.4.1"
    notes: "The id identifies a uid and recurrenceId pair, so the uid is treated as immutable. Sending the unchanged uid in an update is accepted."

  - id: CEV-017
    title: "Allow several events with one uid when each has a distinct recurrenceId"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 1.4.1 and RFC 8984 4.3.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create two events with uid \"series-1\", recurrenceIdTimeZone \"Europe/Tallinn\" and recurrenceId \"2026-01-05T09:00:00\" and \"2026-01-12T09:00:00\"."
    then: "Both are created with different ids. CalendarEvent/get returns the recurrenceId of each and neither has recurrenceRule or recurrenceOverrides."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_standalone_instances_create"
      - "cyrus:JMAPCalendars/calendarevent_get_standalone_instances"
      - "cyrus:JMAPCalendars/calendarevent_get_standalone_instances_multi"
      - "rfc:draft-ietf-jmap-calendars-33 1.4.1"
      - "rfc:draft-ietf-jmap-calendars-33 5.5"

  - id: CEV-018
    title: "Reject a duplicate uid and recurrenceId pair, and mixing a base event with standalone instances"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 1.4.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A standalone instance with uid \"series-1\" and recurrenceId \"2026-01-05T09:00:00\"."
    when: "Create another event with the same uid and recurrenceId; then create an event with uid \"series-1\" and no recurrenceId."
    then: "Both creates fail with invalidProperties and properties [\"uid\"] (the first may also name recurrenceId)."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_get_duplicate_recurrence_ids"
      - "rfc:draft-ietf-jmap-calendars-33 1.4.1"

  - id: CEV-019
    title: "Validate recurrenceId and recurrenceIdTimeZone as a pair"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.3.1 and RFC 8984 4.3.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with recurrenceId but no recurrenceIdTimeZone property, one with recurrenceIdTimeZone but no recurrenceId, and one with recurrenceId together with a recurrenceRule."
    then: "All three fail with invalidProperties naming the offending property (recurrenceIdTimeZone, recurrenceIdTimeZone and recurrenceRule respectively)."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_get_recurrenceid"
      - "cyrus:JMAPCalendars/calendarevent_set_standalone_instance_floatingtz"
      - "rfc:8984 4.3.1"
      - "rfc:8984 4.3.2"
    notes: "recurrenceIdTimeZone null is valid and means the series is floating; the property must still be present."

  - id: CEV-020
    title: "Replace standalone instances with the base event in one call"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Two standalone instances I1 and I2 with uid \"series-1\"; CalendarEvent state S1."
    when: "Call CalendarEvent/set with destroy [I1, I2] and create {\"base\": {uid \"series-1\", no recurrenceId, a weekly recurrenceRule}}."
    then: "Both destroys and the create succeed. CalendarEvent/changes since S1 lists I1 and I2 in destroyed and the new id in created."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_standalone_instances_to_main"
      - "cyrus:JMAPCalendars/calendarevent_set_replace_standalone_with_destroy"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"
      - "rfc:draft-ietf-jmap-calendars-33 5.5"

  - id: CEV-021
    title: "Update and destroy one standalone instance without touching its siblings"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Standalone instances I1 and I2 with the same uid."
    when: "Update I1 with a new title, then destroy I1."
    then: "After the update only I1 has the new title. After the destroy I2 still exists and CalendarEvent/get for I1 reports notFound."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_standalone_instances_update"
      - "cyrus:JMAPCalendars/calendarevent_set_standalone_instances_destroy"
      - "cyrus:JMAPCalendars/calendarevent_set_standalone_instances_move"
      - "rfc:draft-ietf-jmap-calendars-33 5.5"

  - id: CEV-022
    title: "Set created to the current time when omitted and keep a past client value"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create one event without created and one with created \"2020-01-01T00:00:00Z\"."
    then: "The first has created within a few seconds of the request time, returned in the created map. The second reads back with created \"2020-01-01T00:00:00Z\" and an updated value of now."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_created"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-023
    title: "Override a client created time that lies after the server updated time"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with created \"2099-01-01T00:00:00Z\" and updated \"2099-01-01T00:00:00Z\"."
    then: "Both created and updated are replaced with the server's current time and returned in the created map."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_created"
      - "cyrus:JMAPCalendars/calendarevent_set_updated"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-024
    title: "Set updated to the server time on every create and update of an event the server is the origin of"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An event E1 in the default calendar: title \"Lunch\", start \"2026-03-10T12:00:00\", timeZone \"Europe/Tallinn\", duration \"PT1H\"."
    when: "Wait at least one second, update E1 with {\"title\": \"Late lunch\", \"updated\": \"2001-01-01T00:00:00Z\"}."
    then: "No error. updated[E1] carries the server time as updated, it is later than the previous updated value, and created is unchanged."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_updated"
      - "cyrus:JMAPCalendars/calendarevent_set_updated_scheduled_source"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-025
    title: "Do not set or override updated on an event whose origin is elsewhere"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event with organizerCalendarAddress \"mailto:boss@remote.example\", the user as attendee and updated \"2026-01-01T00:00:00Z\" (isOrigin false)."
    when: "Update the event with {\"keywords/work\": true}, then with {\"title\": \"Changed locally\"} without sending updated."
    then: "After both updates CalendarEvent/get still returns updated \"2026-01-01T00:00:00Z\". A create of such an event without updated stores no updated property."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_updated_scheduled_not_source"
      - "cyrus:JMAPCalendars/calendarevent_set_updated_peruser_only"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-026
    title: "Increment sequence by one when a shared property changes on an origin event"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "E1 with sequence 0 (isOrigin true)."
    when: "Update E1 with {\"title\": \"New\"}; then update with {\"start\": \"2026-03-10T13:00:00\", \"sequence\": 0}."
    then: "After the first update sequence is 1, after the second it is 2. The new value is returned in the updated map each time."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_itip_request_sequence"
      - "cyrus:JMAPCalendars/calendarevent_set_rsvpsequence"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-027
    title: "Leave sequence alone for per user properties, calendarIds, isDraft and updated"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "E1 with sequence 3; a second calendar C2."
    when: "Update E1 in separate calls with {\"keywords/x\": true}, {\"color\": \"red\"}, {\"freeBusyStatus\": \"free\"}, {\"useDefaultAlerts\": true}, an added alert, {\"calendarIds\": {C2: true}} and {\"updated\": \"2026-01-01T00:00:00Z\"}."
    then: "sequence is still 3 after every call."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_itip_request_sequence"
      - "cyrus:JMAPCalendars/calendarevent_set_rsvpsequence"
      - "cyrus:JMAPCalendars/calendarevent_set_peruser"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"
      - "rfc:draft-ietf-jmap-calendars-33 5.4"

  - id: CEV-028
    title: "Accept an explicit sequence greater than the current one without a further increment"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "E1 with sequence 1."
    when: "Update E1 with {\"title\": \"X\", \"sequence\": 5}."
    then: "sequence reads back as 5."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-029
    title: "Do not increment sequence on events whose origin is elsewhere"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event with an external organizerCalendarAddress and sequence 2 (isOrigin false)."
    when: "Update the user's own participant with participationStatus \"accepted\", then update the title."
    then: "sequence stays 2 after both updates."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_itip_reply_sequence"
      - "cyrus:JMAPCalendars/calendarevent_set_mayrsvp_sequence"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-030
    title: "Reject the method property on create and update"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5 and draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event E1 in the default calendar: title \"Lunch\", start \"2026-03-10T12:00:00\", timeZone \"Europe/Tallinn\", duration \"PT1H\"."
    when: "Create an event with \"method\": \"request\"; update E1 with {\"method\": \"cancel\"}."
    then: "The create fails and the update lands in notUpdated, both with invalidProperties and properties [\"method\"]. Stored events never have a method property."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_method"
      - "rfc:draft-ietf-jmap-calendars-33 5"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-031
    title: "Treat null top level optional properties on create as omitted"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with \"description\": null, \"locations\": null, \"alerts\": null, \"recurrenceRule\": null, \"participants\": null and \"descriptionContentType\": null."
    then: "The event is created. CalendarEvent/get returns none of these properties (or their defaults), exactly as if they had not been sent."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_create_null_values"
      - "cyrus:JMAPCalendars/calendarevent_get_emptyprops"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"
      - "rfc:draft-ietf-jmap-calendars-33 8.2"

  - id: CEV-032
    title: "Do not extend the null equals omitted rule to nested properties"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with locations {\"l1\": {\"@type\": \"Location\", \"name\": null}}."
    then: "The create fails with invalidProperties whose properties entry points at locations/l1/name."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-033
    title: "Reject client changes to id, baseEventId and isOrigin"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event E1 in the default calendar: title \"Lunch\", start \"2026-03-10T12:00:00\", timeZone \"Europe/Tallinn\", duration \"PT1H\"."
    when: "Update E1 with {\"id\": \"Zother\"}, with {\"isOrigin\": false} and with {\"baseEventId\": \"Zbase\"}; create an event with \"baseEventId\": E1."
    then: "Every change is rejected with invalidProperties naming the property. Sending the current value of id or isOrigin unchanged is accepted."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_baseeventid"
      - "cyrus:JMAPCalendars/calendarevent_get_isorigin"
      - "rfc:draft-ietf-jmap-calendars-33 5"
      - "rfc:8620 5.3"

  - id: CEV-034
    title: "Create draft and non draft events and keep the flag across unrelated updates"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create event D with isDraft true and event N without isDraft, then update the title of both."
    then: "D has isDraft true before and after the update, N has isDraft false."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_isdraft"
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5"

  - id: CEV-035
    title: "Allow isDraft to go from true to false but never back"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Draft event D (isDraft true) and event N (isDraft false)."
    when: "Update D with {\"isDraft\": false}, then update D with {\"isDraft\": true}, then update N with {\"isDraft\": true}."
    then: "The first update succeeds. The second and third are rejected with invalidProperties and properties [\"isDraft\"]."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_isdraft"
      - "rfc:draft-ietf-jmap-calendars-33 5"

  - id: CEV-036
    title: "Reject isDraft inside recurrenceOverrides"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}."
    when: "Update R1 with recurrenceOverrides {\"2026-01-12T09:00:00\": {\"isDraft\": true}}."
    then: "notUpdated[R1] has type invalidProperties and its properties entry points into recurrenceOverrides."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 5"

  - id: CEV-037
    title: "Accept only LocalDateTime values for start"
    method: "CalendarEvent/set"
    spec: "RFC 8984 1.4.5 and RFC 8984 5.1.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create events with start \"2026-03-10T12:00:00Z\", \"2026-03-10T12:00:00+02:00\", \"2026-03-10\", \"2026-02-30T10:00:00\" and \"2026-03-10T25:00:00\"."
    then: "All five fail with invalidProperties and properties [\"start\"]."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_get_utctime_with_tzid"
      - "rfc:8984 1.4.5"

  - id: CEV-038
    title: "Store a floating event without converting its local time"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.7.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with start \"2026-06-01T08:00:00\" and timeZone null (or omitted)."
    then: "CalendarEvent/get returns start \"2026-06-01T08:00:00\" and timeZone null or absent. Nothing is converted to UTC."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_simple"
      - "rfc:8984 4.7.1"
      - "rfc:8984 6.7"

  - id: CEV-039
    title: "Reject an unknown time zone id"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.7.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create events with timeZone \"Europe/Atlantis\" and timeZone \"GMT+2\"."
    then: "Both fail with invalidProperties and properties [\"timeZone\"]."
    sources:
      - "cyrus:JMAPCalendars/itip_ignore_invalid_timezone"
      - "cyrus:JMAPCalendars/calendarevent_get_ms_timezone"
      - "rfc:8984 4.7.1"
    notes: "Open question: RFC 8984 4.7.2 allows custom zones declared in a timeZones property with ids starting with a slash. The assumed WildDuck rule is IANA ids only, and a timeZones property is rejected with invalidProperties. Windows zone names and guessed zones (Cyrus calendarevent_get_ms_timezone, calendarevent_get_guesstz) only matter for iCalendar input, see CPAR."

  - id: CEV-040
    title: "Accept IANA link names and keep the id as sent"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.7.1"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create events with timeZone \"US/Eastern\" and \"Asia/Calcutta\"."
    then: "Both are created and read back with the same ids. utcStart is computed with the rules of America/New_York and Asia/Kolkata."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_no_preserve_iana_timezone"
      - "rfc:8984 4.7.1"

  - id: CEV-041
    title: "Store an all day event with showWithoutTime"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.2.4 and RFC 8984 6.4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with start \"2026-07-01T00:00:00\", duration \"P1D\", showWithoutTime true and no timeZone."
    then: "The event reads back with exactly these values; showWithoutTime defaults to false on events that do not send it."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_simple"
      - "cyrus:JMAPCalendars/calendarevent_set_recurrence_untilallday"
      - "stalwart:calendar/instance.rs"
      - "rfc:8984 4.2.4"
      - "rfc:8984 6.4"

  - id: CEV-042
    title: "Validate the duration format"
    method: "CalendarEvent/set"
    spec: "RFC 8984 1.4.6 and RFC 8984 5.1.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create events with duration \"PT1H30M\", \"P1W\", \"P1DT2H\", \"PT0S\", \"-PT1H\", \"1h\" and \"P1M\"."
    then: "The first four are created and read back unchanged. The last three fail with invalidProperties and properties [\"duration\"] (durations are not signed and have no month or year component)."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_simple"
      - "rfc:8984 1.4.6"
      - "rfc:8984 5.1.2"

  - id: CEV-043
    title: "Store an end time zone that differs from the start time zone"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.7"
    level: should
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with start \"2026-05-01T22:00:00\", timeZone \"Europe/London\", duration \"PT9H\" and endTimeZone \"Asia/Tokyo\"."
    then: "The event reads back with endTimeZone \"Asia/Tokyo\". utcStart is 2026-05-01T21:00:00Z and utcEnd is 2026-05-02T06:00:00Z, since the duration is elapsed time."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_endtimezone"
      - "cyrus:JMAPCalendars/calendarevent_get_endtimezone"
      - "cyrus:JMAPCalendars/calendarevent_set_endtimezone_recurrence"
      - "rfc:8984 6.6"
    notes: "endTimeZone is a JSCalendar bis property (RFC 8984 expressed this with a location whose relativeTo is end). Follows the bis draft and may move."

  - id: CEV-044
    title: "Reject dates outside minDateTime and maxDateTime"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 1.5.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "The capability reports minDateTime and maxDateTime."
    when: "Create an event whose start is one day before minDateTime, one whose start is one day after maxDateTime, and one inside the range whose recurrenceRule has until after maxDateTime."
    then: "All three fail with invalidProperties naming start (first two) and recurrenceRule/until (third). An event exactly at minDateTime is accepted."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 1.5.1"
    notes: "The limit applies to any date stored in the event: start, until, recurrence override keys, AbsoluteTrigger when, created."

  - id: CEV-045
    title: "Compute utcStart and utcEnd for a zoned event only when requested"
    method: "CalendarEvent/get"
    spec: "draft-ietf-jmap-calendars-33 5 and draft-ietf-jmap-calendars-33 5.7"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event with start \"2026-03-10T12:00:00\", timeZone \"Europe/Tallinn\" (UTC+2 in March), duration \"PT1H\"."
    when: "Call CalendarEvent/get with properties [\"utcStart\", \"utcEnd\", \"start\"]."
    then: "utcStart is \"2026-03-10T10:00:00Z\" and utcEnd is \"2026-03-10T11:00:00Z\". A get with properties null contains neither."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_get_utcstart"
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5"
      - "rfc:draft-ietf-jmap-calendars-33 5.7"

  - id: CEV-046
    title: "Interpret floating events in the timeZone argument when computing utcStart and utcEnd"
    method: "CalendarEvent/get"
    spec: "draft-ietf-jmap-calendars-33 5.7"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A floating event with start \"2026-07-01T09:00:00\" and duration \"PT30M\"."
    when: "Call CalendarEvent/get with properties [\"utcStart\", \"utcEnd\"] three times: without timeZone, with timeZone \"America/New_York\" and with timeZone \"Asia/Tokyo\"."
    then: "utcStart is \"2026-07-01T09:00:00Z\", \"2026-07-01T13:00:00Z\" and \"2026-07-01T00:00:00Z\" respectively, and utcEnd is 30 minutes later each time."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_get_utcstart"
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.7"

  - id: CEV-047
    title: "Ignore the timeZone argument for zoned events and when UTC properties are not requested"
    method: "CalendarEvent/get"
    spec: "draft-ietf-jmap-calendars-33 5.7"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A zoned event in Europe/Tallinn and a floating event."
    when: "Call CalendarEvent/get with timeZone \"Asia/Tokyo\" and properties [\"start\", \"timeZone\"], then with properties [\"utcStart\"] for the zoned event."
    then: "start and timeZone are returned as stored for both events. The zoned event's utcStart is computed from Europe/Tallinn, not from the argument."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 5.7"

  - id: CEV-048
    title: "Reject recurrenceOverrides requested together with utcStart or utcEnd"
    method: "CalendarEvent/get"
    spec: "draft-ietf-jmap-calendars-33 5.7"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}."
    when: "Call CalendarEvent/get with properties [\"utcStart\", \"recurrenceOverrides\"], and with [\"utcEnd\", \"recurrenceOverrides\"]."
    then: "Both calls answer with error type invalidArguments."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 5.7"
    notes: "The draft states the combination MUST NOT be requested but names no error; invalidArguments is the RFC 8620 answer to an invalid argument combination."

  - id: CEV-049
    title: "Reject an unknown timeZone argument"
    method: "CalendarEvent/get"
    spec: "draft-ietf-jmap-calendars-33 5.7"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event E1 in the default calendar: title \"Lunch\", start \"2026-03-10T12:00:00\", timeZone \"Europe/Tallinn\", duration \"PT1H\"."
    when: "Call CalendarEvent/get with timeZone \"Nowhere/City\" and properties [\"utcStart\"]."
    then: "The response is an error with type invalidArguments."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 5.7"

  - id: CEV-050
    title: "Compute utcStart across a daylight saving change with current zone rules"
    method: "CalendarEvent/get"
    spec: "draft-ietf-jmap-calendars-33 5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Two events at start \"09:00:00\" local in Europe/Tallinn, one on 2026-03-28 and one on 2026-03-29 (the day summer time begins)."
    when: "Call CalendarEvent/get with properties [\"utcStart\"]."
    then: "utcStart is \"2026-03-28T07:00:00Z\" for the first and \"2026-03-29T06:00:00Z\" for the second."
    sources:
      - "cyrus:JMAPCalendars/misc_timezone_expansion"
      - "rfc:draft-ietf-jmap-calendars-33 5"

  - id: CEV-051
    title: "Translate utcStart into a local start in the event's time zone"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5 and draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with utcStart \"2026-03-10T10:00:00Z\", timeZone \"Europe/Tallinn\" and duration \"PT1H\"."
    then: "The stored event has start \"2026-03-10T12:00:00\" and timeZone \"Europe/Tallinn\"; start is returned in the created map."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_utcstart"
      - "rfc:draft-ietf-jmap-calendars-33 5"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-052
    title: "Set timeZone from the calendar when utcStart is used without a time zone"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Calendar A has timeZone \"Australia/Melbourne\"; calendar B has timeZone null."
    when: "Create an event in A with utcStart \"2026-01-10T00:00:00Z\" and no timeZone; create the same in B."
    then: "The event in A gets timeZone \"Australia/Melbourne\" and start \"2026-01-10T11:00:00\". The event in B gets timeZone \"Etc/UTC\" and start \"2026-01-10T00:00:00\". timeZone and start are returned in the created map."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_utcstart"
      - "rfc:draft-ietf-jmap-calendars-33 5"

  - id: CEV-053
    title: "Fall back to Etc/UTC when the event's calendars disagree on timeZone"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Calendar A has timeZone \"Australia/Melbourne\", calendar B has timeZone \"Europe/Tallinn\"."
    when: "Create an event with calendarIds {A: true, B: true}, utcStart \"2026-01-10T00:00:00Z\" and no timeZone."
    then: "timeZone is set to \"Etc/UTC\" and start to \"2026-01-10T00:00:00\"."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 5"
    notes: "Needs maxCalendarsPerEvent above 1."

  - id: CEV-054
    title: "Reject utcStart together with start and utcEnd together with duration"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with both start and utcStart; create another with utcStart, utcEnd and duration."
    then: "The first fails with invalidProperties naming utcStart (or start), the second with invalidProperties naming utcEnd (or duration)."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_utcstart"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-055
    title: "Translate utcEnd into a duration"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with utcStart \"2026-03-10T10:00:00Z\", utcEnd \"2026-03-10T11:30:00Z\" and timeZone \"Europe/Tallinn\". Create another with utcEnd earlier than utcStart."
    then: "The first is stored with duration \"PT1H30M\". The second fails with invalidProperties naming utcEnd."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_utcstart"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-056
    title: "Update an existing event through utcStart and utcEnd"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "E1 in Europe/Tallinn at \"2026-03-10T12:00:00\" for one hour."
    when: "Update E1 with {\"utcStart\": \"2026-03-11T08:00:00Z\", \"utcEnd\": \"2026-03-11T10:00:00Z\"}."
    then: "E1 now has start \"2026-03-11T10:00:00\", duration \"PT2H\" and the unchanged timeZone; start and duration are returned in the updated map."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_utcstart"
      - "cyrus:JMAPCalendars/calendarevent_set_utcstart_recur"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-057
    title: "Reject utcStart and utcEnd inside recurrenceOverrides"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}."
    when: "Update R1 with recurrenceOverrides {\"2026-01-12T09:00:00\": {\"utcStart\": \"2026-01-12T10:00:00Z\"}}, and again with utcEnd in the patch."
    then: "Both updates are rejected with invalidProperties whose properties entry points into recurrenceOverrides."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_utcstart_recur"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-058
    title: "Store description with its content type"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.2.2 and RFC 8984 4.2.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with description \"<b>Agenda</b>\" and descriptionContentType \"text/html\"; create another with descriptionContentType \"application/pdf\"."
    then: "The first reads back unchanged; without descriptionContentType the default is \"text/plain\". The second fails with invalidProperties and properties [\"descriptionContentType\"]."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_htmldescription"
      - "cyrus:JMAPCalendars/calendarevent_get_description"
      - "rfc:8984 4.2.2"
      - "rfc:8984 4.2.3"

  - id: CEV-059
    title: "Store locations with names, coordinates and time zones"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.2.5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with locations {\"l1\": {\"@type\": \"Location\", \"name\": \"Room 4\"}, \"l2\": {\"@type\": \"Location\", \"name\": \"Harbour\", \"coordinates\": \"geo:59.44,24.75\"}}."
    then: "CalendarEvent/get returns both locations under the same ids with all sent properties."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_locations"
      - "cyrus:JMAPCalendars/calendarevent_get_locations"
      - "cyrus:JMAPCalendars/calendarevent_get_locations_geo"
      - "cyrus:JMAPCalendars/calendarevent_set_update_geo_jsid"
      - "rfc:8984 4.2.5"

  - id: CEV-060
    title: "Store virtual locations and require their uri"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.2.6"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with virtualLocations {\"v1\": {\"@type\": \"VirtualLocation\", \"name\": \"Call\", \"uri\": \"https://meet.example.com/abc\"}}; create another whose virtual location has no uri."
    then: "The first reads back unchanged. The second fails with invalidProperties pointing at virtualLocations/v1/uri."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_get_virtuallocations_conference"
      - "cyrus:JMAPCalendars/calendarevent_set_virtuallocation_xprop"
      - "rfc:8984 4.2.6"

  - id: CEV-061
    title: "Store links with href, contentType, rel and title"
    method: "CalendarEvent/set"
    spec: "RFC 8984 1.4.11 and RFC 8984 4.2.7"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with links {\"a\": {\"@type\": \"Link\", \"href\": \"https://example.com/agenda.pdf\", \"contentType\": \"application/pdf\", \"rel\": \"describedby\", \"title\": \"Agenda\"}}."
    then: "The link reads back unchanged under id \"a\"."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_links"
      - "cyrus:JMAPCalendars/calendarevent_get_links"
      - "cyrus:JMAPCalendars/calendarevent_set_links_dupids"
      - "cyrus:JMAPCalendars/calendarevent_set_links_display"
      - "rfc:8984 1.4.11"
      - "rfc:8984 4.2.7"

  - id: CEV-062
    title: "Attach an uploaded blob to an event by blobId"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A PDF uploaded through the upload endpoint, blob id B1."
    when: "Create an event with links {\"att\": {\"@type\": \"Link\", \"rel\": \"enclosure\", \"blobId\": B1, \"contentType\": \"application/pdf\", \"title\": \"notes.pdf\"}} and no href."
    then: "The event is created. CalendarEvent/get returns the link with blobId B1, and downloading B1 through the download endpoint returns the uploaded bytes."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_links"
      - "cyrus:JMAPCalendars/calendarevent_get_links"
      - "rfc:draft-ietf-jmap-calendars-33 5.3"
      - "wildduck:plan 10.3 blob ids"

  - id: CEV-063
    title: "Reject a link that references an unknown blob or has neither href nor blobId"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.3 and RFC 8620 5.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with an enclosure link whose blobId is \"Bnope\"; create another whose link has neither href nor blobId."
    then: "Both fail with invalidProperties whose properties entry points at the link (links/att/blobId and links/att)."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 5.3"
      - "rfc:8620 5.3"
    notes: "The draft defines no blobNotFound error for events, so invalidProperties is used."

  - id: CEV-064
    title: "Keep an uploaded blob alive while an event references it and release it afterwards"
    method: "Upload"
    spec: "draft-ietf-jmap-calendars-33 5.3"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An event with an enclosure link to uploaded blob B1."
    when: "Advance the clock past the upload expiry and download B1; then destroy the event, advance past the expiry again and download B1."
    then: "The first download succeeds. After the event is destroyed and the expiry passes the download answers 404."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_failed_update_keeps_attachment"
      - "rfc:draft-ietf-jmap-calendars-33 10.5"
      - "wildduck:brief Blobs"

  - id: CEV-065
    title: "Convert a data URI attachment into a blob"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.3"
    level: should
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with links {\"att\": {\"@type\": \"Link\", \"rel\": \"enclosure\", \"href\": \"data:text/plain;base64,aGVsbG8=\"}}."
    then: "CalendarEvent/get returns the link with a blobId and contentType \"text/plain\" and no data URI; downloading the blob returns \"hello\"."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_attachbinary_datauri"
      - "wildduck:plan 10.1 photos and media"
    notes: "Same treatment as contact photos. If not implemented the data URI must at least be stored and returned unchanged."

  - id: CEV-066
    title: "Find the events that reference a blob"
    method: "Blob/lookup"
    spec: "draft-ietf-jmap-calendars-33 10.5"
    level: should
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Event E1 with an enclosure link to blob B1."
    when: "Call Blob/lookup with typeNames [\"CalendarEvent\"] and ids [B1]."
    then: "The result for B1 lists E1 under matchedIds.CalendarEvent."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_blob_lookup"
      - "cyrus:JMAPCalendars/calendarevent_blob_lookup_standalone_instances"
      - "rfc:draft-ietf-jmap-calendars-33 10.5"
      - "rfc:9404 4.3"
    notes: "CalendarEvent is registered as a type that can reference blobs. Blob/lookup arrives in phase 4, so it exists by phase 6."

  - id: CEV-067
    title: "Store keywords, categories and color"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.2.9 and RFC 8984 4.2.10 and RFC 8984 4.2.11"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with keywords {\"work\": true, \"urgent\": true}, categories {\"http://example.com/cat/meeting\": true} and color \"rebeccapurple\"."
    then: "All three read back unchanged. A keywords value of false is rejected with invalidProperties."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_keywords"
      - "cyrus:JMAPCalendars/calendarevent_get_keywords"
      - "cyrus:JMAPCalendars/calendarevent_set_color"
      - "cyrus:JMAPCalendars/calendarevent_get_color"
      - "rfc:8984 4.2.9"
      - "rfc:8984 4.2.11"

  - id: CEV-068
    title: "Validate freeBusyStatus, priority and status"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.4.2 and RFC 8984 4.4.1 and RFC 8984 5.1.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create events with freeBusyStatus \"free\", status \"tentative\" and priority 9; then events with freeBusyStatus \"maybe\", status \"done\" and priority 10."
    then: "The first three values are stored (defaults are freeBusyStatus \"busy\", status \"confirmed\", priority 0). The second three each fail with invalidProperties naming the property."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_fullblown"
      - "rfc:8984 4.4.2"
      - "rfc:8984 4.4.1"
      - "rfc:8984 5.1.3"

  - id: CEV-069
    title: "Store privacy values and show the full event to its owner"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.4.3 and draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "adapted"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create events with privacy \"public\", \"private\" and \"secret\", each with a title, description and participants, then fetch them."
    then: "All three are created. The owner's CalendarEvent/get, query and changes return every property of all three events; privacy only restricts other users, of which there are none."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_privacy"
      - "cyrus:JMAPCalendars/calendarevent_get_privacy"
      - "cyrus:JMAPCalendars/calendarevent_set_preserve_class"
      - "rfc:draft-ietf-jmap-calendars-33 5.7"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"
      - "rfc:8984 4.4.3"
    notes: "The shared calendar halves of the Cyrus privacy tests (private_shared, secret_shared, get_privacy_shared) have nothing to assert without sharing."

  - id: CEV-070
    title: "Reject changes that leave events of one uid with different privacy values"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 1.4.1 and draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Standalone instances I1 and I2 with the same uid, both privacy \"public\"."
    when: "Update only I1 with {\"privacy\": \"private\"}; in a second request update I1 and I2 together with {\"privacy\": \"private\"}; in the same second request also update an unrelated event's title."
    then: "The first request puts I1 in notUpdated with invalidProperties and properties [\"privacy\"]. The second request updates I1, I2 and the unrelated event."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 1.4.1"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-071
    title: "Reject a new standalone instance whose privacy differs from its siblings"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Standalone instance I1 with uid \"series-1\" and privacy \"private\"."
    when: "Create a second instance with uid \"series-1\", another recurrenceId and privacy omitted (public)."
    then: "The create fails with invalidProperties and properties [\"privacy\"]. With privacy \"private\" it succeeds."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-072
    title: "Store relatedTo relations"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.1.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with relatedTo {\"other-uid\": {\"@type\": \"Relation\", \"relation\": {\"parent\": true}}}."
    then: "The property reads back unchanged. The referenced uid does not need to exist in the account."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_relatedto"
      - "cyrus:JMAPCalendars/calendarevent_get_relatedto"
      - "rfc:8984 4.1.3"

  - id: CEV-073
    title: "Keep a client supplied prodId and set one when omitted"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.1.4"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create one event with prodId \"-//Example//Client 1.0//EN\" and one without prodId."
    then: "The first reads back with the client value. The second has a WildDuck prodId or none; either way it is stable across fetches."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_prodid"
      - "rfc:8984 4.1.4"

  - id: CEV-074
    title: "Preserve vendor specific properties"
    method: "CalendarEvent/set"
    spec: "RFC 8984 3.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with \"example.com:mood\": \"sunny\" and a location carrying \"example.com:floor\": 3."
    then: "Both vendor properties are returned unchanged by CalendarEvent/get and can be patched and removed like any other property."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_participants_patch_empty_xprop"
      - "cyrus:JMAPCalendars/calendarevent_set_virtuallocation_xprop"
      - "rfc:8984 3.3"
      - "rfc:draft-ietf-jmap-calendars-33 5.7"

  - id: CEV-075
    title: "Reject unknown properties that are not vendor prefixed"
    method: "CalendarEvent/set"
    spec: "RFC 8984 3.3 and RFC 8620 5.3"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with \"colour\": \"red\" and one with \"recurrenceRules\": [{\"@type\": \"RecurrenceRule\", \"frequency\": \"daily\"}]."
    then: "Both fail with invalidProperties naming the unknown property."
    sources:
      - "rfc:8620 5.3"
    notes: "Catches typos and RFC 8984 era names (recurrenceRules, excludedRecurrenceRules, replyTo, sendTo) that the JSCalendar bis format replaced. The exact property set follows the bis draft and may move."

  - id: CEV-076
    title: "Store participants with roles, kind and participation status"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.4.6"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "The user's default identity is mailto:alice@example.com."
    when: "Create an event with participants {\"p1\": {\"@type\": \"Participant\", \"name\": \"Alice\", \"calendarAddress\": \"mailto:alice@example.com\", \"kind\": \"individual\", \"roles\": {\"owner\": true, \"attendee\": true}, \"participationStatus\": \"accepted\"}, \"p2\": {\"@type\": \"Participant\", \"name\": \"Bob\", \"email\": \"bob@example.net\", \"calendarAddress\": \"mailto:bob@example.net\", \"roles\": {\"attendee\": true}, \"expectReply\": true}} and sendSchedulingMessages omitted."
    then: "The event is created and nothing is queued for delivery. CalendarEvent/get returns both participants under ids p1 and p2 with all sent properties; p2 reports participationStatus \"needs-action\" by default or omits it."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_participants"
      - "cyrus:JMAPCalendars/calendarevent_get_participants"
      - "cyrus:JMAPCalendars/calendarevent_set_participantid"
      - "cyrus:JMAPCalendars/calendarevent_set_participants_justorga"
      - "stalwart:calendar/event.rs"
      - "rfc:8984 4.4.6"
      - "rfc:draft-ietf-jmap-calendars-33 8.2"

  - id: CEV-077
    title: "Validate participant roles and participation status"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.4.6"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create events whose participant has roles {} (empty), roles {\"owner\": false}, and participationStatus \"maybe\"."
    then: "Each create fails with invalidProperties pointing at the participant property (participants/p1/roles or participants/p1/participationStatus)."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_participants"
      - "rfc:8984 4.4.6"

  - id: CEV-078
    title: "Set organizerCalendarAddress when an event is created with participants"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "The user's default identity is mailto:alice@example.com."
    when: "Create an event with an owner participant for mailto:alice@example.com and an attendee, without organizerCalendarAddress and without sendSchedulingMessages."
    then: "created contains organizerCalendarAddress \"mailto:alice@example.com\" and isOrigin true."
    sources:
      - "stalwart:calendar/event.rs"
      - "cyrus:JMAPCalendars/calendarevent_set_organizer"
      - "cyrus:JMAPCalendars/calendarevent_set_participants_organame"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"
      - "rfc:draft-ietf-jmap-calendars-33 8.2"
    notes: "WildDuck uses the address of the participant identity that matches the owner participant, or the default identity when no participant matches. It does not mint a per event address as the draft example does. The choice rules are tested in CSCH."

  - id: CEV-079
    title: "Set organizerCalendarAddress when participants are added to an event that had none"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event E1 in the default calendar: title \"Lunch\", start \"2026-03-10T12:00:00\", timeZone \"Europe/Tallinn\", duration \"PT1H\"."
    when: "Update E1 with {\"participants\": {\"p1\": {owner, mailto:alice@example.com}, \"p2\": {attendee, mailto:bob@example.net}}}."
    then: "updated[E1] contains organizerCalendarAddress with one of the user's addresses."
    sources:
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-080
    title: "Never overwrite a client supplied organizerCalendarAddress and leave it unset without participants"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create one event with participants and organizerCalendarAddress \"mailto:boss@remote.example\"; create another without participants."
    then: "The first keeps \"mailto:boss@remote.example\" and has isOrigin false. The second has no organizerCalendarAddress and isOrigin true."
    sources:
      - "stalwart:calendar/event.rs"
      - "cyrus:JMAPCalendars/calendarevent_get_organizer"
      - "cyrus:JMAPCalendars/calendarevent_get_organizermailto"
      - "cyrus:JMAPCalendars/calendarevent_attendee_noorganizer"
      - "cyrus:JMAPCalendars/calendarevent_organizer_noattendees"
      - "rfc:draft-ietf-jmap-calendars-33 5"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-081
    title: "Derive isOrigin from organizerCalendarAddress and the user's addresses"
    method: "CalendarEvent/get"
    spec: "draft-ietf-jmap-calendars-33 5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "The user owns alice@example.com and alias al@example.com."
    when: "Create three events with participants: organizerCalendarAddress \"mailto:al@example.com\", \"MAILTO:Alice@EXAMPLE.com\" and \"mailto:carol@remote.example\"; fetch isOrigin."
    then: "isOrigin is true for the first two and false for the third."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_get_isorigin"
      - "cyrus:JMAPCalendars/calendarevent_get_organizer_bogusuri"
      - "rfc:draft-ietf-jmap-calendars-33 5"
      - "rfc:draft-ietf-jmap-calendars-33 3"
    notes: "Comparison uses RFC 3986 syntax based normalisation plus WildDuck address normalisation, as for ParticipantIdentity matching."

  - id: CEV-082
    title: "Recompute isOrigin when the user's addresses change"
    method: "CalendarEvent/get"
    spec: "draft-ietf-jmap-calendars-33 5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, api]
    given: "An event with organizerCalendarAddress \"mailto:al@example.com\" while the user owns that alias."
    when: "Remove the alias through the REST API, then fetch isOrigin."
    then: "isOrigin is now false. The event itself is not reported by CalendarEvent/changes for this reason alone."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 5"
    notes: "Open question: whether a server set property changing without a state change is acceptable. The alternative is to bump every affected event, which is costly."

  - id: CEV-083
    title: "Do not add an owner to events created without participants"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event without participants."
    then: "CalendarEvent/get returns no participants property and no organizerCalendarAddress."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_organizer_noattendees"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"
    notes: "The draft lets servers enforce an owner on team calendars; WildDuck has none."

  - id: CEV-084
    title: "Enforce maxParticipantsPerEvent"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 1.5.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "The capability reports maxParticipantsPerEvent N."
    when: "Create an event with N participants, then update it adding one more; also create an event with N+1 participants."
    then: "The first create succeeds. The update and the second create are rejected with invalidProperties and properties [\"participants\"]."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 1.5.1"
    notes: "The draft names no error for this limit. Participants added only in recurrence overrides count towards the limit of that instance."

  - id: CEV-085
    title: "Keep participationStatus and expectReply when other event details change"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event with attendee p2 at participationStatus \"accepted\" and expectReply false."
    when: "Update the event's start and title."
    then: "p2 still has participationStatus \"accepted\" and expectReply false."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_itip_preserve_partstat"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-086
    title: "Return only owners and the user's own participants with reduceParticipants"
    method: "CalendarEvent/get"
    spec: "draft-ietf-jmap-calendars-33 5.7"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event with owner carol@remote.example, attendee alice@example.com (the user) and attendees bob and dave; a recurrence override changes bob's participationStatus."
    when: "Call CalendarEvent/get with reduceParticipants true, then false."
    then: "With true, participants holds only carol and alice, and the override no longer contains the patch to bob. With false all four are returned."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_get_reducepartitipants"
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.7"

  - id: CEV-087
    title: "Store mayInviteSelf, mayInviteOthers and hideAttendees on the base event only"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}."
    when: "Update R1 with {\"mayInviteSelf\": true, \"mayInviteOthers\": true, \"hideAttendees\": true}; then update with recurrenceOverrides {\"2026-01-12T09:00:00\": {\"hideAttendees\": false}}."
    then: "The first update succeeds and the values read back (default false). The second is rejected with invalidProperties pointing into recurrenceOverrides."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_mayinvite_preserve_caldav"
      - "cyrus:JMAPCalendars/calendarevent_get_hideattendees_alternate_representations"
      - "rfc:draft-ietf-jmap-calendars-33 5.1.1"
      - "rfc:draft-ietf-jmap-calendars-33 5.1.2"
      - "rfc:draft-ietf-jmap-calendars-33 5.1.3"

  - id: CEV-088
    title: "Show all participants of a hideAttendees event to the account owner"
    method: "CalendarEvent/get"
    spec: "draft-ietf-jmap-calendars-33 5.7"
    level: must
    phase: 6
    applies: "adapted"
    seed: [jmap]
    given: "An event with hideAttendees true, the user as attendee and three other attendees, organised externally."
    when: "Call CalendarEvent/get, and CalendarEvent/query with filter {\"participant\": \"<name of another attendee>\"}."
    then: "All participants are returned and the query matches. The owner has mayWriteAll, so no filtering applies."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_get_hideattendees_alternate_representations"
      - "rfc:draft-ietf-jmap-calendars-33 5.7"
    notes: "The filtering rules only bite for users without write permission, which cannot exist without sharing."

  - id: CEV-089
    title: "Store scheduleSequence and scheduleUpdated on participants"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event the user organises with attendee p2."
    when: "Update with {\"participants/p2/participationStatus\": \"accepted\", \"participants/p2/scheduleSequence\": 2, \"participants/p2/scheduleUpdated\": \"2026-03-01T10:00:00Z\"}."
    then: "All three values read back. scheduleSequence defaults to 0 when never set; a negative or non-integer scheduleSequence is rejected with invalidProperties."
    sources:
      - "cyrus:JMAPCalendars/email_get_calendarevents_itip_schedprops"
      - "rfc:draft-ietf-jmap-calendars-33 5.2.1"
      - "rfc:draft-ietf-jmap-calendars-33 5.2.2"

  - id: CEV-090
    title: "Store alerts with offset and absolute triggers"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.5.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with alerts {\"a1\": {\"@type\": \"Alert\", \"action\": \"display\", \"trigger\": {\"@type\": \"OffsetTrigger\", \"offset\": \"-PT15M\", \"relativeTo\": \"start\"}}, \"a2\": {\"@type\": \"Alert\", \"action\": \"email\", \"trigger\": {\"@type\": \"AbsoluteTrigger\", \"when\": \"2026-03-10T06:00:00Z\"}}}."
    then: "Both alerts read back under their ids. action defaults to \"display\" and relativeTo to \"start\" when omitted."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_alerts"
      - "cyrus:JMAPCalendars/calendarevent_get_alerts"
      - "cyrus:JMAPCalendars/calendarevent_set_alerts_description"
      - "rfc:8984 4.5.2"

  - id: CEV-091
    title: "Validate alert structure and preserve unknown trigger types"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.5.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create events whose alert has no trigger, an OffsetTrigger with offset \"15 minutes\", an OffsetTrigger with relativeTo \"middle\", an action \"shout\", and a trigger {\"@type\": \"example.com:GeoTrigger\", \"radius\": 100}."
    then: "The first four fail with invalidProperties pointing at the alert property. The fifth is created and the unknown trigger is returned unchanged."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_alerts"
      - "rfc:8984 4.5.2"

  - id: CEV-092
    title: "Store useDefaultAlerts alongside the event's own alerts"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5 and RFC 8984 4.5.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with useDefaultAlerts true and alerts {\"a1\": ...}; then update useDefaultAlerts to false."
    then: "Both properties read back as stored in each state; the alerts map is not removed when useDefaultAlerts is true."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_defaultalerts"
      - "cyrus:JMAPCalendars/calendarevent_multiget_defaultalerts"
      - "rfc:draft-ietf-jmap-calendars-33 5"
      - "rfc:draft-ietf-jmap-calendars-33 6.1"

  - id: CEV-093
    title: "Update top level properties and leave the rest untouched"
    method: "CalendarEvent/set"
    spec: "RFC 8620 5.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event E1 in the default calendar: title \"Lunch\", start \"2026-03-10T12:00:00\", timeZone \"Europe/Tallinn\", duration \"PT1H\"."
    when: "Update E1 with {\"title\": \"Dinner\", \"start\": \"2026-03-10T19:00:00\", \"timeZone\": \"Europe/Helsinki\", \"duration\": \"PT2H\"}."
    then: "All four values read back; uid, created and calendarIds are unchanged."
    sources:
      - "fastmail:t/CalendarEvent/set/update.t"
      - "cyrus:JMAPCalendars/calendarevent_set_simple"
      - "stalwart:calendar/event.rs"
      - "rfc:8620 5.3"

  - id: CEV-094
    title: "Patch nested objects by path: add, change and remove map entries"
    method: "CalendarEvent/set"
    spec: "RFC 8620 5.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event with locations {\"l1\": {name \"Room 4\"}} and participants p1 and p2."
    when: "Update with {\"locations/l2\": {\"@type\": \"Location\", \"name\": \"Cafe\"}, \"locations/l1/name\": \"Room 5\", \"participants/p2\": null, \"participants/p1/participationStatus\": \"tentative\"}."
    then: "The event has locations l1 (name \"Room 5\") and l2, only participant p1, and p1 has participationStatus \"tentative\"."
    sources:
      - "fastmail:t/CalendarEvent/set/update.t"
      - "cyrus:JMAPCalendars/calendarevent_set_participants_patch"
      - "cyrus:JMAPCalendars/calendarevent_set_keywords_patch"
      - "cyrus:JMAPCalendars/calendarevent_set_recurrence_patch"
      - "stalwart:calendar/event.rs"
      - "rfc:8620 5.3"

  - id: CEV-095
    title: "Decode JSON Pointer escapes in patch paths"
    method: "CalendarEvent/set"
    spec: "RFC 8620 5.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event with categories {\"http://example.com/cat/a\": true} and a participant whose id is \"a~b\"."
    when: "Update with {\"categories/http:~1~1example.com~1cat~1b\": true, \"participants/a~0b/name\": \"Renamed\"}."
    then: "The category \"http://example.com/cat/b\" is added and participant \"a~b\" has the new name."
    sources:
      - "rfc:8620 5.3"
      - "rfc:draft-ietf-jmap-calendars-33 5.9.1"

  - id: CEV-096
    title: "Reject invalid patches with invalidPatch"
    method: "CalendarEvent/set"
    spec: "RFC 8620 5.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event E1 in the default calendar: title \"Lunch\", start \"2026-03-10T12:00:00\", timeZone \"Europe/Tallinn\", duration \"PT1H\"."
    when: "Update E1 with {\"locations/nope/name\": \"X\"} (parent missing), with {\"title/0\": \"X\"} (path through a string), and with {\"locations\": {}, \"locations/l1\": {...}} (parent and child in one patch)."
    then: "Each update lands in notUpdated with type invalidPatch and E1 is unchanged."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_invalidpatch"
      - "rfc:8620 5.3"

  - id: CEV-097
    title: "Apply an event update atomically"
    method: "CalendarEvent/set"
    spec: "RFC 8620 5.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event E1 in the default calendar: title \"Lunch\", start \"2026-03-10T12:00:00\", timeZone \"Europe/Tallinn\", duration \"PT1H\"."
    when: "Update E1 with {\"title\": \"Valid\", \"duration\": \"bogus\"}."
    then: "notUpdated[E1] has type invalidProperties with properties [\"duration\"]; the title is still \"Lunch\" and the state is unchanged."
    sources:
      - "rfc:8620 5.3"

  - id: CEV-098
    title: "Name nested invalid properties by JSON Pointer path in SetError properties"
    method: "CalendarEvent/set"
    spec: "RFC 8620 5.3"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with a valid top level and three faults: participants/p2/participationStatus \"bogus\", alerts/a1/trigger/offset \"x\" and recurrenceOverrides/2026-01-12T09:00:00/duration \"y\"."
    then: "notCreated has type invalidProperties and properties lists exactly those three paths, without a leading slash."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_participants"
      - "rfc:8620 5.3"
    notes: "RFC 8620 only requires the names of invalid properties. Paths are what Cyrus returns and what clients need to point at the faulty field."

  - id: CEV-099
    title: "Reject an event that exceeds the maximum stored size with tooLarge"
    method: "CalendarEvent/set"
    spec: "RFC 8620 5.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A configured maximum event size (for example 1 MB of JSON)."
    when: "Create an event whose description pushes the object over the limit; update an existing event the same way."
    then: "notCreated and notUpdated carry type tooLarge. Nothing is stored and the existing event is unchanged."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_too_large"
      - "rfc:8620 5.3"

  - id: CEV-100
    title: "Report notFound for updates and destroys of unknown event ids"
    method: "CalendarEvent/set"
    spec: "RFC 8620 5.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Call CalendarEvent/set with update {\"Zmissing\": {\"title\": \"X\"}} and destroy [\"Zgone\"]."
    then: "notUpdated.Zmissing and notDestroyed.Zgone both have type notFound."
    sources:
      - "fastmail:t/CalendarEvent/set/update.t"
      - "rfc:8620 5.3"

  - id: CEV-101
    title: "Honour ifInState and maxObjectsInSet on CalendarEvent/set"
    method: "CalendarEvent/set"
    spec: "RFC 8620 5.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event E1 in the default calendar: title \"Lunch\", start \"2026-03-10T12:00:00\", timeZone \"Europe/Tallinn\", duration \"PT1H\"."
    when: "Call CalendarEvent/set with a stale ifInState; then with more creates than maxObjectsInSet."
    then: "The first answers stateMismatch, the second requestTooLarge. No event is written in either case."
    sources:
      - "rfc:8620 5.3"

  - id: CEV-102
    title: "Move an event to another calendar by replacing calendarIds"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "E1 in calendar A; calendar B exists; CalendarEvent state S1."
    when: "Update E1 with {\"calendarIds\": {idB: true}}."
    then: "E1 keeps its id, has calendarIds {idB: true}, and CalendarEvent/changes since S1 lists it in updated (not destroyed plus created). CalendarEvent/query inCalendar A no longer returns it."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_move"
      - "cyrus:JMAPCalendars/calendarevent_set_move_fast_path"
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5"

  - id: CEV-103
    title: "Add and remove single calendars by patch"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "E1 in calendar A; calendar B exists."
    when: "Update E1 with {\"calendarIds/idB\": true}, then with {\"calendarIds/idA\": null}."
    then: "After the first update calendarIds is {idA: true, idB: true}; after the second it is {idB: true}."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_move"
      - "rfc:draft-ietf-jmap-calendars-33 5"
    notes: "The first step needs maxCalendarsPerEvent above 1; with a limit of 1 it must fail with invalidProperties and the two patches have to be sent together."

  - id: CEV-104
    title: "Reject updates that leave an event in no calendar or in an unknown calendar"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "E1 in calendar A."
    when: "Update E1 with {\"calendarIds/idA\": null}, with {\"calendarIds\": {}} and with {\"calendarIds\": {\"Znope\": true}}."
    then: "All three are rejected with invalidProperties and properties [\"calendarIds\"]; E1 stays in A."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_move"
      - "rfc:draft-ietf-jmap-calendars-33 5"

  - id: CEV-105
    title: "Destroy an event"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event E1 in the default calendar: title \"Lunch\", start \"2026-03-10T12:00:00\", timeZone \"Europe/Tallinn\", duration \"PT1H\"."
    when: "Call CalendarEvent/set with destroy [E1], then CalendarEvent/get with ids [E1]."
    then: "destroyed is [E1], the get reports E1 in notFound, a second destroy answers notFound, and newState differs from oldState."
    sources:
      - "fastmail:t/CalendarEvent/set/destroy.t"
      - "cyrus:JMAPCalendars/calendarevent_set_simple"
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-106
    title: "Allow a destroyed event's uid to be used again"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "E1 with uid \"u-1\" was destroyed."
    when: "Create a new event with uid \"u-1\"."
    then: "The create succeeds with a new id. The tombstone of E1 does not block the unique index."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_changes_recreate_uid"
      - "wildduck:plan 10.3 owned change log"

  - id: CEV-107
    title: "Return the same state and empty lists when no event changed"
    method: "CalendarEvent/changes"
    spec: "draft-ietf-jmap-calendars-33 5.8"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "State S1 from CalendarEvent/get."
    when: "Call CalendarEvent/changes with sinceState S1."
    then: "oldState and newState equal S1, hasMoreChanges is false, and all three lists are empty."
    sources:
      - "fastmail:t/CalendarEvent/changes/basic.t"
      - "cyrus:JMAPCalendars/calendarevent_changes"
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.8"

  - id: CEV-108
    title: "Report created, updated and destroyed events"
    method: "CalendarEvent/changes"
    spec: "draft-ietf-jmap-calendars-33 5.8"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Events E1 and E2; state S1."
    when: "Create E3, update E1's title, destroy E2, then call CalendarEvent/changes with sinceState S1."
    then: "created is [E3], updated is [E1], destroyed is [E2]; newState equals the state of a fresh CalendarEvent/get."
    sources:
      - "fastmail:t/CalendarEvent/changes/basic.t"
      - "cyrus:JMAPCalendars/calendarevent_changes"
      - "cyrus:JMAPCalendars/calendarevent_changes_issue2558"
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.8"

  - id: CEV-109
    title: "Page event changes with maxChanges and reject an unknown sinceState"
    method: "CalendarEvent/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "State S1, then seven events are created."
    when: "Call CalendarEvent/changes with sinceState S1 and maxChanges 3 until hasMoreChanges is false; then call with sinceState \"bogus\"."
    then: "No page has more than three ids and the pages together list each new id exactly once. The bogus state answers cannotCalculateChanges."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_changes"
      - "rfc:8620 5.2"

  - id: CEV-110
    title: "Report only stored event ids, never synthetic instance ids"
    method: "CalendarEvent/changes"
    spec: "draft-ietf-jmap-calendars-33 5.5 and draft-ietf-jmap-calendars-33 5.8"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Recurring event R1; a synthetic instance id X obtained from an expanding query; state S1."
    when: "Update X with a new title, destroy another synthetic instance Y, then call CalendarEvent/changes with sinceState S1."
    then: "updated is exactly [R1]. Neither X nor Y appears in created, updated or destroyed."
    sources:
      - "stalwart:calendar/instance.rs"
      - "cyrus:JMAPCalendars/calendarevent_changes_add_override_keep_main_unchanged"
      - "rfc:draft-ietf-jmap-calendars-33 5.5"
      - "rfc:draft-ietf-jmap-calendars-33 5.8"

  - id: CEV-111
    title: "Keep event tombstones for at least 30 days and never answer with a silent gap"
    method: "CalendarEvent/changes"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "State S1, then E1 is destroyed."
    when: "Advance the clock 29 days and call CalendarEvent/changes since S1; advance beyond the retention and call again."
    then: "The first call lists E1 in destroyed. The second either does the same or answers cannotCalculateChanges."
    sources:
      - "wildduck:plan 10.3 owned change log"

  - id: CEV-112
    title: "Push a StateChange for CalendarEvent when an event is written"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An EventSource connection with types=CalendarEvent is open."
    when: "Create an event, then destroy it, on another connection."
    then: "Two state events arrive; each has changed[accountId].CalendarEvent equal to the newState of the corresponding set response."
    sources:
      - "rfc:8620 7.1"
      - "rfc:8620 7.3"
      - "rfc:draft-ietf-jmap-calendars-33 10.5"
      - "wildduck:plan 10.3 push"

  - id: CEV-113
    title: "Answer fromAccountNotFound when copying from an account the user cannot access"
    method: "CalendarEvent/copy"
    spec: "draft-ietf-jmap-calendars-33 5.10 and RFC 8620 5.4"
    level: must
    phase: 6
    applies: "adapted"
    seed: [jmap]
    given: "Two unrelated users; the second user has an event E9."
    when: "As the first user call CalendarEvent/copy with fromAccountId set to the second user's account id, accountId the own account and create {\"k1\": {\"id\": E9, \"calendarIds\": {C1: true}}}; repeat with a fromAccountId that does not exist."
    then: "Both calls answer with error type fromAccountNotFound. Nothing is created and E9 is untouched."
    sources:
      - "fastmail:t/CalendarEvent/copy/basic.t"
      - "cyrus:JMAPCalendars/calendarevent_copy"
      - "cyrus:JMAPCalendars/calendarevent_copy_error"
      - "cyrus:JMAPCalendars/calendarevent_copy_state"
      - "stalwart:calendar/acl.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.10"
      - "rfc:8620 5.4"
    notes: "There is never a second account, so the positive copy tests of Cyrus, Stalwart and Fastmail (which skips without an account pair) have no counterpart, and the privacy rules of draft 5.10 cannot be reached."

  - id: CEV-114
    title: "Reject a copy whose source and destination account are the same"
    method: "CalendarEvent/copy"
    spec: "RFC 8620 5.4"
    level: must
    phase: 6
    applies: "adapted"
    seed: [jmap]
    given: "An event E1 in the default calendar: title \"Lunch\", start \"2026-03-10T12:00:00\", timeZone \"Europe/Tallinn\", duration \"PT1H\"."
    when: "Call CalendarEvent/copy with fromAccountId and accountId both set to the user's account and create {\"k1\": {\"id\": E1}}."
    then: "The response is an error with type invalidArguments, and no second event with E1's uid appears."
    sources:
      - "rfc:8620 5.4"

  - id: CEV-115
    title: "Store a recurrence rule and return it unchanged"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.3.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with recurrenceRule {\"@type\": \"RecurrenceRule\", \"frequency\": \"monthly\", \"interval\": 2, \"byDay\": [{\"@type\": \"NDay\", \"day\": \"tu\", \"nthOfPeriod\": 2}], \"count\": 10}."
    then: "CalendarEvent/get returns the rule with the same frequency, interval, byDay and count. Defaults that were not sent (rscale \"gregorian\", skip \"omit\", firstDayOfWeek \"mo\") are either omitted or returned with those values."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_recurrence"
      - "cyrus:JMAPCalendars/calendarevent_get_recurrence"
      - "fastmail:t/CalendarEvent/set/update.t"
      - "stalwart:calendar/event.rs"
      - "rfc:8984 4.3.3"
    notes: "The draft and JSCalendar bis use a single recurrenceRule object; RFC 8984 had a recurrenceRules array and excludedRecurrenceRules. Rule part names and semantics are those of RFC 8984 4.3.3 and may move with the bis draft."

  - id: CEV-116
    title: "Require a valid frequency in a recurrence rule"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.3.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create events whose recurrenceRule has no frequency, frequency \"fortnightly\" and frequency \"WEEKLY\"."
    then: "All three fail with invalidProperties pointing at recurrenceRule/frequency. The seven lowercase values yearly, monthly, weekly, daily, hourly, minutely and secondly are accepted."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_get_empty_rrule"
      - "rfc:8984 4.3.3"

  - id: CEV-117
    title: "Reject interval zero and a rule with both count and until"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.3.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create events with recurrenceRule {frequency \"daily\", interval 0}, {frequency \"daily\", interval -1} and {frequency \"daily\", count 3, until \"2026-02-01T00:00:00\"}."
    then: "All three fail with invalidProperties pointing into recurrenceRule (interval, interval, and count or until)."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_recurrence"
      - "rfc:8984 4.3.3"

  - id: CEV-118
    title: "Validate byDay entries"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.3.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create events with byDay [{\"day\": \"xx\"}], byDay [{\"day\": \"mo\", \"nthOfPeriod\": 0}] and byDay [{\"day\": \"Mo\"}]."
    then: "All three fail with invalidProperties pointing at recurrenceRule/byDay. byDay [{\"day\": \"fr\", \"nthOfPeriod\": -1}] is accepted."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_recurrence"
      - "rfc:8984 4.3.3"

  - id: CEV-119
    title: "Validate the ranges of the numeric by parts"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.3.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create events with byMonthDay [0], byMonthDay [32], byMonthDay [], byMonth [\"13\"], byMonth [3] (a number), byYearDay [367], byWeekNo [54], byHour [24], byMinute [60], bySecond [61] and bySetPosition []."
    then: "Every create fails with invalidProperties pointing at the offending part. byMonthDay [-31, 31], byMonth [\"1\", \"12\"], byYearDay [-366], byWeekNo [-53], byHour [0, 23], bySecond [60] and bySetPosition [-1] are accepted."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_recurrence_bymonthday"
      - "cyrus:JMAPCalendars/calendarevent_set_bymonth"
      - "rfc:8984 4.3.3"

  - id: CEV-120
    title: "Validate firstDayOfWeek and skip"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.3.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create events with firstDayOfWeek \"sunday\", skip \"sideways\", and valid values firstDayOfWeek \"su\" and skip \"backward\"."
    then: "The first two fail with invalidProperties pointing at the part; the valid ones are stored and returned."
    sources:
      - "rfc:8984 4.3.3"

  - id: CEV-121
    title: "Reject recurrence rules in a calendar system other than gregorian"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.3.3"
    level: wd
    phase: 6
    applies: "adapted"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create events with recurrenceRule rscale \"hebrew\", rscale \"chinese\" with byMonth [\"3L\"], and rscale \"gregorian\"."
    then: "The first two fail with invalidProperties pointing at recurrenceRule/rscale. The third is created; rscale is compared case sensitively in lowercase."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_get_rscale"
      - "cyrus:JMAPCalendars/rscale_in_jmap_hidden_in_caldav"
      - "rfc:8984 4.3.3"
    notes: "Open question. Non gregorian expansion needs calendar data the planned engine does not have. Rejecting on write is preferred over storing a rule the server cannot expand (which would surface later as cannotCalculateOccurrences and silent missing alerts)."

  - id: CEV-122
    title: "Accept until as a LocalDateTime in the event's time zone"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.3.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A user whose default calendar C1 exists."
    when: "Create an event with recurrenceRule {frequency \"daily\", until \"2026-01-07T09:00:00\"}, and one with until \"2026-01-07T09:00:00Z\"."
    then: "The first is stored and returns until unchanged. The second fails with invalidProperties pointing at recurrenceRule/until."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_recurrence_until"
      - "cyrus:JMAPCalendars/calendarevent_set_recurrence_untilallday"
      - "rfc:8984 4.3.3"

  - id: CEV-123
    title: "Store recurrence overrides that patch, exclude and add instances"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.3.5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}, no overrides."
    when: "Update R1 with recurrenceOverrides {\"2026-01-12T09:00:00\": {\"title\": \"Special\", \"start\": \"2026-01-12T11:00:00\"}, \"2026-01-19T09:00:00\": {\"excluded\": true}, \"2026-01-21T15:00:00\": {}}."
    then: "CalendarEvent/get returns the three override keys with exactly these patch objects."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_recurrenceoverrides"
      - "cyrus:JMAPCalendars/calendarevent_get_recurrenceoverrides"
      - "cyrus:JMAPCalendars/calendarevent_set_recurrenceinstances"
      - "cyrus:JMAPCalendars/calendarevent_set_recurrenceinstances_rdate"
      - "cyrus:JMAPCalendars/calendarevent_get_rdate_period"
      - "fastmail:t/CalendarEvent/set/update.t"
      - "rfc:8984 4.3.5"
      - "rfc:8984 6.9"

  - id: CEV-124
    title: "Validate recurrence override keys and patched values"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.3.5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}, no overrides."
    when: "Update R1 with recurrenceOverrides whose key is \"2026-01-12\" (not a LocalDateTime), whose key is \"2026-01-12T09:00:00Z\", and whose patch sets \"duration\": \"nonsense\"."
    then: "All three are rejected with invalidProperties pointing into recurrenceOverrides; R1 is unchanged."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_recurrenceoverrides_mixed_datetypes"
      - "cyrus:JMAPCalendars/calendarevent_get_recurrenceid_date_start_datetime"
      - "rfc:8984 4.3.5"

  - id: CEV-125
    title: "Reject an excluded override that patches other properties"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.3.5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}, no overrides."
    when: "Update R1 with recurrenceOverrides {\"2026-01-12T09:00:00\": {\"excluded\": true, \"title\": \"Gone\"}}."
    then: "notUpdated[R1] has type invalidProperties pointing at the override."
    sources:
      - "rfc:8984 4.3.5"
      - "rfc:8984 4.3.6"

  - id: CEV-126
    title: "Ignore override pointers to properties that cannot be overridden"
    method: "CalendarEvent/set"
    spec: "RFC 8984 4.3.5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}, no overrides."
    when: "Update R1 with recurrenceOverrides {\"2026-01-12T09:00:00\": {\"uid\": \"other\", \"privacy\": \"secret\", \"method\": \"cancel\", \"recurrenceRule\": null, \"title\": \"Kept\"}}."
    then: "The update is accepted. Fetching the instance through its synthetic id shows title \"Kept\" while uid, privacy and the absence of method equal the base event. The stored override may drop the ignored pointers."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_method"
      - "cyrus:JMAPCalendars/calendarevent_set_privacy_ignore_override"
      - "cyrus:JMAPCalendars/calendarevent_get_privacy_ignore_override"
      - "rfc:8984 4.3.5"
    notes: "RFC 8984 lists the ignored prefixes: @type, excludedRecurrenceRules, method, privacy, prodId, recurrenceId, recurrenceIdTimeZone, recurrenceOverrides, recurrenceRules, relatedTo, replyTo, sentBy, timeZones, uid. The draft adds its own stricter rules for isDraft, utcStart, utcEnd, mayInviteSelf, mayInviteOthers and hideAttendees, which are rejected (see CEV scenarios above)."

  - id: CEV-127
    title: "Patch a property inside an existing recurrence override with an escaped path"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "R1 with participants tom and zoe and recurrenceOverrides {\"2026-01-12T09:00:00\": {\"start\": \"2026-01-12T10:00:00\", \"participants/tom/participationStatus\": \"declined\"}}."
    when: "Update R1 with {\"recurrenceOverrides/2026-01-12T09:00:00/participants~1zoe~1participationStatus\": \"declined\"}."
    then: "The override now holds start plus both participants/tom/participationStatus and participants/zoe/participationStatus set to \"declined\"."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_participants_recur"
      - "rfc:draft-ietf-jmap-calendars-33 5.9.1"

  - id: CEV-128
    title: "Remove one entry from an override patch with a null value"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "The override from the previous scenario with both participants declined."
    when: "Update R1 with {\"recurrenceOverrides/2026-01-12T09:00:00/participants~1tom~1participationStatus\": null}."
    then: "The override keeps start and zoe's status; the entry for tom is gone, so tom inherits the base status for that instance."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 5.9.1"

  - id: CEV-129
    title: "Require the whole override object to add a null valued patch entry"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "R1 with participants tom and zoe and an override for \"2026-01-12T09:00:00\" containing only start."
    when: "First update R1 with {\"recurrenceOverrides/2026-01-12T09:00:00/participants~1tom\": null}. Then update with {\"recurrenceOverrides/2026-01-12T09:00:00\": {\"start\": \"2026-01-12T10:00:00\", \"participants/tom\": null}}."
    then: "The first update is accepted as a removal of an entry that does not exist and leaves the override unchanged (it does not remove tom from the instance). After the second update the override contains \"participants/tom\": null and the instance fetched through its synthetic id has no participant tom."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 5.9.1"
    notes: "This is the trap described around figures 5 and 6 of the draft. Rejecting the first update with invalidPatch would also be defensible; the draft only says it does not do what the client wants."

  - id: CEV-130
    title: "Filter returned overrides with recurrenceOverridesBefore and recurrenceOverridesAfter"
    method: "CalendarEvent/get"
    spec: "draft-ietf-jmap-calendars-33 5.7"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "R1 in Europe/Tallinn with overrides for 2026-01-12, 2026-01-19 and 2026-01-26 at 09:00:00 local (07:00:00Z)."
    when: "Call CalendarEvent/get with recurrenceOverridesAfter \"2026-01-19T07:00:00Z\" and recurrenceOverridesBefore \"2026-01-26T07:00:00Z\"; then with each argument alone."
    then: "With both, only the 2026-01-19 override is returned (after is inclusive, before exclusive). With only After, 19 and 26 are returned; with only Before, 12 and 19."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_get_recurrenceoverrides_before_after"
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.7"

  - id: CEV-131
    title: "Resolve a synthetic instance id into a single event with start and recurrenceId"
    method: "CalendarEvent/get"
    spec: "draft-ietf-jmap-calendars-33 5.7"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}, no overrides. An expanding query over January 2026 returned synthetic ids X05, X12, X19 and X26 for its four occurrences."
    when: "Call CalendarEvent/get with ids [X12] and properties null."
    then: "One object is returned with id X12, baseEventId R1, start \"2026-01-12T09:00:00\", recurrenceId \"2026-01-12T09:00:00\", the title, duration, timeZone, uid and calendarIds of R1, and no recurrenceRule or recurrenceOverrides."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_get_recurrenceinstances"
      - "cyrus:JMAPCalendars/calendarevent_get_baseeventid"
      - "stalwart:calendar/instance.rs"
      - "fastmail:t/CalendarEvent/query/expand-recurrences.t"
      - "rfc:draft-ietf-jmap-calendars-33 5"
      - "rfc:draft-ietf-jmap-calendars-33 5.7"

  - id: CEV-132
    title: "Return recurrenceRule and recurrenceOverrides as null for a synthetic instance when requested"
    method: "CalendarEvent/get"
    spec: "draft-ietf-jmap-calendars-33 5.7"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}, no overrides. An expanding query over January 2026 returned synthetic ids X05, X12, X19 and X26 for its four occurrences."
    when: "Call CalendarEvent/get with ids [X12] and properties [\"recurrenceRule\", \"recurrenceOverrides\", \"start\"]."
    then: "recurrenceRule is null and recurrenceOverrides is null; start is \"2026-01-12T09:00:00\"."
    sources:
      - "stalwart:calendar/instance.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.7"

  - id: CEV-133
    title: "Apply the override when fetching an overridden instance and keep its original recurrenceId"
    method: "CalendarEvent/get"
    spec: "draft-ietf-jmap-calendars-33 5.7"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "R1 with override {\"2026-01-12T09:00:00\": {\"start\": \"2026-01-12T11:00:00\", \"title\": \"Special\"}}; synthetic id X12 from an expanding query."
    when: "Call CalendarEvent/get with ids [X12]."
    then: "start is \"2026-01-12T11:00:00\", title is \"Special\", recurrenceId is still \"2026-01-12T09:00:00\" and baseEventId is R1."
    sources:
      - "stalwart:calendar/instance.rs"
      - "cyrus:JMAPCalendars/calendarevent_get_recurrenceinstances"
      - "rfc:draft-ietf-jmap-calendars-33 5.7"

  - id: CEV-134
    title: "Report synthetic ids of unknown, excluded or destroyed instances as notFound"
    method: "CalendarEvent/get"
    spec: "draft-ietf-jmap-calendars-33 5.7"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}, no overrides. An expanding query over January 2026 returned synthetic ids X05, X12, X19 and X26 for its four occurrences. Then X19 is excluded through an override and, separately, a syntactically valid synthetic id is built for a date the rule does not generate."
    when: "Call CalendarEvent/get with ids [X19, theInventedId]; then destroy R1 and get X12."
    then: "All three ids are reported in notFound."
    sources:
      - "stalwart:calendar/instance.rs"
      - "cyrus:JMAPCalendars/calendarevent_get_ignore_dead_standalone_instance"
      - "rfc:draft-ietf-jmap-calendars-33 5.7"

  - id: CEV-135
    title: "Return baseEventId only for synthetic ids"
    method: "CalendarEvent/get"
    spec: "draft-ietf-jmap-calendars-33 5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}, no overrides. An expanding query over January 2026 returned synthetic ids X05, X12, X19 and X26 for its four occurrences."
    when: "Call CalendarEvent/get with ids [R1, X12] and properties [\"baseEventId\"]."
    then: "X12 has baseEventId R1. R1 has baseEventId null or omits it."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_get_baseeventid"
      - "cyrus:JMAPCalendars/calendarevent_set_baseeventid"
      - "rfc:draft-ietf-jmap-calendars-33 5"

  - id: CEV-136
    title: "Compute utcStart and utcEnd per instance for synthetic ids"
    method: "CalendarEvent/get"
    spec: "draft-ietf-jmap-calendars-33 5.7"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "R1 (09:00 Europe/Tallinn weekly) expanded over 2026-03-20 to 2026-04-05, giving instances on 2026-03-23 and 2026-03-30."
    when: "Call CalendarEvent/get for both synthetic ids with properties [\"utcStart\", \"utcEnd\"]."
    then: "The 2026-03-23 instance has utcStart \"2026-03-23T07:00:00Z\"; the 2026-03-30 instance, after the switch to summer time, has utcStart \"2026-03-30T06:00:00Z\". utcEnd is one hour later in both."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_get_utcstart"
      - "cyrus:JMAPCalendars/calendarevent_set_utcstart_recur"
      - "rfc:draft-ietf-jmap-calendars-33 5"
      - "rfc:draft-ietf-jmap-calendars-33 5.7"

  - id: CEV-137
    title: "Keep synthetic ids valid, stable and within the id character set"
    method: "CalendarEvent/get"
    spec: "draft-ietf-jmap-calendars-33 5.11"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}, no overrides. An expanding query over January 2026 returned synthetic ids X05, X12, X19 and X26 for its four occurrences."
    when: "Repeat the same expanding query after updating R1's title and after restarting the JMAP worker; fetch X12 obtained before the changes."
    then: "The query returns the same four ids each time, X12 still resolves to the 2026-01-12 instance, and every id uses only A-Za-z0-9-_ and is at most 255 octets."
    sources:
      - "stalwart:calendar/instance.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.11"
      - "rfc:8620 1.2"
      - "wildduck:plan 10.2 recurrence engine"
    notes: "The draft only requires that the id identifies base event id plus recurrence id. Encoding both into the id (as the plan states) makes them stable for free."

  - id: CEV-138
    title: "Return non recurring events under their real id from an expanding query"
    method: "CalendarEvent/get"
    spec: "draft-ietf-jmap-calendars-33 5.11"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A single non recurring event E1 inside the queried window."
    when: "Run an expanding query, then CalendarEvent/get with the returned id."
    then: "The returned id is E1 itself; the object has no baseEventId and no recurrenceId."
    sources:
      - "stalwart:calendar/instance.rs"
      - "fastmail:t/CalendarEvent/query/expand-recurrences.t"
      - "rfc:draft-ietf-jmap-calendars-33 5.11"
    notes: "Stalwart also accepts a synthetic form for a non recurring event and maps it to the event itself; WildDuck does not issue such ids."

  - id: CEV-139
    title: "Turn an update of a rule generated instance into a recurrence override on the base event"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}, no overrides. An expanding query over January 2026 returned synthetic ids X05, X12, X19 and X26 for its four occurrences. CalendarEvent state S1."
    when: "Call CalendarEvent/set with update {X12: {\"title\": \"Moved\", \"start\": \"2026-01-12T14:00:00\"}}, then CalendarEvent/get for R1."
    then: "updated has the key X12. R1 now has recurrenceOverrides {\"2026-01-12T09:00:00\": {\"title\": \"Moved\", \"start\": \"2026-01-12T14:00:00\"}} and its own title is unchanged. No new event id exists."
    sources:
      - "stalwart:calendar/instance.rs"
      - "fastmail:t/CalendarEvent/set/update.t"
      - "cyrus:JMAPCalendars/calendarevent_set_recurrenceinstances"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"
      - "rfc:draft-ietf-jmap-calendars-33 5.5"

  - id: CEV-140
    title: "Patch an existing override when an already overridden instance is updated"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "R1 with override {\"2026-01-12T09:00:00\": {\"title\": \"Moved\"}}; synthetic id X12."
    when: "Update X12 with {\"description\": \"Bring slides\"}."
    then: "The override for 2026-01-12 now has both title \"Moved\" and description \"Bring slides\"."
    sources:
      - "stalwart:calendar/instance.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-141
    title: "Drop an override entry when an instance is set back to the base value"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: should
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "R1 (title \"Standup\") with override {\"2026-01-12T09:00:00\": {\"title\": \"Moved\"}}; synthetic id X12."
    when: "Update X12 with {\"title\": \"Standup\"}."
    then: "The instance has title \"Standup\". The stored override no longer patches title; an override left empty for a rule generated date is removed."
    sources:
      - "stalwart:calendar/instance.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"
    notes: "Keeps overrides minimal. Storing a redundant patch is harmless but makes this and future edits leak into old instances."

  - id: CEV-142
    title: "Exclude only that occurrence when a synthetic instance is destroyed"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}, no overrides. An expanding query over January 2026 returned synthetic ids X05, X12, X19 and X26 for its four occurrences."
    when: "Call CalendarEvent/set with destroy [X19], then repeat the expanding query and get R1."
    then: "destroyed is [X19]. The query returns three ids (05, 12, 26). R1 still exists and has recurrenceOverrides {\"2026-01-19T09:00:00\": {\"excluded\": true}}."
    sources:
      - "stalwart:calendar/instance.rs"
      - "fastmail:t/CalendarEvent/set/update.t"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-143
    title: "Replace an existing override with an exclusion when an overridden instance is destroyed"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "R1 with override {\"2026-01-12T09:00:00\": {\"start\": \"2026-01-12T14:00:00\"}}; synthetic id X12."
    when: "Destroy X12, then run the expanding query."
    then: "The override becomes {\"excluded\": true}; neither the 09:00 nor the 14:00 occurrence on 2026-01-12 is returned."
    sources:
      - "stalwart:calendar/instance.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-144
    title: "Remove an added instance entirely when it is destroyed"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9 and RFC 8984 4.3.5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "R1 with an extra instance override {\"2026-01-21T15:00:00\": {}}; its synthetic id XA."
    when: "Destroy XA."
    then: "The key 2026-01-21T15:00:00 is removed from recurrenceOverrides (an exclusion for a date the rule does not generate is not kept), and the expanding query no longer returns it."
    sources:
      - "stalwart:calendar/instance.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"
      - "rfc:draft-ietf-jmap-calendars-33 5.9.2.2"

  - id: CEV-145
    title: "Allow excluding the first occurrence"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}, no overrides. An expanding query over January 2026 returned synthetic ids X05, X12, X19 and X26 for its four occurrences."
    when: "Destroy X05, the instance on the event's own start."
    then: "The destroy succeeds. R1 keeps start \"2026-01-05T09:00:00\" and gains an excluded override for it; the expanding query starts with the 2026-01-12 instance."
    sources:
      - "stalwart:calendar/instance.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-146
    title: "Change several instances of one event in a single request"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}, no overrides. An expanding query over January 2026 returned synthetic ids X05, X12, X19 and X26 for its four occurrences."
    when: "Call CalendarEvent/set with update {X12: {\"title\": \"A\"}, X19: {\"title\": \"B\"}} and destroy [X26]."
    then: "All three succeed and R1 ends up with three override keys: two title patches and one exclusion. CalendarEvent/changes reports R1 once in updated."
    sources:
      - "stalwart:calendar/instance.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-147
    title: "Isolate a rejected instance update from other instances in the same request"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}, no overrides. An expanding query over January 2026 returned synthetic ids X05, X12, X19 and X26 for its four occurrences."
    when: "Call CalendarEvent/set with update {X12: {\"title\": \"Fine\"}, X19: {\"duration\": \"bogus\"}}."
    then: "updated contains X12 and notUpdated[X19] has type invalidProperties. R1 has an override for 2026-01-12 only."
    sources:
      - "stalwart:calendar/instance.rs"
      - "rfc:8620 5.3"

  - id: CEV-148
    title: "Reject a request that changes both a base event and one of its synthetic instances"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}, no overrides. An expanding query over January 2026 returned synthetic ids X05, X12, X19 and X26 for its four occurrences."
    when: "Call CalendarEvent/set with update {R1: {\"title\": \"Base\"}, X12: {\"title\": \"Instance\"}}; in another request send destroy [R1] together with update {X12: {...}}."
    then: "In both requests every entry that refers to R1 or its instances is rejected with invalidProperties and R1 is unchanged. Entries for unrelated events in the same request are applied."
    sources:
      - "stalwart:calendar/instance.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"
    notes: "The draft declares the result undefined and forbids clients from doing it. Rejecting deterministically, as Stalwart does, is safer than last write wins."

  - id: CEV-149
    title: "Reject instance updates of properties that cannot differ per occurrence"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9 and RFC 8984 4.3.5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}, no overrides. An expanding query over January 2026 returned synthetic ids X05, X12, X19 and X26 for its four occurrences."
    when: "Update X12 with {\"recurrenceRule\": {...}}, with {\"uid\": \"x\"}, with {\"privacy\": \"private\"}, with {\"isDraft\": true}, with {\"calendarIds\": {other: true}} and with {\"recurrenceOverrides\": {}}."
    then: "Each update is rejected with invalidProperties naming the property; R1 is unchanged."
    sources:
      - "stalwart:calendar/instance.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-150
    title: "Ignore instance update values that equal what the instance already inherits"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: should
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}, no overrides. An expanding query over January 2026 returned synthetic ids X05, X12, X19 and X26 for its four occurrences."
    when: "Update X12 by sending back the complete object as fetched (including uid, calendarIds, recurrenceId and baseEventId) with only title changed."
    then: "The update succeeds and the override contains only the title patch."
    sources:
      - "stalwart:calendar/instance.rs"
      - "cyrus:JMAPCalendars/calendarevent_set_baseeventid"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"
    notes: "Clients commonly send the whole object back. Unchanged immutable values are accepted, as in RFC 8620 5.3."

  - id: CEV-151
    title: "Report notFound for updates and destroys of synthetic ids that match no instance"
    method: "CalendarEvent/set"
    spec: "RFC 8620 5.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}, no overrides. An expanding query over January 2026 returned synthetic ids X05, X12, X19 and X26 for its four occurrences. X19 was excluded earlier."
    when: "Call CalendarEvent/set with update {X19: {\"title\": \"Back\"}} and destroy [X19]."
    then: "Both are rejected with notFound; the exclusion stays."
    sources:
      - "stalwart:calendar/instance.rs"
      - "rfc:8620 5.3"

  - id: CEV-152
    title: "Keep an instance's duration when only its start is patched"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An all day floating weekly event: start \"2026-01-05T00:00:00\", duration \"P1D\", showWithoutTime true; synthetic id of the 2026-01-12 instance."
    when: "Update the instance with {\"start\": \"2026-01-13T00:00:00\"}; fetch it."
    then: "The instance has start \"2026-01-13T00:00:00\", duration \"P1D\", showWithoutTime true and timeZone null; nothing was converted through UTC."
    sources:
      - "stalwart:calendar/instance.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.9"

  - id: CEV-153
    title: "Do not create an override when an alert is acknowledged through a synthetic instance id"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 6.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "R1 with alerts {\"a1\": offset \"-PT15M\"} and no overrides; synthetic id X12."
    when: "Update X12 with {\"alerts/a1/acknowledged\": \"2026-01-12T06:50:00Z\"}."
    then: "R1 has no recurrenceOverrides afterwards and its base alerts.a1.acknowledged is \"2026-01-12T06:50:00Z\"."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 6.2"
      - "rfc:8984 4.5.2"

  - id: CEV-154
    title: "Split a series for a this and future change using first and next relations"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.6.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}, no overrides. It has no participants."
    when: "In one CalendarEvent/set, update R1 with recurrenceRule/until \"2026-01-18T23:59:59\" and relatedTo {newUid: {relation {\"next\": true}}}, and create a new event with uid newUid, start \"2026-01-19T10:00:00\", the same weekly rule and relatedTo {R1uid: {relation {\"first\": true}}}."
    then: "Both changes succeed. An expanding query over January returns 05 and 12 at 09:00 from R1 and 19 and 26 at 10:00 from the new event. Both relatedTo maps read back as sent."
    sources:
      - "stalwart:calendar/instance.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.6.1"
      - "rfc:8984 4.1.3"
    notes: "The split is client driven; the server only has to store both events and the relations. The relation names first and next come from the JSCalendar bis draft."

  - id: CEV-155
    title: "Apply a this and future change by updating the base and overriding earlier occurrences"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.6.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}, no overrides. Title is \"Standup\"."
    when: "Update R1 with {\"title\": \"Sync\", \"recurrenceOverrides\": {\"2026-01-05T09:00:00\": {\"title\": \"Standup\"}, \"2026-01-12T09:00:00\": {\"title\": \"Standup\"}}}."
    then: "Expanded instances on 05 and 12 have title \"Standup\", those on 19 and 26 have \"Sync\". The event keeps its id and uid, and sequence increased by one."
    sources:
      - "stalwart:calendar/instance.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.6.2"

  - id: CEV-156
    title: "Accept overrides that place instances before the base event's start"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.6.2"
    level: should
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}, no overrides."
    when: "Update R1 with {\"start\": \"2026-01-19T09:00:00\", \"recurrenceOverrides\": {\"2026-01-05T09:00:00\": {}, \"2026-01-12T09:00:00\": {}}}."
    then: "The update is stored. An expanding query over January returns instances on 05, 12, 19 and 26."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 5.6.2"
      - "rfc:8984 4.3.5"
    notes: "The draft discourages clients from doing this but the data format allows it, so the server must store and expand it."

  - id: CEQ-001
    title: "Return all events for an empty or absent filter"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Events in calendar A: \"Budget review\" (2026-01-10 10:00 to 11:00 UTC), \"Team lunch\" (2026-01-15 12:00 to 13:00 UTC); in calendar B: \"Dentist\" (2026-02-03 08:00 to 08:30 UTC). All have timeZone \"Etc/UTC\"."
    when: "Call CalendarEvent/query with no filter, then with filter {}."
    then: "Both responses list the three event ids, with position 0, a queryState string and a canCalculateChanges boolean. total is absent because calculateTotal was not requested."
    sources:
      - "fastmail:t/CalendarEvent/query/basic.t"
      - "cyrus:JMAPCalendars/calendarevent_query"
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.11"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.1"
      - "rfc:8620 5.5"

  - id: CEQ-002
    title: "Filter by inCalendar"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Events in calendar A: \"Budget review\" (2026-01-10 10:00 to 11:00 UTC), \"Team lunch\" (2026-01-15 12:00 to 13:00 UTC); in calendar B: \"Dentist\" (2026-02-03 08:00 to 08:30 UTC). All have timeZone \"Etc/UTC\"."
    when: "Call CalendarEvent/query with filter {\"inCalendar\": idA}, then with {\"inCalendar\": idB}."
    then: "The first returns the two events of A, the second only \"Dentist\"."
    sources:
      - "fastmail:t/CalendarEvent/query/basic.t"
      - "cyrus:JMAPCalendars/calendarevent_query"
      - "cyrus:JMAPCalendars/calendarevent_query_no_sched_inbox"
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.1"

  - id: CEQ-003
    title: "Return no results for inCalendar with an unknown or destroyed calendar id"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.1"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Events in calendar A: \"Budget review\" (2026-01-10 10:00 to 11:00 UTC), \"Team lunch\" (2026-01-15 12:00 to 13:00 UTC); in calendar B: \"Dentist\" (2026-02-03 08:00 to 08:30 UTC). All have timeZone \"Etc/UTC\". Calendar B is then destroyed with onDestroyRemoveEvents true."
    when: "Call CalendarEvent/query with filter {\"inCalendar\": idB} and with {\"inCalendar\": \"Znope\"}."
    then: "Both return ids [] without an error."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_deleted_calendar"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.1"

  - id: CEQ-004
    title: "Match after against the event end and before against the event start"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Events in calendar A: \"Budget review\" (2026-01-10 10:00 to 11:00 UTC), \"Team lunch\" (2026-01-15 12:00 to 13:00 UTC); in calendar B: \"Dentist\" (2026-02-03 08:00 to 08:30 UTC). All have timeZone \"Etc/UTC\"."
    when: "Call CalendarEvent/query with filter {\"after\": \"2026-01-10T10:30:00\", \"before\": \"2026-01-15T12:30:00\"}."
    then: "Both \"Budget review\" (ends after the after bound) and \"Team lunch\" (starts before the before bound) match; \"Dentist\" does not."
    sources:
      - "fastmail:t/CalendarEvent/query/basic.t"
      - "cyrus:JMAPCalendars/calendarevent_query_datetime"
      - "cyrus:JMAPCalendars/calendarevent_query_date"
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.1"

  - id: CEQ-005
    title: "Treat after and before as exclusive bounds"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Events in calendar A: \"Budget review\" (2026-01-10 10:00 to 11:00 UTC), \"Team lunch\" (2026-01-15 12:00 to 13:00 UTC); in calendar B: \"Dentist\" (2026-02-03 08:00 to 08:30 UTC). All have timeZone \"Etc/UTC\"."
    when: "Call CalendarEvent/query with filter {\"after\": \"2026-01-10T11:00:00\"} and with filter {\"before\": \"2026-01-10T10:00:00\"}; then with {\"after\": \"2026-01-10T10:59:59\"} and {\"before\": \"2026-01-10T10:00:01\"}."
    then: "\"Budget review\" (10:00 to 11:00) is absent from the first two results and present in the last two."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_datetime"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.1"

  - id: CEQ-006
    title: "Interpret after and before in the timeZone argument"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11 and draft-ietf-jmap-calendars-33 5.11.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event at utc 2025-12-31T20:00:00Z for one hour (timeZone \"Etc/UTC\")."
    when: "Call CalendarEvent/query with filter {\"after\": \"2026-01-01T00:00:00\", \"before\": \"2026-02-01T00:00:00\"}, once without timeZone and once with timeZone \"Australia/Melbourne\"."
    then: "Without timeZone the event does not match. With Australia/Melbourne the window begins at 2025-12-31T13:00:00Z, so the event matches."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_with_timezone"
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.11"
      - "rfc:draft-ietf-jmap-calendars-33 8.1"

  - id: CEQ-007
    title: "Interpret floating events in the timeZone argument when filtering"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A floating event with start \"2026-01-01T02:00:00\" and duration \"PT1H\"."
    when: "Call CalendarEvent/query with filter {\"after\": \"2026-01-01T00:00:00\", \"before\": \"2026-01-01T06:00:00\"} with timeZone \"Etc/UTC\", then with timeZone \"Asia/Tokyo\", then with filter {\"before\": \"2026-01-01T02:30:00\"} for both zones."
    then: "The event matches in every case: the window and the floating start are interpreted in the same zone, so the local comparison is all that matters."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_datetime"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.1"

  - id: CEQ-008
    title: "Compare zoned events against the window as absolute times"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event with start \"2026-01-01T02:00:00\" in \"America/New_York\" (07:00:00Z), duration \"PT1H\"."
    when: "Call CalendarEvent/query with filter {\"after\": \"2026-01-01T00:00:00\", \"before\": \"2026-01-01T06:00:00\"} and timeZone \"Etc/UTC\"; then with timeZone \"America/New_York\"."
    then: "No match with Etc/UTC (the event starts at 07:00Z, after the window). A match with America/New_York."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_with_timezone"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.1"

  - id: CEQ-009
    title: "Reject an unknown timeZone argument and malformed bounds"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Events in calendar A: \"Budget review\" (2026-01-10 10:00 to 11:00 UTC), \"Team lunch\" (2026-01-15 12:00 to 13:00 UTC); in calendar B: \"Dentist\" (2026-02-03 08:00 to 08:30 UTC). All have timeZone \"Etc/UTC\"."
    when: "Call CalendarEvent/query with timeZone \"Not/AZone\"; with filter {\"after\": \"2026-01-01T00:00:00Z\"}; with filter {\"before\": \"2026-01-01\"}."
    then: "Each call answers with error type invalidArguments."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 5.11"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.1"
      - "rfc:8620 5.5"

  - id: CEQ-010
    title: "Match a recurring event once when any occurrence falls in the range and recurrences are not expanded"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1 starting 2026-01-05T09:00:00 with count 8."
    when: "Call CalendarEvent/query with filter {\"after\": \"2026-02-01T00:00:00\", \"before\": \"2026-02-08T00:00:00\"} and expandRecurrences false or omitted."
    then: "ids is [R1], the stored event id, exactly once."
    sources:
      - "fastmail:t/CalendarEvent/query/expand-recurrences.t"
      - "cyrus:JMAPCalendars/calendarevent_query_expandrecurrences"
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.11"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.1"

  - id: CEQ-011
    title: "Do not match a recurring event whose occurrences all lie outside the range"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event with count 4 starting 2026-01-05T09:00:00 (last occurrence 2026-01-26), with the 2026-01-12 occurrence excluded."
    when: "Call CalendarEvent/query with filter after \"2026-02-01T00:00:00\" before \"2026-03-01T00:00:00\"; then with after \"2026-01-12T00:00:00\" before \"2026-01-13T00:00:00\"."
    then: "Neither query returns the event: the first lies after the series ends, the second covers only the excluded occurrence."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_datetime"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.1"
      - "wildduck:plan 10.2 CalendarEvent storage"
    notes: "The stored firstStart and lastEnd bounds only preselect candidates; the exact answer needs expansion."

  - id: CEQ-012
    title: "Match an occurrence moved into the range by an override and not one moved out of it"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Weekly R1 at 09:00 with override {\"2026-01-12T09:00:00\": {\"start\": \"2026-01-14T09:00:00\"}}."
    when: "Call CalendarEvent/query with filter after \"2026-01-14T00:00:00\" before \"2026-01-15T00:00:00\"; then after \"2026-01-12T00:00:00\" before \"2026-01-13T00:00:00\"."
    then: "The first returns R1, the second does not."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_expandrecurrences"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.1"

  - id: CEQ-013
    title: "Match an unbounded recurrence far in the future"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A yearly event starting 2026-06-01T10:00:00 with no count or until."
    when: "Call CalendarEvent/query with filter after \"2090-05-31T00:00:00\" before \"2090-06-02T00:00:00\" (inside maxDateTime)."
    then: "The event is returned."
    sources:
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.1"
      - "wildduck:plan 10.2 CalendarEvent storage"

  - id: CEQ-014
    title: "Filter by uid exactly"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Events in calendar A: \"Budget review\" (2026-01-10 10:00 to 11:00 UTC), \"Team lunch\" (2026-01-15 12:00 to 13:00 UTC); in calendar B: \"Dentist\" (2026-02-03 08:00 to 08:30 UTC). All have timeZone \"Etc/UTC\"."
    when: "Call CalendarEvent/query with filter {\"uid\": <uid of \"Dentist\">}, then with the same uid in a different letter case, then with a prefix of it."
    then: "Only the exact uid returns \"Dentist\"; the other two return ids []."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query"
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.1"

  - id: CEQ-015
    title: "Return every standalone instance for a uid filter"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Two standalone instances with uid \"series-1\" and different recurrenceIds."
    when: "Call CalendarEvent/query with filter {\"uid\": \"series-1\"}."
    then: "Both instance ids are returned."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_get_standalone_added_later"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.1"
      - "rfc:draft-ietf-jmap-calendars-33 1.4.1"

  - id: CEQ-016
    title: "Search title, description and location name with their dedicated filters"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Event X: title \"Quarterly planning\", description \"Bring the roadmap\", location name \"Harbour room\". Event Y: title \"Roadmap\", description \"Quarterly\", location name \"Planning office\"."
    when: "Call CalendarEvent/query with filter {\"title\": \"roadmap\"}, {\"description\": \"roadmap\"}, {\"location\": \"harbour\"} and {\"location\": \"planning\"}."
    then: "The results are [Y], [X], [X] and [Y]. Matching is case insensitive and each filter looks only at its own property."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_text"
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.1"

  - id: CEQ-017
    title: "Search across title, description, locations and participants with text"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Four events, each containing the word \"zebra\" in exactly one of: title, description, a location name, a participant name; a fifth has a participant with email zebra@example.com; a sixth contains it nowhere."
    when: "Call CalendarEvent/query with filter {\"text\": \"zebra\"}."
    then: "The first five events are returned, the sixth is not."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_text"
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.1"

  - id: CEQ-018
    title: "Filter by participant and by owner"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Event X: owner \"Carol King\" <carol@example.net>, attendee \"Bob Stone\" <bob@example.net>. Event Y: owner \"Bob Stone\", attendee \"Dave\". Event Z: no participants."
    when: "Call CalendarEvent/query with filter {\"participant\": \"bob\"}, {\"owner\": \"bob\"}, {\"owner\": \"carol@example.net\"} and {\"participant\": \"nobody\"}."
    then: "The results are [X, Y], [Y], [X] and []. Name and email are both searched; owner only considers participants with the owner role."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_text"
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.1"

  - id: CEQ-019
    title: "Apply phrase and token rules to string filters"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.1"
    level: should
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Event X with title \"big red bus\", event Y with title \"red big buses\", event Z with title \"business\"."
    when: "Call CalendarEvent/query with filter {\"title\": \"\\\"big red\\\"\"}, {\"title\": \"red big\"}, and {\"title\": \"bus\"}."
    then: "The quoted phrase matches only X. The two unquoted tokens must both be present and match X and Y. \"bus\" matches X, may match Y through stemming, and never matches Z."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_text"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.1"

  - id: CEQ-020
    title: "Match string filters against overridden values of a recurrence"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Weekly R1 titled \"Standup\" with override {\"2026-01-12T09:00:00\": {\"title\": \"Retrospective\", \"locations\": {\"l9\": {\"name\": \"Rooftop\"}}}}."
    when: "Call CalendarEvent/query (not expanded) with filter {\"title\": \"retrospective\"}, then {\"location\": \"rooftop\"}, then {\"text\": \"retrospective\"}."
    then: "Each query returns [R1]."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_text"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.1"

  - id: CEQ-021
    title: "Let conditions match different instances when not expanding, and require one instance when expanding"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Weekly R1 titled \"Standup\" starting 2026-01-05T09:00:00 with override {\"2026-01-12T09:00:00\": {\"title\": \"Retrospective\"}}."
    when: "Call CalendarEvent/query with filter {\"title\": \"retrospective\", \"after\": \"2026-01-19T00:00:00\", \"before\": \"2026-01-20T00:00:00\"}, first with expandRecurrences false, then true."
    then: "Not expanded: [R1] (the title matches one instance, the range another). Expanded: ids [] because no single instance satisfies both conditions."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 5.11.1"

  - id: CEQ-022
    title: "Combine conditions with AND, OR and NOT operators"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.1 and RFC 8620 5.5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Events in calendar A: \"Budget review\" (2026-01-10 10:00 to 11:00 UTC), \"Team lunch\" (2026-01-15 12:00 to 13:00 UTC); in calendar B: \"Dentist\" (2026-02-03 08:00 to 08:30 UTC). All have timeZone \"Etc/UTC\"."
    when: "Call CalendarEvent/query with filter {\"operator\": \"OR\", \"conditions\": [{\"title\": \"budget\"}, {\"inCalendar\": idB}]}; with {\"operator\": \"AND\", \"conditions\": [{\"inCalendar\": idA}, {\"operator\": \"NOT\", \"conditions\": [{\"title\": \"lunch\"}]}]}."
    then: "The first returns \"Budget review\" and \"Dentist\". The second returns only \"Budget review\"."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query"
      - "stalwart:calendar/event.rs"
      - "rfc:8620 5.5"

  - id: CEQ-023
    title: "Treat multiple properties in one FilterCondition as AND"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Events in calendar A: \"Budget review\" (2026-01-10 10:00 to 11:00 UTC), \"Team lunch\" (2026-01-15 12:00 to 13:00 UTC); in calendar B: \"Dentist\" (2026-02-03 08:00 to 08:30 UTC). All have timeZone \"Etc/UTC\"."
    when: "Call CalendarEvent/query with filter {\"inCalendar\": idA, \"title\": \"lunch\"} and with {\"inCalendar\": idB, \"title\": \"lunch\"}."
    then: "The first returns \"Team lunch\", the second returns ids []."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.1"

  - id: CEQ-024
    title: "Reject unknown filter properties and wrongly typed values"
    method: "CalendarEvent/query"
    spec: "RFC 8620 5.5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Events in calendar A: \"Budget review\" (2026-01-10 10:00 to 11:00 UTC), \"Team lunch\" (2026-01-15 12:00 to 13:00 UTC); in calendar B: \"Dentist\" (2026-02-03 08:00 to 08:30 UTC). All have timeZone \"Etc/UTC\"."
    when: "Call CalendarEvent/query with filter {\"colour\": \"red\"}, with {\"inCalendar\": 5} and with {\"operator\": \"XOR\", \"conditions\": []}."
    then: "Each call answers with error type invalidArguments."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_unsupported"
      - "rfc:8620 5.5"
    notes: "Cyrus answers unsupportedFilter for a filter tree too complex for its index. WildDuck should cap the filter depth and condition count the same way and answer unsupportedFilter beyond the cap."

  - id: CEQ-025
    title: "Include draft events in query results"
    method: "CalendarEvent/query"
    spec: "RFC 8620 5.5"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "One draft event (isDraft true) and one normal event in the same range."
    when: "Call CalendarEvent/query with a range filter covering both."
    then: "Both ids are returned."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_isdraft"
      - "rfc:draft-ietf-jmap-calendars-33 5"

  - id: CEQ-026
    title: "Query events before the Unix epoch"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.1"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "minDateTime is earlier than 1960. An event with start \"1960-06-01T10:00:00\" UTC."
    when: "Call CalendarEvent/query with filter after \"1960-01-01T00:00:00\" before \"1961-01-01T00:00:00\", sorted by start."
    then: "The event is returned; negative epoch times do not break filtering or sorting."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_unixepoch"
      - "rfc:draft-ietf-jmap-calendars-33 1.5.1"

  - id: CEQ-027
    title: "Sort by start as an absolute time, ascending and descending"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Event NY with start \"2026-06-01T09:00:00\" in \"America/New_York\" (13:00Z) and event LA with start \"2026-06-01T09:00:00\" in \"America/Los_Angeles\" (16:00Z), plus event EARLY at \"2026-06-01T12:30:00\" in \"Etc/UTC\"."
    when: "Call CalendarEvent/query with sort [{\"property\": \"start\"}], then with isAscending false."
    then: "Ascending order is EARLY, NY, LA; descending is LA, NY, EARLY. The lexical order of the start strings is not used."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_sort"
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.2"

  - id: CEQ-028
    title: "Interpret floating starts in the timeZone argument when sorting"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Floating event F at \"2026-06-01T10:00:00\" and zoned event U at \"2026-06-01T12:00:00\" in \"Etc/UTC\"."
    when: "Call CalendarEvent/query sorted by start with no timeZone, then with timeZone \"America/New_York\"."
    then: "Without timeZone F (10:00Z) sorts before U. With America/New_York F is 14:00Z and sorts after U."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_sort"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.2"

  - id: CEQ-029
    title: "Sort by id and by uid"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Three events with uids \"b\", \"a\", \"c\"."
    when: "Call CalendarEvent/query with sort [{\"property\": \"uid\"}], then [{\"property\": \"uid\", \"isAscending\": false}], then [{\"property\": \"id\"}]."
    then: "The uid sorts return a, b, c and c, b, a. The id sort returns the ids in ascending string order."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_sort"
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.2"

  - id: CEQ-030
    title: "Sort by created and updated"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.2"
    level: should
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Events E1, E2, E3 created in that order with distinct created times; E1 is then updated."
    when: "Call CalendarEvent/query with sort [{\"property\": \"created\"}], then [{\"property\": \"updated\", \"isAscending\": false}]."
    then: "created order is E1, E2, E3. updated descending starts with E1."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_sort"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.2"

  - id: CEQ-031
    title: "Answer unsupportedSort for a property that cannot be sorted on"
    method: "CalendarEvent/query"
    spec: "RFC 8620 5.5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Any events."
    when: "Call CalendarEvent/query with sort [{\"property\": \"title\"}] and with sort [{\"property\": \"nonsense\"}]."
    then: "Both answer with error type unsupportedSort."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_sort"
      - "rfc:8620 5.5"

  - id: CEQ-032
    title: "Use later comparators to break ties and keep the order stable"
    method: "CalendarEvent/query"
    spec: "RFC 8620 5.5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Three events with the same absolute start and uids \"b\", \"a\", \"c\"."
    when: "Call CalendarEvent/query twice with sort [{\"property\": \"start\"}, {\"property\": \"uid\"}], and twice with sort [{\"property\": \"start\"}] only."
    then: "With the uid tie breaker the order is a, b, c. With start alone the order is the same in both calls."
    sources:
      - "rfc:8620 5.5"

  - id: CEQ-033
    title: "Sort unexpanded recurring events by their first occurrence"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.2"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Weekly R1 whose first occurrence is 2026-01-05 and a single event E on 2026-01-08; the query has no range filter."
    when: "Call CalendarEvent/query sorted by start ascending, with expandRecurrences false."
    then: "R1 sorts before E, by the start of the base event."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 5.11.2"
      - "wildduck:plan 10.2 query and sort by start"
    notes: "The draft does not say which occurrence represents an unexpanded series. The stored firstStart is used."

  - id: CEQ-034
    title: "Page with position and limit and report total on request"
    method: "CalendarEvent/query"
    spec: "RFC 8620 5.5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Ten single events on ten consecutive days."
    when: "Call CalendarEvent/query sorted by start with position 3, limit 4 and calculateTotal true."
    then: "ids are the 4th to 7th events, position is 3 and total is 10."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query"
      - "cyrus:JMAPCalendars/calendarevent_query_fastpath_position"
      - "rfc:8620 5.5"

  - id: CEQ-035
    title: "Handle negative and out of range positions"
    method: "CalendarEvent/query"
    spec: "RFC 8620 5.5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Ten single events sorted by start."
    when: "Call CalendarEvent/query with position -3; with position -50; with position 50."
    then: "position -3 returns the last three ids with position 7. position -50 is clamped to 0 and returns from the first. position 50 returns ids [] and no error."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query"
      - "rfc:8620 5.5"

  - id: CEQ-036
    title: "Page relative to an anchor"
    method: "CalendarEvent/query"
    spec: "RFC 8620 5.5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Ten single events sorted by start, ids e1 to e10."
    when: "Call CalendarEvent/query with anchor e5 and limit 2; with anchor e5, anchorOffset -2 and limit 3; with anchor \"Zmissing\"."
    then: "The first returns [e5, e6] with position 4. The second returns [e3, e4, e5] with position 2. The third answers with error type anchorNotFound."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_anchor"
      - "rfc:8620 5.5"

  - id: CEQ-037
    title: "Validate limit and clamp it to the server maximum"
    method: "CalendarEvent/query"
    spec: "RFC 8620 5.5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "More events than the server's maximum page size."
    when: "Call CalendarEvent/query with limit -1; with limit 0; with a limit above the server maximum."
    then: "limit -1 answers invalidArguments. limit 0 returns ids []. The oversized limit returns at most the server maximum and the response carries the limit property with the value actually applied."
    sources:
      - "rfc:8620 5.5"

  - id: CEQ-038
    title: "Return one synthetic id per occurrence with expandRecurrences"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}, no overrides."
    when: "Call CalendarEvent/query with expandRecurrences true and filter {\"after\": \"2026-01-01T00:00:00\", \"before\": \"2026-02-01T00:00:00\"}, calculateTotal true."
    then: "ids has four distinct values, none of which equals R1, and total is 4. CalendarEvent/get on them returns starts on 2026-01-05, 12, 19 and 26 at 09:00:00."
    sources:
      - "fastmail:t/CalendarEvent/query/expand-recurrences.t"
      - "cyrus:JMAPCalendars/calendarevent_query_expandrecurrences"
      - "cyrus:JMAPCalendars/calendarevent_get_expandrecurrences_date"
      - "stalwart:calendar/event.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.11"

  - id: CEQ-039
    title: "Require a plain FilterCondition with both after and before when expanding"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}, no overrides."
    when: "Call CalendarEvent/query with expandRecurrences true and: no filter; filter {\"after\": \"2026-01-01T00:00:00\"} only; filter {\"before\": \"2026-02-01T00:00:00\"} only; a filter {\"operator\": \"AND\", \"conditions\": [{\"after\": ..., \"before\": ...}]}."
    then: "All four calls answer with error type invalidArguments."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_expandrecurrences_bounds"
      - "rfc:draft-ietf-jmap-calendars-33 5.11"

  - id: CEQ-040
    title: "Answer expandDurationTooLarge when the window exceeds maxExpandedQueryDuration"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11 and draft-ietf-jmap-calendars-33 1.5.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "The capability reports maxExpandedQueryDuration D."
    when: "Call CalendarEvent/query with expandRecurrences true and a window of exactly D, then a window one second longer than D. Repeat the long window with expandRecurrences false."
    then: "The window of D succeeds. The longer one answers with error type expandDurationTooLarge. The unexpanded query over the long window succeeds."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_expandrecurrences_bounds"
      - "rfc:draft-ietf-jmap-calendars-33 5.11"
      - "rfc:draft-ietf-jmap-calendars-33 10.8.3"
    notes: "The duration is measured between the two bounds as absolute times in the timeZone argument, so a window spanning a daylight saving change is compared by elapsed time."

  - id: CEQ-041
    title: "Answer cannotCalculateOccurrences when expansion would exceed the instance cap"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11 and draft-ietf-jmap-calendars-33 9.3.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event with recurrenceRule {frequency \"minutely\", count 20000}, start \"2026-01-01T09:00:00\" UTC, duration \"PT30S\"."
    when: "Call CalendarEvent/query with expandRecurrences true, limit 1, over 2026-01-01T08:59:00 to 2026-01-01T09:59:45; then over all of January."
    then: "The one hour window succeeds with total 60 when calculateTotal is set. The month window answers with error type cannotCalculateOccurrences, even though limit is 1."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_expandrecurrences_too_many"
      - "rfc:draft-ietf-jmap-calendars-33 5.11"
      - "rfc:draft-ietf-jmap-calendars-33 9.3.1"
      - "rfc:draft-ietf-jmap-calendars-33 10.8.4"
    notes: "The caps are WildDuck settings. Cyrus applies a per event limit and a per query limit of ten times that; the test must read the configured values."

  - id: CEQ-042
    title: "Bound the work spent on a rule that never produces another occurrence"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 9.3.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event starting 2026-01-15T10:00:00 with recurrenceRule {frequency \"secondly\", byMonth [\"2\"], byMonthDay [30]}."
    when: "Call CalendarEvent/query with expandRecurrences true over 2026-02-01 to 2026-03-01."
    then: "The call returns within the normal request time limit, either with ids [] or with error type cannotCalculateOccurrences. It never hangs or exhausts memory."
    sources:
      - "cyrus:JMAPCalendars/crasher20191227"
      - "cyrus:JMAPCalendars/calendarevent_get_reset_iter"
      - "rfc:draft-ietf-jmap-calendars-33 9.3.1"
      - "rfc:8984 7.1"

  - id: CEQ-043
    title: "Exclude excluded occurrences and include added ones in the expansion"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Weekly R1 from 2026-01-05T09:00:00 with overrides {\"2026-01-12T09:00:00\": {\"excluded\": true}, \"2026-01-21T15:00:00\": {}}."
    when: "Call CalendarEvent/query with expandRecurrences true, filter {\"after\": \"2026-01-01T00:00:00\", \"before\": \"2026-02-01T00:00:00\"}, sort [{\"property\": \"start\"}], then CalendarEvent/get for the returned ids with properties [\"start\", \"recurrenceId\"]."
    then: "Four instances are returned with starts 2026-01-05T09:00:00, 2026-01-19T09:00:00, 2026-01-21T15:00:00 and 2026-01-26T09:00:00. The added instance has recurrenceId \"2026-01-21T15:00:00\"."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_expandrecurrences"
      - "cyrus:JMAPCalendars/calendarevent_set_recurrenceinstances_rdate"
      - "rfc:8984 4.3.5"
      - "rfc:draft-ietf-jmap-calendars-33 5.11"

  - id: CEQ-044
    title: "Place an overridden occurrence by its patched start in the expansion"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11 and draft-ietf-jmap-calendars-33 5.11.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Weekly R1 from 2026-01-05T09:00:00 with override {\"2026-01-12T09:00:00\": {\"start\": \"2026-02-02T15:00:00\"}}."
    when: "Call CalendarEvent/query with expandRecurrences true, filter {\"after\": \"2026-01-01T00:00:00\", \"before\": \"2026-02-01T00:00:00\"}, sort [{\"property\": \"start\"}], then CalendarEvent/get for the returned ids with properties [\"start\", \"recurrenceId\"]."
    then: "Three instances are returned (05, 19, 26); the moved occurrence is outside the window. A query over 2026-02-02 returns two instances for that day: the regular one at 09:00 and the moved one at 15:00 with recurrenceId \"2026-01-12T09:00:00\"."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_expandrecurrences"
      - "stalwart:calendar/instance.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.1"

  - id: CEQ-045
    title: "Sort expanded instances of different events together by start"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Weekly R1 on Mondays 09:00 and weekly R2 on Wednesdays 09:00, both from the first week of January 2026, plus a single event on Tuesday 2026-01-06."
    when: "Call CalendarEvent/query with expandRecurrences true over 2026-01-05 to 2026-01-15, sorted by start."
    then: "The order is R1 05, single 06, R2 07, R1 12, R2 14."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_expandrecurrences"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.2"

  - id: CEQ-046
    title: "Page over expanded instances"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11 and RFC 8620 5.5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A daily event with count 10 from 2026-01-05."
    when: "Call CalendarEvent/query with expandRecurrences true over January, sorted by start, calculateTotal true, position 4 and limit 3; then with the 5th id as anchor."
    then: "total is 10 and ids are the instances of 2026-01-09, 10 and 11. The anchored call returns a window starting at the 2026-01-09 instance with position 4."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_expandrecurrences"
      - "cyrus:JMAPCalendars/calendarevent_query_anchor"
      - "rfc:8620 5.5"

  - id: CEQ-047
    title: "Apply inCalendar and string filters per instance when expanding"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Weekly R1 titled \"Standup\" in calendar A with override {\"2026-01-12T09:00:00\": {\"title\": \"Retrospective\"}}; a weekly event in calendar B."
    when: "Call CalendarEvent/query with expandRecurrences true over January and filter additionally {\"inCalendar\": idA, \"title\": \"retrospective\"}."
    then: "Exactly one synthetic id is returned and it resolves to the 2026-01-12 instance."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_expandrecurrences"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.1"

  - id: CEQ-048
    title: "Expand standalone instances as ordinary events"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Two standalone instances with the same uid on 2026-01-12 and 2026-01-19."
    when: "Call CalendarEvent/query with expandRecurrences true over January."
    then: "Both stored ids are returned as they are; no synthetic ids are generated for them."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_get_standalone_instances"
      - "cyrus:JMAPCalendars/calendarevent_query_get_standalone_added_later"
      - "rfc:draft-ietf-jmap-calendars-33 5.5"

  - id: CEQ-049
    title: "Expand a daily rule with interval and count"
    method: "CalendarEvent/query"
    spec: "RFC 8984 4.3.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event starting 2026-01-05T09:00:00 with recurrenceRule {frequency \"daily\", interval 2, count 3}."
    when: "Call CalendarEvent/query with expandRecurrences true, filter {\"after\": \"2026-01-01T00:00:00\", \"before\": \"2026-02-01T00:00:00\"}, sort [{\"property\": \"start\"}], then CalendarEvent/get for the returned ids with properties [\"start\", \"recurrenceId\"]."
    then: "Starts are 2026-01-05, 2026-01-07 and 2026-01-09, all at 09:00:00."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_recurrence"
      - "cyrus:JMAPCalendars/calendarevent_get_recurrence"
      - "rfc:8984 4.3.3.1"

  - id: CEQ-050
    title: "Count the start as the first occurrence even when it does not match the rule"
    method: "CalendarEvent/query"
    spec: "RFC 8984 4.3.3.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event starting Monday 2026-01-05T09:00:00 with recurrenceRule {frequency \"weekly\", byDay [{\"day\": \"we\"}], count 3}."
    when: "Call CalendarEvent/query with expandRecurrences true, filter {\"after\": \"2026-01-01T00:00:00\", \"before\": \"2026-02-01T00:00:00\"}, sort [{\"property\": \"start\"}], then CalendarEvent/get for the returned ids with properties [\"start\", \"recurrenceId\"]."
    then: "Starts are 2026-01-05 (the start itself), 2026-01-07 and 2026-01-14."
    sources:
      - "rfc:8984 4.3.3.1"

  - id: CEQ-051
    title: "Treat until as inclusive"
    method: "CalendarEvent/query"
    spec: "RFC 8984 4.3.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Two daily events starting 2026-01-05T09:00:00: one with until \"2026-01-07T09:00:00\", one with until \"2026-01-07T08:59:59\"."
    when: "Call CalendarEvent/query with expandRecurrences true, filter {\"after\": \"2026-01-01T00:00:00\", \"before\": \"2026-02-01T00:00:00\"}, sort [{\"property\": \"start\"}], then CalendarEvent/get for the returned ids with properties [\"start\", \"recurrenceId\"]."
    then: "The first event has instances on 05, 06 and 07. The second has instances on 05 and 06 only."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_recurrence_until"
      - "rfc:8984 4.3.3"

  - id: CEQ-052
    title: "Count occurrences before applying exclusions"
    method: "CalendarEvent/query"
    spec: "RFC 8984 4.3.3.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A daily event from 2026-01-05T09:00:00 with count 3 and override {\"2026-01-06T09:00:00\": {\"excluded\": true}}."
    when: "Call CalendarEvent/query with expandRecurrences true, filter {\"after\": \"2026-01-01T00:00:00\", \"before\": \"2026-02-01T00:00:00\"}, sort [{\"property\": \"start\"}], then CalendarEvent/get for the returned ids with properties [\"start\", \"recurrenceId\"]."
    then: "Starts are 2026-01-05 and 2026-01-07 only; the exclusion does not extend the series to a fourth day."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_create_no_reply_exdate"
      - "rfc:8984 4.3"
      - "rfc:8984 4.3.5"

  - id: CEQ-053
