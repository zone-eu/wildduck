    when: "Call CalendarEvent/query with expandRecurrences true, filter {\"after\": \"2026-01-01T00:00:00\", \"before\": \"2026-04-01T00:00:00\"}, sort [{\"property\": \"start\"}], then CalendarEvent/get for the returned ids with properties [\"start\", \"recurrenceId\"]."
    then: "Starts are 2026-01-30, 2026-02-27 and 2026-03-31 (the last weekday of each month)."
