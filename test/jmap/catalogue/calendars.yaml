  - id: CEQ-063
    title: "Expand byYearDay with an interval"
    method: "CalendarEvent/query"
    spec: "RFC 8984 4.3.3.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event starting 2026-01-01T09:00:00 with recurrenceRule {frequency \"yearly\", interval 3, byYearDay [1, 100, 200], count 5}."
    when: "Expand over 2026 and over 2029 (two windows) and read the starts."
    then: "2026: 01-01, 04-10, 07-19. 2029: 01-01 and 04-10. Nothing in 2027 or 2028."
    sources:
      - "rfc:5545 3.8.5.3"
      - "rfc:8984 4.3.3.1"

  - id: CEQ-064
    title: "Expand byWeekNo with ISO week numbering"
    method: "CalendarEvent/query"
    spec: "RFC 8984 4.3.3.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event starting Monday 2026-05-11T09:00:00 with recurrenceRule {frequency \"yearly\", byWeekNo [20], byDay [{\"day\": \"mo\"}]}."
    when: "Expand over 2026-05-01 to 2026-06-01 and over 2027-05-01 to 2027-06-01."
    then: "The instances are 2026-05-11 and 2027-05-17, the Mondays of ISO week 20."
    sources:
      - "rfc:5545 3.8.5.3"
      - "rfc:8984 4.3.3.1"

  - id: CEQ-065
    title: "Expand sub daily frequencies"
    method: "CalendarEvent/query"
    spec: "RFC 8984 4.3.3.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "An event starting 2026-01-05T09:00:00 UTC with recurrenceRule {frequency \"hourly\", interval 6, count 4}, and one with {frequency \"daily\", byHour [9, 17], byMinute [0, 30], count 5}."
    when: "Call CalendarEvent/query with expandRecurrences true, filter {\"after\": \"2026-01-05T00:00:00\", \"before\": \"2026-01-08T00:00:00\"}, sort [{\"property\": \"start\"}], then CalendarEvent/get for the returned ids with properties [\"start\", \"recurrenceId\"]."
    then: "Hourly: 09:00, 15:00, 21:00 on 01-05 and 03:00 on 01-06. Daily with by parts: 01-05 at 09:00, 09:30, 17:00, 17:30 and 01-06 at 09:00."
    sources:
      - "rfc:5545 3.8.5.3"
      - "rfc:8984 4.3.3.1"

  - id: CEQ-066
    title: "Keep the local time of a recurrence across a daylight saving change"
    method: "CalendarEvent/query"
    spec: "RFC 8984 4.3.3.1 and draft-ietf-jmap-calendars-33 5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A daily event in \"America/New_York\" starting Saturday 2026-03-07T09:00:00 with count 2."
    when: "Expand over 2026-03-07 to 2026-03-09 and fetch start and utcStart for both instances."
    then: "Both have local start 09:00:00. utcStart is 2026-03-07T14:00:00Z for the first and 2026-03-08T13:00:00Z for the second (summer time began that morning)."
    sources:
      - "cyrus:JMAPCalendars/misc_timezone_expansion"
      - "cyrus:JMAPCalendars/itip_request_tzid_change"
      - "rfc:draft-ietf-jmap-calendars-33 5"
      - "rfc:8984 4.3.3"

  - id: CEQ-067
    title: "Resolve occurrences that fall into a daylight saving gap or overlap"
    method: "CalendarEvent/query"
    spec: "RFC 8984 4.7.1"
    level: should
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A daily event at 03:30:00 in \"Europe/Tallinn\"; clocks go from 03:00 to 04:00 on 2026-03-29 and from 04:00 back to 03:00 on 2026-10-25."
    when: "Expand over 2026-03-29 and over 2026-10-25 and fetch utcStart of the instance of each day."
    then: "On 2026-03-29 the non existent local time is taken with the offset before the gap, giving utcStart 2026-03-29T01:30:00Z. On 2026-10-25 the ambiguous time is taken as its first occurrence, 2026-10-25T00:30:00Z. Exactly one instance exists on each day."
    sources:
      - "rfc:5545 3.3.5"
      - "cyrus:JMAPCalendars/misc_timezone_expansion"
    notes: "JSCalendar inherits this rule from iCalendar DATE-TIME handling. The recurrenceId stays \"2026-03-29T03:30:00\"."

  - id: CEQ-068
    title: "Expand floating recurrences in the timeZone argument"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 5.11 and draft-ietf-jmap-calendars-33 5.11.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A floating daily event starting 2026-01-05T23:30:00 with duration \"PT1H\" and count 3."
    when: "Call CalendarEvent/query with expandRecurrences true, filter after \"2026-01-06T00:00:00\" before \"2026-01-07T00:00:00\", with timeZone \"Etc/UTC\" and with timeZone \"Asia/Tokyo\"."
    then: "Both calls return two instances: the one starting 2026-01-05T23:30:00 (it ends at 00:30 on the 6th) and the one starting 2026-01-06T23:30:00. The result does not depend on the zone because event and window are both local."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_query_expandrecurrences"
      - "cyrus:JMAPCalendars/calendarevent_set_standalone_instance_floatingtz"
      - "stalwart:calendar/instance.rs"
      - "rfc:draft-ietf-jmap-calendars-33 5.11.1"

  - id: CEQ-069
    title: "Expand all day recurring events on local dates"
    method: "CalendarEvent/query"
    spec: "RFC 8984 4.2.4 and draft-ietf-jmap-calendars-33 5.11"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A floating all day event: start \"2026-01-05T00:00:00\", duration \"P1D\", showWithoutTime true, recurrenceRule {frequency \"weekly\", count 3}."
    when: "Call CalendarEvent/query with expandRecurrences true over January with timeZone \"Pacific/Auckland\", then get start and duration of each instance."
    then: "Three instances with start 2026-01-05T00:00:00, 2026-01-12T00:00:00 and 2026-01-19T00:00:00, each with duration \"P1D\" and showWithoutTime true."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_get_expandrecurrences_date"
      - "cyrus:JMAPCalendars/calendarevent_set_recurrence_untilallday"
      - "stalwart:calendar/instance.rs"
      - "rfc:8984 6.4"

  - id: CEQ-070
    title: "Expand an unbounded rule in a window far from its start"
    method: "CalendarEvent/query"
    spec: "RFC 8984 4.3.3.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A daily event starting 2020-01-01T09:00:00 UTC with no count or until."
    when: "Call CalendarEvent/query with expandRecurrences true over 2026-06-01T00:00:00 to 2026-06-04T00:00:00."
    then: "Exactly three ids are returned, for 2026-06-01, 02 and 03. The roughly 2300 earlier occurrences do not count towards the instance cap of the response."
    sources:
      - "stalwart:calendar/event.rs"
      - "cyrus:JMAPCalendars/calendarevent_query_expandrecurrences"
      - "rfc:draft-ietf-jmap-calendars-33 9.3.1"

  - id: CEQ-071
    title: "Return no changes for an unchanged query state"
    method: "CalendarEvent/queryChanges"
    spec: "draft-ietf-jmap-calendars-33 5.12"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A CalendarEvent/query with filter {\"inCalendar\": idA} sorted by start returned queryState Q1 and canCalculateChanges true."
    when: "Call CalendarEvent/queryChanges with the same filter and sort and sinceQueryState Q1."
    then: "oldQueryState and newQueryState equal Q1, removed is [] and added is []."
    sources:
      - "fastmail:t/CalendarEvent/queryChanges/basic.t"
      - "cyrus:JMAPCalendars/calendarevent_querychanges"
      - "rfc:draft-ietf-jmap-calendars-33 5.12"
      - "rfc:8620 5.6"

  - id: CEQ-072
    title: "Report created events in added with their index and destroyed events in removed"
    method: "CalendarEvent/queryChanges"
    spec: "draft-ietf-jmap-calendars-33 5.12"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Query state Q1 for filter {\"inCalendar\": idA} sorted by start; the result was [e1, e2]."
    when: "Create e3 in A starting between e1 and e2, destroy e1, then call CalendarEvent/queryChanges with sinceQueryState Q1 and calculateTotal true."
    then: "removed contains e1, added contains {\"id\": e3, \"index\": 0}, total is 2 and newQueryState differs from Q1."
    sources:
      - "fastmail:t/CalendarEvent/queryChanges/basic.t"
      - "cyrus:JMAPCalendars/calendarevent_querychanges"
      - "rfc:8620 5.6"

  - id: CEQ-073
    title: "Report an updated event that may have moved in both removed and added"
    method: "CalendarEvent/queryChanges"
    spec: "RFC 8620 5.6"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Query state Q1 for a start sorted query that returned [e1, e2, e3]."
    when: "Move e1's start after e3, then call CalendarEvent/queryChanges since Q1."
    then: "removed contains e1 and added contains {\"id\": e1, \"index\": 2}."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_querychanges"
      - "rfc:8620 5.6"

  - id: CEQ-074
    title: "Report events that stop or start matching the filter"
    method: "CalendarEvent/queryChanges"
    spec: "RFC 8620 5.6"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Query state Q1 for filter {\"inCalendar\": idA}; e1 is in A, e2 in B."
    when: "Move e1 to B and e2 to A, then call CalendarEvent/queryChanges since Q1."
    then: "removed contains e1 and added contains e2 with its index."
    sources:
      - "rfc:8620 5.6"

  - id: CEQ-075
    title: "Honour maxChanges and upToId"
    method: "CalendarEvent/queryChanges"
    spec: "RFC 8620 5.6"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Query state Q1, then five events are created that match the query."
    when: "Call CalendarEvent/queryChanges since Q1 with maxChanges 2; then without maxChanges but with upToId set to the id that was first in the original result."
    then: "The first call answers with error type tooManyChanges. The second succeeds and omits changes that sort after upToId."
    sources:
      - "rfc:8620 5.6"

  - id: CEQ-076
    title: "Answer cannotCalculateChanges for an unknown or expired query state"
    method: "CalendarEvent/queryChanges"
    spec: "RFC 8620 5.6"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Any events."
    when: "Call CalendarEvent/queryChanges with sinceQueryState \"bogus\"."
    then: "The response is an error with type cannotCalculateChanges."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_querychanges"
      - "rfc:8620 5.6"

  - id: CEQ-077
    title: "Report canCalculateChanges false for expanded queries and refuse queryChanges on them"
    method: "CalendarEvent/queryChanges"
    spec: "draft-ietf-jmap-calendars-33 5.12"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "A weekly event R1: start \"2026-01-05T09:00:00\" (a Monday), timeZone \"Europe/Tallinn\", duration \"PT1H\", recurrenceRule {frequency \"weekly\"}, no overrides."
    when: "Call CalendarEvent/query with expandRecurrences true over January and read canCalculateChanges; then call CalendarEvent/queryChanges with the returned queryState."
    then: "canCalculateChanges is false and queryChanges answers cannotCalculateChanges. The same query without expandRecurrences reports canCalculateChanges true."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 5.12"
      - "rfc:8620 5.5"
      - "wildduck:plan 10.3 owned change log"
    notes: "CalendarEvent/queryChanges has no expandRecurrences argument, and synthetic ids are not in the change log. The draft example in 8.1 also shows canCalculateChanges false."

  - id: CALR-001
    title: "Push a CalendarAlert when a display alert with an offset trigger fires"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 6.4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. An event E1 (uid U1) starts at T in \"Etc/UTC\" and has alerts {\"a1\": {action \"display\", trigger OffsetTrigger offset \"-PT10M\"}}."
    when: "Advance the clock to T minus 10 minutes."
    then: "An event named calendarAlert arrives whose data is {\"@type\": \"CalendarAlert\", \"accountId\": <account>, \"calendarEventId\": E1, \"uid\": U1, \"recurrenceId\": null, \"alertId\": \"a1\"}. It arrives once."
    sources:
      - "cyrus:JMAPCalendars/calendaralert_notification"
      - "cyrus:JMAPCalendars/calendaralert_notification_standalone"
      - "stalwart:calendar/alarm.rs"
      - "rfc:draft-ietf-jmap-calendars-33 6.4"
      - "rfc:draft-ietf-jmap-calendars-33 8.3"
      - "wildduck:plan 10.2 alerts"

  - id: CALR-002
    title: "Deliver CalendarAlert only to connections that asked for the type"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 6.4 and RFC 8620 7.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "Three EventSource connections for the same user: types=CalendarAlert, types=* and types=CalendarEvent. An event with a display alert is about to fire."
    when: "Advance the clock to the trigger time."
    then: "The first two connections receive the calendarAlert event. The third receives none."
    sources:
      - "stalwart:calendar/alarm.rs"
      - "rfc:draft-ietf-jmap-calendars-33 6.4"
      - "rfc:8620 7.3"

  - id: CALR-003
    title: "Never deliver a CalendarAlert to another user"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 6.4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "Users A and B each hold an EventSource connection with types=*; only A has an event with an alert."
    when: "Advance the clock to the trigger time."
    then: "A receives the calendarAlert event; B receives nothing."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 6.4"
      - "rfc:draft-ietf-jmap-calendars-33 9.1"

  - id: CALR-004
    title: "Compute offset triggers relative to start and to end, before and after"
    method: "EventSource"
    spec: "RFC 8984 4.5.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. An event from T to T plus 1 hour with four display alerts: s-before (offset \"-PT5M\", relativeTo \"start\"), s-after (offset \"PT5M\", relativeTo \"start\"), e-before (offset \"-PT5M\", relativeTo \"end\") and e-at (offset \"PT0S\", relativeTo \"end\")."
    when: "Advance the clock step by step past T plus 1 hour."
    then: "The pushes arrive in the order s-before (T minus 5 min), s-after (T plus 5 min), e-before (T plus 55 min), e-at (T plus 60 min), each with the matching alertId."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_alerts"
      - "cyrus:JMAPCalendars/calendaralert_notification"
      - "rfc:8984 4.5.2"

  - id: CALR-005
    title: "Fire an absolute trigger at its when time regardless of the event start"
    method: "EventSource"
    spec: "RFC 8984 4.5.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. An event starting next week with alerts {\"abs\": {trigger AbsoluteTrigger when W}} where W is two minutes from now."
    when: "Advance the clock to W."
    then: "A calendarAlert with alertId \"abs\" arrives at W."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_alerts"
      - "rfc:8984 4.5.2"
      - "rfc:draft-ietf-jmap-calendars-33 6.3"

  - id: CALR-006
    title: "Compute triggers of zoned events in the event's time zone"
    method: "EventSource"
    spec: "RFC 8984 4.5.2 and draft-ietf-jmap-calendars-33 5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. An event with start \"2026-03-29T09:00:00\" in \"Europe/Tallinn\" (06:00:00Z, the day summer time begins) and an alert with offset \"-PT1H\"."
    when: "Run the clock through 2026-03-29T05:00:00Z."
    then: "The alert fires at 2026-03-29T05:00:00Z, one hour of elapsed time before the start."
    sources:
      - "cyrus:JMAPCalendars/calendaralert_notification"
      - "rfc:draft-ietf-jmap-calendars-33 5"
      - "rfc:8984 4.5.2"

  - id: CALR-007
    title: "Resolve floating events with the calendar's timeZone when firing alerts"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. Calendar A has timeZone \"Asia/Tokyo\". A floating event in A starts at \"2026-06-01T09:00:00\" with an alert offset \"PT0S\"."
    when: "Run the clock through 2026-06-01T00:00:00Z."
    then: "The alert fires at 2026-06-01T00:00:00Z (09:00 in Tokyo)."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 4"
      - "rfc:draft-ietf-jmap-calendars-33 6"

  - id: CALR-008
    title: "Fall back to Etc/UTC for floating events when the calendar has no timeZone"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 4"
    level: wd
    phase: 6
    applies: "adapted"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. Calendar B has timeZone null. A floating event in B starts at \"2026-06-01T09:00:00\" with an alert offset \"PT0S\"."
    when: "Run the clock through 2026-06-01T09:00:00Z."
    then: "The alert fires at 2026-06-01T09:00:00Z."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 4"
    notes: "Open question. The draft says a null calendar timeZone means the time zone of the account principal, and WildDuck has neither principals nor a per user time zone setting. Etc/UTC is assumed; a user level time zone setting would be the better answer."

  - id: CALR-009
    title: "Fire once per occurrence of a recurring event with the base id and the recurrenceId"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 6.4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. A daily event R1 starting today at T with alert a1 offset \"PT0S\" and count 3."
    when: "Advance the clock through three days."
    then: "Three calendarAlert events arrive. Each has calendarEventId R1 (never a synthetic id), alertId \"a1\" and recurrenceId equal to the local start of that occurrence."
    sources:
      - "cyrus:JMAPCalendars/calendaralert_notification_recurring"
      - "rfc:draft-ietf-jmap-calendars-33 6.4"

  - id: CALR-010
    title: "Follow recurrence overrides when firing alerts"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 6.4 and RFC 8984 4.3.5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. A daily event at T with alert a1 offset \"PT0S\". Day 2 is overridden to start two hours later, day 3 is excluded, and day 4's override replaces alerts with {\"b1\": offset \"-PT5M\"}."
    when: "Advance the clock through four days."
    then: "Day 1 fires a1 at T. Day 2 fires a1 two hours later with recurrenceId of the original day 2 time. Day 3 fires nothing. Day 4 fires only b1, five minutes before T."
    sources:
      - "cyrus:JMAPCalendars/calendaralert_notification_recurring"
      - "rfc:8984 4.3.5"
      - "rfc:draft-ietf-jmap-calendars-33 6.4"

  - id: CALR-011
    title: "Fire alerts of a standalone instance with its recurrenceId"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 6.4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. A standalone instance with recurrenceId \"2026-06-01T09:00:00\", recurrenceIdTimeZone \"Etc/UTC\" and an alert offset \"PT0S\"."
    when: "Run the clock through the start."
    then: "The calendarAlert has calendarEventId of the stored instance and recurrenceId \"2026-06-01T09:00:00\"."
    sources:
      - "cyrus:JMAPCalendars/calendaralert_notification_standalone"
      - "rfc:draft-ietf-jmap-calendars-33 6.4"

  - id: CALR-012
    title: "Fire each alert of an event separately"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 6.4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. An event with three display alerts at offsets \"-PT30M\", \"-PT10M\" and \"PT0S\"."
    when: "Advance the clock past the start."
    then: "Three calendarAlert events arrive at the three trigger times with three different alertId values."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_alerts"
      - "rfc:draft-ietf-jmap-calendars-33 6.4"

  - id: CALR-013
    title: "Do not push alerts for draft events"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 5"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. An event with isDraft true and an alert due in one minute."
    when: "Advance the clock past the trigger; then set isDraft false on a second draft whose alert is still in the future and advance again."
    then: "No push arrives for the first event. The second event's alert fires at its trigger time."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_isdraft"
      - "rfc:draft-ietf-jmap-calendars-33 5"

  - id: CALR-014
    title: "Fire alerts only for events in subscribed calendars"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 6"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. Calendar A has isSubscribed false and holds an event with an alert due in one minute. Calendar B is subscribed and holds a similar event."
    when: "Advance the clock past both triggers. Then set A to isSubscribed true and create another due alert there."
    then: "Only the event in B fires in the first round. After resubscribing, the new alert in A fires."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 6"
      - "cyrus:JMAPCalendars/calendar_set_issubscribed"

  - id: CALR-015
    title: "Fire once for an event that is in a subscribed and an unsubscribed calendar"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 6"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. An event in calendars A (unsubscribed) and B (subscribed) with one alert."
    when: "Advance the clock past the trigger."
    then: "Exactly one calendarAlert arrives."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 6"
    notes: "Needs maxCalendarsPerEvent above 1."

  - id: CALR-016
    title: "Reschedule or cancel alerts when the event changes"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 6.4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. An event starting at T with an alert offset \"-PT10M\"."
    when: "Before the trigger, move the start to T plus 1 hour. In a second run destroy the event instead. In a third run remove the alert with a patch."
    then: "Run 1: nothing fires at T minus 10 min and the alert fires at T plus 50 min. Runs 2 and 3: nothing fires."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_defaultalerts_etag_preserved_after_alarm"
      - "rfc:draft-ietf-jmap-calendars-33 6"
      - "wildduck:plan 10.2 alerts"

  - id: CALR-017
    title: "Do not fire alerts whose trigger time has already passed when they are written"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 6"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user."
    when: "Create an event that started yesterday with an alert offset \"-PT10M\"; create an event starting in one hour with an AbsoluteTrigger one hour in the past."
    then: "No calendarAlert arrives for either."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_get_alert_acknowledged_far_future"
      - "rfc:draft-ietf-jmap-calendars-33 9.3.2"
    notes: "Importing a calendar full of past events must not produce a burst of alerts."

  - id: CALR-018
    title: "Never fire for trigger types the server does not understand"
    method: "EventSource"
    spec: "RFC 8984 4.5.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. An event with an alert whose trigger is {\"@type\": \"example.com:GeoTrigger\"}."
    when: "Advance the clock past the event's start and end."
    then: "No calendarAlert arrives and the alert is still stored unchanged."
    sources:
      - "rfc:8984 4.5.2"

  - id: CALR-019
    title: "Apply the calendar's defaultAlertsWithTime to a timed event with useDefaultAlerts"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 6.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. Calendar A has defaultAlertsWithTime {\"dt\": offset \"-PT10M\"}. A timed event in A has useDefaultAlerts true and its own alerts {\"own\": offset \"-PT30M\"}."
    when: "Advance the clock past the start."
    then: "One calendarAlert arrives, at start minus 10 minutes, with alertId \"dt\". The event's own alert \"own\" does not fire."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_defaultalerts_calalarmd"
      - "cyrus:JMAPCalendars/calendarevent_set_defaultalerts"
      - "cyrus:JMAPCalendars/calendarevent_multiget_defaultalerts"
      - "rfc:draft-ietf-jmap-calendars-33 6.1"

  - id: CALR-020
    title: "Apply defaultAlertsWithoutTime to an all day event"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 6.1 and draft-ietf-jmap-calendars-33 4"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. Calendar A (timeZone \"Europe/Tallinn\") has defaultAlertsWithTime {\"dt\": offset \"-PT10M\"} and defaultAlertsWithoutTime {\"dd\": offset \"PT9H\"}. A floating event in A has showWithoutTime true, start \"2026-06-01T00:00:00\", duration \"P1D\" and useDefaultAlerts true."
    when: "Run the clock through 2026-06-01."
    then: "One calendarAlert with alertId \"dd\" arrives at 2026-06-01T06:00:00Z (09:00 local). \"dt\" does not fire."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_defaultalerts_calalarmd"
      - "cyrus:JMAPCalendars/calendar_set_defaultalerts"
      - "rfc:draft-ietf-jmap-calendars-33 6.1"
      - "rfc:draft-ietf-jmap-calendars-33 4"

  - id: CALR-021
    title: "Fire nothing when useDefaultAlerts is true and the calendar has no default alerts"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 6.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. Calendar B has both default alert sets null. An event in B has useDefaultAlerts true and its own alerts {\"own\": offset \"PT0S\"}."
    when: "Advance the clock past the start."
    then: "No calendarAlert arrives."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 6.1"

  - id: CALR-022
    title: "Use the default alerts of every calendar the event is in"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 6.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. Calendar A has defaultAlertsWithTime {\"a-def\": offset \"-PT10M\"}, calendar B has {\"b-def\": offset \"-PT5M\"}. An event in both has useDefaultAlerts true."
    when: "Advance the clock past the start."
    then: "Two calendarAlert events arrive with alertId \"a-def\" and \"b-def\"."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_multiget_defaultalerts_per_calendar"
      - "rfc:draft-ietf-jmap-calendars-33 6.1"
    notes: "Needs maxCalendarsPerEvent above 1. This is why default alert ids must be unique across the account."

  - id: CALR-023
    title: "Pick up changed calendar default alerts for existing events"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 6.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. Calendar A has defaultAlertsWithTime {\"dt\": offset \"-PT10M\"}; an event with useDefaultAlerts true starts in one hour."
    when: "Update A to defaultAlertsWithTime {\"dt2\": offset \"-PT30M\"} and advance the clock past the start."
    then: "One calendarAlert with alertId \"dt2\" arrives 30 minutes before the start. Nothing fires for \"dt\"."
    sources:
      - "cyrus:JMAPCalendars/calendar_defaultalerts_synctoken"
      - "cyrus:JMAPCalendars/calendarevent_defaultalerts_updated_by_caldav_put"
      - "rfc:draft-ietf-jmap-calendars-33 6.1"
    notes: "The CalendarEvent state does not change when calendar defaults change; clients learn it from the Calendar state."

  - id: CALR-024
    title: "Acknowledge a default alert by storing it on the event under the same id"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 6.1 and draft-ietf-jmap-calendars-33 6.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. Calendar A has defaultAlertsWithTime {\"dt\": offset \"-PT10M\"}; weekly event R1 has useDefaultAlerts true. The alert for this week's occurrence just fired."
    when: "Update R1 with {\"alerts/dt\": {\"@type\": \"Alert\", \"trigger\": {\"@type\": \"OffsetTrigger\", \"offset\": \"-PT10M\"}, \"acknowledged\": <now>}}."
    then: "The update succeeds with no recurrence override created. R1.alerts.dt.acknowledged reads back, the default alert does not fire again for this occurrence, and it fires for next week's occurrence."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 6.1"
      - "rfc:draft-ietf-jmap-calendars-33 6.2"
      - "cyrus:JMAPCalendars/calendarevent_set_defaultalerts"

  - id: CALR-025
    title: "Store acknowledged on the alert and report the change to other clients"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 6.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An event E1 whose alert a1 has fired; CalendarEvent state S1; a second EventSource connection with types=CalendarEvent."
    when: "Update E1 with {\"alerts/a1/acknowledged\": \"2026-06-01T08:50:30Z\"}."
    then: "CalendarEvent/get returns alerts.a1.acknowledged with that value, CalendarEvent/changes since S1 lists E1 in updated, the second connection gets a StateChange, and sequence is unchanged (alerts are per user properties)."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_alerts"
      - "rfc:draft-ietf-jmap-calendars-33 6.2"
      - "rfc:draft-ietf-jmap-calendars-33 8.3"
      - "rfc:draft-ietf-jmap-calendars-33 5.4"

  - id: CALR-026
    title: "Do not fire an alert that was acknowledged at or after its trigger time"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 6.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. An event starting at T with alert a1 offset \"-PT10M\"."
    when: "Before the trigger, set alerts/a1/acknowledged to a time later than T minus 10 minutes (for example by a client with a fast clock), then advance past the trigger."
    then: "No calendarAlert arrives for a1."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_get_alert_acknowledged_far_future"
      - "rfc:draft-ietf-jmap-calendars-33 6.2"
      - "rfc:8984 4.5.2"

  - id: CALR-027
    title: "Keep firing later occurrences after an alert was acknowledged on the base event"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 6.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. Daily event R1 at T with alert a1 offset \"PT0S\"; day 1 has fired."
    when: "Set R1 alerts/a1/acknowledged to day 1 T plus 1 minute; advance through day 2."
    then: "R1 has no recurrenceOverrides. The day 2 alert fires because its trigger time is after the acknowledged time."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 6.2"
      - "rfc:8984 4.5.2"

  - id: CALR-028
    title: "Update acknowledged inside an override when the alert is already overridden there"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 6.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Weekly R1 with base alert a1 and override {\"2026-01-12T09:00:00\": {\"alerts/a1/trigger/offset\": \"-PT1H\"}}."
    when: "Acknowledge the alert through the synthetic id of the 2026-01-12 instance."
    then: "The acknowledged time is stored in the existing override for 2026-01-12 (as alerts/a1/acknowledged); the base alert a1 has no acknowledged property and no new override key appears."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 6.2"

  - id: CALR-029
    title: "Fire a snooze alert at its absolute time"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 6.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. Event E1 whose alert a1 fired at T minus 1 hour."
    when: "Update E1 with {\"alerts/a1/acknowledged\": <now>, \"alerts/snz\": {\"@type\": \"Alert\", \"action\": \"display\", \"trigger\": {\"@type\": \"AbsoluteTrigger\", \"when\": <now plus 30 min>}, \"relatedTo\": {\"a1\": {\"@type\": \"Relation\", \"relation\": {\"snooze\": true}}}}}, then advance 30 minutes."
    then: "The update succeeds without creating a recurrence override. A calendarAlert with alertId \"snz\" and calendarEventId E1 arrives at the snooze time; a1 does not fire again."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 6.3"
      - "rfc:draft-ietf-jmap-calendars-33 8.3"

  - id: CALR-030
    title: "Process a snooze of a default alert even though useDefaultAlerts ignores the event's other alerts"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 6.1 and draft-ietf-jmap-calendars-33 6.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. Calendar A has defaultAlertsWithTime {\"dt\": ...}. Event E1 has useDefaultAlerts true and alerts {\"own\": offset \"PT0S\", \"snz\": AbsoluteTrigger in 5 minutes with relatedTo {\"dt\": snooze}, \"dt\": {acknowledged now}}."
    when: "Advance the clock 5 minutes and then past the start."
    then: "\"snz\" fires at its absolute time. \"own\" never fires."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 6.1"
      - "rfc:draft-ietf-jmap-calendars-33 6.3"

  - id: CALR-031
    title: "Stop a snoozed alert by deleting it"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 6.3"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. Event E1 with snooze alert \"snz\" due in 10 minutes."
    when: "Update E1 with {\"alerts/snz\": null} and advance 10 minutes."
    then: "No calendarAlert arrives and alerts no longer contains \"snz\"."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 6.3"

  - id: CALR-032
    title: "Send an email to the user's own address when an email alert fires"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 6 and draft-ietf-jmap-calendars-33 9.3.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time, imap]
    given: "A user with main address alice@example.com. An event titled \"Board meeting\" with alerts {\"m1\": {action \"email\", trigger offset \"-PT10M\"}} and participants bob@example.net and carol@example.net."
    when: "Advance the clock to the trigger time, then look at the user's INBOX over IMAP and at the outbound queue."
    then: "Exactly one new message is in alice's INBOX; it mentions the event title and start time. Nothing is queued for bob, carol or any other address."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_set_alerts"
      - "rfc:draft-ietf-jmap-calendars-33 6"
      - "rfc:draft-ietf-jmap-calendars-33 9.3.2"
      - "wildduck:plan 10.2 alerts"
    notes: "The recipient is the main address (users.address), which WildDuck treats as verified. Delivery should go straight into the mailbox rather than through the outbound queue."

  - id: CALR-033
    title: "Set acknowledged on an email alert as soon as the email is sent"
    method: "CalendarEvent/get"
    spec: "RFC 8984 4.5.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An event with an email alert m1 due in one minute; CalendarEvent state S1."
    when: "Advance the clock past the trigger, then call CalendarEvent/get and CalendarEvent/changes since S1."
    then: "alerts.m1.acknowledged is set to the send time and the event is listed in updated. No recurrence override was created."
    sources:
      - "rfc:8984 4.5.2"
      - "rfc:draft-ietf-jmap-calendars-33 6.2"

  - id: CALR-034
    title: "Keep display and email actions apart"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 6"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time, imap]
    given: "An EventSource connection with types=CalendarAlert is open for the user. An event with a display alert d1 and an email alert m1 at the same trigger time."
    when: "Advance the clock to the trigger time."
    then: "One calendarAlert with alertId \"d1\" is pushed and one email is delivered. No email is sent for d1."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 6"
      - "rfc:draft-ietf-jmap-calendars-33 6.4"
    notes: "Whether the email alert m1 is also pushed as a CalendarAlert is not specified; clients must ignore email alerts either way. WildDuck does not push it."

  - id: CALR-035
    title: "Do not send alert emails for events of disabled or suspended users"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 9.3.2"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap, time, imap]
    given: "A user with a due email alert is disabled through the REST API before the trigger time."
    when: "Advance the clock past the trigger."
    then: "No message is delivered and nothing is pushed."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 9.3.2"
      - "wildduck:brief Accounts and auth"

  - id: CALR-036
    title: "Rate limit the alerts fired for one user"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 9.3.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. An event with recurrenceRule {frequency \"minutely\"} and ten display alerts, giving ten triggers per minute. The configured limit is N alerts per user per hour."
    when: "Advance the clock by one hour."
    then: "No more than N calendarAlert events are pushed in that hour, the server stays responsive for other users, and after the window resets alerts are delivered again."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 9.3.2"
      - "wildduck:plan 10.2 alerts"
    notes: "N is a WildDuck setting, to be implemented with the existing ttlcounter Lua script."

  - id: CALR-037
    title: "Rate limit alert emails separately and more strictly"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 9.3.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time, imap]
    given: "An event recurring every minute with an email alert; the configured limit is M alert emails per user per day."
    when: "Advance the clock by one day."
    then: "At most M alert emails arrive in the INBOX."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 9.3.2"

  - id: CALR-038
    title: "Fire jittered alerts early rather than late"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 9.3.3"
    level: should
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. 200 users each have an event starting at the same full hour H with an alert offset \"PT0S\". The configured maximum jitter is J seconds."
    when: "Advance the clock in one second steps from H minus J to H plus 1."
    then: "Every alert is pushed within the interval from H minus J to H; none is pushed later than H plus the scheduler tick."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 9.3.3"
      - "wildduck:plan 10.2 alerts"

  - id: CALR-039
    title: "Keep scheduled alerts across a restart of the worker"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 6.4"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An EventSource connection with types=CalendarAlert is open for the user. An event with an alert due in five minutes."
    when: "Restart the JMAP worker and the alert scheduler, reconnect the EventSource, and advance the clock five minutes."
    then: "The calendarAlert arrives once."
    sources:
      - "wildduck:plan 10.2 alerts"

  - id: CALR-040
    title: "Do not replay past alerts on reconnect"
    method: "EventSource"
    spec: "draft-ietf-jmap-calendars-33 6.4 and RFC 8620 7.3"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "An alert fired while the client had no EventSource connection."
    when: "Connect with a Last-Event-ID from before the alert."
    then: "State changes are replayed as usual, but no calendarAlert event for the missed alert is sent. The client can still find the unacknowledged alert by fetching the event."
    sources:
      - "rfc:8620 7.3"
      - "rfc:draft-ietf-jmap-calendars-33 6"
    notes: "Open question. Alerts are transient; replaying an old reminder after a long disconnect would be wrong more often than right. A short grace period (for example alerts younger than one minute) could be replayed."

  - id: CALR-041
    title: "Accept CalendarAlert as a type in a PushSubscription"
    method: "PushSubscription/set"
    spec: "draft-ietf-jmap-calendars-33 6.4 and RFC 8620 7.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Web Push is available (phase 4)."
    when: "Call PushSubscription/set creating a subscription with types [\"CalendarAlert\", \"CalendarEvent\"], and another with types [\"CalendarAlarm\"]."
    then: "The first is created. The second is rejected with invalidProperties and properties [\"types\"]."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 6.4"
      - "rfc:8620 7.2"

  - id: CALR-042
    title: "Push a CalendarAlert object through Web Push"
    method: "PushSubscription"
    spec: "draft-ietf-jmap-calendars-33 6.4 and RFC 8620 7.2"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap, time]
    given: "A verified PushSubscription with types [\"CalendarAlert\"] and encryption keys; an event with a display alert due in one minute."
    when: "Advance the clock to the trigger time and decrypt what the push endpoint received."
    then: "The endpoint receives one encrypted message whose body is the CalendarAlert object with \"@type\", accountId, calendarEventId, uid, recurrenceId and alertId. A subscription with types [\"Email\"] receives nothing."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 6.4"
      - "rfc:8620 7.2"

  - id: CEV-157
    title: "Reject sendSchedulingMessages true with noSupportedScheduleMethods before scheduling exists"
    method: "CalendarEvent/set"
    spec: "draft-ietf-jmap-calendars-33 5.9 and draft-ietf-jmap-calendars-33 5.9.2"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap, db]
    given: "Phase 6 server (no scheduling). The user's default calendar exists."
    when: "Create an event with an owner participant for the user and an attendee mailto:bob@example.net with sendSchedulingMessages true; repeat with sendSchedulingMessages false."
    then: "The first create is rejected with a noSupportedScheduleMethods SetError, nothing is stored and nothing is queued for delivery. The second create succeeds and nothing is queued."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 5.9"
      - "rfc:draft-ietf-jmap-calendars-33 5.9.2"
      - "wildduck:plan 10.3 order of work"
    notes: "Open question. The draft says the server MUST send when the flag is true, and defines this error for recipients it cannot reach; in phase 6 it cannot reach anyone. Silently storing the event would make clients believe invitations went out. An event without participants and sendSchedulingMessages true has nothing to send and must succeed. Superseded in phase 7 by CSCH-001."

  - id: CEV-158
    title: "Leave inbound invitations as plain mail before scheduling exists"
    method: "CalendarEvent/query"
    spec: "draft-ietf-jmap-calendars-33 7 and draft-ietf-jmap-calendars-33 9.4"
    level: wd
    phase: 6
    applies: "yes"
    seed: [lmtp]
    given: "Phase 6 server. CalendarEvent state S1."
    when: "Deliver an iMIP REQUEST (text/calendar; method=REQUEST) addressed to the user through LMTP."
    then: "The message is in the INBOX as ordinary mail. CalendarEvent/changes since S1 reports nothing, no event with the invitation's uid exists, and CalendarEventNotification/get returns an empty list."
    sources:
      - "rfc:draft-ietf-jmap-calendars-33 7"
      - "wildduck:plan 10.3 order of work"
    notes: "Superseded in phase 7 by the inbound CSCH scenarios."

  - id: CEV-159
    title: "Do not return the iCalendar property unless requested, and answer invalidArguments for it before conversion exists"
    method: "CalendarEvent/get"
    spec: "draft-ietf-jmap-calendars-33 5.7"
    level: wd
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Phase 6 server. An event E1."
    when: "Call CalendarEvent/get with properties null, then with properties [\"iCalendar\"]."
    then: "The default response has no iCalendar property. The explicit request answers with error type invalidArguments because the JSCalendar to iCalendar conversion arrives with phase 7."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_get_icalendar"
      - "rfc:draft-ietf-jmap-calendars-33 5.7"
    notes: "Open question: returning the property as null would be the softer alternative."

  - id: CEV-160
    title: "Return an iCalendar rendering of the event when explicitly requested"
    method: "CalendarEvent/get"
    spec: "draft-ietf-jmap-calendars-33 5.7"
    level: should
    phase: 7
    applies: "yes"
    seed: [jmap]
    given: "Phase 7 server. A weekly event with one override and two participants."
    when: "Call CalendarEvent/get with properties [\"iCalendar\", \"uid\"]."
    then: "iCalendar is a string holding a VCALENDAR without METHOD, with one VEVENT carrying the RRULE and one VEVENT with RECURRENCE-ID for the override, both with the event's UID. Parsing it with CalendarEvent/parse yields the same start, duration, time zone, rule and participants."
    sources:
      - "cyrus:JMAPCalendars/calendarevent_get_icalendar"
      - "rfc:draft-ietf-jmap-calendars-33 5.7"
    notes: "Defined by draft-ietf-calext-jscalendar-icalendar, which was not reviewed; the exact property shape may move."

  - id: CEV-161
    title: "Implement the CalendarEventNotification methods even though nothing creates notifications yet"
    method: "CalendarEventNotification/get"
    spec: "draft-ietf-jmap-calendars-33 7.1"
    level: must
    phase: 6
    applies: "yes"
    seed: [jmap]
    given: "Phase 6 server. The user has created, updated and destroyed events through JMAP."
    when: "Call CalendarEventNotification/get with ids null, CalendarEventNotification/query with no filter, and CalendarEventNotification/changes with the state from the get."
    then: "The get returns list [] and a state; the query returns ids []; changes returns the same state and empty lists. None answers unknownMethod."
    sources:
      - "cyrus:JMAPCalendars/calendareventnotification_get_no_sharee"
      - "rfc:draft-ietf-jmap-calendars-33 1.5.1"
      - "rfc:draft-ietf-jmap-calendars-33 7"
    notes: "The calendars capability covers this data type, so the methods must exist in phase 6. Without sharing and without scheduling there is no source of notifications: changes made by the user never create one."
