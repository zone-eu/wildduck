    seed: [jmap]
    given: "Three yearly events starting 2024-02-29T09:00:00 with skip \"omit\", \"backward\" and \"forward\"."
    when: "Expand each over 2025-02-01 to 2025-03-31, and over 2028-02-01 to 2028-03-31."
