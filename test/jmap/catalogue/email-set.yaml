      - "james:EmailSetMethodContract#emailCreationShouldFailWhenHtmlBodyPresentBothBlobIdAndPartId"
      - "james:EmailSetMethodContract#emailCreationShouldFailWhenHtmlBodyAbsentBothBlobIdAndPartId"
