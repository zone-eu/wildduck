    when: "Creates with \"header:Content-Transfer-Encoding\": \" base64\" (and \" 7bit\", \" binary\") on a textBody part, on an attachment part and on a bodyStructure part."
    then: "Each gives invalidProperties naming the part or the header property."
    sources:
      - "james:EmailSetMethodContract#createShouldFailWhenContentTransferEncodingIsSpecified"
      - "james:EmailSetMethodContract#rejectAttahmentCreationRequestWithContentTransferEncoding"
      - "james:EmailSetMethodContract#textContentTransferEncodingShouldBeRejectedInTextBody"
      - "james:EmailSetMethodContract#binaryContentTransferEncodingShouldBeRejectedInTextBody"
      - "fastmail:t/Email/set/create/content-transfer-encoding-not-allowed.t"
      - "rfc:8621 4.6"

  - id: ESET-189
    title: "isTruncated or isEncodingProblem true in bodyValues is rejected"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: should
    phase: 2
    applies: yes
    seed: [jmap]
    given: "The Drafts mailbox id is known."
    when: "Four creates whose body value has isTruncated true, isEncodingProblem true, both false, and both omitted."
    then: "The first two give invalidProperties naming bodyValues; the last two are created."
    sources:
      - "james:EmailSetMethodContract#createShouldFailWhenIsTruncatedIsTrue"
      - "james:EmailSetMethodContract#createShouldFailWhenIsEncodingProblemIsTrue"
      - "fastmail:t/Email/set/create/email-body-value-restrictions.t"
      - "rfc:8621 4.6"

  - id: ESET-190
    title: "bodyValues of the wrong shape are rejected"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "The Drafts mailbox id is known."
    when: "Creates with bodyValues {\"a\": \"text\"}, {\"a\": {\"value\": 5}}, {\"a\": {}} and bodyValues as an array."
    then: "Each gives invalidProperties naming bodyValues."
    sources:
      - "rfc:8621 4.1.4"
      - "cyrus:JMAPEmail/email_set_bodystructure_invalid"

  - id: ESET-191
    title: "An empty text body is allowed"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "The Drafts mailbox id is known."
    when: "Create with textBody [{\"partId\": \"a\"}] and bodyValues {\"a\": {\"value\": \"\"}}."
    then: "Created; Email/get returns the part with size 0 and value \"\"."
    sources:
      - "rfc:8621 4.6"
      - "fastmail:t/Email/set/create/text-body.t"

  - id: ESET-192
    title: "The server chooses charset and transfer encoding for text given by partId"
    method: Email/set
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "The Drafts mailbox id is known."
    when: "Create with a text body value mixing ASCII, accented Latin, CJK and emoji characters."
    then: "Email/get returns the identical string, charset \"utf-8\" on the part and isEncodingProblem false. The raw part is quoted-printable or base64 with a matching Content-Transfer-Encoding header, and the raw message is 7 bit clean."
    sources:
      - "cyrus:JMAPEmail/email_set_create_encoding"
      - "rfc:8621 4.6"
      - "wildduck:MIME builder, after jmap-proxy-go mime_build_test.go"

  - id: ESET-193
    title: "ASCII text is not needlessly encoded"
    method: Email/set
    spec: "RFC 8621 4.1.4"
    level: wd
    phase: 2
    applies: yes
    seed: [jmap]
    given: "The Drafts mailbox id is known."
    when: "Create with a short ASCII only text body with lines under 76 characters."
    then: "The raw part uses Content-Transfer-Encoding 7bit (or quoted-printable without any encoded octet), so the body is readable in the raw message."
    sources:
      - "cyrus:JMAPEmail/email_set_create_encoding"
      - "cyrus:JMAPEmail/email_set_encode_plain_text_attachment"

  - id: ESET-194
    title: "Very long lines in a text body are encoded so no raw line exceeds 998 octets"
    method: Email/set
    spec: "RFC 5322 2.1.1"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "The Drafts mailbox id is known."
    when: "Create with a text body value of 2000 \"x\" characters without a line break, and an html body with a 5000 character line."
    then: "No line of the raw message exceeds 998 octets; Email/get returns the values unchanged with no inserted line breaks."
    sources:
      - "cyrus:JMAPEmail/email_set_text_split"
      - "cyrus:JMAPEmail/email_set_create_encoding"

  - id: ESET-195
    title: "Line endings in a body value are normalised"
    method: Email/set
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "The Drafts mailbox id is known."
    when: "Create with body value \"ab<CRLF>cde<CR>fgh<LF>ij\"."
    then: "The raw message body contains only CRLF line endings (no bare CR or LF). Email/get returns the value with LF line endings: \"ab<LF>cde<LF>fgh<LF>ij\"."
    sources:
      - "cyrus:JMAPEmail/email_set_text_crlf"
      - "rfc:8621 4.1.4"

  - id: ESET-196
    title: "Lines starting with From or a dot and trailing spaces survive"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: wd
    phase: 2
    applies: yes
    seed: [jmap]
    given: "The Drafts mailbox id is known."
    when: "Create with a text body whose lines include \"From here\", \".\", \"..\" and a line ending with spaces."
    then: "Email/get returns exactly the same text and an IMAP FETCH BODY[TEXT] decodes to the same text; nothing is escaped with \">\" or dropped."
    sources:
      - "wildduck:MIME builder round trip"
      - "cyrus:JMAPEmail/email_set_create_encoding"

  - id: ESET-197
    title: "The multipart boundary never occurs in the content"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: wd
    phase: 2
    applies: yes
    seed: [jmap]
    given: "An existing multipart email E whose raw blob is known."
    when: "Create a multipart/mixed email that attaches blob E as text/plain and whose text body contains lines starting with \"--\"."
    then: "Email/get returns exactly two sub parts with the original contents; the generated boundary string does not appear inside any part."
    sources:
      - "cyrus:JMAPEmail/email_set_create_deterministic_boundaries"
      - "wildduck:MIME builder round trip"

  - id: ESET-198
    title: "Attach an uploaded blob"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "A 20 kB binary file uploaded through the upload endpoint, blobId B."
    when: "Create with a text body and attachments [{\"blobId\": B, \"type\": \"application/pdf\", \"name\": \"report.pdf\", \"disposition\": \"attachment\"}]."
    then: "Created. Email/get shows hasAttachment true and one attachment with type application/pdf, name report.pdf, disposition attachment and size 20 kB; downloading its blobId returns bytes identical to the upload."
    sources:
      - "james:EmailSetMethodContract#createShouldSupportAttachment"
      - "james:EmailSetMethodContract#createShouldSupportAttachmentWithName"
      - "james:EmailSetMethodContract#createShouldSupportAttachmentAndTextBody"
      - "cyrus:JMAPEmail/email_set_attachments"
      - "jmapio:email/set-create-with-attachment"
      - "fastmail:t/Email/set/create/attachments-using-blob-id.t"
      - "fastmail:t/Email/set/create/attachments.t"

  - id: ESET-199
    title: "textBody, htmlBody and attachments together"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "Uploaded blobs IMG and DOC."
    when: "Create with textBody, htmlBody, and attachments [IMG with disposition inline and cid \"c1\", DOC with disposition attachment]."
    then: "Email/get: textBody is the plain part, htmlBody the html part, attachments lists IMG (inline, cid c1) and DOC. The html part and IMG share a multipart/related parent and DOC sits in the outer multipart/mixed."
    sources:
      - "james:EmailSetMethodContract#createShouldSupportInlinedAttachmentsMixedWithRegularAttachmentsAndHtmlBody"
      - "james:EmailSetMethodContract#createShouldSupportAttachmentAndHtmlBody"
      - "james:EmailSetMethodContract#inlinedAttachmentsShouldBeWrappedInRelatedMultipart"
      - "cyrus:JMAPEmail/email_set_multipart_related"
      - "stalwart:resources/jmap/email_set/rfc8621_2"

  - id: ESET-200
    title: "No needless multipart wrappers are generated"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: wd
    phase: 2
    applies: yes
    seed: [jmap]
    given: "Uploaded blobs IMG and DOC."
    when: "Create (a) htmlBody plus one inline IMG only, (b) htmlBody plus one regular attachment DOC only."
    then: "In (a) the top level is multipart/related with no multipart/mixed around it. In (b) the top level is multipart/mixed with no multipart/related inside."
    sources:
      - "james:EmailSetMethodContract#inlinedAttachmentsOnlyShouldNotBeWrappedInAMixedMultipart"
      - "james:EmailSetMethodContract#htmlBodyPartWithOnlyNormalAttachmentsShouldNotBeWrappedInARelatedMultipart"

  - id: ESET-201
    title: "cid becomes a Content-ID header in angle brackets"
    method: Email/set
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "An uploaded image blob IMG."
    when: "Create with an inline attachment {\"blobId\": IMG, \"type\": \"image/png\", \"cid\": \"logo@example.com\", \"disposition\": \"inline\"}."
    then: "The raw part has \"Content-ID: <logo@example.com>\" and Email/get returns cid \"logo@example.com\" without brackets. A cid containing spaces or angle brackets is rejected with invalidProperties."
    sources:
      - "james:EmailSetMethodContract#inlinedAttachmentsShouldBeWrappedInRelatedMultipart"
      - "fastmail:t/Email/set/create/body-structure-subparts.t"
      - "rfc:8621 4.1.4"

  - id: ESET-202
    title: "language and location become Content-Language and Content-Location"
    method: Email/set
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "The Drafts mailbox id is known."
    when: "Create with bodyStructure {\"type\": \"text/plain\", \"partId\": \"t\", \"language\": [\"de-DE\", \"en-CA\"], \"location\": \"http://example.com/uri\"}."
    then: "Email/get bodyStructure returns the same language list and location; the raw headers are \"Content-Language: de-DE, en-CA\" and \"Content-Location: http://example.com/uri\"."
    sources:
      - "cyrus:JMAPEmail/email_set_language_header"
      - "cyrus:JMAPEmail/email_set_location"
      - "fastmail:t/Email/set/create/body-structure-subparts.t"

  - id: ESET-203
    title: "disposition and name set Content-Disposition and its filename"
    method: Email/set
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "An uploaded blob B."
    when: "Creates with attachments using disposition \"attachment\", \"inline\", null (omitted) and a non standard token \"x-custom\", each with name \"a.bin\"."
    then: "Email/get returns the disposition as sent (lowercase) and name \"a.bin\". With disposition omitted the part still carries the name (as a Content-Type name or Content-Disposition filename parameter) and is listed in attachments."
    sources:
      - "cyrus:JMAPEmail/email_set_filename"
      - "james:EmailSetMethodContract#createShouldSupportAttachmentWithName"
      - "rfc:8621 4.1.4"

  - id: ESET-204
    title: "Non ASCII and long attachment names are encoded and round trip"
    method: Email/set
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "An uploaded blob B."
    when: "Creates with attachment names containing accented and CJK characters, a name with quotes, semicolons and backslashes, and a 300 character name."
    then: "Email/get name returns each original name. The raw header uses RFC 2231 or RFC 2047 parameter encoding with ASCII only lines under 998 octets, and IMAP BODYSTRUCTURE exposes a decodable file name."
    sources:
      - "cyrus:JMAPEmail/email_set_filename"
      - "cyrus:JMAPEmail/email_import_encoded_contenttype"

  - id: ESET-205
    title: "Binary and 8 bit attachment content is preserved exactly"
    method: Email/set
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "An uploaded blob containing all 256 octet values, NUL octets, bare CR and bare LF and no trailing newline."
    when: "Create with that blob as an application/octet-stream attachment."
    then: "The raw part is base64 encoded with lines of at most 76 characters. Downloading the part blobId, and IMAP FETCH BINARY or decoding BODY[n], gives bytes identical to the upload."
    sources:
      - "cyrus:JMAPEmail/email_set_blobencoding"
      - "cyrus:JMAPEmail/email_set_encode_plain_text_attachment"
      - "jmapio:binary/upload-binary-content"

  - id: ESET-206
    title: "A text attachment with LF line endings is not rewritten"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: should
    phase: 2
    applies: yes
    seed: [jmap]
    given: "An uploaded blob with content \"line1<LF>line2<LF>\" (bare LF)."
    when: "Create with that blob as a text/plain attachment with disposition attachment."
    then: "Downloading the attachment part blob returns the original octets with bare LF; the server used an encoding (base64 or quoted-printable) that preserves them."
    sources:
      - "cyrus:JMAPEmail/email_set_encode_plain_text_attachment"

  - id: ESET-207
    title: "Text and HTML bodies can be given by blobId"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "Uploaded blobs T (UTF-8 text) and H (UTF-8 html)."
    when: "Create with textBody [{\"blobId\": T, \"type\": \"text/plain\"}] and htmlBody [{\"blobId\": H, \"type\": \"text/html\"}], no bodyValues."
    then: "Created; Email/get with fetchAllBodyValues returns the blob contents as the text and html values."
    sources:
      - "james:EmailSetMethodContract#creationShouldSupportHtmlBodyUsingBlobId"
      - "fastmail:t/Email/set/create/text-body-using-blob-id.t"
      - "fastmail:t/Email/set/create/html-body-using-blob-id.t"

  - id: ESET-208
    title: "charset given with a blobId is declared on the part"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: should
    phase: 2
    applies: yes
    seed: [jmap]
    given: "An uploaded blob holding ISO-8859-1 encoded text with accented characters."
    when: "Create with textBody [{\"blobId\": B, \"type\": \"text/plain\", \"charset\": \"iso-8859-1\"}]."
    then: "Email/get returns charset \"iso-8859-1\" for the part and the decoded body value shows the accented characters correctly; the blob bytes are not transcoded."
    sources:
      - "james:EmailSetMethodContract#shouldPreserveCharsetOfBlobWhenEmailBodyWithBlobId"
      - "james:EmailSetMethodContract#createShouldSupportCustomCharsetInAttachment"
      - "cyrus:JMAPEmail/email_set_create_encoding"

  - id: ESET-209
    title: "A part blob of another email can be reused as an attachment"
    method: Email/set
    spec: "RFC 8620 6"
    level: must
    phase: 2
    applies: yes
    seed: [imap, jmap]
    given: "An email E in INBOX with a PDF attachment whose part blobId PB is known from Email/get."
    when: "Create a new email with attachments [{\"blobId\": PB, \"type\": \"application/pdf\", \"name\": \"copy.pdf\"}]."
    then: "Created; the new attachment downloads byte identical to the original. Destroying E afterwards does not affect the new email."
    sources:
      - "cyrus:JMAPEmail/email_set_update_after_attach"
      - "rfc:8620 6"
      - "fastmail:t/Email/set/create/attachments-using-blob-id.t"

  - id: ESET-210
    title: "A whole email can be attached as message/rfc822"
    method: Email/set
    spec: "RFC 8620 6"
    level: must
    phase: 2
    applies: yes
    seed: [imap, jmap]
    given: "An email E in INBOX with blobId EB, containing 8 bit characters."
    when: "Create with attachments [{\"blobId\": EB, \"type\": \"message/rfc822\", \"name\": \"fwd.eml\"}]."
    then: "Created; the nested part has type message/rfc822 and Content-Transfer-Encoding 7bit, 8bit or binary (never base64 or quoted-printable). Downloading the part blob equals the raw bytes of E and Email/parse on it returns the subject of E."
    sources:
      - "james:EmailSetMethodContract#createShouldSupportAttachedMessages"
      - "cyrus:JMAPEmail/email_set_blobencoding"
      - "cyrus:JMAPEmail/email_set_multipartdigest"
      - "rfc:8620 6"
    notes: "RFC 2046 5.2.1 forbids base64 or quoted-printable on message/rfc822."

  - id: ESET-211
    title: "A blob used in a create and whose owner is destroyed in the same call is still usable"
    method: Email/set
    spec: "RFC 8620 6"
    level: must
    phase: 2
    applies: yes
    seed: [imap, jmap]
    given: "An email E with an attachment part blob PB."
    when: "One Email/set with create {\"c1\": <email attaching PB>} and destroy [E]."
    then: "c1 is created with the attachment intact and E is destroyed."
    sources:
      - "rfc:8620 6"

  - id: ESET-212
    title: "Custom headers on a body part are written into the part"
    method: Email/set
    spec: "RFC 8621 4.1.4"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "An uploaded blob B."
    when: "Create with bodyStructure multipart/mixed whose attachment part has \"header:X-Part-Info\": \" abc\" and \"header:Content-Description:asText\": \"desc\"."
    then: "Email/get with bodyProperties [\"header:X-Part-Info\", \"header:Content-Description:asText\"] returns those values on that part only, not on the top level."
    sources:
      - "james:EmailSetMethodContract#shouldSupportSpecificHeadersInEmailBodyPart"
      - "fastmail:t/Email/set/create/body-structure-subparts.t"
      - "stalwart:resources/jmap/email_set/headers"

  - id: ESET-213
    title: "A part header that duplicates a part property is rejected"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: should
    phase: 2
    applies: yes
    seed: [jmap]
    given: "An uploaded blob B."
    when: "Creates whose part has (a) type plus \"header:Content-Type\", (b) disposition plus \"header:Content-Disposition\", (c) cid plus \"header:Content-ID\", (d) language plus \"header:Content-Language\", (e) location plus \"header:Content-Location\"."
    then: "Each gives invalidProperties naming the part."
    sources:
      - "james:EmailSetMethodContract#shouldFailIfSpecificHeadersSetInBothEmailBodyPartAndEmailBodyValue"
      - "cyrus:JMAPEmail/email_set_create_encoding"
      - "rfc:8621 4.6"

  - id: ESET-214
    title: "An attachment without a type gets a default type"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: wd
    phase: 2
    applies: yes
    seed: [jmap]
    given: "A blob uploaded with Content-Type image/png."
    when: "Create with attachments [{\"blobId\": B, \"name\": \"x.png\"}] (no type)."
    then: "Created; the part type is the type recorded at upload, or application/octet-stream. It is never text/plain for binary content."
    sources:
      - "james:EmailSetMethodContract#createShouldSucceedWhenPartPropertiesOmitted"
      - "rfc:8620 6"
    notes: "RFC 8620 6 says a blobId carries no content type, so falling back to application/octet-stream is the strict reading. Decide one."

  - id: ESET-215
    title: "An unknown blobId gives blobNotFound with the notFound list"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "One uploaded blob B; ids X1 and X2 that do not exist."
    when: "Create with attachments referencing X1, B and X2."
    then: "notCreated.c1 has type blobNotFound and notFound containing exactly X1 and X2 (not B). Nothing is stored."
    sources:
      - "james:EmailSetMethodContract#createShouldFailWhenAttachmentNotFound"
      - "james:EmailSetMethodContract#emailCreationShouldFailWhenHtmlBodyUsesNotFoundBlobId"
      - "fastmail:t/Email/set/create/blob-not-found.t"
      - "rfc:8621 4.6"

  - id: ESET-216
    title: "Another user's blob gives blobNotFound"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: must
    phase: 2
    applies: yes
    seed: [jmap, api]
    given: "Users A and B; a blob uploaded by B and the blobId of an email of B."
    when: "As A, create an email attaching each of those blob ids."
    then: "Both creates fail with blobNotFound listing the blob id; no data of B is copied."
    sources:
      - "james:EmailSetMethodContract#createShouldFailWhenAttachmentDoesNotBelongToUser"
      - "james:EmailSetMethodContract#emailCreationShouldFailWhenHtmlBodyUsesNotUploadBlobId"
      - "james:EmailImportContract#importShouldFailWhenBlobNotOwned"

  - id: ESET-217
    title: "A malformed blobId is reported like a missing blob"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "The Drafts mailbox id is known."
    when: "Create with attachments [{\"blobId\": \"not a blob id!\", \"type\": \"text/plain\"}] and another with \"blobId\": 5."
    then: "The string case gives blobNotFound with the id in notFound (or invalidProperties); the number gives invalidProperties. Neither answers serverFail."
    sources:
      - "fastmail:t/Email/set/create/blob-not-found.t"
      - "rfc:8621 4.6"

  - id: ESET-218
    title: "An expired upload gives blobNotFound"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: must
    phase: 2
    applies: yes
    seed: [jmap, time]
    given: "A blob uploaded and left unreferenced past the upload expiry time."
    when: "Create with an attachment referencing that blobId."
    then: "notCreated.c1 is blobNotFound with the id in notFound."
    sources:
      - "rfc:8620 6"
      - "wildduck:brief: uploads expire when unreferenced"

  - id: ESET-219
    title: "An email keeps its attachment after the uploaded blob expires"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: wd
    phase: 2
    applies: yes
    seed: [jmap, time]
    given: "An email created with an attachment from uploaded blob B."
    when: "Let the upload expire and run the upload cleanup, then Email/get and download the attachment part blob."
    then: "The attachment is intact and downloads byte identical; the message owns its own copy of the content."
    sources:
      - "rfc:8620 6"
      - "wildduck:report 4.10: upload expiry"

  - id: ESET-220
    title: "One uploaded blob can be attached to several emails and several times in one email"
    method: Email/set
    spec: "RFC 8620 6"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "An uploaded blob B."
    when: "One Email/set creating two emails that both attach B, one of them twice under different names."
    then: "Both are created; each attachment downloads identical to B; B itself still downloads until it expires."
    sources:
      - "rfc:8620 6"
      - "cyrus:JMAPEmail/email_set_attachments"

  - id: ESET-221
    title: "An email larger than the message size limit gives tooLarge"
    method: Email/set
    spec: "RFC 8620 5.3"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "The server message size limit L is known (maxSizeAttachmentsPerEmail and the configured maximum message size)."
    when: "Create with a text body value large enough that the generated message exceeds L (within maxSizeRequest), or with attachments that push it over."
    then: "notCreated.c1 has type tooLarge; nothing is stored and the quota usage is unchanged."
    sources:
      - "james:EmailSetMethodContract#tooBigEmailsShouldBeRejected"
      - "rfc:8620 5.3"

  - id: ESET-222
    title: "Attachments over maxSizeAttachmentsPerEmail give tooLarge"
    method: Email/set
    spec: "RFC 8621 1.3.1"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "The account capability maxSizeAttachmentsPerEmail is N; two uploaded blobs whose sizes add up to more than N while each is below N."
    when: "Create attaching both blobs; then create attaching only one."
    then: "The first gives tooLarge. The second is created."
    sources:
      - "rfc:8621 1.3.1"
      - "james:EmailSetMethodContract#tooBigEmailsShouldBeRejected"
    notes: "The limit counts unencoded attachment sizes. Attachments summing to exactly N must be accepted, so the raw message size limit has to leave room for base64 overhead."

  - id: ESET-223
    title: "A create that would exceed the storage quota gives overQuota"
    method: Email/set
    spec: "RFC 8620 5.3"
    level: must
    phase: 2
    applies: yes
    seed: [jmap, api]
    given: "A user whose quota is set through the REST API so that less than 10 kB is free; a 50 kB uploaded blob."
    when: "Create attaching the blob."
    then: "notCreated.c1 has type overQuota; no message is stored, storageUsed in the REST API is unchanged, and a small create that fits still succeeds afterwards."
    sources:
      - "james:EmailSetMethodContract#createShouldEnforceQuotas"
      - "cyrus:JMAPEmail/email_set_getquota"
      - "cyrus:JMAPEmail/email_set_create_copy_overquota"
      - "stalwart:system/quota.rs"

  - id: ESET-224
    title: "A create increases the storage used by the message size"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: wd
    phase: 2
    applies: yes
    seed: [jmap, api]
    given: "storageUsed of the user read through the REST API."
    when: "Create an email, read created.c1.size, read storageUsed again; destroy the email and read once more."
    then: "storageUsed grew by exactly size after the create and returned to the original value after the destroy."
    sources:
      - "cyrus:JMAPEmail/email_set_getquota"
      - "wildduck:quota accounting through the existing upload path"

  - id: ESET-225
    title: "Keyword and update operations work while over quota"
    method: Email/set
    spec: "RFC 8620 5.3"
    level: should
    phase: 2
    applies: yes
    seed: [imap, api]
    given: "A user over quota (quota lowered through the REST API) with an email M1 in INBOX."
    when: "Email/set update of keywords on M1, a move of M1 to Trash, and a destroy."
    then: "All three succeed; being over quota blocks creates only."
    sources:
      - "james:EmailSetMethodContract#copyShouldEnforceQuotas"
      - "rfc:8620 5.3"
    notes: "James checks quota on JMAP copy because a second mailbox is a new copy; in WildDuck a move does not add storage."

  - id: ESET-226
    title: "Create into a mailbox with encryption at rest"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: wd
    phase: 2
    applies: adapted
    seed: [jmap, api]
    given: "A user with a PGP public key and encryptMessages enabled."
    when: "Email/set create of a text draft."
    then: "Created; created.c1.size and blobId describe the message as stored (encrypted), and the IMAP view of the same message has the same size and bytes."
    sources:
      - "wildduck:brief: encrypted at rest mailboxes return the encrypted parts as stored"
    notes: "Open question: whether drafts created by the owner should be encrypted at all; today the REST API draft upload follows the user setting."

  - id: ESET-227
    title: "A created email is byte identical over IMAP"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: wd
    phase: 2
    applies: adapted
    seed: [jmap]
    given: "An IMAP session for the same user."
    when: "Create an email with text, html and one attachment; download created.c1.blobId; IMAP FETCH (RFC822.SIZE BODY.PEEK[] INTERNALDATE FLAGS) of the new message."
    then: "BODY[] equals the downloaded blob octet for octet, RFC822.SIZE equals created size and the blob length, INTERNALDATE equals receivedAt, and FLAGS match the keywords."
    sources:
      - "wildduck:brief: the same message must look the same through IMAP and JMAP"
      - "stalwart:mail/set.rs"
      - "cyrus:JMAPEmail/email_set_draft"

  - id: ESET-228
    title: "IMAP BODYSTRUCTURE and ENVELOPE agree with the JMAP view of a created email"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: wd
    phase: 2
    applies: adapted
    seed: [jmap]
    given: "An IMAP session for the same user."
    when: "Create a nested multipart email with from, to, cc, subject, messageId and inReplyTo; IMAP FETCH (BODYSTRUCTURE ENVELOPE)."
    then: "BODYSTRUCTURE has the same tree, types, names, content ids, encodings and part sizes that Email/get bodyStructure reports; ENVELOPE subject, addresses, message id and in-reply-to match the convenience properties."
    sources:
      - "wildduck:brief: the same message must look the same through IMAP and JMAP"
      - "cyrus:JMAPEmail/email_set_bodystructure"

  - id: ESET-229
    title: "A selected IMAP session is told about a created email"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: wd
    phase: 2
    applies: adapted
    seed: [jmap]
    given: "An IMAP session idling on Drafts."
    when: "Email/set create into Drafts."
    then: "The session receives an untagged EXISTS (and the message is found with the next UID); the mailbox UIDNEXT advanced by one."
    sources:
      - "wildduck:lib/imap-notifier.js"
      - "james:ImapSetMessagesMailboxesUpdatesCompatibilityContract"

  - id: ESET-230
    title: "A created email is visible in the REST API"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: wd
    phase: 2
    applies: adapted
    seed: [jmap, api]
    given: "Nothing special."
    when: "Create a draft with $draft, subject, text, html and an attachment; fetch it through the REST API messages endpoint of Drafts."
    then: "The REST message shows the same subject, addresses, draft true, the text and html content and one attachment with the same file name and size."
    sources:
      - "wildduck:REST API and JMAP share the store"

  - id: ESET-231
    title: "The created email can be fetched in the same request with the full body model"
    method: Email/set
    spec: "RFC 8620 5.3"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "Nothing special."
    when: "One request: Email/set create {\"c1\": ...} then Email/get ids [\"#c1\"] with fetchAllBodyValues true."
    then: "Email/get returns the email with preview (at most 128 characters), hasAttachment, bodyStructure, textBody, htmlBody, attachments and bodyValues consistent with what was sent."
    sources:
      - "cyrus:JMAPEmail/email_set_text_crlf"
      - "stalwart:mail/set.rs"
      - "fastmail:t/Email/set/create/text-body.t"

  - id: ESET-232
    title: "Concurrent keyword patches on the same email are both applied"
    method: Email/set
    spec: "RFC 8620 5.3"
    level: wd
    phase: 2
    applies: adapted
    seed: [imap]
    given: "An email M1 without keywords; two JMAP clients."
    when: "In parallel, client 1 sends {\"keywords/$seen\": true} and client 2 sends {\"keywords/$flagged\": true}, repeated 50 times with clearing in between."
    then: "Every round ends with both keywords set and both calls reporting updated. No patch is lost through read, modify, write on the whole flag list."
    sources:
      - "wildduck:report 4.4: no transaction, patches map to the STORE path"
      - "cyrus:JMAPEmail/email_set_update_bulk"

  - id: ESET-233
    title: "Whole object keyword replacements from two clients leave one of the two values"
    method: Email/set
    spec: "RFC 8620 5.3"
    level: wd
    phase: 2
    applies: adapted
    seed: [imap]
    given: "An email M1; two JMAP clients."
    when: "In parallel, client 1 sends {\"keywords\": {\"a\": true}} and client 2 sends {\"keywords\": {\"b\": true}}."
    then: "Both report updated. The final keywords are exactly {\"a\": true} or exactly {\"b\": true}, never a mix and never empty, and IMAP shows the same."
    sources:
      - "wildduck:report 4.4: Email/set update"
      - "rfc:8620 5.3"

  - id: ESET-234
    title: "A second client with a stale ifInState is refused"
    method: Email/set
    spec: "RFC 8620 5.3"
    level: must
    phase: 2
    applies: yes
    seed: [imap]
    given: "An email M1; both clients read state S0."
    when: "Client 1 updates M1 with ifInState S0 and succeeds; then client 2 updates M1 with ifInState S0."
    then: "Client 2 gets stateMismatch and its change is not applied; after re-reading the state its retry succeeds."
    sources:
      - "fastmail:t/Email/set/if-in-state.t"
      - "rfc:8620 5.3"
    notes: "When the two calls are truly simultaneous the report accepts a small check then write race; the sequential case must always hold."

  - id: ESET-235
    title: "Concurrent moves of the same email leave exactly one copy"
    method: Email/set
    spec: "RFC 8620 5.3"
    level: wd
    phase: 2
    applies: adapted
    seed: [imap]
    given: "An email M1 in INBOX; mailboxes A and B; two JMAP clients."
    when: "In parallel, client 1 moves M1 to A and client 2 moves M1 to B."
    then: "Afterwards Email/get shows M1 with exactly one mailboxId (A or B). Over IMAP exactly one of A and B holds the message and INBOX does not; counters of all three mailboxes are exact. Each call reports updated or notFound, never serverFail."
    sources:
      - "wildduck:report 5.1: uniqueness of root is an invariant of the write paths"
      - "cyrus:JMAPEmail/email_set_move_multiuid_set"

  - id: ESET-236
    title: "Concurrent destroy and update of the same email"
    method: Email/set
    spec: "RFC 8620 5.3"
    level: wd
    phase: 2
    applies: adapted
    seed: [imap]
    given: "An email M1; two JMAP clients."
    when: "In parallel, client 1 destroys M1 and client 2 sets a keyword on M1."
    then: "The destroy reports destroyed. The update reports updated or notFound. Afterwards the email is gone from JMAP and IMAP and exists once in the archive."
    sources:
      - "rfc:8620 5.3"
      - "wildduck:archive on destroy"

  - id: ESET-237
    title: "Two clients destroying the same email"
    method: Email/set
    spec: "RFC 8620 5.3"
    level: wd
    phase: 2
    applies: adapted
    seed: [imap]
    given: "An email M1; two JMAP clients."
    when: "Both send Email/set destroy [M1] at the same time."
    then: "One or both report destroyed and any other reports notFound; mailbox counters drop by one only, storageUsed drops by the size once, and the archive holds one copy."
    sources:
      - "rfc:8620 5.3"
      - "wildduck:archive on destroy"

  - id: ESET-238
    title: "JMAP update racing with an IMAP move"
    method: Email/set
    spec: "RFC 8620 5.3"
    level: wd
    phase: 2
    applies: adapted
    seed: [imap]
    given: "An email M1 in INBOX; an IMAP session and a JMAP client."
    when: "At the same time IMAP UID MOVE of the message to Archive and Email/set update {M1: {\"keywords/$flagged\": true}}."
    then: "The JMAP call reports updated (never notFound for a message that still exists) and the message in Archive ends up with \\Flagged."
    sources:
      - "wildduck:brief: id is stable across moves"
      - "james:ImapSetMessagesMailboxesUpdatesCompatibilityContract"
    notes: "A move inserts the new document before deleting the old one (report 5.1), so the lookup by root must tolerate seeing two documents for a moment."

  - id: ESET-239
    title: "JMAP keyword patch racing with an IMAP STORE on the same message"
    method: Email/set
    spec: "RFC 8620 5.3"
    level: wd
    phase: 2
    applies: adapted
    seed: [imap]
    given: "An email M1 in INBOX; an IMAP session and a JMAP client."
    when: "At the same time IMAP STORE +FLAGS (\\Answered) and Email/set update {M1: {\"keywords/$flagged\": true}}."
    then: "Both flags are set afterwards in both views, and Email/changes from the earlier state lists M1 in updated."
    sources:
      - "james:ImapKeywordsConsistencyContract"
      - "wildduck:patch semantics"
