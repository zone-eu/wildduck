  - id: ESET-186
    title: "charset and size are not allowed together with partId"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: should
    phase: 2
    applies: yes
    seed: [jmap]
    given: "The Drafts mailbox id is known."
    when: "Create with textBody [{\"partId\": \"a\", \"charset\": \"utf-8\"}]; another with textBody [{\"partId\": \"a\", \"size\": 3}]."
    then: "Both give invalidProperties naming the part property (for example textBody/0/charset or textBody)."
    sources:
      - "james:EmailSetMethodContract#createShouldFailWhenCharsetIsSpecified"
      - "james:EmailSetMethodContract#createShouldFailWhenSizeIsSpecified"
      - "fastmail:t/Email/set/create/no-charset-with-partid.t"
      - "fastmail:t/Email/set/create/no-size-with-partid.t"
      - "cyrus:JMAPEmail/email_set_create_encoding"

  - id: ESET-187
    title: "size given together with blobId is ignored"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: must
    phase: 2
    applies: yes
    seed: [jmap]
    given: "An uploaded blob B of 100 octets."
    when: "Create with an attachment {\"blobId\": B, \"type\": \"text/plain\", \"size\": 105}; another with size 100."
    then: "Both are created and Email/get reports the real decoded size 100 for the part."
    sources:
      - "fastmail:t/Email/set/create/size-with-blob-id-must-match.t"
      - "rfc:8621 4.6"

  - id: ESET-188
    title: "A Content-Transfer-Encoding header on a body part is rejected"
    method: Email/set
