  - id: ESET-185
    title: "A partId that is missing from bodyValues is rejected"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: should
    phase: 2
    applies: yes
    seed: [jmap]
    given: "The Drafts mailbox id is known."
    when: "Create with textBody [{\"partId\": \"a\"}] and bodyValues {\"b\": {\"value\": \"x\"}}; another with no bodyValues at all."
    then: "Both give invalidProperties naming textBody or bodyValues."
    sources:
      - "james:EmailSetMethodContract#createShouldFailWhenPartIdMisMatch"
      - "fastmail:t/Email/set/create/email-body-part-must-be-present.t"
