      - "james:EmailSetMethodContract#createShouldFailWhenMultipleBodyParts"
      - "fastmail:t/Email/set/create/only-one-part-in-text-body.t"
      - "fastmail:t/Email/set/create/only-one-part-in-html-body.t"
      - "rfc:8621 4.6"

  - id: ESET-183
    title: "textBody must be text/plain and htmlBody must be text/html"
    method: Email/set
    spec: "RFC 8621 4.6"
    level: should
    phase: 2
    applies: yes
    seed: [jmap]
    given: "The Drafts mailbox id is known."
    when: "Create with textBody [{\"partId\": \"a\", \"type\": \"text/html\"}]; another with htmlBody [{\"partId\": \"a\", \"type\": \"text/plain\"}]; another with htmlBody [{\"partId\": \"a\"}] (type omitted)."
    then: "The first two give invalidProperties naming textBody and htmlBody. The third is created and the part type is text/html."
