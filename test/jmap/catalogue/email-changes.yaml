area: email-changes
title: "Email/changes and state strings"
description: "State strings for Email (shared with Thread and Mailbox) and the Email/changes method: every origin of change, coalescing, maxChanges paging, errors, concurrency and large change sets. In the scenarios S0 is the state returned by Email/get before the described change and S1 the state after it."
scenarios:
  - id: ECHG-001
    title: "Email/get returns a state string"
    method: "Email/get"
    spec: "RFC 8620 5.1"
    level: must
    phase: 1
    applies: "yes"
    seed: [none]
    given: "A fresh account with only the default mailboxes."
    when: "Email/get with ids set to an empty array."
    then: "The response has a state property that is a non empty JSON string, list is empty and notFound is empty."
    sources:
      - "rfc:8620 5.1"
      - "jmap-perl:t/set-state-consistent.t"
  - id: ECHG-002
    title: "State is identical on repeated calls when nothing changed"
    method: "Email/get"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "An account with three messages appended over IMAP, then no further activity."
    when: "Email/get with ids null is called three times, with Email/query, Email/changes and Thread/get calls in between."
    then: "All three responses carry the same state string. Read only methods never change the state."
    sources:
      - "rfc:8620 5.2"
      - "fastmail:t/Email/changes/no-changes.t"
      - "legacy-proxy:test/unit/shared.spec.ts"
  - id: ECHG-003
    title: "Email, Thread and Mailbox share one state string"
    method: "Email/get"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "An account with a few messages."
    when: "One request with Email/get (ids empty), Thread/get (ids empty) and Mailbox/get (ids null)."
    then: "The three state values are the same string."
    sources:
      - "wildduck:brief State and changes"
      - "wildduck:plan 5.2"
  - id: ECHG-004
    title: "Email/changes from the current state returns no changes"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "An account with messages. S0 is read with Email/get."
    when: "Email/changes with sinceState S0."
    then: "oldState is S0, newState is S0, hasMoreChanges is false, created, updated and destroyed are empty arrays."
    sources:
      - "james:EmailChangesMethodContract#emailChangesShouldReturnNoChangesWhenNoNewerState"
      - "cyrus:JMAPEmail/email_changes"
      - "jmapio:email/changes-no-changes"
      - "fastmail:t/Email/changes/no-changes.t"
      - "legacy-proxy:test/unit/shared.spec.ts"
  - id: ECHG-005
    title: "Email/changes response carries all required properties with the right types"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "One message was appended after S0."
    when: "Email/changes with sinceState S0."
    then: "The response has exactly accountId (the account id used), oldState (string, equal to S0), newState (string), hasMoreChanges (boolean) and created, updated, destroyed (arrays of Email ids, each id M plus 24 hex characters)."
    sources:
      - "jmapio:email/changes-response-structure"
      - "rfc:8620 5.2"
  - id: ECHG-006
    title: "State changes when an Email is created and oldState differs from newState"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "S0 is read, then one message is appended over IMAP."
    when: "Email/get (ids empty) and Email/changes with sinceState S0 in one request."
    then: "Email/get state S1 differs from S0. Email/changes returns oldState S0 and newState S1."
    sources:
      - "james:EmailChangesMethodContract#emailChangesShouldReturnDifferentStateThanOldState"
      - "rfc:8620 5.2"
  - id: ECHG-007
    title: "newState of a complete Email/changes equals the current Email/get state"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "Several changes were made after S0."
    when: "Email/changes with sinceState S0 and no maxChanges, followed by Email/get with ids empty in the same request."
    then: "hasMoreChanges is false and newState equals the state returned by Email/get."
    sources:
      - "jmap-perl:t/set-state-consistent.t"
      - "rfc:8620 5.2"
  - id: ECHG-008
    title: "Calling Email/changes again with the returned newState yields nothing"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "One message was appended after S0 and Email/changes since S0 returned newState S1."
    when: "Email/changes with sinceState S1."
    then: "All three lists are empty, hasMoreChanges is false, newState is S1."
    sources:
      - "james:EmailChangesMethodContract#emailChangesShouldEventuallyReturnNoChanges"
      - "rfc:8620 5.2"
  - id: ECHG-009
    title: "An account without any journal entry gets a stable state on first use"
    method: "Email/get"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: "yes"
    seed: [db]
    given: "A user that existed before JMAP was enabled, with no state anchor document and no journal entries."
    when: "Email/get with ids empty twice, then Email/changes with the returned state."
    then: "Both calls return the same non empty state (the anchor is minted once, not per call) and Email/changes returns no changes."
    sources:
      - "wildduck:plan 5.2"
  - id: ECHG-010
    title: "State does not change when old journal entries expire"
    method: "Email/get"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: "yes"
    seed: [imap, time, db]
    given: "S0 is read after some changes. The journal retention then passes (or all journal entries of the user are removed from the journal collection) with no new change."
    when: "Email/get with ids empty."
    then: "state is still S0."
    sources:
      - "wildduck:plan 5.2"
      - "wildduck:brief State and changes"
    notes: "The state is a persisted per user anchor, not the newest journal row."
  - id: ECHG-011
    title: "A sinceState equal to the current state stays usable after the journal has expired"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: "yes"
    seed: [imap, time, db]
    given: "S0 is read. Nothing changes for longer than the journal retention, so S0 is older than the retention window and the journal holds no entries for the user."
    when: "Email/changes with sinceState S0."
    then: "The answer is an empty change set with newState S0 and hasMoreChanges false, not cannotCalculateChanges."
    sources:
      - "wildduck:plan 5.2"
    notes: "A sinceState equal to the anchor is answered without touching the journal."
  - id: ECHG-012
    title: "State survives a restart of the server processes"
    method: "Email/get"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "S0 is read after some changes."
    when: "All WildDuck processes are restarted, then Email/get (ids empty) and Email/changes with sinceState S0."
    then: "state is S0 and Email/changes returns no changes. Nothing in the state depends on process memory or start time."
    sources:
      - "wildduck:brief State and changes"
  - id: ECHG-013
    title: "Changes in another account do not change the state"
    method: "Email/get"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [lmtp]
    given: "Users A and B. S0 is the Email state of A."
    when: "A message is delivered to B, then Email/get (ids empty) for A."
    then: "A still has state S0."
    sources:
      - "rfc:8620 5.2"
  - id: ECHG-014
    title: "Account changes that do not touch mail data leave the Email state alone"
    method: "Email/get"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: "yes"
    seed: [api]
    given: "S0 is read."
    when: "The user name, quota and password are updated through the REST API and an application password is created, then Email/get (ids empty)."
    then: "state is still S0."
    sources:
      - "wildduck:plan 5.2"
  - id: ECHG-015
    title: "A change that touches only mailboxes advances the shared state but lists no Email ids"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: adapted
    seed: [api]
    given: "S0 is read. A new empty mailbox is created through the REST API."
    when: "Email/changes with sinceState S0."
    then: "newState differs from S0 and equals the current Mailbox/get state, hasMoreChanges is false and created, updated and destroyed are all empty."
    sources:
      - "wildduck:brief State and changes"
      - "rfc:8620 5.2"
    notes: "Follows from the shared state string. Clients must accept an empty change set with a new state."
  - id: ECHG-016
    title: "Email/changes, Thread/changes and Mailbox/changes accept the same sinceState and agree on newState"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "S0 is read. A message is appended and another is flagged after S0."
    when: "One request with Email/changes, Thread/changes and Mailbox/changes, all with sinceState S0 and no maxChanges."
    then: "All three succeed, return oldState S0 and the same newState, and hasMoreChanges is false in each."
    sources:
      - "wildduck:brief State and changes"
      - "jmap-perl:t/set-state-consistent.t"
  - id: ECHG-017
    title: "A state taken from Thread/get or Mailbox/get works as sinceState for Email/changes"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "ST is the state from Thread/get and SM the state from Mailbox/get. One message is appended afterwards."
    when: "Email/changes with sinceState ST, then with sinceState SM."
    then: "Both calls return the appended id in created."
    sources:
      - "wildduck:brief State and changes"
  - id: ECHG-018
    title: "A message delivered over LMTP is reported as created"
    method: "Email/changes"
    spec: "RFC 8621 4.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [lmtp]
    given: "S0 is read. One message is delivered to the user over LMTP."
    when: "Email/changes with sinceState S0."
    then: "created holds exactly one id, updated and destroyed are empty. Email/get for that id returns the message with mailboxIds pointing at INBOX."
    sources:
      - "james:EmailChangesMethodContract#emailChangesShouldReturnCreatedChanges"
      - "cyrus:JMAPEmail/email_changes"
      - "fastmail:t/Email/changes/changes.t"
      - "stalwart:mail/changes.rs"
  - id: ECHG-019
    title: "A message delivered through the SMTP front end is reported as created"
    method: "Email/changes"
    spec: "RFC 8621 4.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [smtp]
    given: "S0 is read. One message is accepted by the inbound SMTP server (Haraka with the WildDuck plugin, which stores through FilterHandler.storeMessage)."
    when: "Email/changes with sinceState S0."
    then: "created holds exactly the id of the stored message, the other lists are empty."
    sources:
      - "wildduck:plan 3"
      - "rfc:8621 4.3"
  - id: ECHG-020
    title: "A message added with IMAP APPEND is reported as created"
    method: "Email/changes"
    spec: "RFC 8621 4.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "S0 is read. A message is appended to a user mailbox over IMAP."
    when: "Email/changes with sinceState S0."
    then: "created holds exactly one id, the other lists are empty, and Email/get shows the mailbox it was appended to."
    sources:
      - "cyrus:JMAPEmail/email_changes"
      - "cyrus:JMAPEmail/email_changes_cads"
      - "rfc:8621 4.3"
  - id: ECHG-021
    title: "A message uploaded through the REST API is reported as created"
    method: "Email/changes"
    spec: "RFC 8621 4.3"
    level: wd
    phase: 1
    applies: "yes"
    seed: [api]
    given: "S0 is read. A message is stored with POST /users/:user/mailboxes/:mailbox/messages."
    when: "Email/changes with sinceState S0."
    then: "created holds exactly one id, the other lists are empty."
    sources:
      - "wildduck:brief State and changes"
  - id: ECHG-022
    title: "A sent copy stored by the REST API submit is reported as created"
    method: "Email/changes"
    spec: "RFC 8621 4.3"
    level: wd
    phase: 1
    applies: "yes"
    seed: [api]
    given: "S0 is read. A message is submitted through the REST API submit endpoint with the sent copy upload enabled."
    when: "Email/changes with sinceState S0."
    then: "created holds the id of the copy in the Sent mailbox."
    sources:
      - "wildduck:plan 4.7"
  - id: ECHG-023
    title: "An Email created by another JMAP session is reported as created"
    method: "Email/changes"
    spec: "RFC 8621 4.3"
    level: must
    phase: 2
    applies: "yes"
    seed: [jmap]
    given: "Session 1 reads S0. Session 2 (other credentials, same user) creates one Email with Email/set and one with Email/import."
    when: "Session 1 calls Email/changes with sinceState S0."
    then: "created holds both new ids, which equal the ids returned to session 2."
    sources:
      - "james:EmailChangesMethodContract#emailChangesShouldReturnCreatedChanges"
      - "jmapio:email/changes-after-create-and-destroy"
      - "fastmail:t/Email/changes/changes.t"
  - id: ECHG-024
    title: "Several new messages are each listed once in created"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap, lmtp]
    given: "S0 is read. Five messages are appended over IMAP to two mailboxes and three are delivered over LMTP."
    when: "Email/changes with sinceState S0."
    then: "created holds eight distinct ids, the other lists are empty."
    sources:
      - "cyrus:JMAPEmail/email_changes"
      - "stalwart:mail/changes.rs"
  - id: ECHG-025
    title: "Ids from Email/changes can be fed to Email/get through a result reference"
    method: "Email/changes"
    spec: "RFC 8620 3.7"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "S0 is read. Two messages are appended and one existing message is flagged."
    when: "One request: Email/changes since S0 as call c1, Email/get with #ids referencing c1 path /created, Email/get with #ids referencing c1 path /updated."
    then: "The first Email/get returns the two new Emails, the second the flagged one, notFound is empty in both."
    sources:
      - "rfc:8620 3.7"
      - "rfc:8621 4.3"
  - id: ECHG-026
    title: "A message appended with the Deleted flag never shows up"
    method: "Email/changes"
    spec: "RFC 8621 4.3"
    level: wd
    phase: 1
    applies: adapted
    seed: [imap]
    given: "S0 is read. A message is appended over IMAP with the \\Deleted flag already set."
    when: "Email/changes with sinceState S0."
    then: "The message id is in none of the three lists. newState may differ from S0."
    sources:
      - "wildduck:brief Emails"
    notes: "Messages flagged Deleted are invisible to JMAP everywhere."
  - id: ECHG-027
    title: "Setting the Seen flag over IMAP is reported as updated"
    method: "Email/changes"
    spec: "RFC 8621 4.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "A message with id E exists. S0 is read. IMAP STORE +FLAGS (\\Seen) is run on it."
    when: "Email/changes with sinceState S0, then Email/get for E with property keywords."
    then: "updated is exactly [E], the other lists are empty. keywords contains $seen."
    sources:
      - "james:EmailChangesMethodContract#emailChangesShouldReturnUpdatedChangesWhenAddFlags"
      - "cyrus:JMAPEmail/email_changes"
      - "jmapio:email/changes-after-keyword-change"
      - "fastmail:t/Email/changes/changes.t"
  - id: ECHG-028
    title: "Each kind of flag change over IMAP is reported as updated"
    method: "Email/changes"
    spec: "RFC 8621 4.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "A message E exists. The test is repeated for \\Flagged, \\Answered, \\Draft, $Forwarded, $MDNSent and a custom keyword such as project_x."
    when: "S0 is read, IMAP STORE +FLAGS with the flag is run on E, then Email/changes with sinceState S0."
    then: "For every flag, updated is exactly [E] and Email/get shows the matching lowercase keyword ($flagged, $answered, $draft, $forwarded, $mdnsent, project_x)."
    sources:
      - "james:EmailChangesMethodContract#emailChangesShouldReturnUpdatedChangesWhenAddFlags"
      - "rfc:8621 4.3"
      - "wildduck:brief Emails"
  - id: ECHG-029
    title: "Removing a flag over IMAP is reported as updated"
    method: "Email/changes"
    spec: "RFC 8621 4.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "A message E has \\Seen and \\Flagged. S0 is read. IMAP STORE -FLAGS (\\Flagged) is run."
    when: "Email/changes with sinceState S0."
    then: "updated is exactly [E], the other lists are empty, and Email/get no longer lists $flagged."
    sources:
      - "james:EmailChangesMethodContract#emailChangesShouldReturnUpdatedChangesWhenRemoveFlags"
  - id: ECHG-030
    title: "Replacing the whole flag set with IMAP STORE FLAGS is reported as updated once"
    method: "Email/changes"
    spec: "RFC 8621 4.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "A message E has \\Seen. S0 is read. IMAP STORE FLAGS (\\Flagged \\Answered) is run."
    when: "Email/changes with sinceState S0."
    then: "updated is exactly [E] with a single entry, and keywords are exactly $flagged and $answered."
    sources:
      - "rfc:8621 4.3"
  - id: ECHG-031
    title: "An IMAP STORE that changes nothing does not change the state"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "A message E already has \\Seen. S0 is read. IMAP STORE +FLAGS (\\Seen) is run again."
    when: "Email/get (ids empty) and Email/changes with sinceState S0."
    then: "state is still S0 and the change set is empty."
    sources:
      - "wildduck:brief State and changes"
    notes: "Verify that on-store writes no journal entry for a no-op. If it does, the state may advance but E must still not be missed or the test relaxed to an optional updated entry."
  - id: ECHG-032
    title: "A flag change through the REST API is reported as updated"
    method: "Email/changes"
    spec: "RFC 8621 4.3"
    level: wd
    phase: 1
    applies: "yes"
    seed: [api]
    given: "A message E exists. S0 is read. PUT /users/:user/mailboxes/:mailbox/messages sets seen true and flagged true for it."
    when: "Email/changes with sinceState S0."
    then: "updated is exactly [E]."
    sources:
      - "wildduck:brief State and changes"
  - id: ECHG-033
    title: "A keyword change made by another JMAP session is reported as updated"
    method: "Email/changes"
    spec: "RFC 8621 4.3"
    level: must
    phase: 2
    applies: "yes"
    seed: [jmap]
    given: "Session 1 reads S0. Session 2 patches keywords/$flagged to true on Email E with Email/set."
    when: "Session 1 calls Email/changes with sinceState S0."
    then: "updated is exactly [E], and newState equals the newState session 2 got from Email/set."
    sources:
      - "jmapio:email/changes-after-keyword-change"
      - "fastmail:t/Email/changes/changes.t"
      - "james:EmailChangesMethodContract#emailChangesShouldReturnUpdatedChangesWhenAddFlags"
  - id: ECHG-034
    title: "An IMAP MOVE is reported as updated with the same id"
    method: "Email/changes"
    spec: "RFC 8621 4.3"
    level: wd
    phase: 1
    applies: adapted
    seed: [imap]
    given: "A message E is in INBOX. S0 is read. IMAP MOVE (or UID MOVE) moves it to Archive."
    when: "Email/changes with sinceState S0, then Email/get for E with property mailboxIds."
    then: "updated is exactly [E], created and destroyed are empty. Email/get finds E and mailboxIds holds only the Archive id."
    sources:
      - "james:EmailChangesMethodContract#shouldReturnUpdatedWhenMessageMove"
      - "jmap-perl:t/imap-move.t"
      - "stalwart:mail/changes.rs"
      - "wildduck:plan 5.1"
    notes: "Needs the phase 0 change that records root in journal entries so EXPUNGE plus EXISTS with the same root folds into updated. Stalwart models a move as destroyed plus created, which WildDuck must not do."
  - id: ECHG-035
    title: "A move through the REST API is reported as updated with the same id"
    method: "Email/changes"
    spec: "RFC 8621 4.3"
    level: wd
    phase: 1
    applies: adapted
    seed: [api]
    given: "A message E is in INBOX. S0 is read. The REST API message update call moves it with moveTo to another mailbox."
    when: "Email/changes with sinceState S0."
    then: "updated is exactly [E], created and destroyed are empty, and Email/get shows the new mailbox."
    sources:
      - "wildduck:brief State and changes"
      - "wildduck:plan 5.1"
  - id: ECHG-036
    title: "A mailbox change made with Email/set in another session is reported as updated"
    method: "Email/changes"
    spec: "RFC 8621 4.3"
    level: must
    phase: 2
    applies: "yes"
    seed: [jmap]
    given: "Session 1 reads S0. Session 2 replaces mailboxIds of E with another mailbox through Email/set."
    when: "Session 1 calls Email/changes with sinceState S0."
    then: "updated is exactly [E], created and destroyed are empty."
    sources:
      - "james:EmailChangesMethodContract#shouldReturnUpdatedWhenMessageMove"
      - "rfc:8621 4.3"
  - id: ECHG-037
    title: "A POP3 session that deletes a message is reported as updated because the message moves to Trash"
    method: "Email/changes"
    spec: "RFC 8621 4.3"
    level: wd
    phase: 1
    applies: adapted
    seed: [imap]
    given: "A message E is in INBOX. S0 is read. A POP3 session issues DELE for it and QUIT."
    when: "Email/changes with sinceState S0, then Email/get for E."
    then: "updated is exactly [E], created and destroyed are empty. E is now in the Trash mailbox and has $seen."
    sources:
      - "wildduck:brief State and changes"
    notes: "pop3.js moves deleted messages to Trash and marks them seen. Seeding needs a POP3 client; the seed list has no pop3 value."
  - id: ECHG-038
    title: "A POP3 retrieval that marks messages as seen is reported as updated"
    method: "Email/changes"
    spec: "RFC 8621 4.3"
    level: wd
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "An unread message E is in INBOX. S0 is read. A POP3 session issues RETR for it and QUIT."
    when: "Email/changes with sinceState S0."
    then: "updated is exactly [E] and E has $seen."
    sources:
      - "wildduck:brief State and changes"
  - id: ECHG-039
    title: "An IMAP COPY creates a new Email id and leaves the original untouched"
    method: "Email/changes"
    spec: "RFC 8621 4.3"
    level: wd
    phase: 1
    applies: adapted
    seed: [imap]
    given: "A message E is in INBOX. S0 is read. IMAP COPY copies it to Archive."
    when: "Email/changes with sinceState S0, then Email/get for the created id."
    then: "created holds exactly one id that differs from E. E is in neither updated nor destroyed. The new Email is in Archive and has the same blob content, size and receivedAt as E."
    sources:
      - "wildduck:brief Ids"
      - "cyrus:JMAPEmail/email_copy_state"
    notes: "Depends on the phase 0 change that gives a copy a fresh root."
  - id: ECHG-040
    title: "Adding and removing a label through the REST API is reported as updated"
    method: "Email/changes"
    spec: "RFC 8621 4.3"
    level: wd
    phase: 1
    applies: "yes"
    seed: [api]
    given: "A label L exists and a message E has no labels. S0 is read. The REST API adds L to E."
    when: "Email/changes with sinceState S0, then the label is removed again and Email/changes is called with the new state."
