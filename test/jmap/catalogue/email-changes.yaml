    spec: "RFC 8620 5.2"
    level: should
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "S0 is read. A message is appended over IMAP and then flagged \\Flagged."
    when: "Email/changes with sinceState S0."
    then: "The id is in created and not in updated."
    sources:
      - "stalwart:mail/changes.rs"
      - "rfc:8620 5.2"
  - id: ECHG-071
    title: "An Email created and then moved inside the window is only in created"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: should
    phase: 1
    applies: adapted
    seed: [lmtp, imap]
    given: "S0 is read. A message is delivered to INBOX and then moved to Archive over IMAP."
    when: "Email/changes with sinceState S0."
    then: "The id is in created only, once, and Email/get shows Archive."
    sources:
      - "rfc:8620 5.2"
      - "wildduck:plan 5.2"
  - id: ECHG-072
    title: "An Email updated and then destroyed inside the window is only in destroyed"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: should
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "A message E exists. S0 is read. It is flagged, moved to another mailbox and then expunged."
    when: "Email/changes with sinceState S0."
    then: "E is in destroyed and not in updated or created."
    sources:
      - "stalwart:mail/changes.rs"
      - "rfc:8620 5.2"
  - id: ECHG-073
    title: "An id never appears in more than one list"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "S0 is read. A mix of appends, flag changes, moves, copies, deletes and undeletes is applied to ten messages, several of them touched more than once."
    when: "Email/changes with sinceState S0."
    then: "The three lists are pairwise disjoint and no list contains a duplicate."
    sources:
      - "james:EmailChangesMethodContract#emailChangesShouldNotReturnDuplicatedIdsAccrossCreatedUpdatedOrDestroyed"
      - "legacy-proxy:test/unit/gmail-history.spec.ts"
      - "rfc:8620 5.2"
  - id: ECHG-074
    title: "Created, updated and destroyed are reported together in one response"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "Messages E1 and E2 exist. S0 is read. A new message E3 is appended, E1 is flagged and E2 is expunged."
    when: "Email/changes with sinceState S0."
    then: "created is [E3], updated is [E1], destroyed is [E2]."
    sources:
      - "james:EmailChangesMethodContract#emailChangesShouldReturnAllTypeOfChanges"
      - "cyrus:JMAPEmail/email_changes"
      - "fastmail:t/Email/changes/changes.t"
  - id: ECHG-075
    title: "Changes computed from any earlier state give the net difference to now"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "States S0 to S5 are recorded while five change batches are applied (create three, update one, destroy one, move one, create and destroy one)."
    when: "Email/changes without maxChanges is called with each of S0 to S5."
    then: "For every Si the lists equal the net effect of the batches after Si, using the coalescing rules, and newState is S5 each time."
    sources:
      - "stalwart:mail/changes.rs"
  - id: ECHG-076
    title: "An Email destroyed before the window and never recreated is not reported again"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "E was expunged and that was already seen by the client, giving S0. Another message is then flagged."
    when: "Email/changes with sinceState S0."
    then: "destroyed is empty and updated holds only the flagged message."
    sources:
      - "rfc:8620 5.2"
  - id: ECHG-077
    title: "maxChanges at or above the number of changes returns everything"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "S0 is read. Five messages are appended."
    when: "Email/changes with sinceState S0 and maxChanges 5, then again with maxChanges 50."
    then: "Both calls return the five ids in created, hasMoreChanges false and newState equal to the current state."
    sources:
      - "james:EmailChangesMethodContract#maxChangesShouldBeTakenIntoAccount"
      - "rfc:8620 5.2"
  - id: ECHG-078
    title: "More changes than maxChanges sets hasMoreChanges and returns an intermediate state"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "S0 is read. Five messages are appended one by one, the current state is S5."
    when: "Email/changes with sinceState S0 and maxChanges 2."
    then: "The three lists hold at most two ids in total, hasMoreChanges is true, and newState differs from both S0 and S5. The answer is not cannotCalculateChanges."
    sources:
      - "james:EmailChangesMethodContract#emailChangesShouldReturnHasMoreChangesWhenTrue"
      - "cyrus:JMAPEmail/email_changes"
      - "fastmail:t/Email/changes/max-changes-has-more-changes.t"
      - "jmap-perl:t/changes-paging.t"
      - "stalwart:mail/changes.rs"
  - id: ECHG-079
    title: "Following hasMoreChanges to the end gives the same set as one unpaged call"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "S0 is read. Seven messages are appended, two older ones flagged and one expunged."
    when: "Email/changes is called in a loop with maxChanges 3, each time with the previous newState, until hasMoreChanges is false. One call without maxChanges is made from S0."
    then: "Every page holds at most three ids. Applying the pages in order to a client cache gives the same final sets of created, updated and destroyed as the unpaged call, and the last newState equals the Email/get state."
    sources:
      - "stalwart:mail/changes.rs"
      - "jmap-perl:t/changes-paging.t"
      - "fastmail:t/Email/changes/max-changes-has-more-changes.t"
      - "cyrus:JMAPEmail/email_changes"
  - id: ECHG-080
    title: "The maxChanges matrix: every limit from 1 to 8 converges from every earlier state"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "States are recorded across eight change batches of mixed creates, updates, destroys and moves."
    when: "For each recorded state and each maxChanges from 1 to 8, Email/changes is followed until hasMoreChanges is false."
    then: "No page exceeds maxChanges ids, every chain ends with the current state, and the accumulated result matches the unpaged result from that state."
    sources:
      - "stalwart:mail/changes.rs"
  - id: ECHG-081
    title: "maxChanges counts ids across all three lists together"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "S0 is read. Two messages are appended, two are flagged and two are expunged."
    when: "Email/changes with sinceState S0 and maxChanges 4."
    then: "The lengths of created, updated and destroyed add up to at most four and hasMoreChanges is true."
    sources:
      - "rfc:8620 5.2"
      - "james:EmailChangesMethodContract#maxChangesShouldBeTakenIntoAccount"
  - id: ECHG-082
    title: "Every page of a paged run makes progress"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "S0 is read. One message is flagged and unflagged 20 times, then three other messages are appended."
    when: "Email/changes is followed with maxChanges 1 from S0."
    then: "Each response with hasMoreChanges true has a newState different from its sinceState, the run ends after a bounded number of calls, and the result is one updated id and three created ids. Journal rows that fold into one id count once."
    sources:
      - "jmap-perl:t/changes-paging.t"
  - id: ECHG-083
    title: "An intermediate newState is a regular state usable later and by the sibling types"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "S0 is read. Six messages are appended. Email/changes with maxChanges 2 returned intermediate state SI."
    when: "After more changes are made, Email/changes, Thread/changes and Mailbox/changes are each called with sinceState SI."
    then: "All three succeed and return the changes after SI, including the later ones."
    sources:
      - "wildduck:plan 5.2"
    notes: "Intermediate states are earlier journal ids, so they behave like any issued state."
  - id: ECHG-084
    title: "A bulk operation larger than maxChanges is paged instead of rejected"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: adapted
    seed: [imap]
    given: "S0 is read. One IMAP STORE 1:* flags 20 messages in a single command."
    when: "Email/changes with sinceState S0 and maxChanges 1, followed to the end."
    then: "Each page returns one id with hasMoreChanges true until all 20 ids were returned. cannotCalculateChanges is not returned."
    sources:
      - "james:EmailChangesMethodContract#shouldFailWithCannotCalculateChangesWhenSingleChangeIsTooLarge"
      - "cyrus:JMAPEmail/email_changes_maxchanges_too_small_duplicate_modseqs"
      - "cyrus:JMAPEmail/email_changes_maxchanges_duplicate_modseqs"
      - "legacy-proxy:test/unit/gmail-history.spec.ts"
    notes: "James and Cyrus answer cannotCalculateChanges when one atomic change group exceeds maxChanges. The WildDuck journal has one entry per message, so an intermediate state exists between any two entries."
  - id: ECHG-085
    title: "A move is never split across two pages"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: adapted
    seed: [imap]
    given: "S0 is read. Three messages are moved from INBOX to Archive with one IMAP MOVE command."
    when: "Email/changes with sinceState S0 and maxChanges 1, followed to the end."
    then: "Each of the three ids is reported as updated. No page lists any of them as destroyed or created, and Email/get finds each id after every page."
    sources:
      - "wildduck:plan 5.2"
    notes: "The EXPUNGE and EXISTS entries of one move must fall on the same side of any intermediate state."
  - id: ECHG-086
    title: "Paging stays correct when create and destroy of one id fall on different pages"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "S0 is read. Message X is appended, three other messages are flagged, then X is expunged."
    when: "Email/changes with sinceState S0 and maxChanges 1, followed to the end."
    then: "X is either absent from every page, or listed as created on one page and as destroyed on a later page. It is never left as created only, so a client applying the pages ends without X."
    sources:
      - "rfc:8620 5.2"
      - "stalwart:mail/changes.rs"
  - id: ECHG-087
    title: "Paged results return older changes first"
    method: "Email/changes"
    spec: "RFC 8621 4.3"
    level: wd
    phase: 1
    applies: adapted
    seed: [imap]
    given: "S0 is read. Messages E1, E2 and E3 are appended in that order with other activity in between."
    when: "Email/changes with sinceState S0 and maxChanges 1, three times in a chain."
    then: "The pages return E1, then E2, then E3."
    sources:
      - "rfc:8621 4.3"
      - "wildduck:plan 5.2"
    notes: "RFC 8621 4.3 recommends newer changes first. WildDuck uses earlier journal ids as intermediate states, so it pages oldest first. This is allowed (the server chooses how to divide changes)."
  - id: ECHG-088
    title: "Changes made while a client is paging are picked up by the same chain"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "S0 is read. Four messages are appended. The client fetched the first page with maxChanges 2."
    when: "Two more messages are appended, then the client continues the chain with maxChanges 2 until hasMoreChanges is false."
    then: "The chain returns all six ids and ends at the current Email/get state."
    sources:
      - "rfc:8620 5.2"
  - id: ECHG-089
    title: "Without maxChanges the server applies its own cap"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "The server default for changes per response is configured to 100 for the test. S0 is read. 150 messages are appended."
    when: "Email/changes with sinceState S0 and no maxChanges, then again with maxChanges null."
    then: "Both return at most 100 ids, hasMoreChanges true and an intermediate newState. Following the chain returns the remaining ids."
    sources:
      - "rfc:8620 5.2"
    notes: "Open: the default cap value. Suggested: the same number as maxObjectsInGet so a following Email/get by reference never exceeds its limit."
  - id: ECHG-090
    title: "A maxChanges above the server cap is accepted and capped"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: may
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "The server cap is 100. S0 is read. 150 messages are appended."
    when: "Email/changes with sinceState S0 and maxChanges 9007199254740991."
    then: "The call succeeds, returns at most 100 ids and hasMoreChanges true. It is not rejected."
    sources:
      - "rfc:8620 5.2"
  - id: ECHG-091
    title: "maxChanges 0 is rejected"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [none]
    given: "Any account, S0 read."
    when: "Email/changes with sinceState S0 and maxChanges 0."
    then: "A method level error of type invalidArguments, HTTP status 200."
    sources:
      - "rfc:8620 5.2"
      - "james:EmailChangesMethodContract#maxChangesShouldBeTakenIntoAccount"
  - id: ECHG-092
    title: "A maxChanges that is not a positive integer is rejected"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [none]
    given: "Any account, S0 read."
    when: "Email/changes with sinceState S0 and maxChanges set in turn to -1, 1.5, the string \"5\", true, an array and 9007199254740993."
    then: "Each call answers invalidArguments. No call is treated as unlimited."
    sources:
      - "rfc:8620 5.2"
      - "rfc:8620 1.3"
  - id: ECHG-093
    title: "Paging works the same for Thread/changes on the shared state"
    method: "Thread/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "S0 is read. Five messages in five new threads are appended."
    when: "Thread/changes with sinceState S0 and maxChanges 2, followed to the end."
    then: "Each page holds at most two thread ids, hasMoreChanges is true until the last page, the five thread ids are all returned, and the final newState equals the Email/get state."
    sources:
      - "cyrus:JMAPEmail/thread_changes_maxchanges_duplicate_modseqs"
      - "fastmail:t/Thread/changes/max-changes-has-more-changes.t"
      - "jmap-perl:t/changes-paging.t"
  - id: ECHG-094
    title: "A flag change advances the Thread state without listing the thread"
    method: "Thread/changes"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: adapted
    seed: [imap]
    given: "A thread T with two messages exists. S0 is read. One of its messages gets \\Seen over IMAP."
    when: "Thread/changes with sinceState S0."
    then: "newState differs from S0 (shared state) and created, updated and destroyed are empty, because the emailIds of T did not change."
    sources:
      - "wildduck:brief State and changes"
      - "rfc:8621 3"
    notes: "Listing T as updated would also be legal but wasteful. The thread file owns the content rules."
  - id: ECHG-095
    title: "A paged Email/changes and a paged Thread/changes may be interleaved"
    method: "Thread/changes"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "S0 is read. Six messages in six threads are appended."
    when: "Email/changes and Thread/changes are each followed from S0 with maxChanges 2, alternating calls, each chain using only its own newState values."
    then: "Both chains end at the same final state and return six Email ids and six Thread ids."
    sources:
      - "wildduck:plan 5.2"
  - id: ECHG-096
    title: "A newState can be chained inside one request with a result reference"
    method: "Email/changes"
    spec: "RFC 8620 3.7"
    level: may
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "S0 is read. Four messages are appended."
    when: "One request: Email/changes since S0 with maxChanges 2 as c1, then Email/changes with #sinceState referencing c1 path /newState and maxChanges 2."
    then: "The second call returns the remaining two ids and hasMoreChanges false."
    sources:
      - "rfc:8620 3.7"
  - id: ECHG-097
    title: "A sinceState older than the journal retention answers cannotCalculateChanges"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap, time]
    given: "Journal retention is set to a short value for the test. S0 is read, the retention passes, then a message is appended."
    when: "Email/changes with sinceState S0."
    then: "A method level error of type cannotCalculateChanges. The client can recover by reading Email/get state again."
    sources:
      - "fastmail:t/Email/changes/cannot-calculate-changes.t"
      - "cyrus:JMAPEmail/email_changes"
      - "legacy-proxy:test/unit/change-log.spec.ts"
      - "legacy-proxy:test/unit/shared.spec.ts"
      - "rfc:8620 5.2"
      - "wildduck:plan 5.2"
  - id: ECHG-098
    title: "A sinceState close to the retention limit is refused before entries can be missing"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: "yes"
    seed: [imap, time]
    given: "Retention R and safety margin M are configured. S0 is read, then changes continue."
    when: "Email/changes with sinceState S0 is called when S0 is older than R minus M but younger than R, and in a second run when S0 is younger than R minus M."
    then: "The first call answers cannotCalculateChanges, the second returns the full change set. A partial change set is never returned."
    sources:
      - "wildduck:plan 5.2"
  - id: ECHG-099
    title: "A sinceState that is not a string is rejected"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [none]
    given: "Any account."
    when: "Email/changes with sinceState set in turn to the number 1, null, an object, and with sinceState left out."
    then: "Each call answers invalidArguments."
    sources:
      - "cyrus:JMAPEmail/email_changes_since_state_type"
      - "rfc:8620 5.2"
  - id: ECHG-100
    title: "A malformed sinceState string answers cannotCalculateChanges"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: "yes"
    seed: [none]
    given: "Any account."
    when: "Email/changes with sinceState set in turn to \"bogus\", \"0\", the empty string, a 5000 character string and a string with control characters."
    then: "Each call answers cannotCalculateChanges, never serverFail and never an empty change set."
    sources:
      - "cyrus:JMAPEmail/email_changes_since_state_type"
      - "cyrus:JMAPEmail/email_changes"
      - "legacy-proxy:test/unit/states.spec.ts"
      - "james:EmailChangesMethodContract#emailChangesShouldFailWhenStateNotFound"
    notes: "invalidArguments would also be defensible. cannotCalculateChanges is chosen because every client already recovers from it with a full resync."
  - id: ECHG-101
    title: "A well formed sinceState that lies in the future answers cannotCalculateChanges"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: "yes"
    seed: [none]
    given: "S0 is the current state."
    when: "Email/changes with a sinceState of the right format whose embedded position is later than S0."
    then: "cannotCalculateChanges. The call must not return an empty change set with newState S0."
    sources:
      - "james:EmailChangesMethodContract#emailChangesShouldFailWhenStateNotFound"
      - "rfc:8620 5.2"
  - id: ECHG-102
    title: "A sinceState issued for another account answers cannotCalculateChanges"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "Users A and B both have recent changes. SB is the Email state of B."
    when: "User A calls Email/changes with its own accountId and sinceState SB."
    then: "cannotCalculateChanges. No id of B is returned and no partial list for A is returned."
    sources:
      - "wildduck:brief State and changes"
      - "rfc:8620 5.2"
    notes: "Open: a bare journal id cannot be told apart from a foreign one. The state string has to be bound to the account (prefix or keyed hash) for this to be testable; otherwise the outcome is a plain diff of the account own journal from that point, which is harmless but not what a test can pin down."
  - id: ECHG-103
    title: "An unknown accountId answers accountNotFound"
    method: "Email/changes"
    spec: "RFC 8620 3.6.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [none]
    given: "User A is authenticated. User B exists."
    when: "Email/changes with accountId set to an id that does not exist, then to the id of user B, with any sinceState."
    then: "Both calls answer accountNotFound. Nothing about B is disclosed."
    sources:
      - "james:EmailChangesMethodContract#emailChangesShouldFailWhenAccountIdNotFound"
      - "rfc:8620 3.6.2"
  - id: ECHG-104
    title: "A missing accountId is rejected"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [none]
    given: "Any account."
    when: "Email/changes with only sinceState, and again with accountId null."
    then: "Both calls answer invalidArguments."
    sources:
      - "cyrus:JMAPCore/core_accountid_required"
      - "rfc:8620 5.2"
  - id: ECHG-105
    title: "An old sinceState is refused even when only one recent change exists"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: adapted
    seed: [imap, time]
    given: "S0 is read. Nothing happens for longer than the retention. Then one message is appended."
    when: "Email/changes with sinceState S0."
    then: "cannotCalculateChanges, because S0 is neither the current state nor inside the retention window."
    sources:
      - "wildduck:plan 5.2"
    notes: "Strictly the change could be computed, but the server cannot prove nothing expired in between. Pairs with the scenario where S0 is still the current state and is accepted."
  - id: ECHG-106
    title: "After cannotCalculateChanges a fresh state works"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap, time]
    given: "A client got cannotCalculateChanges for an expired state."
    when: "It calls Email/get (ids empty) to read the state S1, a message is appended, and it calls Email/changes with sinceState S1."
    then: "The call succeeds and created holds the new id."
    sources:
      - "fastmail:t/Email/changes/cannot-calculate-changes.t"
      - "rfc:8620 5.2"
  - id: ECHG-107
    title: "Email/set oldState and newState line up with Email/changes"
    method: "Email/set"
    spec: "RFC 8620 5.3"
    level: must
    phase: 2
    applies: "yes"
    seed: [jmap]
    given: "S0 is read with Email/get."
    when: "Email/set updates a keyword on E. Then Email/changes is called with the oldState and again with the newState of that response."
    then: "oldState equals S0. Email/changes since oldState returns updated [E] and the same newState. Email/changes since newState returns nothing."
    sources:
      - "jmap-perl:t/set-state-consistent.t"
      - "cyrus:JMAPEmail/misc_set_oldstate"
      - "rfc:8620 5.3"
  - id: ECHG-108
    title: "An Email/set that changes nothing leaves the state alone"
    method: "Email/set"
    spec: "RFC 8620 5.3"
    level: must
    phase: 2
    applies: "yes"
    seed: [jmap]
    given: "S0 is read."
    when: "Email/set with no create, update or destroy, and a second Email/set whose only update fails with notFound."
    then: "Both responses have oldState S0 and newState S0, and Email/get still returns S0."
    sources:
      - "jmap-perl:t/set-state-consistent.t"
      - "rfc:8620 5.3"
  - id: ECHG-109
    title: "Email/import and Email/copy style creations advance the state seen by Email/changes"
    method: "Email/import"
    spec: "RFC 8621 4.8"
    level: must
    phase: 2
    applies: "yes"
    seed: [jmap]
    given: "S0 is read. A message blob is uploaded."
    when: "Email/import stores it, then Email/changes with sinceState S0."
    then: "The import response has oldState S0 and a different newState, and Email/changes returns the imported id in created with the same newState."
    sources:
      - "cyrus:JMAPEmail/email_import_state"
      - "cyrus:JMAPEmail/email_copy_state"
      - "stalwart:mail/get.rs"
  - id: ECHG-110
    title: "Changes committed by several processes at once are all reported"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap, api, lmtp]
    given: "The server runs with several worker processes. S0 is read. In parallel, 10 IMAP connections append and flag messages, the REST API moves messages and LMTP delivers messages, 200 changes in total."
    when: "After all writers finished, Email/changes is followed from S0 to the end."
    then: "Every created, changed or removed id is present in the accumulated result. None is missing."
    sources:
      - "wildduck:plan 5.2"
      - "rfc:8620 5.2"
  - id: ECHG-111
    title: "Polling during concurrent writes never misses an id, though it may repeat one"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: "yes"
    seed: [imap, api, lmtp]
    given: "Several worker processes write changes for one user for ten seconds while a client polls Email/changes every 200 ms, always from the last newState."
    when: "After the writers stop the client polls once more."
    then: "The union of all polled lists covers every id that was created, updated or destroyed. An id may be reported as updated in two consecutive polls, and an id reported as created is never reported as created a second time unless it was destroyed in between."
    sources:
      - "wildduck:plan 5.2"
      - "wildduck:brief State and changes"
    notes: "Journal ids come from different processes, so an entry with a smaller id can commit after a larger one was handed out as state. The plan resolves sinceState with a safety window and dedupes. Open: the window makes exact list assertions in other scenarios depend on timing unless the already reported entries are filtered; tests should wait longer than the window between seeding and reading S0, or the design must guarantee no re-report for quiescent accounts."
  - id: ECHG-112
    title: "Two requests reading the state during a write see either the old or the new state"
    method: "Email/get"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "S0 is read. One message is appended while 20 parallel Email/get (ids empty) calls are in flight."
    when: "After the append, Email/changes is called with each state value that was observed."
    then: "Only two distinct states were observed (S0 and S1). Email/changes from S0 returns the new id, from S1 nothing."
    sources:
      - "wildduck:plan 5.2"
  - id: ECHG-113
    title: "A large number of created Emails is paged completely"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap, db]
    given: "S0 is read. 10000 messages are added to one mailbox."
    when: "Email/changes is followed from S0 with maxChanges 500."
    then: "Twenty pages or more are returned, none above 500 ids, the union is exactly the 10000 new ids without duplicates, and the final newState equals the Email/get state."
    sources:
      - "jmap-perl:t/changes-paging.t"
      - "rfc:8620 5.2"
  - id: ECHG-114
    title: "A large flag change and a large expunge are reported completely"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "A mailbox holds 5000 messages. S0 is read. IMAP STORE 1:* +FLAGS (\\Seen) runs, S1 is read, then all are flagged \\Deleted and expunged."
    when: "Email/changes is followed to the end from S0 and from S1."
    then: "From S1 the result is 5000 destroyed ids. From S0 the result is the same 5000 ids in destroyed only (updated then destroyed coalesces), with nothing in updated at the end of the chain."
    sources:
      - "rfc:8620 5.2"
      - "stalwart:mail/changes.rs"
  - id: ECHG-115
    title: "Email/changes over a long journal answers within the request limits"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: wd
    phase: 1
    applies: "yes"
    seed: [db]
    given: "The journal holds 200000 entries for the user after S0, most of them repeated flag changes on the same 1000 messages."
    when: "Email/changes with sinceState S0 and maxChanges 100."
    then: "The call returns at most 100 ids with hasMoreChanges true without scanning the whole journal: the number of journal documents read is bounded by a configured scan limit, and the intermediate newState reflects where the scan stopped."
    sources:
      - "wildduck:plan 5.2"
      - "wildduck:plan 5.5"
