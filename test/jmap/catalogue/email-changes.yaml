      - "legacy-proxy:test/unit/gmail-history.spec.ts"
      - "rfc:8620 5.2"
    notes: "The RFC also allows listing it in destroyed only, or in both created and destroyed. WildDuck drops entries that have both EXISTS and EXPUNGE in the window."
  - id: ECHG-070
    title: "An Email created and then updated inside the window is only in created"
