    when: "Email/changes with sinceState S0."
    then: "created holds exactly one id and updated is empty. Email/get shows mailboxIds with only Lists."
    sources:
      - "wildduck:brief State and changes"
  - id: ECHG-065
    title: "A filter that sets flags on delivery yields created only"
