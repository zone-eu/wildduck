    sources:
      - "wildduck:brief State and changes"
  - id: ECHG-069
    title: "An Email created and destroyed inside the window is omitted"
    method: "Email/changes"
    spec: "RFC 8620 5.2"
    level: should
    phase: 1
    applies: "yes"
    seed: [imap]
