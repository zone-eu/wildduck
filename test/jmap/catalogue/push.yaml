area: push
title: "Push: EventSource, PushSubscription and the EmailDelivery state"
description: "The event source stream (RFC 8620 7.3, phase 1), Web Push subscriptions with verification, encryption and delivery rules (RFC 8620 7.2, phase 4) and the EmailDelivery pseudo type (RFC 8621 1.5). The push endpoint in PUSH scenarios is a mock HTTPS push service controlled by the test."
scenarios:
  - id: ESRC-001
    title: "The session advertises an event source URL template with the three variables"
    method: "Session"
    spec: "RFC 8620 7.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [none]
    given: "An authenticated user."
    when: "GET the session resource."
    then: "eventSourceUrl is a URI template that contains the variables {types}, {closeafter} and {ping}, each exactly once."
    sources:
      - "cyrus:JMAPCore/eventsource"
      - "rfc:8620 7.3"
      - "rfc:8620 2"
  - id: ESRC-002
    title: "The event source requires authentication"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [none]
    given: "No credentials."
    when: "GET the event source URL with types=*, closeafter=no, ping=0 and no Authorization header, then with a wrong password."
    then: "Both answer HTTP 401 with a WWW-Authenticate header and no event stream body. The failed password attempt counts towards the login lockout."
    sources:
      - "james:EventSourceContract#shouldRejectUnauthenticated"
      - "rfc:8620 7.3"
    notes: "The stream URL is the session eventSourceUrl with types, closeafter and ping filled in (GET /jmap/eventsource in the plan)."
  - id: ESRC-003
    title: "The event source accepts the same credentials as the API endpoint"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: wd
    phase: 1
    applies: "yes"
    seed: [api]
    given: "A user with a Bearer access token, an application password with the jmap scope and an application password with only the imap scope."
    when: "GET the event source with each credential."
    then: "The token and the jmap scoped password open a stream with HTTP 200. The imap only password is refused with the same status and body the API endpoint gives it, and no stream is opened."
    sources:
      - "wildduck:brief Accounts and auth"
  - id: ESRC-004
    title: "A successful connection is an open text/event-stream response"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [none]
    given: "An authenticated user."
    when: "GET the event source with types=*, closeafter=no, ping=0."
    then: "HTTP 200, Content-Type text/event-stream, no Content-Length header, and the response stays open."
    sources:
      - "jmapio:push/eventsource-connect"
      - "cyrus:JMAPCore/eventsource"
      - "stalwart:compliance/push.rs"
      - "rfc:8620 7.3"
  - id: ESRC-005
    title: "Response headers prevent caching and proxy buffering"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: wd
    phase: 1
    applies: "yes"
    seed: [none]
    given: "An authenticated user."
    when: "GET the event source with types=*, closeafter=no, ping=0, sending Accept-Encoding gzip."
    then: "The response has Cache-Control no-store (or no-cache), X-Accel-Buffering no, no Content-Encoding, and the headers plus a first comment line are flushed at once so a client sees the response start within one second without any event."
    sources:
      - "wildduck:plan 6"
      - "wildduck:lib/api/updates.js"
    notes: "The plan asks for reverse proxy notes: buffering must be off for the stream, as for the existing updates endpoint."
  - id: ESRC-006
    title: "Only GET is allowed on the event source"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: wd
    phase: 1
    applies: "yes"
    seed: [none]
    given: "An authenticated user."
    when: "POST and DELETE to the event source URL."
    then: "HTTP 405 (or 404), no stream."
    sources:
      - "rfc:8620 7.3"
  - id: ESRC-007
    title: "No event is sent while nothing changes"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "An account with existing messages and earlier changes."
    when: "Connect with types=*, closeafter=no, ping=0 and no Last-Event-ID, wait three seconds."
    then: "No state event and no ping event arrives. Comment lines are allowed."
    sources:
      - "james:EventSourceContract#noSSEEventShouldBeSentByDefault"
      - "rfc:8620 7.3"
  - id: ESRC-008
    title: "A change pushes an event named state with a StateChange object"
    method: "EventSource"
    spec: "RFC 8620 7.1"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "A stream is open with types=*, closeafter=no, ping=0."
    when: "A message is appended over IMAP."
    then: "One event arrives with the event field state and data that parses as JSON with @type StateChange and changed holding exactly one key, the account id, mapped to an object of type name to state string."
    sources:
      - "james:EventSourceContract#sseShouldTransportEvent"
      - "cyrus:JMAPCore/eventsource"
      - "jmapio:push/eventsource-receives-state-change"
      - "stalwart:core/event_source.rs"
      - "stalwart:compliance/push.rs"
      - "legacy-proxy:test/unit/gmail-push.spec.ts"
  - id: ESRC-009
    title: "Pushed state strings equal what the get methods return"
    method: "EventSource"
    spec: "RFC 8620 7.1"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "A stream is open with types=*."
    when: "A message is appended over IMAP and, after the event arrived, Email/get, Mailbox/get and Thread/get are called."
    then: "The values under Email, Mailbox and Thread in the event equal the state returned by the matching get call."
    sources:
      - "cyrus:JMAPCore/eventsource"
      - "rfc:8620 7.1"
  - id: ESRC-010
    title: "A StateChange lists only types whose state changed"
    method: "EventSource"
    spec: "RFC 8620 7.1"
    level: must
    phase: 1
    applies: adapted
    seed: [imap]
    given: "A stream is open with types=*."
    when: "A message gets \\Flagged over IMAP."
    then: "The event lists Email, Mailbox and Thread with one identical value (they share the state string) and no other type: no EmailDelivery, Identity, EmailSubmission or VacationResponse key."
    sources:
      - "rfc:8620 7.1"
      - "wildduck:brief State and changes"
    notes: "Open: because the three types share one state, every mail change reports all three. The alternative, listing only the types whose objects changed, is also defensible but then the pushed value for an unlisted type silently differs from the client cache."
  - id: ESRC-011
    title: "The types parameter with one type restricts the event to that type"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "A stream is open with types=Mailbox, closeafter=no, ping=0."
    when: "A message is appended over IMAP."
    then: "The event lists only the Mailbox key for the account."
    sources:
      - "james:EventSourceContract#sseEventsShouldBeFilteredByTypes"
      - "jmapio:push/eventsource-types-filter"
      - "stalwart:compliance/push.rs"
      - "cyrus:JMAPCore/eventsource"
  - id: ESRC-012
    title: "The types parameter accepts a comma separated list"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "A stream is open with types=Email,Thread."
    when: "A message is appended over IMAP."
    then: "The event lists exactly Email and Thread."
    sources:
      - "cyrus:JMAPCore/eventsource"
      - "rfc:8620 7.3"
  - id: ESRC-013
    title: "types=* pushes every changed type"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [lmtp]
    given: "A stream is open with types=*."
    when: "A message is delivered over LMTP."
    then: "The event lists Email, Mailbox, Thread and EmailDelivery, and from phase 4 also Quota, because the delivery changed the storage usage."
    sources:
      - "james:EventSourceContract#allTypesShouldBeSupported"
      - "cyrus:JMAPCore/eventsource"
      - "stalwart:core/event_source.rs"
    notes: "Phase 4 (4.8): Quota is a push type and its state follows storageUsed, which every delivery changes."
  - id: ESRC-014
    title: "No event is sent when only types outside the filter changed"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "A stream is open with types=EmailDelivery,VacationResponse."
    when: "A message is flagged and another moved over IMAP. Wait two seconds."
    then: "No state event arrives."
    sources:
      - "james:EventSourceContract#sseEventsShouldBeFilteredByTypes"
      - "rfc:8620 7.3"
  - id: ESRC-015
    title: "An unknown type name in types is rejected"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: wd
    phase: 1
    applies: "yes"
    seed: [none]
    given: "An authenticated user."
    when: "GET the event source with types=Email,Nonsense and with types=email (wrong case)."
    then: "HTTP 400 and no stream."
    sources:
      - "james:EventSourceContract#shouldRejectInvalidTypes"
    notes: "Open: ignoring unknown names would be friendlier to clients built for servers with more types. If rejected, the known names must include every type of every capability in the session, including types whose methods arrive in a later phase."
  - id: ESRC-016
    title: "A missing or empty types parameter is rejected"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: wd
    phase: 1
    applies: "yes"
    seed: [none]
    given: "An authenticated user."
    when: "GET the event source without types, and with types set to the empty string."
    then: "HTTP 400 and no stream."
    sources:
      - "james:EventSourceContract#typesQueryParamIsCompulsory"
      - "rfc:8620 7.3"
  - id: ESRC-017
    title: "closeafter=state ends the response after the first state event"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "A stream is open with types=*, closeafter=state, ping=0."
    when: "A message is appended over IMAP."
    then: "One complete state event (with its id) is received and then the server ends the HTTP response cleanly."
    sources:
      - "james:EventSourceContract#sseShouldCloseAfterEventWhenCloseAfterState"
      - "cyrus:JMAPCore/eventsource"
      - "jmapio:push/eventsource-closeafter"
      - "stalwart:compliance/push.rs"
  - id: ESRC-018
    title: "closeafter=state is not triggered by ping events"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "A stream is open with types=*, closeafter=state and the smallest allowed ping."
    when: "Two ping intervals pass, then a message is appended."
    then: "The stream stays open through the ping events and closes only after the state event."
    sources:
      - "rfc:8620 7.3"
  - id: ESRC-019
    title: "closeafter=no keeps the stream open across many events"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "A stream is open with types=*, closeafter=no, ping=0."
    when: "Three changes are made over IMAP, two seconds apart."
    then: "Three state events arrive on the same connection, each with a newer Email state."
    sources:
      - "james:EventSourceContract#sseShouldTransportEvents"
      - "rfc:8620 7.3"
  - id: ESRC-020
    title: "A missing or invalid closeafter is rejected"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: wd
    phase: 1
    applies: "yes"
    seed: [none]
    given: "An authenticated user."
    when: "GET the event source without closeafter, with closeafter=yes and with closeafter=State."
    then: "HTTP 400 and no stream."
    sources:
      - "james:EventSourceContract#closeAfterQueryParamIsCompulsory"
      - "james:EventSourceContract#shouldRejectInvalidCloseAfter"
  - id: ESRC-021
    title: "A ping event is sent each time the interval passes without an event"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [none]
    given: "The server minimum ping is configured to 2 seconds for the test."
    when: "Connect with types=*, closeafter=no, ping=2 and wait seven seconds without changes."
    then: "Three ping events arrive about two seconds apart. Each has the event field ping and data {\"interval\":2}."
    sources:
      - "james:EventSourceContract#pingShouldBeSupported"
      - "stalwart:core/event_source.rs"
      - "rfc:8620 7.3"
  - id: ESRC-022
    title: "Ping events never carry an event id"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "A stream with ping enabled received one state event with id I."
    when: "Several ping events arrive, then the client reconnects with Last-Event-ID I."
    then: "No ping event has an id field, so the last event id of the client is still I, and the reconnect sends no immediate state event."
    sources:
      - "rfc:8620 7.3"
  - id: ESRC-023
    title: "ping=0 disables ping events"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [none]
    given: "An authenticated user."
    when: "Connect with ping=0 and wait longer than the server maximum ping."
    then: "No event named ping arrives. Keep alive comment lines (lines starting with a colon) are permitted."
    sources:
      - "rfc:8620 7.3"
      - "wildduck:lib/api/updates.js"
  - id: ESRC-024
    title: "A ping below the server minimum is raised and the real interval is reported"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: may
    phase: 1
    applies: "yes"
    seed: [none]
    given: "The server minimum ping is 5 seconds."
    when: "Connect with ping=1."
    then: "Ping events arrive five seconds apart and their data is {\"interval\":5}."
    sources:
      - "rfc:8620 7.3"
      - "james:EventSourceContract#pingShouldBeSupported"
    notes: "James does not clamp. The interval property is how the client learns the real value."
  - id: ESRC-025
    title: "A ping above the server maximum is lowered and the real interval is reported"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: may
    phase: 1
    applies: "yes"
    seed: [time]
    given: "The server maximum ping is 300 seconds."
    when: "Connect with ping=86400."
    then: "The first ping arrives after 300 seconds with data {\"interval\":300}."
    sources:
      - "rfc:8620 7.3"
  - id: ESRC-026
    title: "Default ping limits satisfy the interoperability bounds"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [time]
    given: "Default configuration."
    when: "Connect once with ping=30 and once with ping=300."
    then: "Both requested values are honoured unchanged (interval 30 and interval 300). A configuration with a minimum above 30 or a maximum below 300 is refused at start up."
    sources:
      - "rfc:8620 7.3"
  - id: ESRC-027
    title: "A missing or invalid ping is rejected"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: wd
    phase: 1
    applies: "yes"
    seed: [none]
    given: "An authenticated user."
    when: "GET the event source without ping, with ping=-5, ping=abc and ping=1.5."
    then: "HTTP 400 and no stream."
    sources:
      - "james:EventSourceContract#pingQueryParamIsCompulsory"
      - "james:EventSourceContract#shouldRejectInvalidPing"
  - id: ESRC-028
    title: "The ping timer restarts after every event"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "A stream with ping=4 (minimum configured at or below 4)."
    when: "A change is made three seconds after connecting."
    then: "The state event arrives at about second 3 and the first ping at about second 7, not at second 4."
    sources:
      - "rfc:8620 7.3"
  - id: ESRC-029
    title: "Every state event is followed by a new event id"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: should
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "A stream is open with types=*."
    when: "Two changes are made a few seconds apart."
    then: "Both state events carry an id field, the two ids differ, and each id is a single line of printable ASCII."
    sources:
      - "cyrus:JMAPCore/eventsource"
      - "rfc:8620 7.3"
    notes: "The plan uses the journal id as event id. Open: from phase 2 the id must also encode the position of the per account change log used for Identity, EmailSubmission and later types, since the RFC wants it to encode the entire state visible to the user."
  - id: ESRC-030
    title: "Reconnecting with the latest event id sends nothing"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: should
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "A stream received a state event with id I and was closed. Nothing changed since."
    when: "Reconnect with the header Last-Event-ID I and wait two seconds."
    then: "No state event arrives."
    sources:
      - "rfc:8620 7.3"
      - "wildduck:lib/api/updates.js"
  - id: ESRC-031
    title: "Reconnecting with an older event id pushes the missed change at once"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: should
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "A stream received a state event with id I and was closed. A message was then appended over IMAP."
    when: "Reconnect with Last-Event-ID I and types=*."
    then: "Within one second a single state event arrives with the current Email, Mailbox and Thread state and a new id. Missed changes are summarised in one event, not replayed one by one."
    sources:
      - "rfc:8620 7.3"
      - "wildduck:plan 4.9"
  - id: ESRC-032
    title: "Replay respects the types filter"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: should
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "A stream with types=EmailDelivery received id I and was closed. A flag was then changed over IMAP."
    when: "Reconnect with Last-Event-ID I and types=EmailDelivery."
    then: "No state event arrives, because no requested type changed."
    sources:
      - "rfc:8620 7.3"
      - "rfc:8621 1.5"
  - id: ESRC-033
    title: "An event id older than the journal retention triggers a full state event"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: wd
    phase: 1
    applies: "yes"
    seed: [imap, time]
    given: "A stream received id I. The journal retention passed and changes happened."
    when: "Reconnect with Last-Event-ID I and types=*."
    then: "The connection is accepted with HTTP 200 and immediately sends a state event with the current state of every requested type. No error status and no silent gap."
    sources:
      - "wildduck:plan 4.9"
      - "wildduck:plan 5.2"
  - id: ESRC-034
    title: "A malformed or foreign Last-Event-ID is treated as unknown"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: wd
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "User A has an account with messages. User B has an event id IB from its own stream."
    when: "A connects with Last-Event-ID set to \"garbage\", then with IB."
    then: "Both connections get HTTP 200 and an immediate state event with the current states of A. Nothing about B is revealed and no 400 is returned."
    sources:
      - "wildduck:lib/api/updates.js"
    notes: "The existing updates endpoint validates the id as an ObjectId and would answer 400. A browser EventSource cannot recover from a 400 on reconnect, so the JMAP endpoint must not do that."
  - id: ESRC-035
    title: "closeafter=state with a stale Last-Event-ID works as a poll"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "A client holds event id I. A change happened since."
    when: "GET the event source with closeafter=state, ping=0 and Last-Event-ID I."
    then: "The missed state event is sent immediately and the response ends."
    sources:
      - "rfc:8620 7.3"
  - id: ESRC-036
    title: "Changes that happened before a first connection are not announced"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: wd
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "Changes were made one second before connecting."
    when: "Connect without Last-Event-ID and wait two seconds."
    then: "No state event arrives until the next change."
    sources:
      - "james:EventSourceContract#noSSEEventShouldBeSentByDefault"
  - id: ESRC-037
    title: "A change made through the REST API produces a state event"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [api]
    given: "A stream is open with types=*."
    when: "A message is moved to another mailbox through the REST API."
    then: "A state event arrives with a new Email and Mailbox state."
    sources:
      - "wildduck:brief State and changes"
      - "rfc:8620 7.3"
  - id: ESRC-038
    title: "A mailbox created over IMAP produces a state event"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: must
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "A stream is open with types=Mailbox."
    when: "IMAP CREATE makes a new mailbox, later IMAP DELETE removes it."
    then: "Each command produces a state event with a new Mailbox state."
    sources:
      - "stalwart:core/event_source.rs"
      - "cyrus:JMAPCore/eventsource"
  - id: ESRC-039
    title: "A change made with a JMAP set call produces a state event, also for the caller"
    method: "EventSource"
    spec: "RFC 8620 7.1"
    level: must
    phase: 2
    applies: "yes"
    seed: [jmap]
    given: "A client has a stream open with types=* and uses the same credentials for API calls."
    when: "It updates a keyword with Email/set."
    then: "A state event arrives whose Email value equals the newState of the Email/set response."
    sources:
      - "jmapio:push/eventsource-receives-state-change"
      - "stalwart:compliance/push.rs"
      - "rfc:8620 7.1"
  - id: ESRC-040
    title: "Types kept in the JMAP change log are pushed on their own"
    method: "EventSource"
    spec: "RFC 8620 7.1"
    level: must
    phase: 2
    applies: "yes"
    seed: [jmap]
    given: "A stream is open with types=*."
    when: "Identity/set updates the name of an identity."
    then: "A state event arrives that lists only Identity, with the value Identity/get returns."
    sources:
      - "rfc:8620 7.1"
      - "wildduck:brief State and changes"
  - id: ESRC-041
    title: "An event reaches a stream served by a different worker process"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: wd
    phase: 1
    applies: "yes"
    seed: [imap, lmtp]
    given: "The server runs several worker processes. A stream is open on one of them."
    when: "Changes are made through IMAP and LMTP connections that land on other workers."
    then: "Every change results in a state event on the stream."
    sources:
      - "wildduck:plan 4.9"
  - id: ESRC-042
    title: "A burst of changes is coalesced and the last event carries the final state"
    method: "EventSource"
    spec: "RFC 8620 7"
    level: should
    phase: 1
    applies: "yes"
    seed: [imap]
    given: "A stream is open with types=*."
    when: "100 messages are appended over IMAP within one second."
    then: "Fewer than 100 state events arrive, and the Email value of the last one equals the Email/get state after the burst."
    sources:
      - "stalwart:core/event_source.rs"
      - "legacy-proxy:test/unit/gmail-push.spec.ts"
      - "rfc:8620 7"
  - id: ESRC-043
    title: "A journal write that does not change any JMAP state sends no event"
    method: "EventSource"
    spec: "RFC 8620 7.3"
    level: wd
