    level: must
    phase: 4
    applies: "yes"
    seed: [api, imap]
    given: "A verified subscription created with application password A."
    when: "A is deleted through the REST API, then a message is appended."
    then: "No push is sent, and the subscription record with its url and keys is gone from storage."
    sources:
      - "rfc:8620 7.2"
      - "wildduck:plan 3"
  - id: PUSH-057
    title: "Changing the account password destroys subscriptions created with it"
    method: "WebPush"
    spec: "RFC 8620 7.2"
    level: must
    phase: 4
    applies: "yes"
    seed: [api, imap]
    given: "Verified subscriptions created with the account password over Basic and with a Bearer token issued before the change."
    when: "The password is changed through the REST API (authVersion increases), then a mail change is made."
    then: "Neither subscription receives a push and both are removed. A subscription created with an untouched application password keeps working."
    sources:
      - "rfc:8620 7.2"
      - "wildduck:plan 3"
  - id: PUSH-058
    title: "A subscription created with an expiring token ends with the token"
    method: "WebPush"
    spec: "RFC 8620 7.2"
    level: must
    phase: 4
    applies: "yes"
    seed: [api, time]
    given: "A Bearer token with a one minute lifetime created a verified subscription with expires three days ahead."
    when: "The token expires, then a mail change is made."
    then: "No push is sent after the token expired, whatever expires says."
    sources:
      - "rfc:8620 7.2"
  - id: PUSH-059
    title: "A disabled, suspended or deleted user gets no pushes"
    method: "WebPush"
    spec: "RFC 8620 7.2"
    level: wd
    phase: 4
    applies: "yes"
    seed: [api, lmtp]
    given: "A verified subscription. The test is repeated for user disabled, user suspended, jmap in disabledScopes and user deleted."
    when: "The change is made through the REST API, then a message is delivered (where delivery is still possible)."
    then: "No push is sent. For a deleted user the subscriptions are removed."
    sources:
      - "wildduck:brief Accounts and auth"
  - id: PUSH-060
    title: "A change posts a StateChange object to a verified subscription"
    method: "WebPush"
    spec: "RFC 8620 7.2"
    level: must
    phase: 4
    applies: "yes"
    seed: [jmap]
    given: "A verified subscription without keys and with types null."
    when: "An Email is created with Email/set."
    then: "The URL receives a POST with Content-Type application/json and a UTF-8 JSON body with @type StateChange and changed mapping the account id to the changed types, whose values equal the current get states."
    sources:
      - "jmapio:push/push-subscription-receives-notification"
      - "stalwart:compliance/push.rs"
      - "stalwart:core/push_subscription.rs"
      - "james:WebPushContract#shouldPushEmailDeliveryChangeWhenUserReceivesEmail"
      - "rfc:8620 7.2"
  - id: PUSH-061
    title: "Changes made over IMAP, the REST API and delivery are pushed"
    method: "WebPush"
    spec: "RFC 8620 7.2"
    level: must
    phase: 4
    applies: "yes"
    seed: [imap, api, lmtp]
    given: "A verified subscription with types null."
    when: "A flag is set over IMAP, later a message is moved through the REST API, later a message is delivered over LMTP, each ten seconds apart."
    then: "Each change results in a StateChange push with a newer Email state. The third also lists EmailDelivery."
    sources:
      - "wildduck:brief State and changes"
      - "rfc:8620 7"
  - id: PUSH-062
    title: "Only subscribed types are pushed and other types are left out"
    method: "WebPush"
    spec: "RFC 8620 7.2"
    level: must
    phase: 4
    applies: "yes"
    seed: [imap]
    given: "A verified subscription with types [Mailbox]."
    when: "A message is appended over IMAP."
    then: "The pushed StateChange lists only Mailbox for the account."
    sources:
      - "stalwart:core/push_subscription.rs"
      - "jmapio:push/push-subscription-types-filter"
      - "rfc:8620 7.2"
  - id: PUSH-063
    title: "No push is sent when none of the subscribed types changed"
    method: "WebPush"
    spec: "RFC 8620 7.2"
    level: must
    phase: 4
    applies: "yes"
    seed: [imap]
    given: "A verified subscription with types [EmailDelivery]."
    when: "Messages are flagged, moved and expunged over IMAP. Wait five seconds."
    then: "The URL receives nothing."
    sources:
      - "rfc:8620 7.2"
      - "rfc:8621 1.5.1"
      - "james:WebPushContract#shouldNotPushEmailDeliveryChangeWhenUserCreatesDraftEmail"
  - id: PUSH-064
    title: "A subscription for EmailDelivery is pushed for every new Email"
    method: "WebPush"
    spec: "RFC 8621 1.5"
    level: must
    phase: 4
    applies: "yes"
    seed: [lmtp, api]
    given: "A verified subscription with types [EmailDelivery]."
    when: "The user submits a message through the REST API (sent copy stored), then a message is delivered to the user over LMTP."
    then: "The submission pushes a StateChange whose only type is EmailDelivery, because the stored Sent copy is a new Email, and the delivery pushes another one whose only type is EmailDelivery."
    sources:
      - "james:WebPushContract#shouldPushEmailDeliveryChangeWhenUserReceivesEmail"
      - "james:WebPushContract#shouldNotPushEmailDeliveryChangeWhenUserSendsEmail"
      - "rfc:8621 1.5.1"
    notes: "Corrected 2026-11-11: the EmailDelivery decision (plan 1.2) counts every Email added to the store, including the Sent copy of a REST submission, as EDLV-010 asserts for the event source."
  - id: PUSH-065
    title: "Every verified subscription of the user receives the push"
    method: "WebPush"
    spec: "RFC 8620 7.2"
    level: must
    phase: 4
    applies: "yes"
    seed: [imap]
    given: "Three verified subscriptions with different URLs, created with two different credentials."
    when: "A message is appended over IMAP."
    then: "Each URL receives one StateChange. Subscriptions of other users receive nothing."
    sources:
      - "rfc:8620 7.2"
  - id: PUSH-066
    title: "A burst of changes is coalesced into few pushes ending with the final state"
    method: "WebPush"
    spec: "RFC 8620 7.2"
    level: should
    phase: 4
    applies: "yes"
    seed: [imap]
    given: "A verified subscription with types null."
    when: "50 messages are appended within one second."
    then: "Far fewer than 50 pushes arrive and the Email state in the last one equals the Email/get state after the burst."
    sources:
      - "stalwart:core/push_subscription.rs"
      - "rfc:8620 7"
  - id: PUSH-067
    title: "An expired subscription receives nothing and is removed"
    method: "WebPush"
    spec: "RFC 8620 7.2"
    level: must
    phase: 4
    applies: "yes"
    seed: [imap, time]
    given: "A verified subscription whose expires passed."
    when: "A message is appended, then PushSubscription/get with ids null."
    then: "No request reaches the URL after the expiry time. The subscription is no longer returned and is deleted from storage."
    sources:
      - "james:WebPushContract#webPushShouldNotPushToPushServerWhenExpiredSubscription"
      - "james:PushSubscriptionSetMethodContract#getShouldNotReturnExpiredSubscriptionAndTriggerTheDeletion"
      - "legacy-proxy:test/unit/gmail-subscriptions.spec.ts"
      - "rfc:8620 7.2"
  - id: PUSH-068
    title: "Every push request carries a TTL header"
    method: "WebPush"
    spec: "RFC 8030 5.2"
    level: must
    phase: 4
    applies: "yes"
    seed: [imap]
    given: "A subscription, verified during the test."
    when: "Capture the PushVerification request and a StateChange request."
    then: "Both are POST requests with a TTL header holding a non negative integer number of seconds."
    sources:
      - "rfc:8620 7.2"
      - "rfc:8030 5.2"
  - id: PUSH-069
    title: "Urgency and Topic headers, when sent, are well formed"
    method: "WebPush"
    spec: "RFC 8030 5.3"
    level: may
    phase: 4
    applies: "yes"
    seed: [lmtp]
    given: "A verified subscription."
    when: "Capture StateChange requests for a delivery and for a flag change."
    then: "If Urgency is present it is one of very-low, low, normal, high. If Topic is present it has at most 32 characters from the URL safe base64 alphabet and is constant for the subscription. PushVerification requests carry no Topic."
    sources:
      - "rfc:8620 7.2"
      - "rfc:8030 5.3"
      - "rfc:8030 5.4"
    notes: "Open: whether WildDuck sends them at all. Suggested: a fixed Topic per subscription so a push service replaces an undelivered older StateChange, and Urgency high only when EmailDelivery changed."
  - id: PUSH-070
    title: "Push requests carry no user credentials or message content"
    method: "WebPush"
    spec: "RFC 8620 8.6"
    level: wd
    phase: 4
    applies: "yes"
    seed: [lmtp]
    given: "A verified subscription without keys."
    when: "A message with a distinctive subject is delivered and the push request is captured."
    then: "The request has no Cookie header, no Authorization header with user credentials, and the body holds only the StateChange object: no subject, sender, ids of Emails or user name."
    sources:
      - "rfc:8620 7"
      - "rfc:8620 8.6"
  - id: PUSH-071
    title: "With keys the verification and every push are encrypted per RFC 8291"
    method: "WebPush"
    spec: "RFC 8291"
    level: must
    phase: 4
    applies: "yes"
    seed: [imap]
    given: "A subscription created with a P-256 public key and auth secret whose private key the test holds."
    when: "Capture the PushVerification request, verify, make a change and capture the StateChange request."
    then: "Both requests have Content-Encoding aes128gcm and a binary body that decrypts with the private key and auth secret (aes128gcm record with a 16 byte salt and the 65 byte server public key as key id) to the JSON PushVerification or StateChange object."
    sources:
      - "james:WebPushContract#correctBehaviourShouldSuccessWhenEncryptionKeys"
      - "james:PushSubscriptionSetMethodContract#bodyRequestToPushServerShouldBeEncryptedWhenClientAssignEncryptionKeys"
      - "james:WebPushVapidContract#pushVerificationShouldBeReadableWithTheKeysOfABrowser"
      - "stalwart:core/push_subscription.rs"
      - "rfc:8620 7.2"
      - "rfc:8291 4"
    notes: "Open: Content-Type of the encrypted request. RFC 8620 says application/json for the POST, push services expect application/octet-stream with aes128gcm. Pin one after checking against a real push service."
  - id: PUSH-072
    title: "Each encrypted push uses a fresh salt and ephemeral key"
    method: "WebPush"
    spec: "RFC 8291"
    level: must
    phase: 4
    applies: "yes"
    seed: [imap]
    given: "A verified subscription with keys."
    when: "Two changes are made and both push bodies are captured, including one that is retried."
    then: "The salt and the server public key differ between the bodies, including between an original and its retry."
    sources:
      - "rfc:8291 3.1"
      - "rfc:8291 4"
  - id: PUSH-073
    title: "A subscription with keys never receives plain text"
    method: "WebPush"
    spec: "RFC 8620 8.7"
    level: must
    phase: 4
    applies: "yes"
    seed: [imap]
    given: "A verified subscription with keys. The mock push service answers 500 twice, then 201."
    when: "A change is made and all three requests are captured."
    then: "No request body is parseable JSON. All three carry Content-Encoding aes128gcm."
    sources:
      - "rfc:8620 7.2"
      - "rfc:8620 8.7"
  - id: PUSH-074
    title: "Any 2xx answer counts as delivered"
    method: "WebPush"
    spec: "RFC 8620 7.2"
    level: must
    phase: 4
    applies: "yes"
    seed: [imap]
    given: "A verified subscription. The mock push service answers 201 Created, in a second run 200 and 204."
    when: "A change is made."
    then: "One request is sent per change and it is not retried."
    sources:
      - "rfc:8030 5"
      - "rfc:8620 7.2"
  - id: PUSH-075
    title: "A 429 answer slows pushes down and Retry-After is honoured"
    method: "WebPush"
    spec: "RFC 8620 7.2"
    level: must
    phase: 4
    applies: "yes"
    seed: [imap]
    given: "A verified subscription. The mock push service answers 429 with Retry-After 20 to the next request."
    when: "Five changes are made over the following ten seconds."
    then: "No request is sent during the 20 seconds. Afterwards a single StateChange with the latest state is sent, not five."
    sources:
      - "rfc:8620 7.2"
      - "stalwart:core/push_subscription.rs"
  - id: PUSH-076
    title: "Repeated 429 answers lengthen the push interval"
    method: "WebPush"
    spec: "RFC 8620 7.2"
    level: must
    phase: 4
    applies: "yes"
    seed: [imap, time]
    given: "A verified subscription. The mock push service answers 429 without Retry-After to every request while changes continue once per second."
    when: "Observe the request times for two minutes."
    then: "The gaps between attempts grow (backoff) up to a configured ceiling, and attempts never come faster than the first retry delay."
    sources:
      - "rfc:8620 7.2"
  - id: PUSH-077
    title: "A 5xx answer is retried with backoff until delivered"
    method: "WebPush"
    spec: "RFC 8620 7.2"
    level: should
    phase: 4
    applies: "yes"
    seed: [imap]
    given: "A verified subscription. The mock push service answers 503 twice, then 201."
    when: "One change is made."
    then: "Three requests are sent with growing delays, the third succeeds, and no fourth is sent."
    sources:
      - "stalwart:core/push_subscription.rs"
      - "rfc:8620 7.2"
  - id: PUSH-078
    title: "A retried push carries the newest state"
    method: "WebPush"
    spec: "RFC 8620 7.2"
    level: should
    phase: 4
    applies: "yes"
    seed: [imap]
    given: "A verified subscription. The mock push service fails the first request."
    when: "A second change is made before the retry fires."
    then: "The retry body has the state after the second change, and no separate push for the second change follows."
    sources:
      - "rfc:8620 7"
      - "stalwart:core/push_subscription.rs"
  - id: PUSH-079
    title: "Connection errors and timeouts are retried and do not block other subscriptions"
    method: "WebPush"
    spec: "RFC 8620 7.2"
    level: wd
    phase: 4
    applies: "yes"
    seed: [imap]
    given: "Two verified subscriptions. The first URL accepts the connection and never answers, the second works."
    when: "A change is made."
    then: "The second URL gets its push within a few seconds. The first request is aborted at the configured timeout (default 10 seconds) and scheduled for retry."
    sources:
      - "rfc:8620 7.2"
  - id: PUSH-080
    title: "A 404 or 410 answer removes the subscription"
    method: "WebPush"
    spec: "RFC 8030 7.3"
    level: wd
    phase: 4
    applies: "yes"
    seed: [imap]
    given: "A verified subscription. The mock push service answers 410 Gone (in a second run 404)."
    when: "A change is made, then another, then PushSubscription/get."
    then: "After the first answer no further request is sent and the subscription is no longer returned."
    sources:
      - "legacy-proxy:test/unit/gmail-subscriptions.spec.ts"
      - "rfc:8030 7.3"
  - id: PUSH-081
    title: "Other 4xx answers are not retried for the same push"
    method: "WebPush"
    spec: "RFC 8620 7.2"
    level: wd
    phase: 4
    applies: "yes"
    seed: [imap]
    given: "A verified subscription. The mock push service answers 400 (in further runs 401, 403, 413)."
    when: "One change is made."
    then: "One request is sent and it is not retried. The failure is counted towards the permanent failure limit."
    sources:
      - "rfc:8620 7.2"
  - id: PUSH-082
    title: "A subscription that keeps failing is removed"
    method: "WebPush"
    spec: "RFC 8620 7.2"
    level: wd
    phase: 4
    applies: "yes"
    seed: [imap, time]
    given: "A verified subscription. The permanent failure limit is configured to 5 consecutive failed pushes. The mock push service answers 500 to everything."
    when: "Changes are made until five pushes have exhausted their retries."
    then: "The subscription is destroyed, its url and keys are erased, and later changes cause no request. A success in between resets the counter."
    sources:
      - "legacy-proxy:test/unit/gmail-subscriptions.spec.ts"
      - "rfc:8620 7.2"
  - id: PUSH-083
    title: "A url pointing at a loopback, private or link local address is rejected"
    method: "PushSubscription/set"
    spec: "RFC 8620 8.6"
    level: must
    phase: 4
    applies: "yes"
    seed: [none]
    given: "SSRF protection on (no test allowlist)."
    when: "Create with url host set in turn to 127.0.0.1, localhost, [::1], 10.0.0.5, 172.16.1.1, 192.168.1.1, 169.254.169.254, 0.0.0.0, [fc00::1], [fe80::1], [::ffff:127.0.0.1], 100.64.0.1 and the decimal form 2130706433."
    then: "Each is notCreated with invalidProperties and properties [url], and no connection is attempted."
    sources:
      - "legacy-proxy:test/unit/push-target.spec.ts"
      - "jmap-perl:t/push.t"
      - "rfc:8620 8.6"
    notes: "Tests that use a local mock push service need an explicit allowlist setting, which must be off by default."
  - id: PUSH-084
    title: "A host name that resolves to a private address is rejected"
    method: "PushSubscription/set"
    spec: "RFC 8620 8.6"
    level: must
    phase: 4
    applies: "yes"
    seed: [none]
    given: "A DNS name that resolves to 10.1.2.3, and one that has both a public and a private A record."
    when: "Create with an https url on each name."
    then: "Both are notCreated with invalidProperties and properties [url]."
    sources:
      - "legacy-proxy:test/unit/push-target.spec.ts"
      - "rfc:8620 8.6"
  - id: PUSH-085
    title: "The address is checked again at delivery time"
    method: "WebPush"
    spec: "RFC 8620 8.6"
    level: must
    phase: 4
    applies: "yes"
    seed: [imap]
    given: "A verified subscription whose host resolved to a public address at creation. The DNS answer then changes to 127.0.0.1."
    when: "A change is made."
    then: "No connection to the loopback address is made. The push counts as a failed delivery. The connection goes to the address that was validated, not to a second lookup."
    sources:
      - "rfc:8620 8.6"
      - "legacy-proxy:test/unit/push-target.spec.ts"
  - id: PUSH-086
    title: "Redirects from the push service are not followed"
    method: "WebPush"
    spec: "RFC 8620 8.6"
    level: must
    phase: 4
    applies: "yes"
    seed: [imap]
    given: "A verified subscription. The mock push service answers 302 (in further runs 301, 307, 308) with a Location on another host and on an internal address."
    when: "A change is made."
    then: "No request is made to the Location target. The answer is handled as a failed delivery."
    sources:
      - "rfc:8620 8.6"
  - id: PUSH-087
    title: "The session advertises a VAPID application server key"
    method: "Session"
    spec: "RFC 9749 3"
    level: may
    phase: 4
    applies: "yes"
    seed: [none]
    given: "Web Push with VAPID configured."
    when: "GET the session resource."
    then: "capabilities has urn:ietf:params:jmap:webpush-vapid with applicationServerKey as the URL safe base64 P-256 public key, and the session state changes when the key is rotated."
    sources:
      - "james:WebPushVapidContract#sessionShouldAdvertiseTheApplicationServerKey"
      - "james:WebPushVapidContract#sessionStateShouldDependOnTheApplicationServerKey"
      - "stalwart:core/push_subscription.rs"
    notes: "Decided 2026-11-11: VAPID is included in phase 4, because push services backed by FCM require it. Signing uses node:crypto (ES256)."
  - id: PUSH-088
    title: "Push requests are signed with VAPID"
    method: "WebPush"
    spec: "RFC 8292 3"
    level: may
    phase: 4
    applies: "yes"
    seed: [imap]
    given: "Web Push with VAPID configured and a verified subscription."
    when: "Capture the PushVerification and a StateChange request."
    then: "Both carry Authorization: vapid with t (a JWT signed with ES256 by the advertised key, aud equal to the origin of the push URL, exp at most 24 hours ahead, sub present) and k (the advertised public key)."
    sources:
      - "james:WebPushVapidContract#pushVerificationShouldBeAuthenticated"
      - "james:WebPushVapidContract#stateChangeShouldBeAuthenticated"
      - "stalwart:core/push_subscription.rs"
    notes: "Decided 2026-11-11: VAPID is included in phase 4."
