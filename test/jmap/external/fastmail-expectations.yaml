# Expected results of fastmail/JMAP-TestSuite against WildDuck, per test file.
# Read README.md in this directory first. This file is data for a CI gate, it contains no code.
#
# Suite:    https://github.com/fastmail/JMAP-TestSuite
# Commit:   0319ec8b1841f040fd313531a3df12a74c4b7bf7 (pinned; re-derive this file when the pin moves)
# Licence:  none (the repository has no LICENSE file). Run it as an external tool at the pinned commit, never vendor or copy it.
# Run:      JMAP_SERVER_ADAPTER_FILE=<wildduck.json> prove -Ilib -r t   with a WildDuck adapter kept outside both repositories (see README.md)
#
# Fields
#   id            path of the test file under t/
#   subtests      number of named subtest blocks in the file (0 means one unnamed test body)
#   capabilities  capability URNs the file passes to require_capabilities; the suite skips the file when one is not advertised
#   pristine      true when the file declares attr pristine => 1 (needs pristine_account from the adapter)
#   phase         WildDuck plan phase (0 to 7) from which the file must pass. Omitted for never and skip.
#                 Before that phase the file either fails or is skipped by the suite (capability not advertised yet).
#   expect        pass   must pass from phase on (prove reports the file ok, subtests skipped inside it are fine)
#                 never  fails by design; reason names the WildDuck constraint
#                 skip   the suite itself skips the whole file: capability never advertised, or no second account (pool_account_pair)
#   reason        for never and skip, and for a pass that depends on a condition worth knowing
suite: fastmail/JMAP-TestSuite
url: "https://github.com/fastmail/JMAP-TestSuite"
commit: "0319ec8b1841f040fd313531a3df12a74c4b7bf7"
licence: "none (no LICENSE file in the repository)"
run: "JMAP_SERVER_ADAPTER_FILE=<wildduck.json> prove -Ilib -r t"
