# Expected results of jmapio/jmap-test-suite against WildDuck, per test.
# Read README.md in this directory first. This file is data for a CI gate, it contains no code.
#
# Suite:    https://github.com/jmapio/jmap-test-suite
# Commit:   0f2c117dc5f3621bfa50cb0b8b4d4ac87a4154be (pinned; re-derive this file when the pin moves)
# Licence:  none (the repository has no LICENSE file). Run it as an external tool at the pinned commit, never vendor or copy it.
# Run:      npm install && npm run build && node dist/cli.js -c <config.json> -f -o report.json  (see README.md)
#
# Fields
#   id             test id exactly as the JSON report gives it in results[].testId
#   required       the suite's own flag (false means the suite calls the test recommended)
#   spec           RFC and section the suite cites for the test
#   phase          WildDuck plan phase (0 to 7) from which the test must pass. Omitted when the test is not expected to pass.
#                  The suite seeds its fixtures with Mailbox/set, the upload endpoint and Email/import and aborts when
#                  seeding fails, so no test can pass before phase 2: phase is never lower than 2 in this file.
#   feature_phase  only present when lower than phase: the phase in which the behaviour itself is implemented
#                  (the test would pass in phase 1 if the suite could seed).
#   expect         pass     must pass from phase on
#                  never    fails or is skipped by design; reason names the WildDuck constraint
#                  opinion  the suite is stricter than the RFC; reason says what WildDuck does. With a phase WildDuck
#                           complies and the test is gated like pass. Without a phase the test is reported, never gated.
#   reason         one sentence, only for never and opinion
#   note           optional, a condition the pass depends on
#   skip_when      optional, the precondition under which the suite itself reports skip instead of running the test
suite: jmapio/jmap-test-suite
url: "https://github.com/jmapio/jmap-test-suite"
