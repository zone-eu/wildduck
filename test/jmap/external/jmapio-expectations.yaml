    spec: "RFC 8620 3.6.1"
    phase: 2
    feature_phase: 1
    expect: opinion
    reason: "RFC 8620 3.6.1 makes the unknownCapability problem response a SHOULD and the suite requires an HTTP level 4xx. WildDuck answers HTTP 400 with urn:ietf:params:jmap:error:unknownCapability, simply comply."
  - id: "core/error-empty-using"
    required: true
    spec: "RFC 8620 3.6.1"
    phase: 2
    feature_phase: 1
    expect: opinion
    reason: "The RFC does not say what an empty using array yields; the suite wants the request processed and every call, Core/echo included, answered with unknownMethod. WildDuck gates every method on using, simply comply."
  - id: "core/error-wrong-content-type"
    required: true
    spec: "RFC 8620 3.6.1"
    phase: 2
    feature_phase: 1
    expect: opinion
    reason: "The RFC only obliges clients to send application/json; the suite requires a 4xx for text/plain. WildDuck answers 415 (or 400 notJSON), simply comply."
