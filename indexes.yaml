---
collections:
    # create following collections with specific options

    - collection: messages
      options:
          storageEngine:
              wiredTiger:
                  configString: block_compressor=zlib

    - collection: attachments.files
      type: gridfs
      options:
          storageEngine:
              wiredTiger:
                  configString: block_compressor=zlib

    - collection: attachments.chunks
      type: gridfs
      options:
          storageEngine:
              wiredTiger:
                  configString: block_compressor=zlib

indexes:
    # Indexes for the user collection

    - collection: users
      type: users # index applies to users database
      index:
          name: users
          key:
              username: 1
    - collection: users
      type: users # index applies to users database
      index:
          name: users_dotless
          unique: true
          key:
              unameview: 1

    - collection: users
      type: users # index applies to users database
      index:
          name: show_new
          key:
              created: -1

    - collection: users
      type: users # index applies to users database
      index:
          name: users_tags
          key:
              tagsview: 1
          sparse: true

    # Indexes for the addresses collection
    - collection: addresses
      type: users # index applies to users database
      index:
          name: address_dotless
          unique: true
          key:
              addrview: 1

    - collection: addresses
      type: users # index applies to users database
      index:
          name: address_tags
          key:
              tagsview: 1
          sparse: true

    - collection: addresses
      type: users # index applies to users database
      index:
          name: address_paging
          key:
              addrview: 1
              _id: 1

    - collection: addresses
      type: users # index applies to users database
      index:
          name: user
          key:
              user: 1

    # Indexes for the domainaliases collection
    - collection: domainaliases
      type: users # index applies to users database
      index:
          name: domainalias
          unique: true
          key:
              alias: 1

    - collection: domainaliases
      type: users # index applies to users database
      index:
          name: domainlist
          key:
              domain: 1

    # Indexes for the application specific passwords collection

    - collection: asps
      type: users # index applies to users database
      index:
          name: asps_user
          key:
              user: 1

    - collection: asps
      type: users # index applies to users database
      index:
          name: entry_autoexpire
          # autoremove log entries after expire seconds
          expireAfterSeconds: 0
          key:
              expires: 1

    # Indexes for dedicated MCP personal access tokens

    - collection: mcptokens
      type: users # index applies to users database
      index:
          name: mcp_token_hash
          unique: true
          key:
              hash: 1

    - collection: mcptokens
      type: users # index applies to users database
      index:
          name: mcp_tokens_user_created
          key:
              user: 1
              created: -1
              _id: -1

    - collection: mcptokens
      type: users # index applies to users database
      index:
          name: mcp_token_autoexpire
          expireAfterSeconds: 0
          key:
              expires: 1

    # Indexes for the authentication log collection
    - collection: authlog
      type: users # index applies to users database
      index:
          name: user
          key:
              user: 1
              _id: -1 # sort newer first

    - collection: authlog
      type: users # index applies to users database
      index:
          name: insert
          key:
              user: 1
              created: 1
              key: 1

    - collection: authlog
      type: users # index applies to users database
      index:
          name: by_ip
          key:
              ip: 1 # All events from this IP
          sparse: true

    - collection: authlog
      type: users # index applies to users database
      index:
          name: user_hashed
          key:
              user: hashed # sharding

    - collection: authlog
      type: users # index applies to users database
      index:
          name: entry_autoexpire
          # autoremove log entries after expire days
          expireAfterSeconds: 0
          key:
              expires: 1

    # Indexes for the filters collection

    - collection: filters
      index:
          name: user
          key:
              user: 1

    - collection: filters
      index:
          name: forward_target
          key:
              action.targets.value: 1

    # Indexes for the allow/block list collection

    - collection: domainaccess
      index:
          name: by_tag
          key:
              tagview: 1
              action: 1
              domain: 1

    # Indexes for the autoreply collection

    - collection: autoreplies
      index:
          name: autoreply
          key:
              user: 1
              start: 1
              end: 1

    # Indexes for the mailboxes collection
    # note: should mailboxes collection be sharded? could be by user
    - collection: mailboxes
      index:
          name: user_path
          unique: true
          key:
              user: 1
              path: 1

    - collection: mailboxes
      index:
          name: user_subscribed
          key:
              user: 1
              subscribed: 1

    - collection: mailboxes
      index:
          name: find_by_type
          key:
              user: 1
              specialUse: 1

    # Label names are unique within a user account.
    - collection: labels
      index:
          name: user_name
          unique: true
          key:
              user: 1
              name: 1

    - collection: labels
      index:
          name: user_slot
          unique: true
          key:
              user: 1
              slot: 1

    # Indexes for the messages collection
    - collection: messages
      index:
          # several message related queries include the shard key values
          name: mailbox_uid_shard
          key:
              _id: 1
              mailbox: 1
              uid: 1

    - collection: messages
      index:
          # also used by JMAP Thread/get, which lists a thread across mailboxes: keep it
          name: user_messages_by_thread
          key:
              user: 1
              thread: 1

    - collection: messages
      feature: jmap
      index:
          # JMAP Email/query without a mailbox filter, sorted by receivedAt (idate). Deleted (\Deleted) messages are
          # rare, so they are filtered after the scan instead of in an index of their own
          name: user_idate
          key:
              user: 1
              idate: -1
              _id: -1

    - collection: messages
      feature: jmap
      index:
          # JMAP Email ids (lib/message-roots.js): root stays the same when a message moves, _id does not
          # because the shard key changes. Roots are globally unique ObjectIds, so root alone is selective
          # and the index stays half the size of a {user, root} one. Documents without root are left out.
          name: by_root
          key:
              root: 1
          partialFilterExpression:
              root:
                  $exists: true

    - collection: messages
      index:
          # Queue IDs are selective, so keep this index to one key and exclude ordinary received messages.
          # The matching document provides mailbox and uid for the shard-targeted notified update.
          name: outbound_message
          key:
              outbound: 1
          partialFilterExpression:
              outbound:
                  $exists: true

    - collection: messages
      index:
          # use also as sharding key
          name: mailbox_uid
          key:
              mailbox: 1
              uid: 1
              _id: 1

    - collection: messages
      index:
          name: mailbox_uid_reverse
          key:
              mailbox: 1
              uid: -1
              _id: -1

    - collection: messages
      index:
          name: mailbox_modseq_uid
          key:
              mailbox: 1
              modseq: 1
              uid: 1

    - collection: messages
      index:
          name: mailbox_flags
          key:
              mailbox: 1
              flags: 1

    - collection: messages
      index:
          name: mailbox_labels
          key:
              mailbox: 1
              labels: 1

    - collection: messages
      index:
          # JMAP Email/query in one mailbox sorted by receivedAt uses the by_idate indexes: keep one of them
          name: by_idate
          key:
              mailbox: 1
              idate: 1

    - collection: messages
      index:
          # index used by api pagination
          name: by_idate_reverse_uid
          key:
              mailbox: 1
              idate: -1
              _id: -1

    - collection: messages
      index:
          # covers the collapseThreads listing and count aggregations. The trailing
          # thread key makes the id-only grouping a covered query, uid is included
          # so that on sharded clusters the SHARDING_FILTER stage can run off index
          # entries instead of forcing a fetch of every document. Supersedes
          # by_idate_reverse_uid, which shares this prefix and can be dropped
          name: by_idate_reverse_thread
          key:
              mailbox: 1
              idate: -1
              _id: -1
              thread: 1
              uid: 1

    - collection: messages
      index:
          name: by_hdate
          key:
              mailbox: 1
              hdate: 1
              msgid: 1

    - collection: messages
      index:
          # SENTBEFORE, SENTON and SENTSINCE read hdateDay, and fall back to by_hdate for
          # messages stored before that field existed. Mongo can only use an index for an
          # $or when every branch has one, so without this the whole pair goes unindexed
          name: by_hdate_day
          key:
              mailbox: 1
              hdateDay: 1

    - collection: messages
      index:
          name: by_size
          key:
              mailbox: 1
              size: 1

    - collection: messages
      index:
          name: by_headers
          key:
              mailbox: 1
              headers.key: 1
              headers.value: 1

    - collection: messages
      index:
          # there can be only one $text index per collection
          name: fulltext
          key:
              user: 1
              headers.value: text
              text: text
          partialFilterExpression:
              # every stored message is searchable. RFC 3501 6.4.4 has BODY and TEXT match any
              # message in the mailbox, and 2.3.2 makes \Deleted only a marker, so a message
              # stays in this index until it is expunged
              searchable: true

    - collection: messages
      index:
          # in most cases we only care about unseen, not seen messages
          name: mailbox_unseen_flag
          key:
              mailbox: 1
              unseen: 1

    - collection: messages
      index:
          name: user_unseen_flag
          key:
              user: 1
              unseen: 1
          partialFilterExpression:
              searchable: true

    - collection: messages
      index:
          # some mail agents list messages that do not have the \Deleted flag set
          name: mailbox_undeleted_flag
          key:
              mailbox: 1
              undeleted: 1

    - collection: messages
      index:
          name: mailbox_flagged_flag
          key:
              mailbox: 1
              flagged: 1

    - collection: messages
      index:
          name: user_flagged_flag
          key:
              user: 1
              flagged: 1

    - collection: messages
      index:
          name: user_searchable_flag
          key:
              user: 1
              searchable: 1

    - collection: messages
      index:
          name: mailbox_draft_flag
          key:
              mailbox: 1
              draft: 1

    - collection: messages
      index:
          name: has_attachment
          key:
              mailbox: 1
              ha: 1

    - collection: messages
      index:
          # This filter finds all messages that are expired and must be deleted.
          # Not sure about performance though as it is a global query
          name: retention_time
          partialFilterExpression:
              exp: true
          key:
              exp: 1
              rdate: 1

    # indexes for address register
    - collection: addressregister
      index:
          name: by_address
          key:
              user: 1
              addrview: 1
              updated: -1

    - collection: addressregister
      index:
          name: by_user_disabled_partial
          key:
              user: 1
              updated: -1
          partialFilterExpression:
              disabled: false

    - collection: addressregister
      index:
          name: by_user_disabled
          key:
              user: 1
              disabled: 1

    # indexes for deleted messages
    - collection: archived
      index:
          name: user_messages
          key:
              user: 1
              _id: 1

    # indexes for deleted messages
    - collection: archived
      index:
          name: user_messages_desc
          key:
              user: 1
              _id: -1

    - collection: archived
      index:
          # backs the threadCounters lookup on archived message listings
          name: user_messages_by_thread
          key:
              user: 1
              thread: 1

    - collection: archived
      feature: jmap
      index:
          # restore and lookups by JMAP Email id, see the by_root index of messages
          name: by_root
          key:
              root: 1
          partialFilterExpression:
              root:
                  $exists: true

    - collection: jmapchanges
      feature: jmap
      index:
          # JMAP /changes of the owned types (lib/jmap/changelog.js): tombstones after a sequence number
          name: user_type_seq
          key:
              user: 1
              type: 1
              seq: 1

    - collection: jmapidentities
      feature: jmap
      index:
          # one derived identity per sending right (lib/jmap/types/identity.js), also under concurrent requests
          name: user_source
          unique: true
          key:
              user: 1
              source: 1
          partialFilterExpression:
              source:
                  $exists: true

    - collection: jmapidentities
      feature: jmap
      index:
          # Identity/changes, a range scan on the change sequence
          name: user_modseq
          key:
              user: 1
              modSeq: 1

    - collection: jmapsubmissions
      feature: jmap
      index:
          # EmailSubmission/changes, a range scan on the change sequence; also the per user listing
          name: user_modseq
          key:
              user: 1
              modSeq: 1

    - collection: jmapsubmissions
      feature: jmap
      index:
          # EmailSubmission/get without ids and EmailSubmission/query without sort: a user's records in id order
          name: user_id
          key:
              user: 1
              _id: 1

    - collection: jmapsubmissions
      feature: jmap
      index:
          # pending submissions of a user (checked against the queue) and the cleanup of old ones
          name: user_status_sendat
          key:
              user: 1
              undoStatus: 1
              sendAt: 1

    - collection: jmapsubmissions
      feature: jmap
      index:
          # the submission of a queued message, when the REST API deletes or reschedules it
          name: user_queueid
          key:
              user: 1
              queueId: 1

    - collection: jmapsubmissions
      feature: jmap
      index:
          # the poller: pending submissions of all users whose next check is due, earliest first
          name: pending_checkat
          key:
              checkAt: 1
          partialFilterExpression:
              undoStatus: pending

    - collection: jmapsubmissions
      feature: jmap
      index:
          name: submission_autoexpire
          # a backstop for records of users who stopped using JMAP; normally the cleanup removes them
          # long before, with a tombstone
          expireAfterSeconds: 0
          key:
              purgeAt: 1

    - collection: jmappush
      feature: jmap
      index:
          # PushSubscription/get and set: the subscriptions of one set of credentials, and of a user
          name: user_cred
          key:
              user: 1
              cred: 1

    - collection: jmappush
      feature: jmap
      index:
          # the push dispatcher: users with a verified subscription
          name: verified_user
          key:
              user: 1
          partialFilterExpression:
              verified: true

    - collection: jmappush
      feature: jmap
      index:
          name: push_autoexpire
          # expired subscriptions, and unverified ones past their grace period
          expireAfterSeconds: 0
          key:
              purgeAt: 1

    - collection: jmapparticipants
      feature: jmap
      index:
          # one calendar participant identity per address (lib/jmap/types/participant-identity.js)
          name: user_address
          unique: true
          key:
              user: 1
              address: 1

    - collection: jmapparticipants
      feature: jmap
      index:
          # ParticipantIdentity/changes, a range scan on the change sequence
          name: user_modseq
          key:
              user: 1
              modSeq: 1

    - collection: calendars
      feature: jmap
      index:
          # the calendars of a user in display order (lib/calendar-handler.js)
          name: user_sortorder
          key:
              user: 1
              sortOrder: 1
              _id: 1

    - collection: calendars
      feature: jmap
      index:
          # at most one default calendar per user, also under concurrent first access
          name: user_default
          unique: true
          key:
              user: 1
          partialFilterExpression:
              isDefault: true

    - collection: calendars
      feature: jmap
      index:
          # Calendar/changes, a range scan on the change sequence
          name: user_modseq
          key:
              user: 1
              modSeq: 1

    - collection: calendarevents
      feature: jmap
      index:
          # the events of a calendar (calendarHasEvent, onDestroyRemoveEvents)
          name: user_calendar
          key:
              user: 1
              calendarIds: 1

    - collection: calendarevents
      feature: jmap
      index:
          # CalendarEvent/changes, a range scan on the change sequence
          name: user_modseq
          key:
              user: 1
              modSeq: 1

    - collection: jmapchanges
      feature: jmap
      index:
          name: entry_autoexpire
          # tombstones are removed once no valid state can reach them
          expireAfterSeconds: 0
          key:
              expires: 1

    - collection: addressbooks
      feature: jmap
      index:
          # JMAP AddressBook (lib/contact-handler.js): the address books of a user
          name: user_id
          key:
              user: 1
              _id: 1

    - collection: addressbooks
      feature: jmap
      index:
          # at most one default address book per user (RFC 9610 2), also under concurrent first use
          name: user_default
          unique: true
          key:
              user: 1
              isDefault: 1
          partialFilterExpression:
              isDefault: true

    - collection: addressbooks
      feature: jmap
      index:
          # AddressBook/changes (lib/jmap/changelog.js)
          name: user_modseq
          key:
              user: 1
              modSeq: 1

    - collection: contacts
      feature: jmap
      index:
          # one card per uid in an account (RFC 9610 3), ContactCard/query uid filter
          name: user_uid
          unique: true
          key:
              user: 1
              uid: 1

    - collection: contacts
      feature: jmap
      index:
          # ContactCard/changes (lib/jmap/changelog.js)
          name: user_modseq
          key:
              user: 1
              modSeq: 1

    - collection: contacts
      feature: jmap
      index:
          # the cards of an address book: ContactCard/query inAddressBook, AddressBook/set destroy
          name: user_books
          key:
              user: 1
              addressBooks: 1

    - collection: contacts
      feature: jmap
      index:
          # ContactCard/query text filters: the search terms of a card (lib/jmap/contact-search.js)
          name: user_terms
          key:
              user: 1
              terms: 1

    - collection: contacts
      feature: jmap
      index:
          # ContactCard/query hasMember
          name: user_members
          key:
              user: 1
              members: 1

    - collection: contacts
      feature: jmap
      index:
          # the cards that reference a media file: Blob/lookup, and removal of unreferenced media
          name: user_blobs
          key:
              user: 1
              blobs: 1

    - collection: contactmedia
      feature: jmap
      index:
          # removal with the user
          name: user
          key:
              user: 1

    - collection: addressregister
      feature: jmap
      index:
          # ContactCard/changes of the cards of the address register book (lib/jmap/contacts-sync.js)
          name: user_modseq
          key:
              user: 1
              modSeq: 1
          partialFilterExpression:
              modSeq:
                  $exists: true

    - collection: archived
      index:
          name: user_messages_archived
          key:
              user: 1
              archived: 1

    - collection: archived
      index:
          name: retention_time
          partialFilterExpression:
              exp: true
          key:
              exp: 1
              rdate: 1

    # Indexes for the storage collection
    # storage.files collection should be sharded by _id (hash)
    # storage.chunks collection should be sharded by files_id (hash)

    - collection: storage.files
      type: gridfs # index applies to gridfs database
      index:
          name: storage_id_hashed
          key:
              _id: hashed

    - collection: storage.chunks
      type: gridfs # index applies to gridfs database
      index:
          # hashed index needed for sharding
          name: chunks_shard
          key:
              files_id: hashed

    - collection: storage.files
      type: gridfs # index applies to gridfs database
      index:
          name: user_files
          key:
              metadata.user: 1
              filename: 1

    - collection: storage.files
      type: gridfs # index applies to gridfs database
      index:
          # temporary uploads (JMAP): the upload quota of a user, see StorageHandler.makeRoom
          name: user_temporary_files
          key:
              metadata.user: 1
              metadata.expires: 1
          partialFilterExpression:
              metadata.expires:
                  $exists: true

    - collection: storage.files
      type: gridfs # index applies to gridfs database
      index:
          # temporary uploads (JMAP): removal once expired, see lib/tasks/upload-cleanup.js
          name: temporary_files_expiry
          key:
              metadata.expires: 1
          partialFilterExpression:
              metadata.expires:
                  $exists: true

    # Indexes for the attachments collection
    # attachments.files collection should be sharded by _id (hash)
    # attachments.chunks collection should be sharded by files_id (hash)

    - collection: attachments.files
      type: gridfs # index applies to gridfs database
      index:
          name: attachment_id_hashed
          key:
              _id: hashed

    - collection: attachments.files
      type: gridfs # index applies to gridfs database
      index:
          name: related_attachments_cu
          key:
              metadata.c: 1
              metadata.m: 1
              metadata.cu: 1

    - collection: attachments.chunks
      type: gridfs # index applies to gridfs database
      index:
          # hashed index needed for sharding
          name: chunks_shard
          key:
              files_id: hashed

    - collection: attachments.chunks
      type: gridfs # index applies to gridfs database
      index:
          name: files_id_1_n_1
          unique: true
          key:
              files_id: 1
              n: 1

    # Indexes for the DKIm collection

    - collection: dkim
      index:
          name: dkim_paging
          key:
              domain: 1
              _id: 1

    - collection: dkim
      index:
          name: dkim_primary
          unique: true
          key:
              domain: 1

    # Indexes for the journal collection

    - collection: journal
      index:
          # this index is used to apply changes in a mailbox for IMAP session
          name: mailbox_modseq
          key:
              mailbox: 1
              modseq: 1

    - collection: journal
      index:
          # this index is used to send updates to a logged in webmail user
          name: user_limit_id
          key:
              user: 1
              _id: 1

    - collection: journal
      index:
          # this index is used to find the latest journal entry
          name: user_limit_id_reverse
          key:
              user: 1
              _id: -1

    - collection: journal
      # delete journal entries after const:journal:time (3 hours unless changed). The JMAP change
      # history (Email/changes and friends) reaches back as far as the journal does
      ttlSetting: const:journal:time
      index:
          name: journal_autoexpire
          expireAfterSeconds: 10800
          key:
              created: 1

    # Indexes for the threads collection

    - collection: threads
      index:
          name: thread_shard
          key:
              user: hashed

    - collection: threads
      index:
          name: thread
          key:
              user: 1
              ids: 1

    - collection: threads
      index:
          name: thread_autoexpire
          # autoremove thread indexes after 180 days of inactivity
          expireAfterSeconds: 15552000
          key:
              updated: 1

    - collection: tasks
      index:
          name: task
          key:
              locked: 1
              lockedUntil: 1

    - collection: tasks
      index:
          name: task_data_user
          key:
              task: 1
              data.user: 1

    - collection: tasks
      index:
          name: clear_folder_task
          unique: true
          partialFilterExpression:
              task: clear-folder
          key:
              task: 1
              data.user: 1
              data.mailbox: 1

    - collection: certs
      index:
          name: servername
          unique: true
          key:
              servername: 1

    - collection: certs
      index:
          name: servername_version
          key:
              servername: 1
              v: 1

    - collection: certs
      index:
          name: servername_alt
          key:
              altNames: 1
              v: 1

    - collection: certs
      index:
          name: renewal_check
          key:
              acme: 1
              expires: 1
              '_acme.lastRenewalCheck': 1

    - collection: certs
      index:
          name: garbage_check
          key:
              acme: 1
              updated: 1
              expires: 1
              autogenerated: 1

    - collection: audits
      index:
          name: user_expire_time
          key:
              user: 1
              expires: 1

    - collection: audits
      index:
          name: expire_time
          key:
              expires: 1
              deleted: 1

    - collection: audit.files
      type: gridfs # index applies to gridfs database
      index:
          name: audit_id_hashed
          key:
              _id: hashed

    - collection: audit.chunks
      type: gridfs # index applies to gridfs database
      index:
          # hashed index needed for sharding
          name: audit_shard
          key:
              files_id: hashed

    - collection: audit.files
      type: gridfs # index applies to gridfs database
      index:
          name: audit_files
          key:
              metadata.audit: 1
              metadata.date: 1

    - collection: audit.files
