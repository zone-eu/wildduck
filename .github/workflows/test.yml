name: Run tests

on:
    push:
    pull_request:

jobs:
    test:
        timeout-minutes: 60
        strategy:
            matrix:
                node: [22.x, 24.x, 26.x]
                os: [ubuntu-latest]
        runs-on: ${{ matrix.os }}
        env:
            S3_TEST_ENDPOINT: http://127.0.0.1:5000
        # Service containers to run with `container-job`
        services:
            # Label used to access the service container
            redis:
                # Docker Hub image
                image: redis
                # Set health checks to wait until redis has started
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 6379:6379
            moto:
                image: motoserver/moto:latest
                ports:
                    - 5000:5000
            # the JMAP full body search scenario (EQRY-065) indexes into it, at the default [elasticsearch] url
            opensearch:
                image: opensearchproject/opensearch:2.19.1
                env:
                    discovery.type: single-node
                    DISABLE_SECURITY_PLUGIN: 'true'
                    DISABLE_INSTALL_DEMO_CONFIG: 'true'
                    OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
                options: >-
                    --health-cmd "curl -fs http://localhost:9200"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 12
                ports:
                    - 9200:9200
        steps:
            - uses: actions/checkout@v6

            - name: Start MongoDB
              uses: supercharge/mongodb-github-action@1.12.1
              with:
                  mongodb-version: 6.0
                  mongodb-port: 27017
                  mongodb-db: wildduck-test

            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node }}

            - name: Install mongosh and mpop
              run: |
                  sudo apt-get update
                  sudo apt-get install -y wget gnupg mpop
                  wget -qO - https://www.mongodb.org/static/pgp/server-8.0.asc | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
                  echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
                  sudo apt-get update
                  sudo apt-get install -y mongodb-mongosh

            - run: which mongosh
            - run: which mpop
            - run: npm install
            - name: Wait for Moto S3
              run: curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 "$S3_TEST_ENDPOINT"
            - name: Validate the JMAP test catalogue
              run: node test/jmap/tools/check-catalogue.js
            - name: Run tests
              # the full output also goes to a file: the job log view stops at very long lines (the fuzz tests
              # log megabyte long URLs), which hides everything after them
              run: |
                  set -o pipefail
                  npm run runtest 2>&1 | tee test-output.log
              env:
                  APPCONF_dbs_redis: redis://127.0.0.1:6379/1
                  APPCONF_dbs_mongodb: 'mongodb://127.0.0.1:27017/wildduck-test?authSource=admin'
                  JMAP_RESULTS: 1
                  JMAP_REQUIRE_OPENSEARCH: 1
            - name: Summary of the test run
              if: always()
              run: grep -aE '^ *[0-9]+ (passing|failing|pending)|^Running "|Aborted|^ *[0-9]+\) ' test-output.log | sed 's/\x1b\[[0-9;]*m//g' | head -200 || true
            - name: Keep the test output
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: test-output-${{ matrix.node }}
                  path: |
                      test-output.log
                      test/jmap/.results/
                  retention-days: 7
            - name: Check JMAP catalogue coverage
              run: node test/jmap/tools/check-coverage.js
