on:
    push:
        branches:
            - master
            - 'release-[0-9]+.[0-9]+' # maintenance branches only, excluding release-please branches

# Default to read-only permissions
permissions: read-all

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}
    PACKAGE_NAME: ${{ github.event.repository.name }}

name: release
jobs:
    release_please:
        timeout-minutes: 30
        permissions:
            contents: write
            pull-requests: write
            id-token: write
        runs-on: ubuntu-latest
        outputs:
            major: ${{ steps.release.outputs.major }}
            minor: ${{ steps.release.outputs.minor }}
            patch: ${{ steps.release.outputs.patch }}
            release_created: ${{ steps.release.outputs.release_created }}
        steps:
            - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
              id: release
              with:
                  # one release PR per branch: master and each release-* branch are independent
                  target-branch: ${{ github.ref_name }}

    # When a "hotfix:" commit lands on master, cherry-pick it onto the maintenance
    # branch of the latest release and open a separate patch-only release PR there.
    # Requires squash or rebase merges (one commit per PR).
    hotfix_backport:
        timeout-minutes: 30
        if: ${{ github.ref_name == 'master' && startsWith(github.event.head_commit.message, 'hotfix') }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  fetch-depth: 0

            - name: Cherry-pick onto the maintenance branch
              id: pick
              run: |
                  set -euo pipefail
                  TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD)
                  BRANCH="release-$(echo "${TAG#v}" | cut -d. -f1,2)"
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
                      git checkout -B "$BRANCH" "origin/$BRANCH"
                  else
                      git checkout -B "$BRANCH" "$TAG"
                      # Old tags may predate both the hotfix config and maintenance trigger.
                      git checkout origin/master -- release-please-config.json .github/workflows/release.yaml
                      if ! git diff --cached --quiet; then
                          git commit -m "chore: sync release configuration and workflow"
                      fi
                  fi
                  git cherry-pick -x "${{ github.sha }}"
                  git push origin "$BRANCH"
                  echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

            # Pushes made with GITHUB_TOKEN don't trigger workflows, so open the PR directly
            - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
              with:
                  target-branch: ${{ steps.pick.outputs.branch }}

    sync_master_version:
        timeout-minutes: 30
        needs: release_please
        if: ${{ github.ref_name != 'master' && needs.release_please.outputs.release_created }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  ref: master
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 24
            - name: Advance master's release baseline
              env:
                  RELEASE_VERSION: ${{ needs.release_please.outputs.major }}.${{ needs.release_please.outputs.minor }}.${{ needs.release_please.outputs.patch }}
              run: |
                  set -euo pipefail
                  node <<'NODE'
                  const fs = require('node:fs');
                  const path = '.release-please-manifest.json';
                  const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
                  const released = process.env.RELEASE_VERSION.split('.').map(Number);
                  const current = manifest['.'].split('.').map(Number);
                  const difference = released.findIndex((value, index) => value !== current[index]);
                  // Maintenance releases on older lines must never lower master's baseline.
                  if (difference !== -1 && released[difference] > current[difference]) {
                      manifest['.'] = process.env.RELEASE_VERSION;
                      fs.writeFileSync(path, JSON.stringify(manifest, null, 4) + '\n');
                  }
                  NODE
                  if ! git diff --quiet -- .release-please-manifest.json; then
                      git config user.name "github-actions[bot]"
                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                      git add .release-please-manifest.json
                      git commit -m "chore: advance release baseline to $RELEASE_VERSION"
                      git push origin HEAD:master
                  fi
            # GITHUB_TOKEN pushes do not trigger workflows; refresh any existing release PR now.
            - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
              with:
                  target-branch: master
                  skip-github-release: true

    publish_npm:
        timeout-minutes: 30
        needs: release_please
        if: ${{ needs.release_please.outputs.release_created }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 24
                  registry-url: 'https://registry.npmjs.org'
            - run: npm ci
            # releases from release-* branches must not take over the "latest" dist-tag
            - run: npm publish --provenance --access public ${{ github.ref_name != 'master' && format('--tag {0}', github.ref_name) || '' }}

    publish_docker:
        timeout-minutes: 30
        name: Create and publish a Docker image
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
            attestations: write
            id-token: write
        needs: release_please
        if: ${{ needs.release_please.outputs.release_created }}
        steps:
            - run: echo "Building version v${{needs.release_please.outputs.major}}.${{needs.release_please.outputs.minor}}.${{needs.release_please.outputs.patch}}"

            - name: Checkout repository
              uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v6

            - name: Set up QEMU
              uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
              with:
                  platforms: 'arm64'

            - name: Set up Docker Buildx
              id: buildx
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
              with:
                  platforms: linux/arm64,linux/amd64

            - name: Log in to the Container registry
              uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  flavor: |
                      latest=${{ github.ref_name == 'master' && 'auto' || 'false' }}
                  tags: |
                      type=semver,pattern={{version}},value=v${{needs.release_please.outputs.major}}.${{needs.release_please.outputs.minor}}.${{needs.release_please.outputs.patch}}
                      type=semver,pattern={{major}}.{{minor}},value=v${{needs.release_please.outputs.major}}.${{needs.release_please.outputs.minor}}.${{needs.release_please.outputs.patch}}
                      type=semver,pattern={{major}},value=v${{needs.release_please.outputs.major}}.${{needs.release_please.outputs.minor}}.${{needs.release_please.outputs.patch}},enable=${{ github.ref_name == 'master' }}

            - name: Build and push Docker image
              id: push
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  push: true
                  platforms: ${{ steps.buildx.outputs.platforms }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}

            - name: Generate artifact attestation
              uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
              with:
                  subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  subject-digest: ${{ steps.push.outputs.digest }}
                  push-to-registry: true

    publish_artifacts:
        timeout-minutes: 30
        name: Package and upload release artifacts
        runs-on: ubuntu-latest
        needs: release_please
        if: ${{ needs.release_please.outputs.release_created }}
        permissions:
            contents: write
            attestations: write
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

            - name: Setup Node
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm install --omit=dev

            - name: Move files to temporary directory
              run: |
                  mkdir -p ${{ runner.temp }}/release_build
                  cp -R . ${{ runner.temp }}/release_build/

            - name: Set archive names
              id: names
              run: |
                  echo "zip=${{env.PACKAGE_NAME}}-${{needs.release_please.outputs.major}}.${{needs.release_please.outputs.minor}}.${{needs.release_please.outputs.patch}}.zip" >> $GITHUB_OUTPUT
                  echo "tar=${{env.PACKAGE_NAME}}-${{needs.release_please.outputs.major}}.${{needs.release_please.outputs.minor}}.${{needs.release_please.outputs.patch}}.tar.gz" >> $GITHUB_OUTPUT
                  echo "zip_checksum=${{env.PACKAGE_NAME}}-${{needs.release_please.outputs.major}}.${{needs.release_please.outputs.minor}}.${{needs.release_please.outputs.patch}}.zip.sha256" >> $GITHUB_OUTPUT
                  echo "tar_checksum=${{env.PACKAGE_NAME}}-${{needs.release_please.outputs.major}}.${{needs.release_please.outputs.minor}}.${{needs.release_please.outputs.patch}}.tar.gz.sha256" >> $GITHUB_OUTPUT

            - name: Create zip archive
              run: |
                  ROOT_DIR=$(pwd)
                  cd ${{ runner.temp }}/release_build
                  zip -r $ROOT_DIR/${{ steps.names.outputs.zip }} . -x "*.git" "*.git/*"
                  cd $ROOT_DIR

            - name: Create tar.gz archive
              run: |
                  tar --exclude='.git' --exclude='.git/*' \
                    -czf ${{ steps.names.outputs.tar }} \
                    -C ${{ runner.temp }}/release_build/ .

            - name: Generate SHA-256 checksums
              run: |
                  sha256sum ${{ steps.names.outputs.zip }} > ${{ steps.names.outputs.zip_checksum }}
                  sha256sum ${{ steps.names.outputs.tar }} > ${{ steps.names.outputs.tar_checksum }}
                  cat ${{ steps.names.outputs.zip_checksum }}
                  cat ${{ steps.names.outputs.tar_checksum }}

            - name: Attest zip archive
              uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
              with:
                  subject-path: ${{ steps.names.outputs.zip }}

            - name: Attest tar.gz archive
              uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
              with:
                  subject-path: ${{ steps.names.outputs.tar }}

            - name: Attest zip checksum
              uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
              with:
                  subject-path: ${{ steps.names.outputs.zip_checksum }}

            - name: Attest tar.gz checksum
              uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
              with:
                  subject-path: ${{ steps.names.outputs.tar_checksum }}

            - name: Upload artifacts to release
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
              with:
                  files: |
                      ${{ steps.names.outputs.zip }}
                      ${{ steps.names.outputs.tar }}
                      ${{ steps.names.outputs.zip_checksum }}
                      ${{ steps.names.outputs.tar_checksum }}
                  tag_name: v${{needs.release_please.outputs.major}}.${{needs.release_please.outputs.minor}}.${{needs.release_please.outputs.patch}}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
